# 豊田市動物愛護センター（迷子動物）
# 一覧 HTML の本文に PDF リンク1本（ファイル名は日付で変わる。パスは /_page_/001/003/696/配下）。
# 動物がいる日は「収容日」区切りの1頭分ブロック（表未確認・0頭時のみ確認できたため fields は旧 adapter の
# ラベル一致方式を踏襲。0頭時は「現在、豊田市では迷子の犬/猫を収容していません」の2文が出る（2026-09-29確認）。
steps:
  - pdf_links: "a[href$='.pdf']"
pdf:
  mode: text
rows_regex: "(?:収容日|保護日|発見日)"
fields:
  shelter_date: {regex: "(?:収容日|保護日|発見日)\\s*[:：]?\\s*(\\d{4}\\s*[年/\\-\\.]\\s*\\d{1,2}\\s*[月/\\-\\.]\\s*\\d{1,2}\\s*日?)"}
  species: {regex: "(?:種類|種別|動物種)\\s*[:：]?\\s*(犬|猫|その他|\\S+)"}
  sex: {regex: "性別\\s*[:：]?\\s*(\\S+)"}
  age: {regex: "年齢\\s*[:：]?\\s*(\\S+)"}
  color: {regex: "(?:毛色|色)\\s*[:：]?\\s*(\\S+)"}
  size: {regex: "(?:体格|大きさ|体重)\\s*[:：]?\\s*(\\S+)"}
  location: {regex: "(?:収容場所|発見場所|保護場所)\\s*[:：]?\\s*([^\\n]+)"}
species:
  from: field
empty_text: ["現在、豊田市では迷子の犬を収容していません", "現在、豊田市では迷子の猫を収容していません"]
