# 広島県動物愛護センター（迷い犬）: div.detail_free 配下に「管理番号 h2」+「写真 p」+「属性 p」が
# 並ぶ single_page（フリーテキスト、表なし）。h2 と p は基本は兄弟だが、稀に <div> で 1 頭分が
# 入れ子にされる（2026-09 時点の実データで確認）。このエンジンは行=1要素の子孫しか見ないため、
# h2（管理番号）と属性 p は別要素になり両方を同時には拾えない。実データが必ず持つ「センターに
# 収容された日：」を含む属性 p を row として選ぶ方式（入れ子・兄弟どちらの構造でも
# `div.detail_free p` は該当 p を子孫として拾える）を採用し、確実性を優先。
# 引き換えに管理番号(h2内)・写真(直前のp内)は行の子孫にならない（管理番号は fields.management_no、写真は image で取る。下記 2026-10-05 参照）。
# 属性 p の中身: 「雑種、推定7歳、雄<br>センターに収容された日：…<br>保護された状況：…」。
# 0 件時は該当 p が無くなり案内文のみ残る。
# 2026-10-04 変更: 管理番号を fields.management_no（行より前の直近の h2）で取るようにした（兄弟でも div 入れ子でも可）。0 頭の日の文言「現在迷い犬はいません」を猫ページ（-2）の実例から empty_text に追加（犬は今日 1 頭で未確認）。
# 2026-10-05 変更: 写真を image で取るようにした。写真 p は行（属性 p）の直前の兄弟で、行と同じ p タグなので、同じタグ名で遡りを止める既定だと
#   直前の写真 p で止まり届かなかった。10/5 のエンジン（image.stop_at: row = 前の行に当たるまで遡る）を当てた。h2 が兄弟でも div 入れ子でも、
#   その子の写真 p（先頭の 1 枚）が取れ、前の子の写真は拾わない（tests/test_registry_t517_f.py）。
# 2026-10-05 監査: 属性 p の最後の行「保護時に茶色の皮の首輪を装着」（保護された状況の次の行）が取れていなかったので note に入れる。
rows: "div.detail_free h2:-soup-contains('管理番号')"
row_until: "h2"
row_filter:
  text_has_any: ["収容された日"]
  text_lacks: ["返還されました"]
image: "p > img@src"
fields:
  management_no: {selector: "h2", regex: "管理番号[:：]?\\s*(\\S+)"}
  breed: {regex: "(?:^|[、,，\\s])((?:(?!推定|雄|雌|\\d)[^、,，\\s])+)[、,，]"}
  age: {regex: "(推定\\s*\\d+\\s*歳|\\d+\\s*歳|\\d+\\s*(?:ヶ月|か月|カ月)|成犬|成猫|子犬|子猫|幼犬|幼猫)"}
  sex: {regex: "(雄|雌)"}
  shelter_date: {regex: "収容された日[:：]\\s*([^\\s]+)"}
  note: {regex: "(?:保護|発見)されました。\\s*(\\S.*)$"}   # 保護された状況の次の行（保護時の首輪など）。行の文字は改行なしの空白区切り
  location: {regex: "保護された状況[:：]\\s*(?:(?:令和|平成|昭和)?\\s*\\d+\\s*年\\s*\\d+\\s*月\\s*\\d+\\s*日[^に]*に\\s*)?(.+?)(?:で(?:保護|発見)されました|$)"}
empty_text:
  - "現在迷い犬はいません"
  - "現在、迷い犬情報はありません"
  - "現在迷い犬情報はありません"
  - "該当する迷い犬はいません"
