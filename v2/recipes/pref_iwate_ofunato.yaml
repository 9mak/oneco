# 岩手県 大船渡保健所 — pref.iwate.jp
# 台帳 url は最終の一覧ページ（1014213.html。迷子・譲渡が同一ページにまとまっている）。
# 2026-09-29時点は全頭「動物種：猫」（犬の記載なし）のため台帳 species は cat 固定。
# 構造は他の保健所と同じフラットな並び（写真 p.imagecenter が兄弟要素でこのエンジンからは届かず、
# 管理番号・保護日の記載も無いため、テキスト側を row にしても動物と判定できない）。
# 行 = 写真の p.imagecenter。慰霊祭ポスター（ireisai.png）は動物の写真ではないため image の exclude で除外し、
# 写真も取れなくなることで自動的に捨てられる。1 枚の写真に複数頭（兄弟猫）が写っている/紹介されている
# ブロックがあり、その場合は1行=1枚の写真（複数頭まとめて1件）として数える。
rows: "h2:-soup-contains('【譲渡】') + p.imagecenter, h2:-soup-contains('元の飼い主を探しています') + p.imagecenter"   # 【御礼】譲渡が決まりました・「最近の保護動物さん」の写真は除外（2026-10-02 監査）
image:
  selector: "img@src"
  exclude: ["ireisai"]
empty_text:
  - "現在、保護されている猫はいません"
  - "現在、保護されている動物はいません"
