# 岩手県 大船渡保健所 — pref.iwate.jp
# 【譲渡】新しい飼い主さんを募集しています・元の飼い主を探しています の節だけを拾う
# （【御礼】譲渡が決まりました・「最近の保護動物さん」の写真は除外。2026-10-02 監査）。
# 2026-10-04: 行を写真の p.imagecenter から説明文の p（h2 + 写真 p の直後）に変え、写真は直前の兄弟から取る
# （image.scope: prev_siblings, stop_at: row）。愛称・動物種・種類・性別・毛色・大きさ・年齢・発見日・発見場所・備考が取れる。
# 慰霊祭の写真（ireisai）は除外。
rows: "h2:-soup-contains('【譲渡】') + p.imagecenter + p, h2:-soup-contains('元の飼い主を探しています') + p.imagecenter + p"
image: {selector: "h2 + p.imagecenter img@src", scope: prev_siblings, stop_at: row, exclude: ["ireisai"]}
fields:
  name: {label: "愛称"}
  species: {label: "動物種"}
  breed: {label: "種類"}
  sex: {regex: "性別[:：]\\s*(.+?)(?:\\s+(?:毛色|模様)[:：]|$)"}
  color: {regex: "(?:毛色|模様)[:：]\\s*(\\S+)"}
  size: {label: "大きさ"}
  age: {regex: "推定年月齢[:：]\\s*(\\S+)"}
  shelter_date: {regex: "発見日[:：]\\s*(\\S+)"}
  location: {regex: "発見場所[:：]\\s*(\\S+)"}
  note: {regex: "(?:備考|その他)[:：]\\s*(.+)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、保護されている猫はいません"
  - "現在、保護されている動物はいません"
