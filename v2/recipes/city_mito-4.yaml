# 水戸市動物愛護センター 愛護センター収容犬の譲渡（里親募集）（2041.html）。city_mito-3（猫）と同じ CMS。
# 見出し「里親募集中の犬（成犬1件）」の下に、犬 1 頭 = 1 つの表（th の見出し・td の値が 2 組ずつの 4 列）。上の行に写真。
# 「※譲渡が決まりました。」の表（名前だけ）は載せない。2026-11-17 時点は 1 頭（R7-36 ノンタ）。
# 0 頭の日（Wayback 2025-07-30）は見出しが「里親募集中の犬（0件）」になり、譲渡が決まった子の表だけが残る。子のいる日にはこの見出しは出ない。
rows: "div#main_body table"
image: "img@src"
row_filter:
  text_has_any: ["管理番号"]
  text_lacks: ["譲渡が決まりました"]
fields:
  management_no: {regex: "管理番号\\s*(\\S+?)\\s*[（(]\\s*名前"}
  name: {regex: "名前[:：]\\s*([^）)]+)[）)]"}
  breed: {label: "犬種"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  age: {label: "年齢"}
  note: {label: "性格等"}
empty_text:
  - "里親募集中の犬（0件）"
  - "里親募集中の犬（0頭）"
