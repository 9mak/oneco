# 2026-10-05 監査: 収容日（直前の h2「【収容日】…」から from: heading で）と毛色（品種・毛色・性別の行の 2 番目）を取るようにした
# 千葉県動愛センター本所（収容猫）。pref_chiba-1 と同一テンプレート
# (<h2>収容日【...】</h2> + <div class="col2"><div class="col2L"> に写真・管理番号・収容場所・
# 品種等)。末尾の「テンプレート」ダミーブロックは管理番号 260000-00 固定なので row_filter で除外。
# 1 ブロック（div.col2）は左右 2 列（div.col2L・div.col2R）で、1 列 = 1 頭。同じ日に 2 頭を 1 ブロックに並べる日がある（Wayback 2025-08-27 の
# sa250827-01 と ks250827-01）ので、管理番号のある列を 1 頭にする。列の無い作りの日はブロックごと（T521）
rows: "div.col2 > div:-soup-contains('管理番号'), div.col2:not(:has(> div)):-soup-contains('管理番号')"
row_filter:
  text_lacks: ["260000-00", "種類・毛色・オスメス"]   # 雛形ブロックは年度で番号が変わる（2025 年版の「2500000ｰ01」「250000-00」が 1 頭として載っていた。Wayback）。どの年も「種類・毛色・オスメス」と書かれている（T521）
image: "img@src"
fields:
  shelter_date:
    from: heading
    selector: "h2"
    regex: "((?:令和|平成)?\\s*\\d+年\\d+月\\d+日)"   # 見出しが「【収容日】令和6年12月9日」の日は令和ごと（Wayback 2024-12。「6年12月9日」になっていた）
  color:
    regex: "収容場所】\\s*\\S+\\s+[^・\\s]+・([^・\\s]+)・"
  management_no:
    regex: "管理番号】\\s*([^\\s（(]+)"
  location:
    regex: "収容場所】\\s*([^\\s【]+)"
  breed:
    regex: "収容場所】\\s*\\S+\\s+([^・\\s]+)・"
  sex:
    regex: "(オス|メス)"
  size:
    regex: "(超小型|超小|小型|中型|大型)"
  age:
    regex: "(成猫|子猫|幼猫|老猫)"
empty_text: ["収容されている動物はいません", "現在収容している猫はいません", "種類・毛色・オスメス", "収容犬の情報はありません", "収容猫の情報はありません", "収容動物の情報はありません"]   # 雛形ブロックしか無い日は 0 頭（0 頭の文言が出ない日がある。Wayback 2025-08 の猫。-5 の雛形番号と同じ考え。T521）
