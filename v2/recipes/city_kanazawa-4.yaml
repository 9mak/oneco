# 金沢市動物愛護管理センター（迷子の犬・猫等の情報） — www4.city.kanazawa.lg.jp/soshikikarasagasu/dobutsuaigokanricenter/gyomuannai/1/3/5382.html
# 2026-10-05 T519 新規作成（環境省リンク集のリンク先 .../1/3/index.html の「迷子の犬・猫等の情報」。飼い主が届け出た迷子の掲示板。kind: lost）。
# 構造: 見出し h2「飼い主さんが探しているペットの情報」の下に、1 頭ごと h2「迷子のペットの詳細」→ div.cmstag.img-text
#   （左 div.image の写真、右 div.textAreaHtml.wysiwyg の表: 特徴の li「動物種類：猫」「種類：…」「名前：…」「性別」「毛色」「年齢」「体格」「首輪」/ いなくなった日時 / いなくなった場所 / その他の情報）。
# 見出し直後の figure（「現在迷子のペットは、こちらです。」の飾り画像）は div.cmstag の外なので影響しない。
# 犬猫は li「動物種類：猫」から。犬・猫以外の語（鳥 等）は種別なしで載る。
# 2026-10-07 T519 v-g3: 作りが 2 つある。今日（と 2026-06）は div.cmstag.img-text（写真 + 表）、2023-05・2025-05 は h3「迷子のペットの詳細（1）」→ figure.img-item → div.wysiwyg > table。
#   最初の版は前者だけを読み、後者の日は 0 件で failed だった（2025-05 は 0 頭の雛形だけだったが、動物がいればそのまま取りこぼす）。両方読む（cmstag の中の wysiwyg は :not(.textAreaHtml) で二重にしない）。
# 0 頭の日: 2023-05「現在迷子のペットは、いません。」、2025-05 は「現在迷子のペットは、こちらです。」のまま項目が空の雛形（「動物種類： 種類： 名前： 性別：」）が残る。
#   後者は動物のいる日にも出る文言（今日）なので、empty_text には「いません」と、雛形の項目名が空のまま並ぶ並び（動物のいる日は値が入る）を置く。
rows: "div.cmstag.img-text, div.wysiwyg:has(> table):not(.textAreaHtml)"
row_filter:
  text_has_any: ["いなくなった日時", "いなくなった場所"]
image: {selector: "div.image img, figure.img-item img:not([alt*='イラスト']), div.wysiwyg > p > img:not([alt*='イラスト'])@src", exclude: ["/pet_"], scope: self_or_prev_siblings, stop_at: row}
species:
  from: field
  map: {"犬": dog, "猫": cat}
fields:
  species: {selector: "li:-soup-contains('動物種類')", regex: '動物種類[:：]\s*(\S+)'}
  name: {selector: "li:-soup-contains('名前')", regex: '名前[:：]\s*(\S.*)'}
  breed: {selector: "li:-soup-contains('種類'):not(:-soup-contains('動物種類'))", regex: '種類[:：]\s*(\S.*)'}
  sex: {selector: "li:-soup-contains('性別')", regex: '性別[:：]\s*(\S.*)'}
  color: {selector: "li:-soup-contains('毛色')", regex: '毛色[:：]\s*(\S.*)'}
  age: {selector: "li:-soup-contains('年齢')", regex: '年齢[:：]\s*(\S.*)'}
  size: {selector: "li:-soup-contains('体格'), li:-soup-contains('大きさ')", regex: '(?:体格|大きさ)[:：]\s*(\S.*)'}
  shelter_date: {label: "いなくなった日時", regex: '((?:令和|平成|R|H)?\s*\d+\s*年\s*\d+\s*月\s*\d+\s*日)'}
  location: {label: ["いなくなった場所", "場所"]}   # 掲載者の入力ミス「いなくなっ？た場所」（2026-06 の 3 頭）でも取る
  note: {label: "その他の情報"}
empty_text: ["現在迷子のペットは、いません", "現在迷子のペットはいません", "動物種類： 種類： 名前： 性別： 毛色： 年齢："]
