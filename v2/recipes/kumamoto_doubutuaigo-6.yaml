# 熊本県動愛 個人保護猫（一般の方からの投稿情報）。
# 一覧 ul.list-4col li = 1 頭。項目は種類・性別・毛色のみ（収容日・個体管理ナンバー・保健所は無い）。
steps:
  - paginate: ".paging .next a@href"
rows: "ul.list-4col li"
image: "img@src"
fields:
  breed: {label: "種類"}
  sex: {label: "性別"}
  color: {label: "毛色"}
  detail: {selector: "a", attr: "href"}
empty_text: ["0件中 0～0件目を表示"]
