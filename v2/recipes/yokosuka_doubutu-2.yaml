# 横須賀市（保護猫）— WordPress。一覧 ul#animals-list li a の各リンクが個体詳細ページ。
# 詳細ページは <th> の無い2列テーブル（整理番号/分類/収容日/収容場所/種類/性別/特徴/首輪/負傷）。
# 写真は div#photos 配下の img。フッタ #footer-text-2 に "TEL : 046-869-0040"（施設代表番号、台帳へ反映用）。
steps:
  - follow_all: "ul#animals-list li a@href"
# 2026-10-05 監査: 特徴「虎毛、推定1歳」から年齢（age）が取れていなかったので、特徴の中の「N歳」「Nか月」を age に、特徴そのものを note に足した。
rows: "body"
image: "div#photos img@src"
fields:
  management_no: {label: "整理番号"}
  shelter_date: {label: "収容日"}
  location: {label: "収容場所"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  color: {label: "特徴", regex: "^([^、,]{0,15})"}
  age: {label: "特徴", regex: "(\\d+(?:か月|ヶ月|ヵ月|カ月|ケ月|週|歳)齢?)"}
  note: {label: "特徴"}
# 2026-10-04: 0 頭の日の実文言「現在情報はありません。」を追加（同じテンプレートの横須賀 -3〜-6 が 2026-10-02 の監査で 0 頭の日にこの文言だったのを確認。-2 自体は今日 1 頭で未再現）。
empty_text:
  - "現在情報はありません"
  - "現在保護収容している犬はいません"
  - "現在保護収容している動物はいません"
  - "現在、収容している動物はいません"
