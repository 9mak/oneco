# 広島県動物愛護センター（迷い猫）: pref_hiroshima-1（迷い犬）と同一テンプレート・同一構造。
# div.detail_free 配下に「管理番号 h2」+「写真 p」+「属性 p」が並ぶ single_page（フリーテキスト、表なし）。
# h2 と p は基本は兄弟（実データで複数頭を確認、常に兄弟構造）。このエンジンは行=1要素の子孫しか
# 見ないため、h2（管理番号）と属性 p は別要素になり両方を同時には拾えない。実データが必ず持つ
# 「センターに収容された日：」を含む属性 p を row として選ぶ方式（h2 が div で入れ子にされた場合でも
# `div.detail_free p` は該当 p を子孫として拾える）を採用し、確実性を優先。
# 引き換えに管理番号(h2内)・写真(直前のpの中)は行の子孫にならず取得不可（既知の制限）。
# 属性 p の中身: 「雑種、推定6歳、雌<br>センターに収容された日：…<br>保護された状況：…」。
# 0 件時は該当 p が無くなり案内文のみ残る。
# 2026-10-04 変更: (1) 管理番号を fields.management_no（直前の h2 から）で取るようにした。h2 が兄弟でも div 入れ子でも「行より前の直近の h2」で拾える。
#   (2) 0 頭の日の文言が「※現在迷い猫はいません。」に変わっていて empty_text に無く failed になっていたので追加。
# 2026-10-05 変更: 写真を image で取るようにした。写真 p は行（属性 p）の直前の兄弟で、行と同じ p タグなので、同じタグ名で遡りを止める既定だと
#   直前の写真 p で止まり届かなかった。10/5 のエンジン（image.stop_at: row = 前の行に当たるまで遡る）を当てた。h2 が兄弟でも div 入れ子でも、
#   その子の写真 p（先頭の 1 枚）が取れ、前の子の写真は拾わない（tests/test_registry_t517_f.py）。
rows: "div.detail_free p:-soup-contains('収容された日')"
image: {selector: "img@src", scope: prev_siblings, stop_at: row}
fields:
  management_no: {from: heading, selector: "h2", regex: "管理番号[:：]\\s*(\\S+)"}
  breed: {regex: "^([^、,，\\n]+)"}
  age: {regex: "(推定\\s*\\d+\\s*歳|\\d+\\s*歳|\\d+\\s*(?:ヶ月|か月|カ月)|成犬|成猫|子犬|子猫|幼犬|幼猫)"}
  sex: {regex: "(雄|雌)"}
  shelter_date: {regex: "収容された日[:：]\\s*([^\\s]+)"}
  location: {regex: "保護された状況[:：]\\s*(?:(?:令和|平成|昭和)?\\s*\\d+\\s*年\\s*\\d+\\s*月\\s*\\d+\\s*日[^に]*に\\s*)?(.+?)(?:で(?:保護|発見)されました|$)"}
empty_text:
  - "現在迷い猫はいません"
  - "現在、迷い猫情報はありません"
  - "現在迷い猫情報はありません"
  - "該当する迷い猫はいません"
  - "現在、迷い猫は収容されていません"
  - "現在、新たな迷い猫の収容はありません"
# 2026-11-06 変更: 0 頭の日に文が出ない形（案内の p「この情報は、迷い猫を探している飼い主さんのための情報提供です。…」だけ）が 11/06 に出て failed だった。
#   Wayback 2025-01 も同じ形。文が出る版もある（2024-07・2025-05「※現在、新たな迷い猫の収容はありません」、2026-04「現在、迷い猫は収容されていません。」）ので 2 文を empty_text に足した。
#   案内の p は子のいる日にも出るので 0 頭の根拠にしない。empty_absent は「案内の p があり、動物の印（見出し h2・写真・表・ul・収容日や保護の状況の行）が 1 つも無い」日だけ 0 頭。
#   子のいる日に属性 p の書き方が変わって行が 0 になっても、見出し・写真・属性の文が残るので 0 頭にならず failed のまま（10/31 の迷い犬と同じ型）。
#   子のいる版（2026-11-05 の保存ページ、Wayback 2025-11-08）に 2 文は出ない。
empty_absent:
  page: "div.detail_free p:-soup-contains('迷い猫を探している飼い主さんのための情報提供です')"
  none: "div.detail_free h2, div.detail_free h3, div.detail_free img, div.detail_free table, div.detail_free ul, div.detail_free p:-soup-contains('収容された日'), div.detail_free p:-soup-contains('収容日'), div.detail_free p:-soup-contains('保護された状況')"
