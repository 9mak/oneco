# 千葉市（市民保護犬）。#contents_editable に <h4>管理番号</h4><p><img></p>(任意)<p>保護日：...</p>
# <p>保護場所：...</p><p>種類：...</p><p>毛色：...</p><p>性別：...</p><p>体格：...</p><p>特徴：...</p> が
# 動物ごとに並ぶ（保護系＝ラベルごとに別々のp）。このエンジンの fields.label / image は row 要素の子孫しか
# 見ないため、ラベルが兄弟pに分かれるこの構造では収容日・性別等・写真は取得不可（city_utsunomiya.yaml と同じ制約）。
# row を h4 にし管理番号のみ取得する。
# 2026-09-29時点0頭「現在情報はありません」（保護日：令和年月日 は数字の無いプレースホルダなので判定除外）。
rows: "div#contents_editable h4"
fields:
  management_no: {selector: "."}
empty_text:
  - "現在情報はありません"
