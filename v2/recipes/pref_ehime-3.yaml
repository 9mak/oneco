# 愛媛県動物愛護センター（譲渡予定・成犬） https://www.pref.ehime.jp/page/145257.html
# 新規（2026-10-04）: 「譲渡予定動物」(pref_ehime-2, page/17125) の末尾に「普段は室内にいる「成犬」は「成犬紹介」からご覧ください」と
# あり、室内で過ごす成犬 11 頭ほどは別ページ (page/145257) にだけ載っている。構造は pref_ehime-2 と同じ
# （td 行が 1 頭、写真 + 「愛　称：／性　別：／体　重：／コメント：」を <br> 区切り。ラベル内に全角空白がある場合とない場合が混ざる）。
# 犬だけのページなので species は台帳（dog）に任せる。年齢欄は「推定年齢：」があるときだけ。多くは「コメント：推定8歳前後。…」に
# 書かれていて note にそのまま入る。
rows: "div.detail_free table tr"
row_filter:
  text_has_any: ["別：", "別:", "コメント"]     # 見出し行（th）を除く
image: "img@src"
fields:
  name: {regex: "愛[\\s\\u200b]*称[:：]\\s*(\\S+)"}
  sex: {regex: "性[\\s\\u200b]*別[:：]\\s*(\\S+)"}
  age: {regex: "年[\\s\\u200b]*齢[:：]\\s*([^\\s。の]+)"}
  size: {regex: "体[\\s\\u200b]*重[:：]\\s*(\\S+)"}
  note: {regex: "コメント[:：]\\s*([^\\u200b]+)"}
empty_text: ["現在、おりません"]
