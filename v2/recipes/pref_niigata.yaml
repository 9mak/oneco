# 新潟県動物愛護センター（保護動物） — 1 ページに子が並ぶ single_page 形式（個別ページなし）。h3 を 1 頭の始まりにし、次の h3 の手前までを 1 頭にする。
# 書式は 2 通りあり、どちらも読む。「保護した日時」がある行は新しい書式で、旧書式の regex は当てない（特徴の文に「…で保護」があっても混ざらない）。
#   旧（〜2026-10）: 枠（div.detail_free）ごとに <h3>猫　10月18日</h3><p>画像</p><p><strong>管理番号</strong></p><p>M月D日 場所で保護/収容</p><p>属性（、区切り: 品種,性別,毛色,...,体重Kg,...）</p>。
#     年は書かれないので shelter_date は "M月D日" のまま採る。h3 にも日付が入る日があるので、location は最後の日付の後ろから取る。
#   新（2026-11-06 確認）: 1 つの枠に <h3>26長FC010</h3><p>画像</p><p>保護した日時：2026年11月5日 12:30頃</p><p>保護した場所：…</p><p>動物種：猫　品種：MIX　毛色：…　性別：…　体重：…　負傷の程度：…</p><p>特徴：…</p> が続けて並ぶ。
# 「返還の際に必要な物」の h3 は子ではないので rows から外す。
# 0 頭の日は、動物ブロックが消えて「保護している動物はいません」の画像 1 枚だけのブロックになる（Wayback 2026-04-10 で確認。
# 画像の alt と URL は日によって違うので画像は見ない）。2026-11-06 T631: ページ冒頭の案内文（h2「…迷子の動物の情報を掲載しています。」）は
# 子のいる日にも毎日出るので empty_text から外し、empty_absent に変えた。page = その案内文の h2（0 頭の日も子のいる日も出る枠）、
# none = 「返還の際に必要な物」以外の h3、「保護した…」「…で保護」の本文、「Kg」の体重の行。読めない作りの日は failed で通知される。
rows: "div.detail_free > h3:not(:-soup-contains('返還の際に必要な物'))"
row_until: "h3"
image: "img@src"
fields:
  species:
    join:
      - {selector: "h3"}
      - {regex: "動物種[:：]\\s*(\\S+)"}
  management_no:
    join:
      - {selector: "strong", regex: "^(\\d{2}\\S*)$"}
      - {selector: "h3", regex: "^(\\d{2}\\S*)$"}
  shelter_date:
    join:
      - {regex: "^(?!.*保護した日時).*?(\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日)(?:(?!、).){0,20}?(?:で保護|を保護|で収容|を収容)"}
      - {regex: "保護した日時[:：]\\s*(\\d{4}\\s*年\\s*\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日)"}
  location:
    join:
      - {regex: "^(?!.*保護した日時).*\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日[\\s、]*(.+?)(?:で保護|を保護|で収容|を収容)"}
      - {regex: "保護した場所[:：]\\s*(\\S+)"}
  breed:
    join:
      - {regex: "^(?!.*保護した日時).*?([^\\s、]+)、(?:オス|メス|雄|雌)"}
      - {regex: "品種[:：]\\s*(\\S+)"}
  sex:
    join:
      - {regex: "^(?!.*保護した日時).*?(オス[^、]*|メス[^、]*|雄[^、]*|雌[^、]*)、"}
      - {regex: "性別[:：]\\s*(\\S+)"}
  color:
    join:
      - {regex: "^(?!.*保護した日時).*?(?:オス|メス|雄|雌)[^、]*、([^、]+)、"}
      - {regex: "毛色[:：]\\s*(\\S+)"}
  size:
    regex: "体重[:：]?\\s*(\\d+(?:\\.\\d+)?\\s*[Kk][Gg])"
  note:
    join:
      - {regex: "負傷の程度[:：]\\s*(\\S+)"}
      - {regex: "特徴[:：]\\s*(.+)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
  infer: true   # h3 に犬猫の語が無く「動物種」も無い版（Wayback 2024-07）は品種から補う。決まらない子（小鳥など）は種別なしで載る
empty_absent:
  page: "div.detail_free h2:-soup-contains('新潟県動物愛護センターで保護している迷子の動物の情報を掲載しています')"
  none: "div.detail_free h3:not(:-soup-contains('返還の際に必要な物')), div.detail_free p:-soup-contains('保護した'), div.detail_free p:-soup-contains('で保護'), div.detail_free p:-soup-contains('Kg')"
