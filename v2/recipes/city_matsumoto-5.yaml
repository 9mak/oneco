# 松本市 新しい飼い主を探している猫の情報（1534）。h2「保健所の譲渡対象猫」（2026-10-05 は「現在、譲渡対象猫の情報はございません。」）と
# h2「対象猫」の h3「個人譲渡猫」の下に、各個体が h3「譲渡猫No.8－8」+ p(img 複数) + p（掲載日）+ table（掲載希望者（連絡先）・種類・毛色・性別・年齢・
# 体格・不妊手術・混合ワクチン・飼育場所・医療費等の負担・既往歴・性格・その他）。1 掲載に 2 頭（列が 2 つ）の表がある（label は最初の列＝1 頭目だけ取れる）。
# 掲載希望者（個人の名前と電話番号）は取らない。保健所の譲渡猫が載る日の形は未確認（犬ページ -4 と同じ h4 の形と推測）。
# 写真の前後に src が壊れた img（./5-28-2）が混ざるので image で除く。h3 の見出しに img が入る個体がある。
rows: "h3"
row_until: "h2, h3"
row_filter:
  text_has_any: ["掲載日", "猫の情報"]   # 2022-04 の版は掲載日が無い（表の見出し「猫の情報」で動物の表と決める）
  field_lacks: {breed: ["譲渡されました", "譲渡済"], note: ["譲渡されました", "譲渡済", "新しい飼い主が見つかりました"]}
image: {selector: "img@src", exclude: ["5-28-2"]}
fields:
  management_no: {selector: "h3", regex: "No[.．]?\\s*(\\S+)"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  size: {label: "体格"}
  note: {label: "性格・その他"}
empty_absent:
  page: "h1:-soup-contains('新しい飼い主を探している猫の情報')"
  none: "table:has(th:-soup-contains('猫の情報'))"
