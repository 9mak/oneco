# 宇都宮市保健所 保健所から犬や猫を譲渡しています（譲渡動物情報）（1005585.html）。迷子犬・負傷猫（city_utsunomiya）とは別のページ。
# h2「譲渡動物情報」の下に、動物ごとに h3（「譲渡猫（のりお）」「譲渡犬（愛称　ケンタ）」。昔は「譲渡猫14」「譲渡猫19・20」）→ p の写真 → p「愛称　…」→ p「種類 … 性別 … 年齢 … 体格 … 性格等 …」（br 区切り）が並ぶ。
# 日によって h3 の言い方・「愛称」の p の有無・項目の区切り（コロンが無く空白だけ）が違うので、行の全文から正規表現で読む。h3 を 1 頭の始まりにして次の h2・h3 の手前までをまとめる。
# 「譲渡猫19・20」のように 1 つの見出しに 2 頭が載る日（Wayback 2025-06）は 1 件として読む（2 頭目は取れない）。
# 犬猫は見出しの「譲渡猫」「譲渡犬」で決める。0 頭の日の版は Wayback に見つからない（6 版とも子がいる）ので文言は分からない。枠（h2）はあるが動物の見出し・写真が 1 つも無い日だけ 0 頭にする。
rows: "h3:-soup-contains('譲渡猫'), h3:-soup-contains('譲渡犬')"
row_until: "h2, h3"
image: "img@src"
fields:
  name: {regex: "(?:愛称\\s*|譲渡[猫犬][（(]\\s*)(?!愛称)([^\\s）)]+(?:[（(][^）)]*[）)])?)"}   # 見出し「譲渡犬（ポロン）」だけで「愛称」の行が無い日もある
  breed: {regex: "種類\\s*(\\S+)"}
  sex: {regex: "性別\\s*(\\S+)"}
  age: {regex: "年齢\\s*(\\S+)"}
  size: {regex: "体格\\s*(\\S+)"}
  note: {regex: "性格等\\s*(.+)"}
species:
  from: text
  map: {"譲渡猫": cat, "譲渡犬": dog}
empty_absent:
  page: "h2:-soup-contains('譲渡動物情報')"
  none: "h3:-soup-contains('譲渡猫'), h3:-soup-contains('譲渡犬'), p.imageleft img[alt*='譲渡'], p.imagecenter img[alt*='譲渡']"
