# 静岡市 迷い犬情報（動物愛護センター）。h1「迷い犬情報」の下に、保護している犬ごとに h2「迷い犬情報1」+ p(img) + ul（保護年月日・保護場所・犬種・性別・毛色・首輪）。
# 犬は迷子の犬（飼い主を探す告知）で一定期間で削除される。動物が載った日の形は Wayback 2024-06-25・2025-02-19 の保存版で確かめた。
# 0 頭の日の文言は日によって違う（「現在、保護している迷い犬はいません。」〔2024-07・2024-11〕・「☆今現在、保護している犬はおりません。」〔2026-07〕・文言なし〔2026-10-07〕）ので
# 文言を 0 頭の印にせず、h1「迷い犬情報」があり、犬の見出し h2「迷い犬情報N」が 1 つも無いことで 0 頭と確定する。
# 犬が載っているのに読めなければ（h2 はあるが動物にならない）「読めなかった」で通知に出る。
rows: "h2:-soup-contains('迷い犬情報')"
row_until: "h2"
image: "img@src"
fields:
  shelter_date: {regex: "保護年月日\\s*(\\S+)"}
  location: {regex: "保護場所\\s*(\\S+)"}
  breed: {regex: "犬種\\s*(\\S+)"}
  sex: {regex: "性別\\s*(\\S+)"}
  color: {regex: "毛色\\s*(\\S+)"}
  note: {regex: "(首輪\\s*\\S+)"}
empty_absent:
  page: "h1:-soup-contains('迷い犬情報')"
  none: "h2:-soup-contains('迷い犬情報')"
