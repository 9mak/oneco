# いわき市保健所（譲渡動物情報 犬） — city.iwaki.lg.jp/www/contents/1777267193348/index.html
# 2026-10-05 T519 新規作成（環境省リンク集のリンク先「保護動物情報」の親ジャンル「保護動物・譲渡動物情報」から辿った譲渡ページ）。
# 構造: div.edit-item 直下に h2「新しい飼い主さんを募集しています（犬）」「現在、３頭です。」→ 表（収容日 / 種類 / 毛色 / 性別 / 体格 / 特徴 / 画像。項目名も値も td）が頭数分。1 頭 = table 1 つ、写真は表の中の「画像」行。
# 特徴の欄に「愛称：ポンちゃん」「年齢：推定2～３歳」が入る。管理番号は載らない（収容日と写真で動物とみなす）。
# 譲渡が決まった子は特徴に「●譲渡決定（手続き待ち）」「●譲渡済」が付く（猫ページで確認。犬ページは 2026-10-05 時点で付いた子なし）ので捨てる。
# 未確認: 0 頭の日の文言（「現在、３頭です。」の数字が 0 になるのか文言が変わるのか）。empty_text は置かない（0 頭の日は「読めなかった」で通知に出る＝安全側）。
# 2026-10-08 T519 v2-g3: 年齢は「年齢：推定2～３歳」と、「年齢：」の無い「推定３～５歳」「推定７歳以上」の両方を読む（以前は とーこ の age が null だった）。
rows: "div.edit-item table"
row_filter:
  text_has_any: ["収容日"]
  text_lacks: ["譲渡済", "譲渡決定"]
image: "img@src"
fields:
  shelter_date: {label: "収容日"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  name: {label: "特徴", regex: "愛称[:：]\\s*([^\\s）)]+)"}
  age: {join: [{label: "特徴", regex: "年齢[:：]\\s*(\\S+)"}, {label: "特徴", regex: "(推定\\S+?歳(?:以上|くらい|位|前後)?)"}]}   # 「年齢：推定2～３歳」と、「年齢：」の無い「推定3～5歳」「推定７歳以上」（2026-10-07 の とーこ は age が null だった）
  note: {label: "特徴"}
