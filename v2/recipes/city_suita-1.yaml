# 吹田市 動物保護情報（保健所に保護されている動物）。本文は #voice。h2「保護している動物」の下に、
# 0 頭の日は <p>現在保護情報はありません。</p> と空の <ul></ul>（2026-10-05 確認）。2024 年の版は「※現在、保護情報はありません。」で、
# 「1．収容した動物が発見された日時及び場所」「2．動物の種類及び特徴」の見出しの p が 0 頭でも残っていた。
# 動物が載った日（Wayback 2025-07-08 で確認。写真も管理番号も無い。2026-10-07 T519v）:
#   <p>1．収容した動物が発見された日時及び場所</p> <p>令和7年7月7日　午後3時40分頃</p> <p>吹田市津雲台1丁目3番付近</p>
#   <p>2．動物の種類及び特徴</p> <p>猫、性別不明、茶トラ、子猫</p>
#   1 頭 = 「1．収容した動物が発見された日時及び場所」の p から次の同じ p か次の h2（返還について）の手前まで。収容日は日付だけを取る（時刻は取らない）。
#   2026-09 に本文の作りが変わった（返還の節が ol から p＋ul になった）ので、動物の日も p の代わりに ul になっている可能性がある（未確認）。
#   ul でも p でも、行の文字（兄弟要素をまとめたもの）から読むので同じ regex で足りる。
# 作りが違えば 0 行→「読めなかった」で通知に出る（誤掲載しない側に倒す）。
rows: "#voice p:-soup-contains('収容した動物が発見された日時及び場所')"
row_until: "h2"
fields:
  shelter_date: {regex: "((?:令和|平成)\\s*\\d+年\\s*\\d+月\\s*\\d+日)"}
  location: {regex: "(\\S+)\\s+2．\\s*動物の種類及び特徴"}
  note: {regex: "2．\\s*動物の種類及び特徴\\s*(.+)$"}
  sex: {regex: "2．\\s*動物の種類及び特徴.*?(オス|メス|雄|雌)"}
  species: {regex: "2．\\s*動物の種類及び特徴\\s*([^、\\s]+)"}
species:
  from: field
  map: {"猫": cat, "ねこ": cat, "ネコ": cat, "犬": dog, "いぬ": dog, "イヌ": dog}
# 0 頭の日だけ出る文言（動物がいる日は出ない）。「※現在、保護情報はありません」（2024）と「現在保護情報はありません」（2026）の両方に当たる。
empty_text:
  - "保護情報はありません"
