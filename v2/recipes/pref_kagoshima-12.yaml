# 鹿児島県動物愛護ホームページ（里親を探す掲載依頼のあった猫（県の施設にはいない））: 画像ボタンの JavaScript（search_submit）が、入口の form
# （hidden の jouto_kubun・search_type と anti-forgery トークン）を POST して一覧を出す作り。
# submit_form で入口の form に jouto_kubun=keisai・search_type=cat を足して POST し、結果のページ送り
# （form[name=paging] の act=next）を「次ページ」のリンクがある間たどる（10 件ずつ）。W006 2026-11-07。
# 1 頭 = 結果の table.t-jouto 1 つ（写真は直前の p.thumbs_left）。0 件の日だけ「検索条件に一致する情報が見つかりませんでした。」が出る。
steps:
  - submit_form:
      form: "form[name=type]"
      set: {search_type: cat, jouto_kubun: keisai}
      require: ["__RequestVerificationToken"]
  - submit_form:
      form: "form[name=paging]"
      set: {act: next}
      repeat_while: "a.paging_next"
      max: 30
rows: "table.t-jouto"
# 写真は読まない: 掲載者個人の氏名がファイル名に入る子がいる（ID の元にもなるので management_no を使う）。
# 備考は読まない: 掲載者の家族の病状・家族構成など個人の事情が自由記述で入る。飼養場所（市町村）だけ備考から取る。
# 掲載日は note に残す（取り下げの印が無いので、古い掲載かどうかを読む人が分かるように。shelter_date には入れない＝サイトで「保護日」と表示されるため）。
# 譲渡済みの印が付いた行は載せない（取り下げ前の掲載が残る日がある）。「決まりましたら」（これから）や、複数匹の行の中の 1 匹だけ「既に譲渡済み」は
# 行ごと落とすと載っている子が消えるので、終わった言い方だけを語にする（今日の実ページで確認）。
# 備考の頭が「※一時譲渡を取り下げています※」の子は、募集を一時止めているので載せない（掲載元が再開したら戻る。2026-11-23 26D0244。POLICY.md 方針 22）。
# text_lacks でなく field_lacks（closed 項目。animals には出ない）で落とす: 全行がこれで外れた日を「捨てた行」として数え、見出しの項目名一致で 0 頭と確定するため。
row_filter:
  text_lacks: ["譲渡済みです", "譲渡済みとなり", "譲渡済みになり", "譲渡しました", "譲渡されました", "決まりました。", "決まりました！", "新しい飼い主さんのもと", "新しい飼い主のもと", "新しい家族のもと", "新しい家族になりました"]
  field_lacks: {closed: ["譲渡を取り下げ"]}
fields:
  closed: {label: "備考", regex: "(譲渡を取り下げ)"}
  management_no: {label: "No"}
  sex: {label: "性別"}
  age: {label: ["推定年齢", "年齢"]}
  location: {label: "備考", regex: "現在[はも、,，]*(\\S+?)で飼養"}
  note: {join: [{regex: "(掲載日\\s*\\d+年\\d+月\\d+日)"}, {regex: "(お問い合わせ先\\s*\\S+（[0-9\\-]+）)"}], sep: "　"}
empty_text: ["検索条件に一致する情報が見つかりませんでした"]
