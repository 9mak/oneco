# 呉市動物愛護センター（譲渡対象の犬・猫） https://www.city.kure.lg.jp/soshiki/127/jouto.html（2026-10-05 T519 で追加）
# 1 頭 = h3「No.1　愛称（仮名）：かい」＋ 直後の p（写真・【個体情報】雄・２０２６年７月頃生まれ（推定）／体重約６ｋｇ）。
# 数字は全角（No．１０）。写真は p の中で、1 頭に 1 枚。管理番号は h3 の No.（センター内の連番）。
# 犬か猫かはページのどこにも書かれていない（「譲渡対象の犬・猫」と見出しにあるだけ）。2026-10-05 の 22 頭は写真 2 枚（No.1・No.20）を見て犬。
# 猫が載る日の書き方は未確認なので、行に「猫」があれば猫、どれにも当たらなければ種別なし（犬を既定にしない）。
# 0 頭の日の文言は未確認（2026-10-05 は 22 頭）。
rows: "div.detail_free > h3"
row_until: "h3"
row_filter:
  text_has_any: ["個体情報"]
image: "img@src"
fields:
  management_no: {selector: "h3", regex: "[NＮ][oｏ][.．]\\s*([0-9０-９]+)"}
  name: {selector: "h3", regex: "愛称（仮名）[:：]\\s*(\\S+)"}
  sex: {regex: "個体情報】\\s*([雄雌オスメス]+)"}
  age: {regex: "([0-9０-９]{4}年[0-9０-９]+月頃生まれ（推定）)"}
  size: {regex: "(体重約[0-9０-９]+[kｋ][gｇ])"}
species:
  from: text
  map: {"猫": cat, "ネコ": cat, "ねこ": cat}
