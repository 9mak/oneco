# 秋田市保健所（収容中の犬猫・公示）。
# #voice の中に h3「犬の収容情報」「猫の保護・収容情報」があり、1 頭 = 1 つの table。犬と猫の節は h3 見出しで分ける。
# 表の作りは日によって 4 種類あった（Wayback 2020-05・2022-05・2023-06・2025-10 と今日で確認。2026-10-08）。どれも 1 つの regex で読めるよう、表の全文（項目名と値の並び）から取る:
#   A（2026-10-05〜）: th に「通年番号　3」「捕獲月日　9月20日」…と値まで入り td は空。項目は 場所・「犬の種類、性別、年齢　秋田犬、オス、推定2歳」・「首輪、大きさ、毛色　なし、大、茶白」・その他・抑留期限。
#   B（〜2025-10）: th が項目名・td が値。捕獲月日・捕獲場所（猫は 拾得月日・拾得場所）・種類・推定年齢・毛色・性別・体格・首輪・引綱・摘要（2022 の猫は 適用）・抑留期限（猫は 公示期限）。
#        2020 は 捕獲日時（5月18日　16時50分）・収容日時／収容月日・拾得日時・雌雄・収容場所 と項目名が少し違う（日付・場所・性別はこの違いも読む）。
#        2025-10 は通年番号「No.3」と表の直前の p.imagecenter に犬の写真（alt「犬の写真 NO.3」）がある。2022〜2023 は通年番号が無く、いない方の表が「該当なし」だらけの雛形で残る。
# 0 頭の日: A は「保健所で収容している捕獲・抑留犬は0頭です」「収容されている猫は0頭です」＋空の雛形の表（通年番号・捕獲月日が空）。
#   2025-10〜2026-05 は「現在、犬の情報はありません。」「現在、猫の情報はありません。」（表なし）。B（2022〜2023）は雛形の表が「該当なし」。
#   雛形の表は通年番号も日付も写真も無いので動物として通らず落ちる。種別は直前の h3 から決める。
# 2026-10-05 時点: 犬 1 頭（通年番号 3）・猫 0 頭を実ページで確認。猫が載った日の読み方は B（2023-06 の猫）で確認。
rows: "#voice table"
species:
  from: heading
  selector: "h3"
  map: {"犬": dog, "猫": cat}
fields:
  management_no: {regex: "通年番号\\s*(?:No\\.?\\s*)?(\\d+)"}
  shelter_date: {regex: "(?:捕獲|拾得|保護収容|収容)(?:月日|日時)\\s*(\\d+月\\d+日)"}
  location: {regex: "(?:捕獲場所|拾得場所|収容場所|場所)\\s*(.+?)\\s+(?:犬の|猫の)?種類"}
  breed: {regex: "(?:(?:犬|猫)の種類、性別、年齢|(?<!の)種類)\\s*(.+?)(?:、|\\s+推定年齢)"}
  sex: {regex: "(?:(?:犬|猫)の種類、性別、年齢\\s*[^、]+、|性別\\s+|雌雄\\s+)([^、\\s]+)"}
  age: {regex: "(?:(?:犬|猫)の種類、性別、年齢\\s*[^、]+、[^、]+、|推定年齢\\s+)(\\S+)"}
  color: {regex: "(?:首輪、大きさ、毛色\\s*[^、]+、[^、]+、|(?<!、)毛色\\s+)(\\S+)"}
  size: {regex: "(?:首輪、大きさ、毛色\\s*[^、]+、|体格\\s+)([^、\\s]+)"}
  note: {regex: "(?:摘要|適用|その他)\\s*(.+?)\\s*(?:抑留期限|公示期限)"}
image: {selector: "p.imagecenter img@src", scope: prev_siblings}
empty_text:
  - "保健所で収容している捕獲・抑留犬は0頭です"
  - "収容されている猫は0頭です"
  - "現在、犬の情報はありません"
  - "現在、猫の情報はありません"
  - "該当なし"
