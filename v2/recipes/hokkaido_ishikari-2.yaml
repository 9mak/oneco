# 北海道 石狩振興局 江別保健所 迷い犬猫と新しい飼い主さん募集情報（/hk/hgc/se/inu-neko-newpage.html）の新しい飼い主募集の節。
# h4「【新しい飼い主を募集している猫】（保管場所、種類推定、性別、体格、毛色、年齢推定）」の下に、1 頭ごとに p「石狩94-3（石狩支所、雑種、オス、中、キジ白・8～9歳、写真1、…）」。
# 先頭の太字が番号。丸括弧の中は行によって項目が抜けるので項目に割らず note に載せる。括弧の入れ子（中（小柄））は最後の「）」まで取り、行末の「、写真…」以降のリンク文字（写真・特集・近況）は載せない。写真はリンク先が PDF で img は無い。
# 同じ節の下の表（支所・保健所ごとの写真と紹介文）は p の子孫なので読まない。犬の節は「現在はいません」の p だけ（太字が無いので行にならない）。
# 0 頭の日は犬猫とも「現在はいません」だが、犬の節の「現在はいません」は猫に子のいる日にも出るので、文だけでは 0 頭にしない。
# 0 頭にするのは、【新しい飼い主を募集している犬】と【…猫】それぞれの見出しの直後に「現在はいません」が出た日だけ（empty_text_all）。猫の見出しは括弧が「年齢推定 )」と半角で崩れているのでそのまま写す（直されたら failed になる）。猫が 0 頭の日の実物は未確認（Wayback 2025 の猫は常に子がいる）。
rows: "h4:-soup-contains('新しい飼い主を募集している') ~ p:has(> strong)"
fields:
  management_no: {selector: "strong"}
  note: {regex: "[（(](.+?)(?:、\\s*写真.*)?[）)]\\s*(?:NEW!?)?\\s*$"}
species:
  from: heading
  selector: "h4"
  map: {"募集している犬": dog, "募集している猫": cat}
empty_text_all:
  - "【新しい飼い主を募集している犬】 （保管場所、種類推定、性別、体格、毛色、年齢推定） 現在はいません"
  - "【新しい飼い主を募集している猫】 （保管場所、種類推定、性別、体格、毛色、年齢推定 ) 現在はいません"
