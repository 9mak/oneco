# 佐賀県（武雄・鹿島・嬉野・杵島・藤津）保護犬猫 — 杵藤保健福祉事務所
# 佐賀県 5 事務所共通の雛形。1 頭 = table.__wys_table 1 つ（縦並び: 先頭セル「保護犬（260924-1）」/ 保護した場所 / 種類 / 毛色 / 性別 / 体格 / 推定年齢 / その他 / 収容日）。
# 犬猫は先頭セルの「保護犬」「保護猫」で決める（見出しが「保護犬情報（保護猫情報は次の欄です）」のように両方含むので見出しは使わない）。
# 動物がいない欄は値が空の雛形（「現在、情報はありません」）で、写真も番号も無いので自動で落ちる。
rows: "table.__wys_table"
image: "img@src"
fields:
  species: {selector: "td"}
  management_no: {selector: "td", regex: "(\\d{4,}(?:[-‐－–]\\w+)?)"}
  location: {label: "保護した場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  age: {label: "推定年齢"}
  note: {label: "その他"}
  shelter_date: {label: "収容日", regex: "((?:令和|平成)\\s*\\d+\\s*年.*?\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日)"}
species:
  from: field
  map: {"保護犬": dog, "保護猫": cat}
empty_text:
  - "現在、情報はありません"
  - "現在保護中の動物はいません"
  - "現在保護中の犬はいません"
  - "現在保護中の猫はいません"
  - "現在保護情報はありません"
  - "現在、保護情報はありません"
