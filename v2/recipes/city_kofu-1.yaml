# 甲府市 迷子の犬猫「保護しています」。ページに表が 2 つ（保護しています／探しています）あり、1 つ目だけを読む。
# 列: ID / 保護日（年なし）/ 保護場所 / 種 / 特徴（品種・毛色・性別・年齢などを空白区切り。順番は日によって違う）/ その他（首輪等）/ 情報源 / 画像。
# 先頭に &nbsp; だけの空行がある（ID も写真も無いので動物とみなされず捨てられる）。負傷のため写真なしの行がある。犬猫以外（フクロモモンガ等）が載る日は species other。
# 表は h2「保護しています」の後ろの 1 つ目の table。表の class（datatable）は編集の仕方で付いたり付かなかったりする（2020〜2026-04 の保存版には無く、2026-10 の版にはある）ので
# class には頼らず、h2「保護しています」と h2「探しています」の位置で 2 つの表を分ける。
# 特徴の欄は「雑種 黒 メス 成猫」「雑種 オス（未去勢） 茶トラ 子猫」「メス 若い」（フクロモモンガ。品種の語が無い）のように並び順が違うので、
# 品種（先頭の 1 語。オス・メスで始まるときは品種なし）と性別だけ取り、残りは備考に入れる（毛色・年齢は無理に決めない）。
# 0 頭の日の文言は未確認（保存版でも 0 頭の日は見つからなかった。10/7 は 3 頭）。表が空になる日は「読めなかった」で通知に出る。
rows: "h2:-soup-contains('保護しています') ~ table:not(h2:-soup-contains('探しています') ~ table) tr:has(td)"
image: "td:nth-of-type(8) img@src"
fields:
  management_no: "td:nth-of-type(1)"
  shelter_date: "td:nth-of-type(2)"
  location: "td:nth-of-type(3)"
  species: "td:nth-of-type(4)"
  breed: {selector: "td:nth-of-type(5)", regex: "^\\s*(?!オス|メス|去勢|不妊|未去勢|性別)(\\S+)"}
  sex: {selector: "td:nth-of-type(5)", regex: "((?:去勢|不妊|未去勢)?(?:オス|メス)|性別不明)"}
  note: {selector: "td:nth-of-type(5)", regex: "^\\s*(?:(?!オス|メス|去勢|不妊|未去勢|性別)\\S+\\s+)?(.+)$"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
  allow_other: true
