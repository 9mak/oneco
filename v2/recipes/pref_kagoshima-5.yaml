# 鹿児島県動物愛護ホームページ（一般の方が保護している猫）: 画像ボタンの JavaScript（search_submit）が、入口の form
# （hidden の lost_kubun・search_type と anti-forgery トークン）を POST して一覧を出す作り。
# submit_form で入口の form に lost_kubun=keisai_hogo・search_type=cat を足して POST し、結果のページ送り
# （form[name=paging] の act=next）を「次ページ」のリンクがある間たどる（10 件ずつ）。W006 2026-11-07。
# 1 頭 = 結果の table.t-jouto 1 つ（写真は直前の p.thumbs_left）。0 件の日だけ「検索条件に一致する情報が見つかりませんでした。」が出る。
steps:
  - submit_form:
      form: "form[name=type]"
      set: {search_type: cat, lost_kubun: keisai_hogo}
      require: ["__RequestVerificationToken"]
  - submit_form:
      form: "form[name=paging]"
      set: {act: next}
      repeat_while: "a.paging_next"
      max: 30
rows: "table.t-jouto"
# 写真は読まない: 掲載者個人の氏名がファイル名に入りうる（ID の元にもなるので management_no を使う）。
# 子のいる日の形は未確認なので、保護場所が読めない行は動物にしない（市町村名の語が無い行を捨て、全行が捨てられた日は 0 頭にならず ok にもならない）。
row_filter:
  text_lacks: ["帰りました", "戻りました"]
  field_has_any: {location: ["市", "町", "村", "郡", "島"]}
fields:
  management_no: {label: "No"}
  sex: {label: "性別"}
  age: {label: ["推定年齢", "年齢"]}
  shelter_date: {label: "保護日", regex: "(\\d+年\\d+月\\d+日)"}
  location: {label: "保護場所"}
  note: {join: [{label: "備考"}, {regex: "(お問い合わせ先\\s*\\S+（[0-9\\-]+）)"}], sep: "　"}
empty_text: ["検索条件に一致する情報が見つかりませんでした"]
