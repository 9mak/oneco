# 栃木県動物愛護指導センター 飼い主募集中の犬たち（/work/dog/）。子犬譲渡（douai_pref_tochigi_puppy-1）・子猫譲渡（-2）とは別の、愛護館のドッグルームで展示している成犬のページ。
# 2026-11-04 の栃木県の返事（収容動物・譲渡動物の画像や文字の転載は遠慮してほしい。掲載するなら当該ページへのリンクのみ）に従い mode: link_only。
# このレシピは許諾が変わったときのために残す。一覧は読まない（写真も文字も転記しない）。
# 1 頭 = 1 つの表（table.has-fixed-layout。左のセルが項目名、右のセルが値の 2 列。番号・性別・（種類）・年齢・体重（大きさ）・ワクチン等・特徴と、写真の行）。
# 表の項目は日によって違う（種類の行・体重か大きさか）ので、項目名（label）で読む。ページの先頭に値の無い空の枠の表が 1 つあるので、番号のセルがある表だけを読む。
# 0 頭の日は「現在、ドックルームには飼い主さん募集中の犬はいません。」が出て、値の無い雛形の表（番号・性別…だけ）が残る（Wayback 2025-05）。子のいる日は
# 「…飼い主募集中の犬が１頭います」「…飼い主さん募集中の犬が２頭います」「…展示中の犬が１頭います」で、この文は出ない。
rows: "table.has-fixed-layout:has(td:-soup-contains('番号'))"
image: "img@src"
fields:
  management_no: {label: "番号"}
  sex: {label: "性別"}
  breed: {label: "種類"}
  age: {label: "年齢"}
  size: {label: ["体重", "大きさ"]}
  note:
    join:
      - {label: "特徴"}
      - {label: "ワクチン等"}
    sep: " "
empty_text:
  - "募集中の犬はいません"
