# 熊本市（迷子犬一覧） https://www.city.kumamoto.jp/doubutuaigo/list03612.html
# 一覧ページの div.kijiArea > ul.kijilist > li.loadbox の記事リンクを個別ページ（kijiNNNNNNNN）へ辿る。1 頭 = 1 記事。
# 個別ページは table.templateForOneImages に写真、table.__wys_table（保護場所/種類/毛色/性別/推定年齢/首輪/体格）に属性。
# 保護日時はテーブルに無く本文「保護日時：yyyy年m月d日…」から regex で取る。
# 現在 0 件で「いません」等の案内文は無い（記事が 0 件だと div.kijiArea ごとページから消える。
# 同一テンプレートの猫版 city_kumamoto-2 は同じセレクタで正常に記事を拾えているため、
# セレクタ自体の不具合ではなくサイト側が実際に空。真の 0 件と読み込み失敗を区別する文言が
# 無いため、このページ固有の見出し文言（h1.classTitle）を「正しいページが読めた」確認に使う）。
steps:
  - follow_all: "div.kijiArea ul.kijilist li.loadbox div.title a@href"
rows: "body"
image: "table.templateForOneImages img@src"
fields:
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "推定年齢"}
  size: {label: "体格"}
  location: {label: "保護場所"}
  shelter_date: {regex: "保護日時[:：]\\s*(\\S+)"}
empty_text:
  - "迷子犬を保護しています"
