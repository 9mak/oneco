# 熊本市（迷子犬一覧） https://www.city.kumamoto.jp/doubutuaigo/list03612.html
# 一覧ページの div.kijiArea > ul.kijilist > li.loadbox の記事リンクを個別ページ（kijiNNNNNNNN）へ辿る。1 頭 = 1 記事。
# 個別ページは table.templateForOneImages に写真、table.__wys_table（保護場所/種類/毛色/性別/推定年齢/首輪/体格）に属性。
# 保護日時はテーブルに無く本文「保護日時：yyyy年m月d日…」から regex で取る。
# 現在 0 件で「いません」等の案内文は無い（記事が 0 件だと div.kijiArea ごとページから消える。
# 同一テンプレートの猫版 city_kumamoto-2 は同じセレクタで正常に記事を拾えているため、
# セレクタ自体の不具合ではなくサイト側が実際に空。真の 0 件と読み込み失敗を区別する文言が
# 無いため、このページ固有の見出し文言（h1.classTitle）を「正しいページが読めた」確認に使う）。
steps:
  - follow_all: "div.kijiArea ul.kijilist li.loadbox div.title a@href"
rows: "body"
image: "table.templateForOneImages img@src"
fields:
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "推定年齢"}
  size: {label: "体格"}
  location: {label: "保護場所"}
  shelter_date: {regex: "保護日(?:時)?[:：]\\s*(\\S+)"}   # 「保護日：2026年10月19日」（2026-11-07 監査 C。city_kumamoto-2 と同じ）
# 2026-11-06 T631: 見出し「迷子犬を保護しています」はサイト共通のメニューと子ページにも毎日出る（一覧の 13 か所に出る）ので empty_text にはできない。
# 猫版 city_kumamoto-2（2026-10-31）と同じく、0 頭の日は div.kijiArea（「全N件」と記事の並び）ごと消える作りを empty_absent で見る。
# page = 本文（#cont_body）の div.wideMenu の中の h1.classTitle「迷子犬を保護しています」（0 頭の日も子のいる日も出る枠）、
# none = 器（kijiArea 等）と記事へのリンク、一覧の入る div.wideMenu の中のリンク全部（記事の URL の形が変わった日や、下位分類へのリンクだけを並べる
# 親分類が返った日も 0 頭にしない）。枠が無い日（ブロック画面・作り替え）は page が当たらず failed で通知される。
empty_absent:
  page: "#cont_body div.wideMenu h1.classTitle:-soup-contains('迷子犬を保護しています')"
  none: "#cont_body div.kijiArea, #cont_body ul.kijilist, #cont_body li.loadbox, #cont_body a[href*='kiji'], #cont_body div.wideMenu a[href]"
