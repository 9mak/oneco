# さぬき動物愛護センター しっぽの森（譲渡犬猫）
# 一覧 HTML に PDF が 3 本（/documents/6103/MMDDdog.pdf・MMDDcat.pdf・micro.pdf=マイクロチップ案内で動物なし）。
# PDF は罫線表で 1 行 = 1 頭。1 ページ目だけ先頭に「掲載日」行があり見出しは 2 行目、2 ページ目以降は 1 行目
# （header_has で見出し行を探す）。空列の数がページごとに違うので index でなく見出し名で取る。写真は無い。
# 犬猫は管理番号の D / C で決める（8中-D0155 = 犬、8中-C0046 = 猫。センター記号は 中西高東小 など）。
# 猫 PDF は「譲渡希望者と交渉中です。」「新しい家族に迎えられました！」が既存セルの上に重ね書きされ
# 文字が 1 文字ずつ交互に混ざる（「譲雑渡種希」「中でオすス」）。既知語の regex で当たる値だけ採用し、
# 混線した値は空にする。混ざった続き行は管理番号が無いので自動で落ちる。
steps:
  - pdf_links: "a[href*='/documents/6103/'][href$='.pdf']"
pdf:
  mode: table
  header_has: "管理番号"
row_filter:
  field_lacks: {name: ["新"]}   # 「新しい家族に迎えられました！」の重ね書きは品種セルに「新」が混ざる（譲渡済。2026-10-02 監査）
  text_lacks: ["迎えられました"]
fields:
  name: {header: "品種", regex: "(新)"}   # 譲渡済の印（通常の品種値に「新」は無い）
  management_no: {header: "管理番号", regex: "([0-9０-９]+[一-龥]\\s*[-‐‑−–—ー－]\\s*[DC][0-9０-９]{4})"}
  species: {header: "管理番号", regex: "[-‐‑−–—ー－]\\s*([DC])[0-9０-９]{4}"}
  age: {header: "生年月日", regex: "([HRhr]\\s*[0-9０-９]{1,2}\\s*\\.\\s*[0-9０-９]{1,2}\\s*\\.\\s*[0-9０-９]{1,2})"}
  breed: {header: "品種", regex: "(雑種|ミックス|日本猫|柴犬|柴|秋田犬|洋猫)"}
  color: {header: "毛色", regex: "^([^。、！!]{1,12})$"}
  sex: {header: "性別", regex: "(オス|メス|雄|雌)"}
  size: {header: "大きさ", regex: "(約\\s*[0-9０-９]+(?:\\.[0-9０-９]+)?\\s*(?:[kKｋＫ][gGｇＧ]|㎏|キロ))"}
  note: {header: "特徴"}
species:
  from: field
  map: {"D": dog, "C": cat}
notes: |
  現行エンジン（2026-09-28 15:10 時点）ではこのレシピは 0 頭になる。必要な汎用拡張は 2 点（monkeypatch で検証済み: 犬 31・猫 37 = 68 頭、捨てた 24 行は全部重ね書きの続き行）:
  1. recipe.py _MGMT_RE に「英字 1〜2 文字 + 数字 3 桁以上」を追加（例 "|[A-Za-z]{1,2}\d{3,}"）。"8中-D0155" の D0155 が今はどの alternative にも当たらず、写真の無い PDF 行が全部落ちる。
  2. recipe.py _pdf_rows: header_has があるとき table[header_row] を見るのでなく先頭 (header_row+5) 行から header_has を含む行を探して見出しにする（無ければその表は飛ばす）。
     この PDF は 1 ページ目だけ「掲載日」行が先頭に挟まり見出しが 2 行目に来るため、header_row 固定では 1 ページ目（犬 12・猫 13 頭）が読めない。
