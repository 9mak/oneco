# 福島市保健所 里親募集中(譲渡)動物情報（soshiki/9/1046/3/5964.html）。
# 「譲渡希望者募集中」の下に h3「犬」「猫」があり、猫は先に一覧（2 頭ずつの表。写真と「譲渡猫R7ねー35」「成猫、茶トラ、おす」）、
# その後ろに 1 頭ごとの詳細: h5「譲渡猫R7ねー35」→ p（写真 2〜3 枚。動画ボタン dougabutton.png が混ざる）→ th/td の表（種類・推定年齢・毛色・毛の長さ・性別・体格・特徴）が平らに並ぶ。
# 詳細の h5 を 1 頭の始まりにして、次の h5・h3（「動物の譲渡手続きについて」）の手前までをまとめる（row_until）。先頭の一覧の表は rows に当たらないので読まない。
# 種別は直前の h3（犬／猫）から決める。管理番号は h5 の「譲渡猫R7ねー35」の「R7ねー35」。
# 2026-10-05 時点: 猫 10 頭・犬 0 頭（「現在、新しい飼い主さんを募集している犬はおりません。」）を実ページで確認。
# 犬が載った日の読み方は未確認（猫と同じ作りで h3「犬」の下に並ぶ推測。h5 は「譲渡犬…」のはず）。
# Wayback 2025-07-13・07-15 の 2 版（猫 11 頭・10 頭、見出し h5 の数と一致）を同じレシピで読めることを確認。犬の 0 頭の文言は当時「…犬は現在おりません。」で今日と少し違う
# （文言は日で変わる）。猫の 0 頭の日の文言は保存に無く未確認（犬の書き方からの推測で両方の書き方を置く。外れても「読めなかった」の通知になるだけで安全側）。
rows: "h5"
row_until: "h3, h5"
species:
  from: heading
  selector: "h3"
  map: {"犬": dog, "猫": cat}
fields:
  name: {selector: "h5"}
  management_no: {selector: "h5", regex: "譲渡[犬猫]\\s*(\\S+)"}
  breed: {label: "種類"}
  age: {label: "推定年齢"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  note: {label: "特徴"}
image: {selector: "img@src", exclude: ["dougabutton"]}
empty_text:
  - "新しい飼い主さんを募集している猫はおりません"
  - "新しい飼い主さんを募集している猫は現在おりません"
