# 新潟市動物愛護センター（迷子で保護している犬） — city.niigata.lg.jp/kurashi/animal/animal_aigo/hogoshuyo/inu_hogoken.html
# 2026-10-05 T519 新規作成（環境省リンク集のリンク先 hogoshuyo/index.html の「迷子で動物愛護センターに保護されている犬」）。
# 確認済み: 2026-10-07 は 0 頭で「現在、迷子になって動物愛護センターで保護している犬はいません。」だけが出る。
# 2026-10-07 T519 v-g3: 動物が載った日の作りを Wayback で確かめて直した。最初の版は譲渡ページ（city_niigata-3・-4）と同じ div.h3bg → 「愛称・性別」の p と仮定していたが、
#   迷子のページは別の作りで、動物が載った日は全部 0 件（failed。掲載漏れ）か 1 頭だけ（猫 2025-05 は 4 頭中 3 頭）だった。
#   迷子ページの作り（2023-06〜2026-08 の 3 つの版で確認）: 動物 1 頭ごとに見出し div.h2bg（1 頭目。h2「保護犬1」「保護犬R8-140」）か div.h3bg（2 頭目以降。h3「保護犬2」）
#   → 写真 div.img-area（見出しの後・表の後のどちらもある）→ div.wysiwyg_wp（ul の li: 収容年月日／保護場所／種類／性別／毛色／体重／首輪／推定年齢 等）。
#   1 頭 = 見出しから次の見出し（か、最後は div#contact）の手前まで。管理番号は見出しに「R8-140」とある日だけ（「保護犬1」の連番は管理番号でないので取らない）。
# 未確認: 犬・猫が複数頭の日の最新の作り（猫 2025-05 の 4 頭の作りと同じはず）。
# 2026-10-08 T519 v2-g3: 動物が載った日の作りは 4 つ（2023-06 img-area-l の中に ul、2024-06〜12 の h2bg/h3bg「保護犬1」→ 写真/ul、2025-11 の h3bg「犬ID R7-54」→ img-area → p の「保護日：…<br>場所：…<br>犬種：…」）。
#   2025-11 の作りは「収容年月日」の語が無く、前任の直しは動物を 0 件にしていた（掲載漏れ）ので、「保護日」「場所」「犬種」でも読む。0 頭の日の文言は「…保護している犬はいません。」（2023-12〜2026-10）。
rows: "div.h2bg, div.h3bg"
row_until: "div.h2bg, div.h3bg, #contact"
row_filter:
  text_has_any: ["収容年月日", "保護日"]
image: "img@src"
fields:
  management_no: {selector: "h2, h3", regex: "(R\\d+\\s*[-－ー]\\s*\\d+)"}
  shelter_date: {regex: "(?:収容年月日|保護日)[:：]?\\s*(\\S+)"}
  location: {regex: "(?:保護場所|場所)[:：]?\\s*(.+?)(?=\\s+(?:種類|犬種|猫種|性別)|$)"}
  breed: {regex: "(?:種類|犬種|猫種)[:：]?\\s*(\\S+)"}
  sex: {regex: "性別[:：]?\\s*(.+?)(?=\\s+(?:毛色|体重|年齢|推定)|$)"}
  color: {regex: "毛色[:：]?\\s*(.+?)(?=\\s+(?:性別|体重|首輪|特徴|推定|年齢)|$)"}
  age: {join: [{regex: "年齢[:：]\\s*(\\S+)"}, {regex: "(推定\\s*\\d\\S*)"}]}
  note: {regex: "(体重.+?)(?=\\s+保護している場所|\\s+問い合わせ先|$)"}
empty_text: ["保護している犬はいません", "保護している犬がいません"]
