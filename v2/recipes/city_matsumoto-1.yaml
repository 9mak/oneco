# 松本市 保護されている動物の情報（1532）の「保健所収容動物の情報」。h2「保健所収容動物の情報」の下に h3「収容犬」「収容猫」、
# 動物がいない日は「現在、犬の収容はありません。」「現在、猫の収容はありません。」の p（2026-10-05 は両方 0 頭）。
# 動物が載る形は未確認。同じページの個人保護（city_matsumoto-2）が h4「保護猫No.7-3」+ p(img) + table（保護年月日・保護場所・種類・毛色・…）の形なので、
# 収容側も同じ形と推測して書いた。載った日に読めなければ「読めなかった」で通知に出るので、その日の実物で直す。
# 1532 には個人保護の節も同じ h4 の形で並ぶので、直近の h3（収容犬／収容猫／保護犬／保護猫）を species 欄に取り、「収容」の行だけを拾う。
# 注意: empty_text は犬・猫の片方だけの文言でも「0 頭」になる（片方に動物がいて読めなかった日はもう片方の文言のせいで 0 頭に見える。動物が載った日に実物を確かめる）。
rows: "h4"
row_until: "h2, h3, h4"
row_filter:
  text_has_any: ["保護年月日", "収容", "No"]
  field_has_any: {species: ["収容"]}
image: "img@src"
fields:
  species: {from: heading, selector: "h3"}
  management_no: {selector: "h4", regex: "No[.．]?\\s*(\\S+)"}
  shelter_date: {label: "保護年月日"}
  location: {label: "保護場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  size: {label: "体格"}
  note: {label: "その他"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、犬の収容はありません"
  - "現在、猫の収容はありません"
