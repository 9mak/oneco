# 豊中市: 台帳 URL は案内ページ(maigo.html)だが実際の一覧は別ページ shuyou.html なので url で上書き。
# 1 頭 = <div class="img-area">（写真＋近くの説明文に管理番号・収容日・性別等）。動物がいない時は
# 同じ div に no_info.gif だけが入り alt="現在、掲載する情報はありません"（img alt は get_text() に
# 出ないため empty_text では直接検出できない）。row_filter で管理番号/収容日等の語が無い div を除外して
# 0件にし、0件のときは no_info.gif の alt（empty_text は本文と画像の alt を照合する）で「本当に0頭」と確定させる。
# 2026-10-05 監査: empty_text が「情報の更新は原則収容当日ですが…」（動物がいる日も載っている案内文）だったので、0 頭の日にだけ出る alt の文言に直した。
# 構造が変わって行が取れなくなった日も 0 頭に見えて通知が来なくなるのを防ぐ。
url: https://www.city.toyonaka.osaka.jp/kurashi/pettp-inuneko/shuyou.html
rows: ".img-area"
row_filter:
  text_has_any: ["管理番号", "収容日", "収容場所"]
image: "img@src"
fields:
  management_no: {label: "管理番号"}
  sex: {label: "性別"}
  shelter_date: {label: "収容日", regex: "(\\d+年\\d+月\\d+日)"}
  breed: {label: "犬種"}
  color: {label: "毛色"}
species:
  from: text
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、掲載する情報はありません"
