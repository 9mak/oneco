# 宮崎市（保護犬）: 「犬・猫の保護情報」一覧（/life/pet/protection/）から「令和N年M月D日保護分【犬・…】」の記事を全部辿る。1 記事 = 1 頭。
# 旧台帳は固定記事 411118.html（5/6 保護分）1 本だけで、保護期間満了後も 1 頭だけ載り続けていた（2026-10-02 監査）。
# <article class="body"> 内に <h3>ラベル</h3><p>値</p> の繰り返しで情報が入る（表構造ではない）。
# 行=article自体を1行とみなし、get_text結合後のテキストに正規表現で各ラベル直後の値を取る。

steps:
  - follow_all: "a[href*='/life/pet/protection/']:-soup-contains('保護分')@href"
rows: "article.body"
image: "img@src"
fields:
  breed: {regex: "犬の種類\\s*(\\S+)"}
  color: {regex: "毛色\\s*(\\S+)"}
  sex: {regex: "性別\\s*(\\S+)"}
  age: {regex: "推定年齢\\s*(\\S+)"}
  size: {regex: "体格\\s*(\\S+)"}
  shelter_date: {regex: "保護日時\\s*(\\S+)"}
  location: {regex: "保護場所\\s*(.+?)(?=\\s*(?:保護日時|毛色|犬の種類|性別|推定年齢|首輪等|体格|備考|$))"}
  management_no: {regex: "保護番号\\s*(\\S+)"}
  note: {regex: "備考\\s*(.+?)(?=\\s*(?:地図|関連記事|$))"}

empty_text: ["現在、保護している犬はいません", "該当する犬はいません"]
