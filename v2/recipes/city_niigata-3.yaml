# 新潟市動物愛護センター（犬の新しい飼い主を募集しています） — city.niigata.lg.jp/kurashi/animal/animal_aigo/jyouto/dobutsuaigo2021i.html
# 2026-10-05 T519 新規作成（環境省リンク集のリンク先 hogoshuyo/index.html の左メニュー「犬・猫 譲渡情報」から辿った譲渡ページ）。
# 構造: 本文 div の直下に兄弟要素が平らに並ぶ。「譲渡犬情報」h2 の後に、1 頭ごと
#   div.h3bg（h3「犬ID R8-9」）→ div.img-area（p.img-left img）→ div.wysiwyg_wp（p: 愛称／犬種／性別／毛色／年齢／体重／… を <br> 区切り）。
# h3bg を 1 頭の始まりにして、次の h3bg・h2bg の手前までを 1 行にする（row_until）。手順の見出し h3（(1)譲渡犬の確認 等）も h3bg だが、愛称・性別を含まないので row_filter で落とす。
# 譲渡対象の動物の説明は「犬種　柴犬」のように項目名と値が全角空白で区切られる（正規化で半角空白）。
# 2026-10-07 T519 v-g3: 0 頭の日の文言を Wayback で確かめた。2024-11・2026-06 は「譲渡犬情報」h2 の下に h3bg で「現在、譲渡対象の犬はいません。」、2023-02 は「只今、新しい飼い主さんを待っている犬はおりません。」。
#   前者は 0 頭の日だけの文言（手順の h3 に「譲渡対象になっている犬を」とあるが「譲渡対象の犬はいません」ではない）。empty_text に入れた。
# 2026-10-08 T519 v2-g3: 前任の empty_text を Wayback 3 版（2023-02・2024-11・2026-06）で確かめ直した。そのまま。
rows: "div.h3bg"
row_until: "div.h3bg, div.h2bg"
row_filter:
  text_has_any: ["愛称", "性別"]
image: "img@src"
fields:
  management_no: {selector: "h3", regex: "(R\\d+\\s*[-－ー]\\s*\\d+)"}
  name: {regex: "愛称\\s*(\\S+)"}
  breed: {regex: "犬種\\s*(\\S+)"}
  sex: {regex: "性別\\s*(\\S+)"}
  color: {regex: "毛色\\s*(\\S+)"}
  age: {regex: "年齢\\s*(\\S+)"}
  note: {regex: "(体重.+?)(?=\\s*PDF形式のファイルを開くには|\\s*このページの作成担当|$)"}
empty_text: ["譲渡対象の犬はいません", "待っている犬はおりません"]
