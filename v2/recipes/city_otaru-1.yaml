# 小樽市 収容犬情報（小樽市犬管理所に収容している迷い犬）— city.otaru.lg.jp（2026-10-05 T519 環境省リンク集から追加。2026-10-08 T519v で Wayback の 2021〜2026 の版に当てて直した）
# 構造（2026-10-05 の実ページは 0 頭の日）: div.susanoo-editable-field の中に h2「収容犬について」があり、その下の div に
#   「現在、収容犬はいません。」「M7-1のチワワ系雑種は飼い主のもとに戻りました。」（返還の報告。動物ではない）の p。
# 動物が載った日（Wayback 2022-03-24・2022-04-10 で確認。2022 年の作りで、2023-06 に 1 節の「収容犬について」になった。新しい作りで動物が載った日の保存は無く未確認）:
#   h2「迷い犬」の下の div に p が縦に並ぶ。「M3-2」「<img src=file_contents/M3-2.jpg>」「保護年月日：令和４年３月１８日」「保護場所：桂岡町２番」
#   「犬種：ミニチュアダックスフンド」「性別：おす」「体格：小」「特徴：首輪等なし、老犬、…」。1 頭 = img を含む一番内側の div。
#   2022 年は h2「引取り犬」（飼い主のやむを得ない事情で引き取った犬。譲渡の対象）の節も同じ作りの想定（載った日の保存は無い）。
#   管理番号は「M3-2」の形（英大文字 + 数字 - 数字）を行の文字から拾う。違う作りだった日は rows が 0 になり、0 頭の文言も消えるので
#   「読めなかった」で通知に載る（0 頭と誤判定しない）。
rows: "div.susanoo-editable-field div:has(img):not(:has(div))"
image: "img@src"
fields:
  management_no: {regex: "([A-Z]\\d+-\\d+)"}
  shelter_date: {regex: "(?:保護|引取り?|収容)年月日[:：]\\s*(\\S+)"}
  location: {regex: "(?:保護|収容)場所[:：]\\s*(\\S+)"}
  breed: {regex: "犬種[:：]\\s*(\\S+)"}
  sex: {regex: "性別[:：]\\s*(\\S+)"}
  size: {regex: "体格[:：]\\s*(\\S+)"}
  color: {regex: "毛色[:：]\\s*(\\S+)"}
  note: {regex: "特徴[:：]\\s*(.+)$"}
# 0 頭の日の文言。2023-06 以降は「現在、収容犬はいません」。2021〜2022 年の作りは節が「迷い犬」「引取り犬」に分かれ、
# 「現在、迷い犬はいません。」と「現在、引き取り犬はいません。」が両方出る（片方だけの文言を 0 頭の印にしない）。
empty_text:
  - "現在、収容犬はいません"
  - "現在、迷い犬はいません。 引取り犬 現在、引き取り犬はいません"
