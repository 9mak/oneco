# proposal: run の日付 2026-11-11・元の失敗理由 0 頭で empty_text も無い（行 0・捨てた 0）・取れた頭数 2・採用条件は次の行（人が差分を見て recipes/ へ反映する。今日の HTML は <slug>.today.html）
# 採用条件: 合格 a 必須項目・b 重複・c 行数・v1 見出し語・v2 日付・v3 現行の指定を保つ / 飛ばした d 回帰（保存 HTML なし）・v4 旧新比較（旧レシピが読めた保存ページが無い） / 回帰未確認 / 半自動の対象外（旧新の比較ができていない。draft のまま人が見る）
# agy note: 静内保健所の節に掲載された犬の募集画像（p:has(> a > img)）を1頭として取得できるようrowsを修正しました。画像のalt属性から管理番号と種別（犬・猫）を取得するようfieldsとspeciesを設定し、全保健所で募集がない日を判定する現行のempty_text_allは維持しています。
# 北海道 日高振興局 動物愛護管理のページ（/hk/kks/doubutuaigokannri.html）
# 本文内の画像リンク（article.body p:has(> a > img)）を動物 1 頭とみなす。
# 静内保健所などの各節で新しい飼い主募集中の犬猫が写真付きで掲載される。
rows: "article.body p:has(> a > img)"
fields:
  management_no: {selector: "img", attr: "alt", regex: "^(\\S+)"}
  species: {selector: "img", attr: "alt"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text_all:
  - "○浦河保健所 現在、新しい飼い主を募集している犬・猫はおりません。"
  - "○静内保健所 現在、新しい飼い主を募集している犬・猫はおりません。"
  - "○環境生活課 現在、新しい飼い主を募集している犬・猫はおりません。"
