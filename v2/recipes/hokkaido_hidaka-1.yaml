# 北海道 日高振興局 動物愛護管理のページ（/hk/kks/doubutuaigokannri.html）の「犬・猫の新しい飼い主募集情報・迷子犬猫情報」。
# 2026-11-07 W006: link_only をやめて 0 頭を読む。節は ○浦河保健所・○静内保健所・○環境生活課 の 3 つで、子のいる日は
#   冒頭に「現在、浦河保健所にて猫3匹の新しい飼い主を募集しております。」（Wayback 2026-04・2026-07）、「現在、静内保健所にて猫1匹…」（2026-01）と
#   頭数が文で出るだけで、個体の表は載らない（個別の子は保健所のページ・飼い主探しノートを見る作り）。
# 2026-11-13: 静内保健所の節に「現在、新しい飼い主を募集している犬が２頭おります。」と、1 頭 1 枚の募集チラシ画像（p > a[href=…png] > img。
#   alt「R8犬6PPB3b (PNG 897KB)」）が 2 つ載った。本番の AI 修復の案（proposals/hokkaido_hidaka-1.yaml）を元に、チラシ 1 枚を 1 頭として読む。
#   個体の項目（性別・毛色など）はチラシの画像の中にしか無いので読まない。alt はファイル名なので管理番号には使わない（案から外した）。
#   種別は alt の「犬」「猫」、場所は直前の h3（○静内保健所）。
rows: "article.body p:has(> a > img)"
image: "img@src"
fields:
  species: {selector: "img", attr: "alt"}
  location: {from: heading, selector: "h3", regex: "[○]?(.+)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
# 0 頭にするのは empty_text_all だけ: 3 節それぞれの見出しの直後に「現在、新しい飼い主を募集している犬・猫はおりません。」が全部出た日。
#   節ごとの同じ文だけでは、1 つの節に子がいる日にも他の節の文が出る（Wayback 2026-01-18 は静内と環境生活課が「おりません」で浦河に猫）ため、見出し付きで 3 つ揃えて照合する。
empty_text_all:
  - "○浦河保健所 現在、新しい飼い主を募集している犬・猫はおりません。"
  - "○静内保健所 現在、新しい飼い主を募集している犬・猫はおりません。"
  - "○環境生活課 現在、新しい飼い主を募集している犬・猫はおりません。"
