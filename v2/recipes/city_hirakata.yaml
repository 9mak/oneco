# 枚方市（収容動物）: 1 ページに「収容犬」「収容猫」の見出し(h4)が並び、
# その下に画像付きカード(div.mol_imageblock)が種別ごとに掲載される single_page 形式。
# 各カードは <p>ラベル：値</p> の並び（種類・毛色・性別・収容日等）。detail ページは無い。
# 調査時点(2026-09-29)は犬・猫とも0頭で、告知文「掲載情報が無い場合でも…」のみ表示。

rows: "div.mol_imageblock"

species:
  from: heading
  selector: "h2, h3, h4"
  map: {"犬": dog, "猫": cat}

fields:
  breed: {regex: "(?:種類|種別|犬種|猫種)[:：]\\s*(\\S+)"}
  color: {regex: "(?:毛色|色)[:：]\\s*(\\S+)"}
  sex: {regex: "性別[:：]\\s*(\\S+)"}
  age: {regex: "(?:推定年齢|年齢)[:：]\\s*(\\S+)"}
  shelter_date: {regex: "(?:収容日|収容|保護日|発見日)[:：]\\s*(\\S+)"}
  location: {regex: "(?:収容場所|場所)[:：]\\s*(\\S+)"}
  size: {regex: "(?:体格|大きさ|体重)[:：]\\s*(\\S+)"}

# 0 頭の日は、収容犬・収容猫の見出し(h4)の下に案内文「掲載情報が無い場合でも、犬が行方不明になったら…」だけが並ぶ。
# 2026-11-06 T631: この案内文は子のいる日にも各見出しの下に毎日出る（猫の写真+表の下にも出ていた）ので empty_text から外し、empty_absent に変えた。
# page = 収容犬・収容猫の両方の見出しがある本文（0 頭の日も子のいる日も出る枠）、none = 表と、アンカー用の透明画像以外の写真。
# カードのクラス名（mol_imageblock）が変わっても、表か写真が残っていれば 0 頭にならず failed で通知される。
empty_absent:
  page: "#mol_contents:has(h4:-soup-contains('収容犬')):has(h4:-soup-contains('収容猫'))"
  none: "#mol_contents table, #mol_contents div.mol_imageblock, #mol_contents img:not([src*='clearspacer'])"
