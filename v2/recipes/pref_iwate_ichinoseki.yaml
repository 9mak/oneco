# 岩手県 一関保健所 — pref.iwate.jp
# 台帳 url は索引ページ。follow_all で「保護動物情報（迷子）」「譲渡動物情報」の両方を辿って合算。
# 迷子ページ: <p class="imageright"><img></p> の次に <p>管理番号 ：　9-1<br>保護日　 ：　2026.09.14<br>…</p>
#   というフラットな並び（写真は兄弟要素でこのエンジンからは届かない）。
#   ラベル文字が全角スペースで字間を空けて書かれている（例:「種　　類」「性　　別」「備　　考」「毛　色　」）ため
#   label: 直指定では一致しない項目は \s（全角スペース U+3000 も含む）を挟んだ regex で拾う。
#   管理番号は「9-1」のように1桁-1桁形式でエンジンの _MGMT_RE には非マッチだが、保護日
#   （2026.09.14 のような日付）があるので動物としては通る。
# 譲渡ページ（例: 蘭丸）: 管理番号・保護日が無く、写真も兄弟要素で届かないため、
#   このエンジンでは「動物とみなす条件」を満たせず捕捉できない（既知の反証未了。下記 note 参照）。
#   仮名・動物種別・備考等の項目自体はラベルがフラット（全角スペース無し）なのでテキストは正常に読める。
steps:
  - follow_all: "a:-soup-contains('一関保健所　保護動物情報'), a:-soup-contains('一関保健所　譲渡動物情報')"
rows: "p:-soup-contains('管理番号')"
fields:
  management_no: {label: "管理番号"}
  shelter_date: {label: "保護日"}
  location: {label: "保護場所"}
  species: {label: "動物種"}
  size: {label: "大きさ"}
  breed: {regex: "種\\s*類\\s*[:：]\\s*([^\\s　]+)"}
  sex: {regex: "性\\s*別\\s*[:：]\\s*([^\\s　]+)"}
  age: {label: "推定年齢"}
  color: {regex: "毛\\s*色\\s*[:：]\\s*([^\\s　]+)"}
  note: {regex: "備\\s*考\\s*[:：]\\s*([^\\s　]+)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、迷い犬猫情報はありません"
  - "現在、保護されている犬、猫はいません"
  - "現在、里親さんを募集している犬猫はいません"
