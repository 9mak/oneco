# 岩手県 一関保健所（迷子・保護動物情報）— pref.iwate.jp
# 2026-10-05 T517: 迷子ページと譲渡ページを slug で分けた（台帳の kind は slug に 1 つ。迷子 = stray はこの slug、譲渡 = adoption は pref_iwate_ichinoseki-2）。
#   この slug は迷子ページ「一関保健所　保護動物情報」だけを辿る。元の slug を迷子側に残したのは、迷子の犬（管理番号 9-1）が 9/29 から載っていて ID を引き継ぐため。
# 台帳 url は索引ページ。follow_all で「保護動物情報（迷子）」を辿る（ページ番号 1013648 が変わっても索引から追える）。
# 迷子ページ: <p class="imageright"><img></p> の次に <p>管理番号 ：　9-1<br>保護日　 ：　2026.09.14<br>…</p>
#   というフラットな並び。写真は直前の兄弟（行と同じ p タグ）なので image.stop_at: row で前の行まで遡る（2026-10-04）。
#   ラベル文字が全角スペースで字間を空けて書かれている（例:「種　　類」「性　　別」「備　　考」「毛　色　」）ため
#   label: 直指定では一致しない項目は \s（全角スペース U+3000 も含む）を挟んだ regex で拾う。
#   管理番号は「9-1」のように1桁-1桁形式でエンジンの _MGMT_RE には非マッチだが、保護日
#   （2026.09.14 のような日付）があるので動物としては通る。
# 0 頭の日の文言は未確認（今日は 1 頭）。empty_text は旧レシピの推測のまま（外れたら「読めなかった」扱いで通知される側に倒れる）。
steps:
  - follow_all: "a:-soup-contains('一関保健所　保護動物情報')"
rows: "p:-soup-contains('管理番号')"
image: {selector: "p.imageright img@src", scope: prev_siblings, stop_at: row}
fields:
  management_no: {label: "管理番号"}
  shelter_date: {label: "保護日"}
  location: {label: "保護場所"}
  species: {regex: "動物種別?\\s*[:：]\\s*([^\\s　]+)"}
  size: {label: "大きさ"}
  breed: {regex: "種\\s*類\\s*[:：]\\s*([^\\s　]+)"}
  sex: {regex: "性\\s*別\\s*[:：]\\s*([^\\s　]+)"}
  age: {regex: "推定年(?:月)?齢\\s*[:：]\\s*([^\\s　]+)"}
  color: {regex: "毛\\s*色\\s*[:：]\\s*([^\\s　]+)"}
  note: {regex: "備\\s*考\\s*[:：]\\s*([^\\s　]+)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、迷い犬猫情報はありません"
  - "現在、保護されている犬、猫はいません"
