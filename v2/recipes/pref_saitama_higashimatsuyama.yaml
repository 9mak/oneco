# 埼玉県 東松山保健所 収容犬情報（県の 13 保健所は同じ作り）: 1 頭 = 管理番号の行を持つ table 1 つ。写真は table の直前の p の中（h2 の中の new.gif は exclude で外す）。
# 職員が手で更新するページ。0 頭の日は空欄の雛形 table（管理番号「2026-」、収容日「2026年月日」等）が残り、新着情報の 1 行に「収容犬情報はありません」等と書く。（0 頭の文言: 現在収容犬情報はありません。）
# 雛形を動物にしないよう、管理番号は「西暦-連番」、収容日は日まで入った日付が取れたときだけ読む（取れない table は写真も無いので落ちる）。
rows: "#tmp_contents table:-soup-contains('管理番号')"
# 落とす行: ①「年月日」が残る＝収容日が未記入の雛形（管理番号だけ先に入れた「2025-3-005」＋「収容日 2025年月日」の日が実在: 動物指導センター本所 2025-03）。
# ②備考に「収容後死亡」「死亡しました」＝亡くなった子（動物指導センター南支所 2026-09 の備考「削痩。脱水。衰弱。低体温。収容後死亡。」）は載せない。
# field_lacks なので、行が全部これで落ちた日は 0 頭と確認される（text_lacks だと行が数えられず「読めなかった」になる）。
row_filter:
  text_lacks: ["年月日", "年 月 日", "年　月　日"]
  field_lacks: {note: ["収容後死亡", "死亡しました"]}
image: {selector: "img@src", scope: self_or_prev_siblings, exclude: ["new.gif"]}
fields:
  management_no: {label: "管理番号", regex: "(\\d{4}\\s*[-‐‑₋−ー－–]\\s*(?:[A-Za-z]\\s*[-‐‑₋−ー－–]\\s*)?\\d+(?:\\s*[-‐‑₋−ー－–]\\s*\\d+)?)"}
  shelter_date: {label: "収容日", regex: "((?:令和|平成)?\\s*\\d+年\\s*\\d+月\\s*\\d+日)"}
  location: {label: "収容場所"}
  size: {label: "大きさ"}
  # label: "種類" は見出しの文字に「種類」を含むセルを全部拾うので、朝霞・東松山の「動物種類 | 犬」の行を先に取って品種が「犬」になる。
  # 「動物種類」を除いた「種類」の次から「性別」の手前までを読む（2024 年の本庄は 1 行 4 セル「大きさ | 大 | 種類 | 雑種」の作りなので列の位置では読まない）。
  breed: {regex: "(?<!動物)種類\\s+(.+?)\\s+性別"}
  sex: {label: "性別"}
  age: {label: "推定年齢"}
  color: {label: "毛色"}
  note: {label: "備考"}
empty_text:
  - "収容犬情報はありません"
  - "収容情報はありません"
  - "収容犬の情報はありません"
  - "新着情報はありません"
  - "収容犬情報は、ありません"
  - "収容動物はありません"
  - "収容動物情報はありません"
  - "現在、情報はありません"
  - "収容猫情報はありません"
  - "収容犬はいません"
  - "収容猫はいません"
  - "収容犬の情報は有りません"
  - "収容情報は有りません"
# 0 頭の日の新着情報の文言は保健所・時期でぶれる（「現在収容情報はありません」「現在、収容犬の情報はありません」「収容犬情報はありません」「現在収容犬情報は、ありません」
# 「現在収容動物はありません」「現在、収容動物情報はありません」「現在、情報はありません」「現在、新着情報はありません」「現在、収容猫情報はありません」「現在、収容犬はいません」「現在、収容犬の情報は有りません」。Wayback 2021〜2026 で確認）ので全部入れる。
# 動物が載った日は「「収容犬2024-13」を掲載しています」に変わる。
