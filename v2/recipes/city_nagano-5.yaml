# 長野市 犬譲渡情報（市民・ボランティア）。市民・ボランティアが譲渡したい犬の掲示（保健所に収容していない犬）。
# h2「譲渡希望」の下に h3「登録番号／8-42号」+ p(img) + ul（掲載期間／…・連絡先／…・種類／…・毛色／…・性別／…・年齢／…・体格／…・情報／…）。
# 連絡先（個人の電話番号）・譲渡希望者の名前は取らない。写真が div.col2 の中に入る個体がある（image は行の中の 1 枚目）。
# 0 頭の日の文言は未確認（0 頭の日は「読めなかった」扱いで通知に出る）。
# 見出しの階層は日によって違う: 2026-10 は h2（犬・猫・その他／譲渡希望／保護情報）の下に動物ごとの h3、2024-11 以前の保存版は h3 の下に h4。
# どちらも読めるよう動物の見出しは h3・h4 の両方を始まりにする（以前は h3 だけで、旧階層の日は節の見出しの h3 が始まりになり、節の最初の 1 頭だけが載った）。
rows: "h3, h4"
row_until: "h2, h3, h4"
row_filter:
  text_has_any: ["登録番号"]
image: "img@src"
fields:
  management_no: {selector: "h3, h4", regex: "／(\\S+)"}
  breed: {regex: "種類／(\\S+)"}
  color: {regex: "毛色／(\\S+)"}
  sex: {regex: "性別／(\\S+)"}
  age: {regex: "年齢／(\\S+)"}
  size: {regex: "(?:体格|体重)／(\\S+)"}
  note: {regex: "情報／(.+)"}
