# 北海道 宗谷総合振興局 犬猫の新しい飼い主募集（/hk/kks/bosyuu.html）。
# 2026-11-07 W006（PR #104 の公開ゲート）: link_only をやめて 0 頭を読む。
# h3「～飼い主募集中の犬猫情報～（ネットワーク事業）」の下に、保健所・支所ごとの頭数の p が 4 つ（稚内保健所 ：0 / 浜頓別地域保健支所 ：0 / 利尻地域保健支所 ：0 / 道北センター（北見市）：0。名前と「：」の間の全角空白の数は不揃い）。4 つとも 0 の日だけ 0 頭にするため、「：0」とその次の名前をつなげた 3 つの文で 4 つの 0 を確かめる。
# 「犬猫の新しい飼い主さがしノート」の節は飼い主個人の掲載（保健所にはいない）なので読まない。
# 0 頭にするのは下の文が全部そろった日だけ。どれか 1 つでも消えれば（子が載った・作りが変わった）0 頭にならず failed で通知される。
# 2026-11-18: 初めて子が載った（11/13 から。稚内保健所 ：6）。h3「…（ネットワーク事業）」の次の枠に、頭数の p と表が入る。
# 表は 1 行目が見出し（td: NO.・種類・性別・年齢・毛色・性格・公開期限・収容場所・詳細情報）、2 行目から 1 行 = 1 掲載。
# 「R8-3～6」のように子猫 4 頭を 1 行にまとめた掲載は、掲載元のとおり 1 行のまま載せる（頭数の 6 と行数の 3 は合わない）。
# 写真はポスターの PDF の中にしか無いので写真なし。管理番号「R8-1」は番号らしい形（2 桁以上の数字など）でなく、収容日の欄も無いので、
# 個体ページの欄に掲載のページそのものを置いて動物として通す（松本市と同じ。元ページのリンクも掲載のページ）。
# 見出し行は行にしない（tr:not(:first-child)）。種類の欄に犬・猫と書いていない行は動物にしない（field_required。列がずれた日に
# 別の欄を種類と読んで載せず、1 頭も読めなければ failed で通知される）。
rows: "div.ss-alignment:has(> h3:-soup-contains('ネットワーク事業')) + div.ss-alignment table tr:not(:first-child)"
row_filter:
  field_required: {species: ["犬", "猫"]}
fields:
  detail: {selector: "span.__none__", default: "https://www.souya.pref.hokkaido.lg.jp/hk/kks/bosyuu.html"}
  management_no: {selector: "td:nth-of-type(1)"}
  species: {selector: "td:nth-of-type(2)"}
  sex: {selector: "td:nth-of-type(3)"}
  age: {selector: "td:nth-of-type(4)"}
  color: {selector: "td:nth-of-type(5)"}
  note: {selector: "td:nth-of-type(6)"}
  location: {selector: "td:nth-of-type(8)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text_all:
  - "：0 浜頓別地域保健支所"
  - "：0 利尻地域保健支所"
  - "：0 道北センター（北見市）：0"
