# 佐賀県（唐津・東松浦郡）保護犬猫 — 唐津保健福祉事務所
# 佐賀県 5 事務所共通の雛形。1 頭 = table.__wys_table 1 つ（縦並び: 先頭セル「保護犬（管理番号 …）」/ 保護した場所 / 種類 / 毛色 / 性別 / 体格 / 推定年齢 / その他 / 収容日）。
# この事務所は見出しが h2.title（他は h3）。犬猫は先頭セルの「保護犬」「保護猫」で決めるので見出しに依存しない。
# 動物がいない欄は値が空の雛形（「現在、保護情報はありません」）で、写真も番号も無いので自動で落ちる。
rows: "table.__wys_table"
image: "img@src"
fields:
  species: {selector: "td"}
  management_no: {selector: "td", regex: "(\\d{4,}(?:[-‐－–]\\w+)?)"}
  location: {label: "保護した場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  age: {label: "推定年齢"}
  note: {label: "その他"}
  shelter_date: {label: "収容日", regex: "((?:令和|平成)\\s*\\d+\\s*年.*?\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日)"}
species:
  from: field
  map: {"保護犬": dog, "保護猫": cat}
# 0 頭の日の根拠: 犬・猫・その他の 3 つの表のそれぞれに同じ文（「現在、保護情報はありません」）が入る雛形が出るので、文は犬だけ 0 頭・猫に子がいる日にも出る（empty_text にすると、
# 子がいる日に行の読み方が崩れただけで「本日は 0 頭」と通知なしで出る。W006 T631）。そこで文言でなく、表の中に写真（img）が 1 枚も無いことを 0 頭の根拠にする
# （子のいる表は必ず写真があり、雛形の表には img が無い。Wayback の子のいる版・0 頭の版と今日の実ページで確かめた）。表そのものが無い日（作り替え・ブロック）は読めなかった扱い。
empty_absent:
  page: "table.__wys_table"
  none: "table.__wys_table img"
