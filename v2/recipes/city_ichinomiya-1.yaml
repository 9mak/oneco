# 一宮市 保護収容した犬・猫の情報。1 日分 = PDF 1 枚（「10月2日に保護した犬（返還）」）。PDF は表 1 行 = 1 頭（番号・写真・保護日・保護場所・種類・毛色・性別・成犬子犬・首輪等）で、
# 写真は PDF の画像なので取れない（保護日と番号で動物になる）。返還が済んだ PDF は、ページのリンク文字に「（返還）」が付き、PDF にも「返還」の印と
# 「無事に飼い主の元に返還されました」が入る。返還済みは保護中ではないので、リンク文字で外す（PDF を取りにも行かない）。
# 2026-10-05 は PDF 6 枚（8 頭）が全部「返還」済みで、保護中の子は 0 頭。
# 0 頭の判定は empty_absent: ページの見出し（h1）があり、「（返還）」が付いていない PDF のリンクが 1 本も無いこと。（返還）の文字を 0 頭の印にすると、
#   返還済みのリンクがある限り、保護中の PDF が読めなくても「0 頭」に見えてしまうので使わない。保護中の PDF のリンクがあるのに読めない日は「読めなかった」で通知に出る。
# PDF は表で読まない（pdf.mode: text）。pdfplumber の表は、PDF によって見出し行と 1 頭ごとの行の列がずれ（見出し 1・4・7… に対し 0・6・9…）、見出し名で取れない。
# 1 頭 = 日付を含む行（「1 2026.9.24 柴犬 黒 めす 成犬 赤色首輪」）から次の日付行の手前まで。種類・毛色・性別・成犬子犬・首輪等はこの行から、保護場所は次の行から取る。
# 番号は PDF ごとに 1 から振り直されるので（毎日「1」が出る）、ID が衝突しないよう管理番号は「番号 保護日」（例「1 2026.10.2」）で取る。
# 保護中の PDF の実例: Wayback 2022-05-15 の「5月9日に保護した猫（探し中）」（番号 1・保護日 2022.5.9・雑種 キジ白 オス 成猫）が読める。注意: その PDF は保護場所が 2 行に折り返され
#   （「浅井町小日比」が数字の行の前、「野」が後ろ）、location は後ろの行の「野」だけになった（誤り。折り返す長い保護場所で起きる）。2024-08・2025-10 の保護中の PDF は Wayback に保存が無く未確認。
# 返還済みの 6 PDF（8 頭）に、リンクの絞りを外したレシピを当てて、番号・保護日・種類・毛色・性別・成犬子犬・保護場所を確かめた（2026-10-05）。保護中の PDF の見た目と猫の PDF は未確認。
steps:
  - pdf_links: "ul.objectlink li.pdf a[href$='.pdf']:not(:-soup-contains('返還'))@href"
pdf:
  mode: text
rows_regex: "^.*\\d{4}[./]\\d{1,2}[./]\\d{1,2}.*$"
fields:
  management_no: {regex: "^[^\\d\\n]*(\\d+[^\\n]*?\\d{4}[./]\\d{1,2}[./]\\d{1,2})"}
  shelter_date: {regex: "(\\d{4}[./]\\d{1,2}[./]\\d{1,2})"}
  breed: {regex: "\\d{4}[./]\\d{1,2}[./]\\d{1,2}[ \\t]+(\\S+)[ \\t]+\\S+[ \\t]+(?:おす|めす|オス|メス|不明)"}
  color: {regex: "\\d{4}[./]\\d{1,2}[./]\\d{1,2}[ \\t]+\\S+[ \\t]+(\\S+)[ \\t]+(?:おす|めす|オス|メス|不明)"}
  sex: {regex: "\\d{4}[./]\\d{1,2}[./]\\d{1,2}[ \\t]+\\S+[ \\t]+\\S+[ \\t]+(おす|めす|オス|メス|不明)"}
  age: {regex: "(?:おす|めす|オス|メス|不明)[ \\t]+(\\S+)"}
  note: {regex: "(?:おす|めす|オス|メス|不明)[ \\t]+\\S+[ \\t]+(\\S+)"}
  location: {regex: "\\n(?!一宮市|返還|無事|保護)(\\S+)"}
  species: {regex: "(成犬|子犬|成猫|子猫)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_absent:
  page: "h1:-soup-contains('保護収容した犬・猫の情報')"
  none: "ul.objectlink li.pdf a[href$='.pdf']:not(:-soup-contains('返還'))"
