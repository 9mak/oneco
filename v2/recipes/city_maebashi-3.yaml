# 前橋市 【市民保護一覧】市民の方が保護している動物の情報一覧（11961.html）。市民が自宅などで預かっている迷子（kind: sheltered。施設で保護中ではない）。
# 作りは city_maebashi-2（行方不明一覧）と同じ 7 列の表。1 列目は「受付日 (受付番号)」で番号は A2026-11-02 の形、2 列目は「保護日時 場所」（2026年10月中旬 天川原町2丁目 のように旬の日もある）、
# 3 列目の動物種別には猫・犬のほかトカゲなどが載る（犬猫以外は other）。備考に「保護はしていない」と書かれた行（トカゲ）は、その旨を note に出す。写真が付くのは一部の行。
# 写真は pending（前橋市は規約が転載要申請の事前相談が要るホスト）。千葉市・旭川の市民保護と同じく、施設の収容とは区別して出す（台帳の kind と note）。
# 0 頭の日の版は Wayback に見つからない。表の枠はあるが受付番号（(A…）のある行も写真の行も無い日だけ 0 頭にする。
rows: "table tbody tr:has(td:nth-child(7))"
image: "img@src"
fields:
  management_no: {selector: "td:nth-child(1)", regex: "[（(]\\s*([A-Za-z]+\\d{4}(?:-\\d+)+)\\s*[）)]"}
  shelter_date: {selector: "td:nth-child(2)", regex: "^\\s*(\\d{4}年\\d+月(?:\\d+日|[上中下]旬))"}
  location: {selector: "td:nth-child(2)", regex: "^\\s*\\d{4}年\\d+月(?:\\d+日|[上中下]旬)\\s*(?:(?:午前中|午前|午後|朝|昼|夕方|夜|明朝|\\d+時(?:\\d+分)?|頃)\\s*)*(.+)$"}
  species: {selector: "td:nth-child(3)", regex: "^\\s*(\\S+)"}
  breed: {selector: "td:nth-child(3)", regex: "^\\s*\\S+\\s+(.+)$"}
  sex: {selector: "td:nth-child(4)", regex: "^\\s*(\\S+)"}
  age: {selector: "td:nth-child(4)", regex: "^\\s*\\S+\\s+(.+)$"}
  color: {selector: "td:nth-child(5)", regex: "^\\s*(\\S+)"}
  note:
    join:
      - {selector: "td:nth-child(6)"}
      - {selector: "td:nth-child(5)", regex: "^\\s*\\S+\\s+(.+)$", prefix: "首輪等："}
      - {selector: "td:nth-child(7)"}
    sep: " "
species:
  from: field
  map: {"犬": dog, "猫": cat}
  allow_other: true
empty_absent:
  page: "h1:-soup-contains('市民保護一覧')"
  none: "table tbody tr:has(td:-soup-contains('(A')), table tbody tr:has(img)"
