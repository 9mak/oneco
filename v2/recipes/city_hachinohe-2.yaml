# 八戸市 譲渡動物情報 — city.hachinohe.aomori.jp（2026-10-05 T519 環境省リンク集の「動物の譲渡」から辿って追加。2026-10-07 T519v で実ページ・Wayback に当てて直した）
# 構造（2026-10-06 の実ページ、Wayback 2025-07・2025-11 で確認）: h2「譲渡対象犬」「譲渡対象猫」「犬猫以外の譲渡対象動物」の下の
#   div.wysiwyg に、0 頭なら「現在、譲渡対象の犬はいません。」の p、いれば table（caption「一覧表」）。
#   1 つの表に動物が行（tr）で並ぶ（Wayback 2025-07 は猫 2 頭が 1 表の 2 行）。1 行 = 3 セル:
#   [名前：チャ<br>種類：ミックス<br>毛色：茶トラ<br>性別：オス<br>体重：約490グラム<br>年齢：1.5か月位 | 写真 img | 【飼育員からのコメント】…]。
#   犬猫以外（2026-10-06 のクサガメ）は [種類：クサガメ<br>大きさ：約21センチメートル | 写真 | 飼い主募集中です。] で名前・性別・年齢が無い。
#   セルの中に「項目名：値」を書く作りなので label でなく regex で読む。
# 種別は直近の h2（犬猫以外 → 猫 → 犬の順に当てる）。
rows: "article div.free-layout-area table tr"
row_filter:
  text_has_any: ["種類：", "名前："]
  text_lacks: ["決まりました"]   # 3 セル目が「譲渡決まりました。」の行（Wayback 2025-07 の子猫 4 頭）は譲渡済みなので載せない
image: "img@src"
fields:
  name: {regex: "名前：\\s*(\\S+)"}
  breed: {regex: "種類：\\s*(\\S+)"}
  color: {regex: "毛色：\\s*(\\S+)"}
  sex: {regex: "性別：\\s*(\\S+)"}
  size: {regex: "(?:大きさ|体格|体重)：\\s*(\\S+)"}
  age: {regex: "年齢：\\s*(\\S+)"}
  note: {regex: "コメント】\\s*(.+)$"}
species:
  from: heading
  selector: "h2"
  map: {"犬猫以外": other, "猫": cat, "犬": dog}
# 0 頭の日は犬・猫・犬猫以外の 3 節とも「現在、譲渡対象の〜はいません。」。1 節だけが空の日に 0 頭と誤判定しないよう 3 節をつなげて照合する。
# 猫の節の文言が「現在、譲渡対象の犬はいません。」になっている日（Wayback 2026-06-25。サイト側の書き間違い）があるので両方を置く。
empty_text:
  - "譲渡対象犬 現在、譲渡対象の犬はいません。 譲渡対象猫 現在、譲渡対象の猫はいません。 犬猫以外の譲渡対象動物 現在、譲渡対象の動物はいません"
  - "譲渡対象犬 現在、譲渡対象の犬はいません。 譲渡対象猫 現在、譲渡対象の犬はいません。 犬猫以外の譲渡対象動物 現在、譲渡対象の動物はいません"
