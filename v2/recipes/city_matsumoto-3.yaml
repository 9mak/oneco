# 松本市 逸走動物の情報（1524）。飼い主が逸走した動物を探している告知（市民の掲載希望）。
# h2「逸走動物の情報」の下に h3「逸走犬」「逸走猫」と h4「その他の逸走動物」。各個体は h4「逸走猫No.8-5」+ p(img 複数) + table（caption 掲載日・
# 逸走日・逸走場所・掲載希望者（連絡先）・種類・毛色・性別・年齢・体格・装着物・その他）。
# 2026-10-05 は逸走犬 0（「現在、逸走犬の情報はございません。」）・逸走猫 4・その他 0（「現在その他の逸走動物の情報はありません。」）。
# 掲載希望者（個人の名前と電話番号）は取らない。h4 の見出しに <br> や空白が混ざるが管理番号は No. の後ろで取る。
# 種別は個体の見出し h4 の語で決める（逸走犬No.… → 犬、逸走猫No.… → 猫、逸走鳥No.4-1〔2023-06〕・逸走動物No.5-2〔2024-09〕 → 犬猫以外の other）。
#   以前は直近の h3 で決めていて、「その他の逸走動物」が h3 の日（2024-09 のオカメインコ）は種別なしで載り、h4 の日（今の作り）は直前の h3「逸走猫」に引かれて猫と表示される恐れがあった。
#   h4 に種別の語が無い子は種別なしで載せる。
# 見出しに「（掲載前削除）」が付く個体（2023-06 の逸走猫No.4-11）は載せない。
# 逸走猫が 0 頭の日の文言は未確認（犬・その他の文言が empty_text にあり、猫だけ読めなかった日は 0 頭に見えてしまう）。
rows: "h4"
row_until: "h2, h3, h4"
row_filter:
  text_has_any: ["逸走日"]
  text_lacks: ["掲載前削除"]
image: "img@src"
fields:
  species: {selector: "h4", regex: "逸走\\s*(犬|猫|鳥|動物)\\s*No"}
  management_no: {selector: "h4", regex: "No[.．]?\\s*(\\S+)"}
  shelter_date: {label: "逸走日"}
  location: {label: "逸走場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  size: {label: "体格"}
  note: {label: "その他"}
species:
  from: field
  map: {"犬": dog, "猫": cat, "鳥": other, "動物": other}
empty_text:
  - "現在、逸走犬の情報はございません"
  - "現在その他の逸走動物の情報はありません"
