# 千葉県動愛センター東葛飾支所（収容犬）。本所と同一テンプレート
# (<h2>【収容日】...</h2> + <div class="col2"><div class="col2L">)。
# 品種・毛色・性別と 体格・年齢 が別々の <p> に分かれることがある（例: "トイプードル・茶色・メス" / "小型・成犬"）。
# 末尾の「テンプレート」ダミーブロックは管理番号 260000-0-0 固定なので row_filter で除外。
rows: "div.col2"
row_filter:
  text_lacks: ["260000-0-0"]
image: "img@src"
fields:
  management_no:
    regex: "管理番号】\\s*([^\\s（(]+)"
  location:
    regex: "収容場所】\\s*([^\\s【]+)"
  breed:
    regex: "収容場所】\\s*\\S+\\s+([^・\\s]+)・"
  sex:
    regex: "(オス|メス)"
  size:
    regex: "(超小型|超小|小型|中型|大型)"
  age:
    regex: "(成犬|子犬|幼犬|老犬)"
empty_text: ["収容されている動物はいません", "現在収容している犬はいません"]
