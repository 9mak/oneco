# ながさき犬猫ネット 行方不明の動物一覧（迷子） /maigo
# 2026-10-05 監査: 備考（保護時の状況・性格・譲渡条件）が note に入っていなかったので、備考〜次の見出しの手前を note に取る。
# WordPress。一覧 div.list-area 配下の /animal/no-xxx リンクを個体ページ方式（follow_all）で1頭=1ページとして辿る。
# 詳細ページは <li><p>ラベル</p><p>値</p></li> 構造で dt/dd を使わないため label 抽出が効かず、正規表現で本文から拾う。
# 収容日に相当するのは「いなくなった日時」（和暦「令和8年3月14日 22時頃」等）。場所は「いなくなった場所」。
# [旧・2026-11-07 廃止。下の注] 犬猫の別は明記が無い。「模様・柄」が三毛/サビ/キジ/トラ（猫固有の柄）なら猫、それ以外は犬とみなす（既定値）。
# 2026-10-04: 柄が選択肢の「犬（猫）種特有」だと柄では決められず犬に倒れていた（No.20039 は備考に「雄猫」とある猫）。
#   その場合だけ備考の本文を species の根拠にし、「猫」を含めば猫とする（柄が入っている子は従来どおり柄だけで決める）。
# 2026-11-07 W006 監査: 犬猫の別は詳細ページのどこにも書かれていない（品種・柄・備考から推すしかない）のに、「柄が三毛・サビ・キジ・トラなら猫、
#   それ以外は犬」と既定値を犬に置いていたため、猫を犬と表示していた（迷子 20106 は品種「日本ねこ」、20155・20108 も一覧では猫。保護 20143 も猫）。
#   サイト自身の一覧に絞り込み（?animal-type=dog|cat|others。サイトの「種別」ボタンの GET パラメータ）があり、入口を 3 本に分けると
#   一覧の URL が種別の根拠になる（species.from: parent_url。詳細ページは辿ってきた一覧の URL を持つ）。既定値の犬は置かない。
#   0 件の一覧は「投稿がありません」だけ（3 本とも 0 件の日だけ 0 頭。1 本でも読めなければ failed）。ID は写真から決まるので変わらない。
urls:
  - https://animal-net.pref.nagasaki.jp/maigo/?animal-type=dog
  - https://animal-net.pref.nagasaki.jp/maigo/?animal-type=cat
  - https://animal-net.pref.nagasaki.jp/maigo/?animal-type=others
species:
  from: parent_url
  map: {"animal-type=dog": dog, "animal-type=cat": cat, "animal-type=others": other}
steps:
  - follow_all: "div.list-area a[href*='/animal/no-']@href"
rows: "body"
image: "ul.detail-img img@src"
fields:
  management_no: {regex: "No\\.(\\d+)"}
  breed: {regex: "品種\\s*(\\S+)"}
  sex: {regex: "性別\\s*(\\S+)"}
  age: {regex: "年齢\\s*(\\S+)"}
  color: {regex: "毛色\\s*(\\S+)"}
  size: {regex: "体格\\s*(\\S+)"}
  shelter_date: {regex: "いなくなった日時\\s*(.+?)(?=いなくなった場所|問い合わせ先)"}
  location: {regex: "いなくなった場所\\s*(.+?)(?=問い合わせ先)"}
  note: {regex: "備考\\s*(?!動画|動物を譲りたい方)(.+?)(?=\\s*(?:動画|動物を譲りたい方))"}   # 備考の本文を次の見出しの手前まで（備考が空の子は「動物を譲りたい方」を拾わない）
empty_text_entries: ["投稿がありません"]   # 3 本の一覧の全部が空のときだけ 0 頭（犬の一覧だけ空の日は子がいる）
