# 高崎市 飼い主が行方を捜している動物一覧（猫、その他）: city_takasaki-5 と同じ表。種別欄（動物種・種類）は「猫・雑種」「鳥・セキセイインコ」。
# 猫は猫、犬は犬、それ以外（鳥等）は犬猫以外（other）として載せる。行方不明日が「令和8年3月中旬」のような旬の行も読む。
# 一覧は解決した行を消さず、2024 年 9 月からの受付が全部残る（131 行）。掲載元が載せているかぎり載せる（こちらで期間を決めて切らない。POLICY.md 方針 31。以前は受付が令和8年以降の行だけ載せていたが外した）。
# 2026-11-07 監査 C: 「ゆき」の番号は掲載元に「26026-3」（5 桁。他は 2026-72 の形なので誤記の可能性）とあり、regex は 4 桁だけ取って「6026-3」になる。
# 写真が無い子なので ID が番号由来で、取り直すと今いる子の ID が変わるため直していない（人の判断）。
rows: "table tr:has(td)"
image: "img@src"
species:
  from: field
  map: {"猫": cat, "犬": dog}
  allow_other: true
fields:
  species: {selector: "td:nth-of-type(3)"}
  name: {selector: "td:nth-of-type(6)", regex: "呼[び]?名[:：]\\s*(\\S+)"}
  management_no: {selector: "td:nth-of-type(1)", regex: "(\\d{4}\\s*[-‐‑₋−ー－–]\\s*(?:[A-Za-z]\\s*[-‐‑₋−ー－–]\\s*)?\\d+)"}
  shelter_date: {selector: "td:nth-of-type(2)", regex: "((?:令和|平成)?\\s*\\d+年\\s*\\d+月\\s*(?:\\d+日|[上中下]旬)?)"}
  location: {selector: "td:nth-of-type(2)", regex: "年\\s*\\d+月\\s*(?:\\d+日(?:[～~]\\d+日)?|[上中下]旬)?\\s*(.+)$"}
  breed: {selector: "td:nth-of-type(3)", regex: "^(?:猫・|犬・|鳥・)?(.+)$"}
  sex: {selector: "td:nth-of-type(4)", regex: "^(?!\\d)([^・]+)"}
  size: {selector: "td:nth-of-type(4)", regex: "^[^・]+・([^・]+)"}
  age: {selector: "td:nth-of-type(4)", regex: "^(?:[^・]+・[^・]+・|(?=\\d+(?:か月|ヶ月|才|歳)))(.+)$"}
  # 4 列目が「5か月齢」だけの行（アヒル。性別・体格は書かれていない）は、年齢だけ取る（性別に「5か月齢」が入らない）。
  # 5 列目は「毛色・首輪」（「茶・無」「白が多い・革製青色」「首輪無」）。毛色は最後の「・」より前、首輪は備考に「首輪：…」（2026-11-13 Codex #6）
  color: {selector: "td:nth-of-type(5)", regex: "^(?!首輪)(.+?)(?:・[^・]*)?$"}
  note: {join: [{selector: "td:nth-of-type(6)"}, {selector: "td:nth-of-type(5)", regex: "(?:・|^首輪)([^・]+)$", prefix: "首輪："}], sep: " "}
empty_selector: "table tr:has(td) td"
