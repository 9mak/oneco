# 西宮市 ペットが迷子になった時は？（迷い犬・迷い猫情報）。ページの下の方の h2「迷い犬・迷い猫情報」の下に、
# 0 頭の日は <div class="wysiwyg_wp"><p class="img-only">現在、迷子の動物の収容はありません。</p></div> が出る（2026-10-05 確認）。
# 動物が載った日（Wayback 2024-06 の迷い犬 1 頭で確認。2026-10-07 T519v）:
#   <div class="h2bg"><div><h2>迷い犬No.553</h2></div></div> → <div class="wysiwyg_wp"> <p class="img-only"><img 写真 1></p> <p class="img-only"><img 写真 2></p>
#   <table><caption>犬の情報</caption> 収容日時（td＋strong）・収容場所・種類・年齢・毛色・性別・体格・特徴（th/td）</table></div>
#   見出しの「No.553」が管理番号、「迷い犬／迷い猫」で種別が決まる。
# 本文ブロック（div.wysiwyg_wp）のうち、収容日時・収容場所などの語があるものだけを 1 頭とする。ページ先頭の案内（連絡先の ul・マイクロチップの注意）の
# div.wysiwyg_wp はこれらの語を持たないので落ちる。
# 0 頭の日に文言が出ない版がある（Wayback 2025-04・2026-03 は案内だけで、動物も 0 頭の文言も無い）。その日は枠（h2「迷い犬・迷い猫情報」）があり、
# 動物の見出し（h2「迷い犬No.553」）も収容情報の表も無いことで 0 頭と確定する（empty_absent）。枠が無い日や、表・番号付きの見出しが残る日は「読めなかった」で通知に出る。
rows: "div.wysiwyg_wp"
row_filter:
  text_has_any: ["収容日時", "収容日", "収容場所", "保護日", "保護場所", "管理番号", "収容年月日"]
image: {selector: "img@src", exclude: ["spacer.gif"]}
fields:
  management_no: {from: heading, selector: "h2", regex: "No\\.?\\s*(\\d+)"}
  shelter_date: {label: ["収容日時", "収容日"], regex: "((?:令和|平成)?\\s*\\d+年\\s*\\d+月\\s*\\d+日)"}
  location: {label: "収容場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  size: {label: "体格"}
  note: {label: ["特徴", "その他特徴"]}
species:
  from: heading
  selector: "h2"
  map: {"迷い犬": dog, "迷い猫": cat}
empty_text:
  - "現在、迷子の動物の収容はありません"
empty_absent:
  page: "h2:-soup-contains('迷い犬・迷い猫情報')"
  none: "div.wysiwyg_wp table, h2:-soup-contains('No')"
