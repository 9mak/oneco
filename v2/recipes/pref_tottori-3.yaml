# 鳥取県 ペットを「捜しています」・「保護しています」（243905.htm）のうち「保護しています」＝飼われていたと思われる迷い犬猫を保護し、本来の飼い主さんを探している県民からの情報（kind: sheltered。県の収容ではなく県民の保護）。
# 作りは pref_tottori-2（捜しています）と同じ（h2 の年度の節 → a → h4「問合番号P08-005」→ div の表。表の列は種類・保護した時期・保護した場所・特徴・写真とコメント（PDF の「■」）・掲載年月日）。
# おまえさん決定（2026-11-18）: こちらで期間を決めず、掲載元が載せている届け出は全部出す（毎年直す作り込みはバグのもと）。
# 2026-11-21（T656 直し 2 回目）: 届け出は番号の頭の文字ではなく、いる節の見出し（h2「保護しています（…年度受付）」）で選ぶ。令和5年度以前の節の「05-04」（猫・R6 年 1 月 7 日・鳥取市青谷町青谷）は
#   番号に P が付かないだけで「保護しています（令和5年度以前受付分）」の節にいる。番号の頭の P で選んでいたので載っていなかった。節で選べば番号の書き方が変わっても落とさない。
#   「捜しています」の節の届け出（M…、頭の文字の無い「07-018」も）は読まない（pref_tottori-2 の仕事）。
# 年度の節に 1 件も無い日は h2 の下に h4「現在、掲載情報はありません」が出る（令和6年度）。届け出が来るまで節そのものが無い版もある（Wayback 2025-11 は令和7年度の「保護しています」の節が無かった）。
# 「保護しています（…年度受付）」の節（h2）はあり、届け出の一覧の h4 が全部「現在、掲載情報はありません」の日だけ 0 頭にする。節が無い日は 0 頭と言い切らない。
# 写真は PDF 内（■）で HTML に画像は無い。写真の規約は鳥取県が転載要申請なので photo: pending。
rows: "div.BrowserItemList h4:-soup-contains('問合番号')"
row_until: "h2, h4"
row_filter:
  field_has_any: {section: ["保護しています"]}   # 行より前の直近の h2 が「保護しています（…年度受付）」の節の届け出だけ
fields:
  section: {from: heading, selector: "h2"}   # 除外判定用（animals には出ない）
  management_no: {selector: "h4", regex: "問合番号\\s*(\\S+)"}
  species: {selector: "table tr:nth-of-type(2) > td:nth-of-type(1)"}
  shelter_date: {selector: "table tr:nth-of-type(2) > td:nth-of-type(2)"}
  location: {selector: "table tr:nth-of-type(2) > td:nth-of-type(3)"}
  note: {selector: "table tr:nth-of-type(2) > td:nth-of-type(4)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
  allow_other: true
empty_absent:
  page: "h2:-soup-contains('保護しています（')"
  none: "div.BrowserItemList h4:not(:-soup-contains('現在、掲載情報はありません'))"
