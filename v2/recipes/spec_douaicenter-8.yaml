# 2026-10-04 location の見出しを 不明場所 → 保護場所 に変更（猫 13946 フジノで確認）。同ページの本文に「保護はしていません」とあり目撃だけなので text_lacks で捨てる（保護できていない告知は載せない方針）。「探しています」は区分 lost の -10 に分けた。
# 旭川市あにまある「ペット探しています/保護しています」一覧（/other-animal/list/cat）。
# 一覧の a[href^=.../other-animal/xxxx] が1頭 → follow_all で個別ページへ。
# 個別ページは table.animal-desc-table だが見出しが「不明日」「不明場所」（保護日/場所ではない）。
# 連絡先は飼い主個人の電話（施設代表番号ではない）なので取らない。
# 「探しています」は飼い主が迷子を探している告知で、収容されている子ではないので捨てる（2026-09-30 おまえさん指摘）。
steps:
  - follow_all: "a[href^='https://www.douaicenter.jp/other-animal/']:not([href*='other-animal/list'])"
rows: "body"
row_filter:
  text_lacks: ["保護はしていません"]   # 「野良猫の可能性もあり、保護はしていませんが念のため掲載」＝保護できていない目撃だけの告知は捨てる
  field_lacks: {name: ["探しています", "探してます", "探しております"]}   # rows: body なのでメニュー文言に当たらないよう name で判定
image:
  selector: ".animal-image .large img@src"
fields:
  name: {selector: "h2.elementor-heading-title"}
  shelter_date: {label: "不明日"}
  location: {label: "保護場所"}   # 「保護しています」ページの見出しは保護場所（「探しています」の不明場所は -10 が拾う）
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  size: {label: "体格"}
empty_text: ["現在、登録がございません"]
