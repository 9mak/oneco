# proposal: run の日付 2026-11-09・元の失敗理由 0 頭で empty_text も無い（行 0・捨てた 0）・取れた頭数 1・採用条件は次の行（人が差分を見て recipes/ へ反映する。今日の HTML は <slug>.today.html）
# 採用条件: 合格 a 必須項目・b 重複・c 行数・v1 見出し語・v2 日付・v3 現行の指定を保つ / 飛ばした d 回帰（保存 HTML なし）・v4 旧新比較（旧レシピが読めた保存ページが無い） / 回帰未確認 / 半自動の対象外（旧新の比較ができていない。draft のまま人が見る）
# agy note: 実際の掲載が表ではなくpタグによる箇条書き形式（「引取り又は収容の場所/日」等）だったため、row_filterの判定語を追加しました。各項目をpタグ内のテキストから正規表現で取得するようにし、年なしの日付にも対応させました。また実態のないempty_selectorを整理しました。
# 寝屋川市 保健所収容動物。h2「保健所収容動物情報」下の div.wysiwyg を 1 頭とする。
# 収容時は p タグで「引取り又は収容の場所/日」等の項目と写真が並び、0 頭時は「現在保健所に収容中の動物はいません」が出る。
rows: "div.wysiwyg"
row_filter:
  text_has_any: ["引取り又は収容", "収容の場所", "収容の日", "収容場所", "保護場所", "収容日", "保護日", "公開期限"]
fields:
  management_no: {selector: "p:-soup-contains('番号')", regex: "番号[:：]\\s*(\\S+)"}
  shelter_date: {regex: "(?:収容の日|収容日|収容年月日)[:：]\\s*((?:(?:令和|平成)?\\s*\\d+年\\s*)?\\d+月\\d+日)"}
  location: {selector: "p:-soup-contains('場所')", regex: "場所[:：]\\s*(.+)"}
  breed: {selector: "p:-soup-contains('種類')", regex: "種類[:：]\\s*(.+)"}
  species: {selector: "p:-soup-contains('種類')", regex: "種類[:：]\\s*(.+)"}
  color: {selector: "p:-soup-contains('特徴')", regex: "(?:色等の特徴|毛色|色|特徴)[:：]\\s*(.+)"}
  sex: {selector: "p:-soup-contains('性別')", regex: "性別[:：]\\s*(.+)"}
  size: {selector: "p:-soup-contains('体格')", regex: "体格[:：]\\s*(.+)"}
  age: {selector: "p:-soup-contains('年齢')", regex: "年齢[:：]\\s*(.+)"}
  note: {selector: "p:-soup-contains('備考')", regex: "備考[:：]\\s*(.+)"}
species:
  from: field
  map: {"猫": cat, "ねこ": cat, "ネコ": cat, "犬": dog, "いぬ": dog, "イヌ": dog}
  infer: true
empty_text:
  - "現在保健所に収容中の動物はいません"
