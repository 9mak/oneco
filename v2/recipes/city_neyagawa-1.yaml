# 寝屋川市 保健所収容動物。h2「保健所収容動物情報」の下の <div class="wysiwyg"> に、0 頭の日は
# <p>現在保健所に収容中の動物はいません。</p> だけが出る（2026-10-05 確認）。
# 動物が載った日の作りは未確認（T519。Wayback の保存は 2023-03 の 1 つだけで、値の入っていない雛形だった）。2023-03 の雛形は
# <div class="wysiwyg"> の中に <table><caption>収容動物情報：</caption> の 1 列表（th: 公開期限・収容場所・種類・毛色・体格・性別・推定年齢・首輪・その他 / td: 値）が
# 1 つ入っていた（2026-10-07 T519v）。値の入る日はこの表（と、あれば同じ div の写真）が動物になると見て、
# 収容場所・公開期限などの語がある本文ブロック（div.wysiwyg）だけを 1 頭とする。ページ先頭の案内（「行方不明になった犬及び猫を捜している飼い主の方に向けて」）や
# 「逃げてしまった方へ」の div.wysiwyg はこれらの語を持たないので落ちる。
# 値が入った日に写真も管理番号も収容日も無いと動物として通らず「読めなかった」で通知に出る（誤掲載しない側に倒す。公開期限は収容日ではないので収容日には取らない）。
# 種別は台帳が mixed で作りも未確認なので決めない（種別なしで載る。記述の項目が 2 つ以上取れる行だけ）。
rows: "div.wysiwyg"
row_filter:
  text_has_any: ["収容日", "保護日", "収容場所", "保護場所", "管理番号", "収容年月日", "公開期限"]
fields:
  management_no: {label: "管理番号"}
  shelter_date: {label: ["収容日時", "収容日", "収容年月日"], regex: "((?:令和|平成)?\\s*\\d+年\\s*\\d+月\\s*\\d+日)"}
  location: {label: ["収容場所", "保護場所"]}
  breed: {label: ["種類", "犬種"]}
  species: {label: ["種類", "犬種"]}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: ["推定年齢", "年齢"]}
  size: {label: "体格"}
  note: {label: ["その他", "特徴"]}
species:
  from: field
  map: {"猫": cat, "ねこ": cat, "ネコ": cat, "犬": dog, "いぬ": dog, "イヌ": dog}
  infer: true
empty_text:
  - "現在保健所に収容中の動物はいません"
# 値の入っていない雛形の表が出る日（Wayback 2023-03。文言は無く、表の td の p がすべて空）も 0 頭。表の caption「収容動物情報」の表の td の p だけを見る
# （値が入った日は p に文字があるので当たらない。他の表の td は見ない）。
empty_selector: "div.wysiwyg table:has(caption:-soup-contains('収容動物情報')) td p"
