# 寝屋川市 保健所収容動物。h2「保健所収容動物情報」の下の <div class="wysiwyg"> を 1 頭とする。
# 0 頭の日は <p>現在保健所に収容中の動物はいません。</p> だけが出る（2026-10-05 確認）。
# 子が初めて載った日（2026-11-10 0:05）は表ではなく p の箇条書き: h3「現在保健所に収容中の動物」の下に
# 「1.引取り又は収容の場所：…」「2.引取り又は収容の日：11月9日」「3.動物の種類：猫」「4.色等の特徴：…」「5.性別：…」「6.体格：…」「7.備考：…」と写真。
# 項目の読み方は本番の AI 修復の案（draft PR #115・agy 既定モデル）を実ページで確かめて採った（初めての採用。人が見て merge）。
# 案は Wayback 2023-03 の雛形の日の根拠（empty_selector）を「実態が無い」として消していたので、それは残した。
# 雛形の日: <div class="wysiwyg"> の中に <table><caption>収容動物情報：</caption> の 1 列表（th: 公開期限・収容場所・…）があり td の p がすべて空。
# 表に値が入る日の作りは未確認で、この読み方では項目が取れず「読めなかった」で通知に出る（誤掲載しない側）。
rows: "div.wysiwyg"
row_filter:
  text_has_any: ["引取り又は収容", "収容の場所", "収容の日", "収容場所", "保護場所", "収容日", "保護日", "公開期限"]
fields:
  management_no: {selector: "p:-soup-contains('番号')", regex: "番号[:：]\\s*(\\S+)"}
  shelter_date: {regex: "(?:収容の日|収容日|収容年月日)[:：]\\s*((?:(?:令和|平成)?\\s*\\d+年\\s*)?\\d+月\\d+日)"}
  location: {selector: "p:-soup-contains('場所')", regex: "場所[:：]\\s*(.+)"}
  breed: {selector: "p:-soup-contains('種類')", regex: "種類[:：]\\s*(.+)"}
  species: {selector: "p:-soup-contains('種類')", regex: "種類[:：]\\s*(.+)"}
  color: {selector: "p:-soup-contains('特徴')", regex: "(?:色等の特徴|毛色|色|特徴)[:：]\\s*(.+)"}
  sex: {selector: "p:-soup-contains('性別')", regex: "性別[:：]\\s*(.+)"}
  size: {selector: "p:-soup-contains('体格')", regex: "体格[:：]\\s*(.+)"}
  age: {selector: "p:-soup-contains('年齢')", regex: "年齢[:：]\\s*(.+)"}
  note: {selector: "p:-soup-contains('備考')", regex: "備考[:：]\\s*(.+)"}
species:
  from: field
  map: {"猫": cat, "ねこ": cat, "ネコ": cat, "犬": dog, "いぬ": dog, "イヌ": dog}
  infer: true
empty_text:
  - "現在保健所に収容中の動物はいません"
# 値の入っていない雛形の表が出る日（Wayback 2023-03。文言は無く、表の td の p がすべて空）も 0 頭。表の caption「収容動物情報」の表の td の p だけを見る
# （値が入った日は p に文字があるので当たらない。他の表の td は見ない）。
empty_selector: "div.wysiwyg table:has(caption:-soup-contains('収容動物情報')) td p"
