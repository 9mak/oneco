# 大阪府動物愛護管理センター 譲渡動物情報（犬猫以外）（jyoutoinunekoigai.html）。センターが新しい飼い主を募集している犬猫以外の動物（2026-11-17 はウサギ）。
# ページ上部の写真の一覧（種類ごとのアイコン）の下に、h2「ウサギ」→ h4「オス」「メス」→ 1 頭 = 1 つの table（左に写真、右に 管理番号・毛色・性別・推定年齢・体重・アピールポイント・撮影年月日）。
# 犬猫以外のページなので、h2 の動物の名前（ウサギ）を種類（breed）に出し、種別は other（犬猫以外）。管理番号は「25-00885」とセンターネーム「しーくん」が 2 段で入る。
# 0 頭は「表も個体の写真も無い」ことで決める（0 頭の日の文言は未確認）。
rows: "#tmp_contents table"
row_filter:
  text_has_any: ["管理番号"]
image: "img@src"
fields:
  management_no: {label: "管理番号", regex: "(\\d{2}-\\d{4,6})"}
  name: {label: "管理番号", regex: "センターネーム[:：]\\s*([^）)]+)"}
  breed: {from: heading, selector: "h2"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "推定年齢"}
  size: {label: "体重"}
  note: {label: "アピールポイント"}
species:
  from: heading
  selector: "h2"
  map: {"犬": dog, "猫": cat}
  allow_other: true
empty_absent:
  page: "#tmp_contents h1:-soup-contains('犬猫以外')"
  none: "#tmp_contents table, #tmp_contents img[src*='/images/20402/']"
