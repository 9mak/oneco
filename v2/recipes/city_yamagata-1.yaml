# 山形市動物愛護センター 保護【犬・猫・その他】情報（kurashi/pet/1006550/1005142.html）。山形市内で保護した犬・負傷動物の収容情報。
# 作りは h2「保護・収容【犬】情報」「保護・収容【猫】情報」（日によって「【その他】」も）の 2 節。犬のいる日は、節の下に
#   p「1　12月2日（木曜）青田二丁目地内で収容 犬種：トイプードル系 性別：メス 年齢：10歳くらい マイクロチップなし …」→ p.imagecenter（写真 1〜3 枚）
# が平らに並ぶ（Wayback 2021-12 は 2 頭、2022-01 は 1 頭。「1　12月10 日（金曜）吉原西公園付近の路上で保護され 現在当センターで収容しています。犬種：チワワ系 性別：… 毛色：…」）。
# 0 頭の日は「現在、保護している犬／猫はいません。」（2024-05）か、中身の無い p だけ（2024-08・2026-11-07）。2026-10-05 は犬の節にポスター画像 1 枚だけ
# （文字で読めない）、2024-12 の「その他」の節には鳥の写真があった。作りが一定しないので、文字の行（性別を含む p）だけ読み、
# 節に文・写真・表・リストのどれかがあるのに行が取れない日は 0 頭にせず failed（通知）にする。猫が載った日の文の書き方は保存に無く未確認（犬と同じ作りと見て読む）。
# 1 頭 = 性別を含む p から、次の性別を含む p・節の見出し・ページ下の定型文の p の手前まで（写真の p.imagecenter を含む）。
rows: "#voice h2:-soup-contains('保護・収容') ~ p:-soup-contains('性別')"
row_until: "p:-soup-contains('性別'), h2, p:-soup-contains('当センターの管轄'), p:-soup-contains('譲渡を希望'), p:-soup-contains('動物を捨てる')"
row_filter:
  text_lacks: ["返還"]
species:
  from: heading
  selector: "h2"
  map: {"【犬】": dog, "【猫】": cat}
fields:
  shelter_date: {regex: "(\\d+月\\s*\\d+\\s*日)"}
  location: {regex: "）\\s*(.+?)\\s*で(?:収容|保護)"}
  breed: {regex: "[犬猫]種[:：]\\s*(.+?)\\s+性別"}
  sex: {regex: "性別[:：]\\s*(\\S+)"}
  age: {regex: "年齢[:：]\\s*(\\S+)"}
  color: {regex: "毛色[:：]\\s*(\\S+)"}
  note: {regex: "(マイクロチップ.*)$"}
image: {selector: "p.imagecenter img@src"}
# 犬と猫の節の見出しがあり、その後ろに文・写真・表・リスト・見出しが無い日だけ 0 頭（節の文は日で違うので文言を根拠にしない）
empty_absent:
  page: "#voice h2:-soup-contains('保護・収容【犬】情報') ~ h2:-soup-contains('保護・収容【猫】情報')"
  none: "#voice h2:-soup-contains('保護・収容') ~ :is(p:has(img), table, h3, h4, ul:not(.objectlink), ol, p.imagecenter, p:-soup-contains('性別'), p:-soup-contains('収容'), p:-soup-contains('保護しています'))"
