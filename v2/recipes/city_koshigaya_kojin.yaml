# 越谷市（個人保護犬猫）hogo_kojin.html
# div#main_content2 の直下に、div.h2bg（h2「犬の情報」「猫の情報」）→ h3.partsstyle_h3（R8-001）→ p 写真 → p 写真 →
# p 発見場所：→ p 発見時期：→ p 毛色：→ p 特徴： が平らに並ぶ。row_until で h3 から次の見出しの div.h2bg までを 1 行にまとめる（T517）。
# 「参考：越谷警察署」「参考：マイクロチップについて」等の見出し用 h3 は div.h3bg > div > h3 に包まれており class が無いので、
# class="partsstyle_h3" だけが 1 頭の始まりになる。
# 管理番号は始まりの h3 自身（selector: h3。from: heading にすると前の子の番号になるので使わない）。
# 写真の 1 枚目は文字入りの迷子ポスター（maigo_pos.jpg）なので外し、2 枚目以降の写真を使う。
# species は直前の h2（犬の情報・猫の情報）で決める。
rows: "h3.partsstyle_h3"
row_until: "div.h2bg"
image:
  selector: "img@src"
  exclude: ["maigo_pos"]
fields:
  management_no: {selector: "h3"}
  location: {label: "発見場所"}
  shelter_date: {label: "発見時期"}
  color: {label: "毛色"}
  note: {selector: "p:-soup-contains('特徴')", regex: "特徴[:：]\\s*(.+)"}
species:
  from: heading
  selector: "h2"
  map: {"犬の情報": dog, "猫の情報": cat}
# 0 頭の根拠（W006 T631）: 「現在、情報はありません。」は犬の節・猫の節それぞれに同じ文が入るので、片方に子がいる日にも出る（Wayback 2023-04・2026-06 は 1 頭の版）。
# 同じ文は 2 節を区別できないため、ページの題名が公式に示す頭数「（情報：0頭）」と組にして、揃った日だけ 0 頭にする
# （題名は子のいる版では「（情報：1頭）」「（情報：１頭）」。0 頭の版は Wayback 2021-12〜2025-06 と tests/fixtures/t517_koshigaya_kojin.html）。
empty_text_all:
  - "個人の方が保護している犬・猫の情報（情報：0頭）"
  - "現在、情報はありません"
