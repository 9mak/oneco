# proposal: run の日付 2026-10-29・元の失敗理由 0 頭で empty_text も無い（行 1・捨てた 1）・取れた頭数 1・採用条件は次の行（人が差分を見て recipes/ へ反映する。今日の HTML は <slug>.today.html）
# 採用条件: 合格 a 必須項目・b 重複・c 行数 / 飛ばした d 回帰（保存 HTML なし） / 警告 species 未確定 1 件（build の仕様で載せる。台帳が mixed のときに起きる） / 回帰未確認
# agy note: 現行レシピの shelter_date は西暦4桁（\d{4}）のみに限定されており、豊田市PDFで使われる和暦（令和8年10月22日等）や改行・空白を挟む配置で収容日が取れず1頭分が捨てられていたため、和暦（令和・R）や月日表記およびラベル後の改行を含む形式に対応させました。あわせて管理番号（management_no）・犬猫種別（species.map / infer）の抽出を補強し、行が捨てられないように修正しました。
# 入口ページの迷子動物情報PDFをテキストとして読み、「収容日」「保護日」「発見日」で始まるブロック1つを1頭とみなす。
steps:
  - pdf_links: "article#content a[href$='.pdf']@href"
pdf:
  mode: text
rows_regex: "(?:収容日|保護日|発見日)"
fields:
  management_no: {regex: "(?:管理番号|収容番号|番号)\\s*[:：]?\\s*([A-Za-z0-9０-９\\-]+)"}
  shelter_date: {regex: "(?:収容日|保護日|発見日)[\\s\\S]{0,60}?((?:令和\\s*\\d+|[RrＲ]\\d+|20\\d{2})\\s*[年/\\-\\.]\\s*\\d{1,2}\\s*[月/\\-\\.]\\s*\\d{1,2}\\s*日?|\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日)"}
  species: {regex: "(?:(?:種類|種別|動物種)\\s*[:：]?\\s*)?(犬|猫|イヌ|ネコ|ねこ)"}
  breed: {regex: "(?:種類|犬種|猫種|品種)\\s*[:：]?\\s*(\\S+)"}
  sex: {regex: "(?:性別\\s*[:：]?\\s*)?(去勢オス|避妊メス|オス|メス|雄|雌|おす|めす|不明)"}
  age: {regex: "(?:年齢|推定年齢)\\s*[:：]?\\s*(\\S+)"}
  color: {regex: "(?:毛色|色)\\s*[:：]?\\s*(\\S+)"}
  size: {regex: "(?:体格|大きさ|体重)\\s*[:：]?\\s*(\\S+)"}
  location: {regex: "(?:収容場所|発見場所|保護場所)\\s*[:：]?\\s*([^\\n]+)"}
  note: {regex: "(?:特徴|備考|首輪)\\s*[:：]?\\s*([^\\n]+)"}
species:
  from: field
  map: {"犬": dog, "猫": cat, "イヌ": dog, "ネコ": cat, "ねこ": cat}
  infer: true
empty_text:
  - "現在、豊田市では迷子の犬を収容していません"
  - "現在、豊田市では迷子の猫を収容していません"
  - "現在、収容している迷子動物はいません"
