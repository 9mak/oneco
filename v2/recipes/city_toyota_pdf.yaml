# 豊田市動物愛護センター（迷子動物）
# 入口ページ（台帳の URL は /sumaikankyo/pet/pet/1073803/1003696.html へ 302）の本文に PDF リンク 1 本（ファイル名は日付で変わる。maigo261022.pdf）。
# 動物がいる日の PDF（2026-10-22 版・Wayback 2019-03-28 版）は「・犬」「・猫」の節ごとに罫線の表があり、見出し行
# 「写真 収容日 収容場所 種類 毛色 性別 体格 特徴等」（2019 年は「保護日 保護場所 … 特徴」）の下に 1 行 = 1 頭。
# 性別のセルが「オス」「（去勢済）」の 2 行に割れ、特徴等のセルの文字が上に寄るので、文字（mode: text）で読むと値が前後の行に
# ずれ、見出し行の語を値に取る（AI 案 #76 の「収容場所 = 種類 毛色 性別 体格 特徴等」）。表（mode: table）で読み、項目は見出しの名前で引く。
# 種別: 表に動物種の欄が無く、犬・猫は表の外の節見出し「・犬」「・猫」にしか書かれない（table モードの行からは見えない）。
#   種類の欄に犬・猫の語があればそれで、無ければ種類・毛色の犬だけ・猫だけの語（キジ 等）で決め（infer）、決まらない子は種別なしで載せる。
# 写真は PDF の中の画像なので取れない（台帳 photo: pending）。管理番号も無いので ID は収容日で決まり、同じ収容日の子が 2 頭いると
#   2 頭目は「同じ ID の行が既にある」で捨てられる（エンジンの制約。city_yokkaichi_pdf と同じ）。
# 1 頭の行が約 188pt あり 1 ページに入るのは 3 頭まで。4 頭目から 2 ページ目に見出し行の無い続きの表が出ると header_has に当たらず読まれない（未確認・想定）。
# 0 頭の日の PDF は「現在、豊田市では迷子の犬を収容していません。」「…猫を収容していません。」の 2 文だけ（Wayback 2025-10-02 版 maigo251002.pdf。
#   2026-09 の 0902maigo.pdf も 2 文だけだった〔2026-09-30 監査〕）。
#   2019-03-28 版は犬の表と同じ PDF の猫の節に「現在、豊田市では迷子の猫を保護しておりません。」を出していたので、1 文だけでは 0 頭にしない
#   （表が読めなくなった日を 0 頭に見せない）。犬・猫の 2 文が続けて出るときだけ 0 頭（2023-05-03 版の節見出し付きの書き方も同じ）。
steps:
  - pdf_links: "a[href$='.pdf']"
pdf:
  mode: table
  header_has: "種類"
fields:
  shelter_date: {label: ["収容日", "保護日"]}
  location: {label: ["収容場所", "保護場所"]}
  species: {label: "種類"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  note: {label: "特徴"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
  infer: true
empty_text:
  - "現在、豊田市では迷子の犬を収容していません。\n現在、豊田市では迷子の猫を収容していません"
  - "・犬\n現在、豊田市では迷子動物を収容していません。\n・猫\n現在、豊田市では迷子動物を収容していません"
