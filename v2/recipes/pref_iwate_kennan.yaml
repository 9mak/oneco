# 岩手県 県央保健所（犬猫保護センター）— pref.iwate.jp
# 2026-10-04: 行を「管理番号：」の p から「名前：」の p に変え、image に p.imageleft を prev_siblings で足した。
#   カテリーナのように 1 頭分が 3 つの p（名前〜特徴 / その他 / 管理番号）に割れた個体は、管理番号だけの p を行にすると
#   動物種が無く捨てられていた。名前の p を行にすると動物種・名前・性別などは取れる（管理番号だけは別 p なので空）。
#   ただし写真（直前の p.imageleft）は行と同じ p タグのため、エンジンが遡りを止めて現状は届かない（engine_needs）。
#   写真が無いカテリーナは、管理番号も無いので現状は捨てられる（エンジンが直れば 7 頭になる）。
# 台帳 url は最終の一覧ページ（morioka/hoken/1012494.html）を直接指す
# （ハブ→doubutsu/index.html→1012494.html と2段だが、台帳側で最終URLを直接指定）。
# 構造: article#content 直下がフラットな並びで、写真 <p class="imageleft"><img></p> の次に
# 名前/動物種/種類/性別/毛色/大きさ/推定年齢/特徴/その他/管理番号 を <br> 区切りで書いた <p> が続く
# （両方を包む共通コンテナが無く、img は兄弟要素の p の中）。
# 迷子（元の飼い主探し）セクションは通常0件、譲渡候補セクションが本体。
rows: "p:-soup-contains('名前：')"
image: {selector: "p.imageleft img@src", scope: prev_siblings, stop_at: row}   # 2026-10-04: 行も写真も p なので前の行まで遡る
fields:
  name: {label: "名前"}
  species: {label: "動物種"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  color: {label: "毛色"}
  size: {label: "大きさ"}
  age: {label: "推定年齢"}
  note: {label: "特徴"}
  management_no: {label: "管理番号"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、保護されている動物はいません"
  - "保護されている動物はいません"
