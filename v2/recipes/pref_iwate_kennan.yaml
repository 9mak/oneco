# 岩手県 県央保健所（犬猫保護センター）— pref.iwate.jp
# 台帳 url は最終の一覧ページ（morioka/hoken/1012494.html）を直接指す
# （ハブ→doubutsu/index.html→1012494.html と2段だが、台帳側で最終URLを直接指定）。
# 構造: article#content 直下がフラットな並びで、写真 <p class="imageleft"><img></p> の次に
# 名前/動物種/種類/性別/毛色/大きさ/推定年齢/特徴/その他/管理番号 を <br> 区切りで書いた <p> が続く
# （両方を包む共通コンテナが無く、img は兄弟要素の p の中なのでこのエンジンからは届かない → 画像なし）。
# 行 = 「管理番号：」を含む p（city_chiba-1 / city_okayama と同じ手口）。
# まれに1頭分の情報が複数 p に分割される個体（管理番号だけの p が来る等）があり、その場合は
# 管理番号以外のフィールドが欠けるが、動物としては正しく1頭カウントされる。
# 迷子（元の飼い主探し）セクションは通常0件、譲渡候補セクションが本体。
rows: "p:-soup-contains('管理番号：')"
fields:
  name: {label: "名前"}
  species: {label: "動物種"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  color: {label: "毛色"}
  size: {label: "大きさ"}
  age: {label: "推定年齢"}
  note: {label: "特徴"}
  management_no: {label: "管理番号"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、保護されている動物はいません"
  - "保護されている動物はいません"
