# 北海道 上川総合振興局 上川保健所 犬猫の保護情報（/hk/hgc/inunekohogojouhou.html）。新しい飼い主さんを募集している犬猫。
# h2「犬・猫情報」の下に、1 頭ごとに h2「No.1」→ 表（種類・毛色・性別・推定年齢・その他・募集期限と写真）→ 写真の p が並ぶ。
# 「No.」の h2 を 1 頭の始まりにして、次の h2 の手前までまとめる。種別は表の写真の alt（「猫1-1.jpg」）の頭の 1 字で決める。
# 0 頭の日（Wayback 2024-05-25・2024-09-11）は h2「犬・猫情報」の直下に「現在、新しい飼い主さんを募集している犬・猫はおりません。」（09 版は「いません」）が出るが、
# 前の子の雛形 h2「No.1」と空欄の表（種類 種類・募集期限 令和5年12月27日…）が消されずに残る。これを子として読まない。
# 0 頭の文がある日は rows を当てない（body の条件）。その文は「犬・猫は」で、子のいる日の「募集している猫がいます」には出ない。
# 子のいる日（2026-11-07）はその文が無く、No.1 の表が読める。「（卒業しました）」の子（2023-03 の版）は載せない。
rows: "body:not(:has(p:-soup-contains('募集している犬・猫は'))) h2:-soup-contains('No.')"
row_until: "h2"
row_filter:
  text_lacks: ["卒業"]
fields:
  management_no: {selector: "h2", regex: "No\\.\\s*(\\d+)"}
  species: {selector: "table img", attr: "alt", regex: "^(猫|犬)"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "推定年齢"}
  note: {label: "その他"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
image: "table img@src"
empty_text:
  - "犬・猫情報 現在、新しい飼い主さんを募集している犬・猫はおりません"
  - "犬・猫情報 現在、新しい飼い主さんを募集している犬・猫はいません"
