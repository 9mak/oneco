# 福山市動物愛護センター（迷い猫情報）
# city_fukuyama-1 と同一 CMS テンプレート（URL のみ違う）。table 1 つ（thead: 番号/保護日/保護場所/種類/毛色/性別/掲載期限、写真なし）。
# 0 頭のときは全セル &nbsp; のプレースホルダ行だけが残る（min_text_length で除外）。
rows: "table tr:has(td)"
row_filter:
  min_text_length: 4
fields:
  management_no: "td:nth-of-type(1)"
  shelter_date: {selector: "td:nth-of-type(2)", regex: "(\\d+年\\d+月\\d+日)"}
  location: "td:nth-of-type(3)"
  breed: "td:nth-of-type(4)"
  color: "td:nth-of-type(5)"
  sex: "td:nth-of-type(6)"
empty_text: ["現在、迷い猫の情報はありません", "現在、迷い猫情報はありません", "現在迷い猫の情報はありません"]
