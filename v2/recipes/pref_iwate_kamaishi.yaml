# 岩手県 釜石保健所 — pref.iwate.jp
# 台帳 url は最終の一覧ページ（1014123.html。迷子・譲渡・報告が同一ページにまとまっている）。
# 構造: <figure class="imagecenter"><img>...<figcaption>管理番号</figcaption></figure> の次に
#   <p>仮名：...<br>管理番号：...<br>動物種別：...<br>…</p> というフラットな並び
#   （写真は figure なので兄弟要素、このエンジンからは届かない。管理番号は「2026-1-004D」のように
#   西暦4桁を含む形式でエンジンの _MGMT_RE に正しくマッチする）。
# 【御報告】譲渡が決まりました🌸🌸 の既に譲渡済み個体は「仮名・管理番号」のみで動物種別が無いブロックのため、
# 犬か猫か判定できず自動的に捨てられる（意図した挙動。募集中ではない個体を数えないという点で正しい）。
rows: "p:-soup-contains('管理番号：')"
fields:
  name: {label: "仮名"}
  management_no: {label: "管理番号"}
  species: {label: "動物種別"}
  size: {label: "大きさ"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  age: {regex: "(?:推定)?年齢[:：]\\s*([^\\s　]+)"}
  color: {label: "毛色"}
  note: {label: "性格等"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、保護されている動物はいません"
