# 岩手県 釜石保健所 — pref.iwate.jp
# 2026-10-04: 写真が全頭で取れていなかったため image を追加（h2/h3 直後の figure を prev_siblings で拾う。14 頭すべてに写真が付く）。
# 台帳 url は最終の一覧ページ（1014123.html。迷子・譲渡・報告が同一ページにまとまっている）。
# 構造: <figure class="imagecenter"><img>...<figcaption>管理番号</figcaption></figure> の次に
#   <p>仮名：...<br>管理番号：...<br>動物種別：...<br>…</p> というフラットな並び
#   （写真は figure なので兄弟要素、このエンジンからは届かない。管理番号は「2026-1-004D」のように
#   西暦4桁を含む形式でエンジンの _MGMT_RE に正しくマッチする）。
# 【御報告】譲渡が決まりました🌸🌸 の既に譲渡済み個体は「仮名・管理番号」のみで動物種別が無いブロック。
# 2026-10-05 T518: これまでは犬か猫か決まらないことで偶然落ちていたが、種別の決まらない子を載せるようになったので
# row_filter で明示的に落とす（募集中の子の p は 動物種別・種類・性別 を持つ。報告の p はどれも持たない）。
# 2026-10-04: 写真 figure は行 p の直前の兄弟（figure は p と別タグなので prev_siblings で届く）。
#   メイン写真は h2/h3 の直後の figure（imagecenter のことも imageright のこともある）。直前の個体の追加写真
#   （figure.imageright）を拾わないよう「h2 + figure」「h3 + figure」に絞る。これで 14 頭の写真が付く。
rows: "p:-soup-contains('管理番号：')"
row_filter:
  text_has_any: ["動物種別", "種類：", "性別："]   # 「譲渡が決まりました」の報告（仮名・管理番号だけ）を落とす
image: {selector: "h2 + figure img, h3 + figure img@src", scope: prev_siblings}
fields:
  name: {label: "仮名"}
  management_no: {label: "管理番号"}
  species: {label: "動物種別"}
  size: {label: "大きさ"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  age: {regex: "(?:推定)?年齢[:：]\\s*([^\\s　]+)"}
  color: {label: "毛色"}
  note: {label: "性格等"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、保護されている動物はいません"
