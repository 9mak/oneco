# 福山市動物愛護センター 里親募集中の犬情報（326010.html）。迷い犬（city_fukuyama-1）・迷い猫（-2）とは別のページ。
# 1 頭 = 1 つの table（summary="里親募集の犬猫の情報"）。左に写真、中に「番号：１－２５」「愛称」「性別」「毛色」「種類」「推定年齢」の行、右に「この犬について：…」の説明（rowspan）。
# 番号は全角数字（「１－２５」）。2026-11-17 時点は 36 頭。ページに頭数の表示は無い。
# 0 頭の日は table ごと消える（猫のページ 380139 の Wayback 2026-03〜06 は表が無く、文言も無い。今日の「現在、譲渡対象の猫はいません。」は今日だけ）。
# 文言は子のいる日の版で確かめられないので根拠にせず、「枠（h1）はあるが本文に表も写真も無い」ことで 0 頭を決める。
rows: "table[summary*='里親募集の犬猫の情報']"
image: "img@src"
fields:
  management_no: {regex: "番号[:：]\\s*(\\S+)"}
  name: {regex: "愛称[:：]\\s*(\\S+)"}
  sex: {regex: "性別[:：]\\s*(\\S+)"}
  color: {regex: "毛色[:：]\\s*(\\S+)"}
  breed: {regex: "種類[:：]\\s*(\\S+)"}
  age: {regex: "推定年齢[:：]\\s*(\\S+)"}
  note: {selector: "td:-soup-contains('この犬について')", regex: "この犬について[:：]\\s*(.+)"}
empty_absent:
  page: "h1:-soup-contains('里親募集中の犬情報')"
  none: "div#main_body table, div#main_body img[src*='/uploaded/image/']"
