# 宮崎市 市民の皆さんが迷子の猫を保護しています（109685.html）。市民が保護している迷子猫（kind: sheltered。施設で保護中ではない）。
# 1 件 = div.imgRTxtL（または div.imgTxtL）: 写真 → p「猫保護情報20261105」（番号の前後に空白なし）→ p「雑種、サビ（ベンガル模様）、メス、老齢、首輪なし」→ p（性格など）→ p「令和8年11月2日より、宮崎市清武町今泉甲で保護しています。」。
# 保護の文は「…から毎日…の自宅の庭に来ます」「…で見かけます」のように保護の場所が書かれない件もある（location は空）。
# ページは掲載期間を最長 6 か月と書いているのに 2025 年の掲載（今日 12 件のうち 4 件）も残る。おまえさん決定（2026-11-18）: こちらで期間を決めず、掲載元が載せている届け出は全部出す（毎年直す作り込みはバグのもと）。
# 写真の規約は無断転載禁止のみ（photo: ok）。市民が写真を届けるので、個体ページの書き方は市民の保護（台帳の kind と note）。
# 0 頭の日の版は猫のページに見つからない（保護している犬のページ city_miyazaki-7 の Wayback では「現在、掲載情報はありません」）ので、同じ言い方を置く。子のいる日の版には出ない。
# 2026-11-21（T656 直し 2 回目）: 場所が「令和7年12月23日、宮崎市柳丸町で保護しました」「令和7年6月上旬から、清武町木原付近で保護してます」の書き方で空になっていたので、「日、」「から、」の後ろの「…で保護」も取るようにした（「より、…で保護」は従来どおり）。掲載番号が 9 桁の届け出（202502212）が 8 桁に切れて別の届け出（20250221）と同じ番号になっていたので `\d{8,9}` にした。
rows: "article.body div.imgRTxtL, article.body div.imgTxtL"
row_filter:
  min_text_length: 10   # 1 つの届け出の 2 枚目以降の写真は文字の無い枠に入る（20260302 の 202603022.jpg）。それを 1 頭にしない
  text_has_any: ["迷子猫情報", "迷子犬情報", "猫保護情報", "犬保護情報", "行方不明", "保護しています"]   # 届け出の枠だけ。注意書きの枠（「迷子の犬を探している方へお願い」）に絵が付いても 1 頭にしない（#130 再レビュー F-02）
image: "img@src"
fields:
  management_no: {regex: "(?:迷子猫情報|迷子犬情報|猫保護情報|犬保護情報)\\s*[:：]?\\s*(\\d{8,9}(?:-\\d+)?)"}
  breed: {regex: "(?:迷子猫情報|迷子犬情報|猫保護情報|犬保護情報)\\s*[:：]?\\s*\\d{8,}(?:-\\d+)?\\s*([^、,\\s]+)"}   # 掲載番号の直後の語。番号と同じ段落・次の段落・空の段落を挟む並びがある（#130 reviewer F-06）
  sex: {regex: "(オス|メス)"}   # 2 段落目に無く 3 段落目に「オス（去勢済み） 1才8ヶ月」と書く届け出もある（2026-11-17 迷子猫 20260719。#130 reviewer F-06）
  age: {selector: "p:nth-of-type(2)", regex: "(老齢|成齢|\\d+歳|\\d+(?:ヶ|か|カ)月|推定[^、,]+)"}
  shelter_date: {regex: "(令和\\d+年\\d+月\\d+日)"}
  location: {regex: "(?:より|から|日)[、,]\\s*([^、,]+?)\\s*で保護"}
  note:
    join:
      - {selector: "p:nth-of-type(2)"}
      - {selector: "p:nth-of-type(3)"}
      - {selector: "p:nth-of-type(4)"}
      - {selector: "p:nth-of-type(5)"}
      - {selector: "p:nth-of-type(6)"}
    sep: " "
empty_text:
  - "現在、掲載情報はありません"
  - "現在、掲載する猫の情報はありません"
