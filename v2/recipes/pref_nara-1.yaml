# 奈良県 中和保健所動物愛護センター 収容犬情報。h4「・現在、収容中の犬はいません。」の下に、1 頭ごとに 5 行の表（左の rowspan セルに写真 / 保護場所 / センター収容日 / 特徴の 種類等・装着物・その他）。
# 0 頭の日はこの表が空の雛形で残る（値がすべて空）。雛形は写真も収容日も無いので動物にならない。
# 2026-10-05（保存した HTML）は 0 頭の日だけ確認。犬が載った日の形は未確認（雛形と同じ表が頭数分並ぶと推測して書いた）。
# 注意: 奈良県のサイトは 2026-09-13 に SSL 証明書が失効していて、収集器は取得できない（台帳は link_only。証明書が更新されたら recipe に戻す）。
rows: "#tmp_contents table"
fields:
  location: {label: "保護場所"}
  shelter_date: {label: "センター収容日"}
  breed: {label: "種類等"}
  note: {label: "装着物"}
empty_text: ["現在、収容中の犬はいません"]
