# 豊橋市あいくる（迷い犬） — toyohashi-aikuru.jp
# 一覧ページ (?animal_type=dog) に直書き。1 頭 = div.dog-cat-list__item（テーマ app.css で確認済みのクラス名）。
# 写真の下の "保護日: YYYY.MM.DD" は img と同じ div.dog-cat-image 内の span テキスト。
# 0 頭の日は div.dog-cat-list が空になるだけで「いません」等の文言は無い（2026-09-29・10-05 に確認）。
# 2026-10-05: 常に出ている案内文を empty_text にしていたのをやめ、empty_selector（器が空なら 0 頭）に切り替えた。
# 構造が変わって div.dog-cat-list が無くなった日や、器に中身があるのに行が取れない日は failed で通知される。
rows: "div.dog-cat-list__item"
image: "img@src"
fields:
  management_no: {label: "管理番号"}
  location: {label: "保護場所"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  note: {label: "その他"}
  shelter_date: {selector: "div.dog-cat-image span", regex: "保護日[:：]\\s*([\\d.]+)"}
empty_selector: "div.dog-cat-list"
