# 宮城県動物愛護センター 譲渡猫の紹介（doubutuaigo/zyoutoneko.html）。
# h3「成猫」「子猫」の下に、1 頭ごとに h4「ID:12915【トチ】」→ h5「オス(去勢手術済み)／推定2歳」→ p（写真 2〜3 枚）→ ul（FeLV/FIV と性格）が平らに並ぶ。
# 見出しは日によって違った（Wayback 2022-10 は 1 頭ごとの見出しが h3「ID:15566　ザクロ」で節の見出しは h2、2025-11 以降は h4「ID:12345【シャイン】」。
# 2026-02 に「D:12515【あや】」と I の抜けた見出しが 1 つある）。1 頭の見出し（h3 で ID: を含むもの、または h4）を始まりにして、
# 次の h2・h3・h4 の手前までをまとめる（row_until）。
# 2021-01 は表の作り（ID と呼称・写真・猫種・性別・年齢等）で、この読み方では読めない（5 年前の作り）。
# 2026-10-07 時点: 成猫 9 頭・子猫 6 頭の計 15 頭を実ページで確認。0 頭の日の文言は未確認（外れると「読めなかった」の通知になるだけで安全側）。
# 同じ猫は みやぎわんにゃん家族むすびにも載るが、wannyan_musubi_miyagi-1 ではセンターの猫を除いている。
rows: "h4, h3:-soup-contains('ID:')"
row_until: "h2, h3, h4"
fields:
  management_no: {selector: "h3, h4", regex: "I?D[:：]\\s*(\\d+)"}
  name:
    join:
      - {selector: "h3, h4", regex: "【([^】]+)】"}
      - {selector: "h3", regex: "ID[:：]\\s*\\d+\\s+(\\S+)"}
  sex: {selector: "h5", regex: "^(オス|メス)"}
  age: {selector: "h5", regex: "／(.+)$"}
  note: {selector: "ul"}
image: {selector: "p img@src"}
empty_text:
  - "現在、譲渡対象の猫はいません"
  - "譲渡対象猫はいません"
