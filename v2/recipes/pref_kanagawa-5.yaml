# 神奈川県動物愛護センター「当所以外で保護されている動物の情報」— 猫 PDF（cat.pdf）だけ。犬は pref_kanagawa-4。
# HTML本文に一覧は無く、犬/猫/その他 3本の PDF（1頭=表の1行、受付番号・受付日・保護/目撃日・場所・品種・毛色・体格・性別・首輪・特徴）。
# 写真は掲載されないため management_no（受付番号）と shelter_date（受付日）で動物判定を通す。
# 受付番号は犬/猫 PDF ごとに別カウンタで同じ番号が重複し、同じ台帳エントリで合算すると後から来た猫 9 行が「同じ ID」で捨てられていたため、台帳を犬用と猫用に分けた（2026-10-02 監査）。
# 「目撃情報」の行は自治体が意図して載せている（見かけた方からの情報）ので捨てない。
steps:
  - pdf_links: "a[href$='cat.pdf']@href"
pdf:
  mode: table
  header_row: 0
fields:
  management_no: {header: "受付番号"}
  shelter_date: {header: "受付日"}
  note: {header: "特徴"}   # 旧 age: 保護/目撃日（年齢ではない）と note: 保護/目撃 は列の取り違えだった（2026-10-02 監査）
  location: {header: "場所"}
  breed: {header: "品種"}
  color: {header: "毛色"}
  size: {header: "体格"}
  sex: {header: "性別"}
