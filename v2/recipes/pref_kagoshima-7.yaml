# 鹿児島県動物愛護ホームページ（迷子の猫を探している方の情報）: 画像ボタンの JavaScript（search_submit）が、入口の form
# （hidden の lost_kubun・search_type と anti-forgery トークン）を POST して一覧を出す作り。
# submit_form で入口の form に lost_kubun=keisai_lost・search_type=cat を足して POST し、結果のページ送り
# （form[name=paging] の act=next）を「次ページ」のリンクがある間たどる（10 件ずつ）。W006 2026-11-07。
# 1 頭 = 結果の table.t-jouto 1 つ（写真は直前の p.thumbs_left）。0 件の日だけ「検索条件に一致する情報が見つかりませんでした。」が出る。
steps:
  - submit_form:
      form: "form[name=type]"
      set: {search_type: cat, lost_kubun: keisai_lost}
      require: ["__RequestVerificationToken"]
  - submit_form:
      form: "form[name=paging]"
      set: {act: next}
      repeat_while: "a.paging_next"
      max: 30
rows: "table.t-jouto"
# 備考は読まないが、行の除外は備考の文にも効く。探す人が「見つかりました」と書いて残した投稿は載せない（-1 と同じ語。公開ゲート F-01・2026-11-08）。
row_filter:
  text_lacks: ["帰りました", "戻りました", "飼い主が見つかりました。", "飼い主が見つかりました！", "飼い主が見つかりましたので", "飼い主さんが見つかりました。", "飼い主さんが見つかりました！", "飼い主さんが見つかりましたので", "飼主が見つかりました。", "飼主が見つかりました！", "飼主が見つかりましたので", "返還しました", "返還されました", "返還済み", "お返ししました", "解決しました", "解決済み"]
# 写真は読まない: 探している方個人の氏名がファイル名に入りうる（ID の元にもなるので management_no を使う）。
# 掲載日は note に残す（取り下げの印が無いので、古い掲載かどうかを読む人が分かるように。shelter_date には入れない＝「いなくなった日」と表示されるため）。
fields:
  management_no: {label: "No"}
  sex: {label: "性別"}
  age: {label: ["推定年齢", "年齢"]}
  note: {join: [{regex: "(掲載日\\s*\\d+年\\d+月\\d+日)"}, {regex: "(お問い合わせ先\\s*\\S+（[0-9\\-]+）)"}], sep: "　"}
empty_text: ["検索条件に一致する情報が見つかりませんでした"]
