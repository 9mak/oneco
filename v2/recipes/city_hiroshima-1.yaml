# 広島市（迷子犬） — city.hiroshima.lg.jp
# 1 頭 = div#voice 配下の dl 1 つ（収容月日/種類/推定年齢/毛色/性別/首輪等/拾得等の場所/備考 が dt/dd）。
# 写真は dl の直前の p.imagecenter img。動物が 0 頭の期間は dd が全部 &nbsp; の雛形 dl が残るだけで
# 「いません」等の文言は無いため、自動判定（写真も管理番号も収容日も無い→捨てる）で 0 頭になる。
# 2026-10-05 監査: 見出しが「整理番号：8-9-12」から「8-9-2」だけに変わり管理番号が取れなかったので、「整理番号：」は付いていても付いていなくても数字で始まる部分を取る。
# 2026-11-20: 常時表示される休館案内文を empty_text に使っており子のいる日にも成立していたため、
# city_hiroshima-2 と同じく empty_selector: "div#voice dl dd" に切り替える（全 dd が空の雛形 dl だけの日を 0 頭確定、div#voice や dl/dd が消えた構造崩れは failed）。
rows: "div#voice dl"
empty_selector: "div#voice dl dd"
image: {selector: "p.imagecenter img@src", scope: prev_siblings}   # 写真は dl の直前の兄弟 p（旧指定は行の子孫しか見ず常に無写真だった。2026-10-02 監査）
fields:
  management_no: {from: heading, selector: "h2", regex: "^(?:整理番号[:：]\\s*)?(\\d\\S*)"}   # 直前の h2「8-9-12」（以前は「整理番号：8-9-12」）。雛形の空見出しは None
  shelter_date: {label: "収容月日"}
  breed: {label: "種類"}
  age: {label: "推定年齢"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  location: {label: "拾得等の場所"}
  note: {label: "備考"}
