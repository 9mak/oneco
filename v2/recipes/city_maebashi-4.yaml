# 前橋市 猫の飼い主を募集しています（kurashi_tetsuzuki/1/1/3/18316.html）。前橋市保健所の譲渡猫。台帳の city_maebashi（保護犬。迷子）・-2・-3（市民の掲示板）とは別のページ。
# 掲載漏れの棚卸し（2026-11-18 W006 T640 3 回目）。2026-11-18 は 14 頭。
# 1 頭 = caption が管理番号（C2026-057）の表 1 つ。表は 5 行: 1 行目 仮名・猫種・ワクチン歴等（3 行分の rowspan）／2 行目 毛色・性別／3 行目 推定年齢・性格／4 行目 紹介欄（colspan 3）／5 行目 猫の画像。
#   見出しの無い位置読み。表の枠だけの雛形（caption「管理番号」。ページに常に 1 つ出る）・年度別の頭数の表は、caption に「-」の付いた管理番号が無いので行にしない。
#   2 段目の並びは猫が「毛色・性別」で犬ページ（city_maebashi-5）は「性別・毛色」。性別の欄が オス・メス でない行は載せない（並びが入れ替わった日にずれた値で載せない。1 頭も読めなければ failed で通知）。
# 0 頭の日（Wayback 2025-05 で確認）は、動物の表が無く、h2 が「飼い主を募集している「猫」の一覧※現在はいません」になる（子のいる日にこの注記は無い）。決まった子の表（caption「譲渡決定♪」・本文「譲渡が決まりました」）は
#   0 頭の日にも残ることがある（犬 2026-04）。0 文言に頼らず、枠（h2「飼い主を募集している「猫」の一覧」）はあるが、管理番号の caption も写真（決まった子の表の写真を除く）も無い日だけ 0 頭にする。
#   caption の書き方が変わった日（表と写真は残る）・枠の見出しが変わった日は 0 頭にせず failed で通知される。2019 年は管理番号の caption が無い別の作り（「ねこ」の一覧・詳細情報の表）で読めず failed になる。
# 写真は pending（前橋市は規約が転載要申請の事前相談が要るホスト。新しいページの写真は改めて聞く）。写真の src は「//www.city.maebashi.gunma.jp/material/…」（スキーム無し）。
rows: "div.wysiwyg table:has(> caption:-soup-contains('-'))"
row_filter:
  text_lacks: ["譲渡が決まりました"]
  field_required: {sex: ["オス", "メス"]}
image: "img@src"
# 写真のファイル名は載せ替えで変わる（同じ管理番号 C2026-057 の猫が 2026-09-23 は vgaten.jpg、2026-11-18 は vga2026-06-10amagawaooshimamachikuroosu5.jpg）ので、ID は管理番号から作る（写真由来だと載せ替えのたびに別の子に見える）。
id_by_management_no: ["C2"]
fields:
  management_no: {selector: "caption", regex: "^\\s*([A-Z]\\d{4}-\\d+)\\s*$"}
  name: {selector: "tr:nth-child(1) > td:nth-child(1)"}
  breed: {selector: "tr:nth-child(1) > td:nth-child(2)"}
  color: {selector: "tr:nth-child(2) > td:nth-child(1)"}
  sex: {selector: "tr:nth-child(2) > td:nth-child(2)"}
  age: {selector: "tr:nth-child(3) > td:nth-child(1)"}
  note:
    join:
      - {selector: "tr:nth-child(3) > td:nth-child(2)", prefix: "性格："}
      - {selector: "tr:nth-child(1) > td:nth-child(3)", prefix: "ワクチン歴等："}
      - {selector: "tr:nth-child(4) > td:nth-child(1)"}
    sep: " "
empty_absent:
  page: "h2:-soup-contains('飼い主を募集している「猫」の一覧')"
  none: "div.wysiwyg table:not(:has(> caption:-soup-contains('譲渡決定'))) img, div.wysiwyg table > caption:-soup-contains('-')"
