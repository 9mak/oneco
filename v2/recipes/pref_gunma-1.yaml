# 群馬県動物愛護センター本所（保護犬）: 一覧は地域見出しごとの「管理番号：…」リンク並び。
# follow_all で個別ページへ辿る（1 ページ = 犬 1 頭、div#main_body div.detail_free 配下の
# th/td ラベル値表 + 写真。旧 legacy: pref_gunma.py 参照）。同じブロックに「収容の情報
# ページへ戻る」(/page/7895.html) への導線リンクがあり、これは 404（サイト側のリンク切れ）
# のため follow_all 全体が落ちないよう明示的に除外する。
# 2026-10-04: 一覧に残っている 26-095 (/page/775956.html) と 26-096 (/page/776793.html) の個別ページが
# 404（移転ではなく削除。県サイト内・soshiki/86/ にも新 URL なし。返還等で消えたが一覧のリンクだけ残る）で
# 1 件の 404 が slug 全体を落とすため、この 2 本を除外（生きている 26-097/26-098 は取れる）。
# 2026-10-05: skip_errors: true（子 1 本の取得失敗はその 1 本だけ捨てて続ける。全部失敗した日は failed）に切り替え、
# 個体ページの 404 固定除外（775956・776793。今日も 404 で一覧に残っている）を外した。今後新しく 404 が出ても slug は落ちない。
# 7895（「収容の情報ページへ戻る」。今は 200 で返る収容動物情報の目次）と 7896 は 404 ではなく動物でない導線なので除外を残す。
steps:
  - follow_all: "div#main_body div.detail_free a[href*='/page/']:not([href='/page/7895.html']):not([href='/page/7896.html'])"
    skip_errors: true
rows: "body"
image: "div#main_body img@src"
fields:
  management_no: {label: "管理番号"}
  shelter_date: {label: "収容日"}
  sex: {label: "性別"}
  age: {label: "推定年齢"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  size: {label: "体格"}
  location: {label: "収容場所"}
  note: {label: "備考", default: null}
# 2026-11-20 T656: 以前の empty_text（「保管期間中の犬はおりません」「…負傷猫はいません」「…猫はいません」）を外した。
#   今の一覧は地区（h4）ごとに同じ文を出すので、1 地区に子がいる日（11/19 は西毛に 26-139）にも他の地区（中毛・北毛）が「現在、保管期間中の犬はおりません。」を出し、
#   子のいた日の保存ページに 0 頭の根拠が当たっていた（ops/audit_empty.py の 11/20 0:05 の出力）。行の読み方が崩れた日に通知なしで「本日は 0 頭」になる穴。
# 2026-11-13: 今の一覧は地区（h4）ごとに文を出す作りで、全地区 0 頭の日は上の文言だけでは足りない（failed になる）。
#   地区ごとの文は 1 地区に子がいる日にも他の地区が出す（11/13 は中毛・西毛が「おりません」で北毛に 26-134）ので、empty_text にはせず、
#   3 地区それぞれの見出し付きの文が全部そろった日だけ 0 頭にする。2026-11-19 の版は文が「現在、保管期間中の動物はおりません。」から「…犬はおりません。」に変わっていたので、
#   文は地区の見出しに続く「現在、保管期間中の」までを照合する（子のいる地区の見出しの後ろは「管理番号：…」なので、この続きは 0 頭の地区にしか出ない）。11/13 は北毛に 26-134 のリンクが残り、その個別ページ（/page/782041.html）
#   だけ 404 なので「辿った 1 本がすべて失敗」の failed のまま（一覧が直るまで 0 頭とは言い切れない。reviewer F-01）。
empty_text_all:
  - "中毛地区（伊勢崎市、佐波郡） 現在、保管期間中の"
  - "北毛地区（渋川市、沼田市、北群馬郡、利根郡、吾妻郡） 現在、保管期間中の"
  - "西毛地区（藤岡市、富岡市、安中市、多野郡、甘楽郡） 現在、保管期間中の"
