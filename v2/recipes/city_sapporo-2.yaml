# 札幌市（迷子猫） — city_sapporo-1（迷子犬）と同じテンプレート。<h2>管理番号</h2><table>写真+ラベル値ul</table>。
# こちらは表の後ろの装飾画像が table でなく <p><img></p> 単独なので rows="h2 + table" で自然に除外される。
rows: "h2 + table"
row_filter:
  text_has_any: ["収容年月日", "保護場所"]
image: "img@src"
fields:
  management_no: {from: heading, selector: "h2", regex: "([A-Za-z]{1,3}\\d{6}-\\d+)"}   # 2026-11-07: 見出しから読む。市が写真のファイル名を打ち間違える（見出し LC081104-01 の 1 枚目が lc081104-03_1.jpeg）ので、写真の名前からは取らない（写真・ID は変えない）
  shelter_date: {label: "収容年月日"}
  location: {label: "保護場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  note: {label: "首輪等"}
empty_text:
  - "現在迷子の猫は収容されていません"   # 2026-11-12 から: この文の下に空欄の雛形の表（収容年月日: 保護場所 ： …）が 2 つ残る
  - "現在、迷子収容猫はいません"   # 0 頭の日の実際の文言（2026-10-05 昼に実ページで確認）
  - "現在、迷子猫はいません"
  - "現在収容している猫はいません"
  - "現在、収容している猫はいません"
  - "該当する猫はいません"
