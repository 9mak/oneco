# 川越市保健所（保護収容犬）: 保護収容動物情報ページの h2「保護犬情報」直後の ul > li が 1 頭 1 行
# 「No005　7月21日収容（小仙波）　ビーグル　黒白茶　成犬」（全角空白区切り）。2025 年は「R7 No.3　6月23日収容（池辺）　柴　茶　年齢不詳（成犬）」。
# 写真は各頭の PDF の中にしか無く HTML には出ない。
# 負傷のとき「※負傷のため写真は掲載しません。」が同じ li の中に br で続く（2025-10 の猫 R7 No.2 で確認）。品種・毛色・年齢は
# 「収容（場所）」の直後の 3 語で取り、末尾の注記に引きずられないようにする。注記は note に入れる。
# 犬と猫で管理番号 No005 が重なる（同じ ID に潰れる）ので猫は別 slug（city_kawagoe-2）。
# 0 頭の日は「現在、情報はございません。」（犬猫それぞれの節に出る。2025 年のアーカイブと 2026-10-07 で確認）。
# 猫の節の文言と取り違えないよう、見出しの直後の文言だけを 0 頭の印にする（照合は文書全体の文字なので「保護犬情報 現在、…」で続けて書く）。
rows: "#content h2:-soup-contains('保護犬情報') + ul > li"
row_filter:
  text_has_any: ["収容"]
fields:
  management_no: {regex: "((?:R\\d+\\s*)?No\\.?\\s*\\d+)"}
  shelter_date: {regex: "(\\d+月\\d+日)収容"}
  location: {regex: "収容（([^）]+)）"}
  breed: {regex: "収容（[^）]+）\\s*(\\S+)\\s+\\S+\\s+\\S+"}
  color: {regex: "収容（[^）]+）\\s*\\S+\\s+(\\S+)\\s+\\S+"}
  age: {regex: "収容（[^）]+）\\s*\\S+\\s+\\S+\\s+(\\S+)"}
  note: {regex: "(※.+)$"}
empty_text:
  - "保護犬情報 現在、情報はございません"
  - "保護犬情報（詳細画像はページ下の添付ファイルをご確認ください。） 現在、情報はございません"
