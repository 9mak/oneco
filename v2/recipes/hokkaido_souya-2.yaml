# 北海道 宗谷総合振興局 負傷のため保護された犬猫（/hk/kks/hogojouhou.html）。
# 2026-11-07 W006（PR #104 の公開ゲート）: link_only をやめて 0 頭を読む。
# 表（番号・種類・推定年齢・毛色・性別・写真・保護年月日・場所）は、0 頭の日は見出しの行の下に全部空欄の行が 1 行ある雛形（2026-11-07）。ページの更新日は 2025-01-20 で、その後は更新されていない可能性がある（未確認）。
# 子が載った日の作りは未確認。0 頭にするのは、その表の見出しの下の欄が全部空の日だけ（empty_selector。1 つでも埋まっていれば 0 頭にならず failed で通知される）。
# rows は今のページに無い物を指す。子が載った日の作りは未確認なので、読めない作りを推測で読まない。
# 0 頭にするのは下の文が全部そろった日だけ。どれか 1 つでも消えれば（子が載った・作りが変わった）0 頭にならず failed で通知される。
rows: "article.w006-souya-2-item"
empty_selector: "table:has(td:-soup-contains('保護年月日')) tr:nth-child(n+2) td"
