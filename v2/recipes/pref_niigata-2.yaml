# 新潟県動物愛護センター 猫の新しい飼い主を募集しています！（1334350843426.html）。保護動物（pref_niigata。1333314133188）とは別のページ。
# 動物の情報（種類・性別・年齢）は写真の中にあり、文字はケージの番号（h3「15a-16a」「3段ケージ」「犬舎41」）だけなので mode: link_only（書ける情報が無い）。
# このレシピは、ページの作りが変わって文字の説明が付いたときのために残す。h3 のケージ番号を 1 頭の始まりにして、次の h2・h3 の手前までをまとめる（写真は 1 頭に 2〜3 枚）。
# 「動画はこちら」「新着動画」の見出しは動物ではないので除く。2026-11-17 時点でケージの見出し 16・写真 51 枚。
rows: "div#main_body h3"
row_until: "h2, h3"
row_filter:
  field_lacks: {management_no: ["動画"]}   # 見出し（h3）の文字だけで判定する（ケージの説明の p に「YouTube の動画はコチラ」が混ざる行を落とさない）
image: "img@src"
fields:
  management_no: {selector: "h3"}
