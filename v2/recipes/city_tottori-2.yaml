# 鳥取市（収容犬猫の譲渡情報＝保健所からの譲渡） https://www.city.tottori.lg.jp/page/5042.html（2026-10-05 T519 で追加。2026-10-07 T519v 検証で直した）
# 「【犬】表1」「【猫】表2」の 2 つの表。1 頭 = 表の 1 行（thead の中に th 行と td 行が並ぶ崩れた HTML なので tr:has(td) で取る）。
# 1 列目に 状態（【里親募集中】/【トライアル中】/【交渉中】/【NEW!】/【治療のため募集一時停止】/【譲渡決定】等）・種類・管理番号（R8-TD20=犬、R8-TC35=猫）・（仮名）・名前・写真、
# 2 列目に 毛色/性別/年齢（2026-10 は「推定年齢」、2026-07 は「年齢」）/体格、3 列目にアピールポイント。
# 種類の p が無い猫（「R8-TC36 / （仮名） / すー」）や、状態の p が無い子（みゃー）がいるので、種類は「状態の直後、または行頭にあって管理番号の直前の 1 語」で取る
# （p の何番目かで取ると、種類の無い猫の名前や、状態の無いみゃーの管理番号を拾う。2026-07-01 の「つぶ」は種類欄に名前が入っていた）。
# 掲載を終えた子（【譲渡決定】【譲渡済】「決まりました」）は捨てる。【トライアル中】（お試し譲渡中）は載せる（2026-10-07 おまえさん方針。以前は捨てていた）。
# 状態の語（トライアル中・交渉中・募集一時停止）は note に出ない（note は 3 列目のアピールポイント。1 項目しか持てない）。
# 空の行（thead に残る空白行。0 頭の日はこれだけになる）は、行の全文が空白だけのものを捨てる（filled）。以前は「管理番号に T を含む行」だけを通していたが、
# 2026-03-25 の「【New!】トイ・プードル クゥ」（管理番号がまだ無い）が黙って消えるので、中身のある行は通す。捨てた数 = 行数の日は「0 頭」と確定する。
# 犬猫は管理番号の語（TD=犬 / TC=猫）で決める。管理番号が無い子は種別なし（犬を既定にしない）。0 頭の日の文言は未確認（犬猫とも今は載っている）。
rows: "div.detail_free table tr:has(td)"
row_filter:
  field_lacks: {status: ["譲渡決定", "譲渡済", "決まりました", "決定"], decided: ["【"]}   # status は最初の【】だけ。【New!】【譲渡決定】のように並ぶ子は decided で見分ける
  field_has_any: {filled: ["FULL"]}   # 空の行（全文が空白だけ）を「捨てた」に数える
image: "img@src"
fields:
  filled: {regex: "^[\\s\\u200b]*$", default: "FULL"}   # 全文が空白だけなら None、中身があれば FULL
  status: {regex: "【\\s*([^】]+?)\\s*】"}
  decided: {regex: "(【[^】]*(?:譲渡決定|譲渡済|決まりました)[^】]*】)"}
  management_no: {regex: "(R\\d+[-‐−－_＿]T[CD]\\d+)"}
  name: {regex: "(?:T[CD]\\d+\\s+(?![（(]仮名)|仮名[)）]\\s*)([^\\s\\u200b]+)"}
  breed: {regex: "(?:^|】)\\s*((?!R\\d)[^\\s【】]\\S*(?:\\s+（[^）]*）)?)\\s+R\\d+[-‐−－_＿]T[CD]"}
  color: {regex: "毛色[:：]\\s*([^\\s\\u200b]+)"}
  sex: {regex: "性別[:：]\\s*([^\\s\\u200b]+)"}
  age: {regex: "年齢[:：]\\s*([^\\s\\u200b]+)"}
  size: {regex: "体格[:：]\\s*([^\\s\\u200b]+)"}
  note: {selector: "td:nth-of-type(3)"}
species:
  from: text
  map: {"TC": cat, "TD": dog}
