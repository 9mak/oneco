# 岡山市（保護動物情報）: 一覧ページ ul.category_end 内の記事リンクには、個体の
# 個別情報記事に加えて「現在いません」等のお知らせ記事や、既存個体を再掲する
# 集計記事（例: 保護犬情報一覧）が混在する。リンク文字に「個別情報」を含む
# ものだけを辿ることで、これらの重複・非動物記事を除外する。
# 2026-11-07 監査: 猫は個別情報ページが消えた後も「保護猫情報一覧」（0000085613）に管理番号（1N2026046）だけが載る（写真・日付・場所は無い）。
# 猫の一覧は犬の一覧と違って個別記事の再掲ではなく、載っている番号が猫の掲載そのものなので辿る（番号だけを載せ、ほかの項目は足さない。
# 個別記事が戻れば同じ管理番号から作る同じ ID になる。species は h1「保護猫情報一覧」の「猫」）。保護犬情報一覧（表に個体を再掲）は引き続き辿らない。
# 各個別情報記事 = 1 頭。種類（毛色に対する犬種/品種）は breed、動物種別
# (犬/猫) は h1 見出しの文言から判定する。電話番号は自由文のみのため
# 個体側 fields には含めず、代表連絡先として結果に別途記載する。

steps:
  - follow_all: 'ul.category_end a:-soup-contains("個別情報"), ul.category_end a:-soup-contains("保護猫情報一覧")@href'

rows: "body"

row_filter:
  field_lacks: {species: ["死亡"]}   # h1「…個別情報（負傷により死亡）」の死亡記事は捨てる（species 項目は h1 の生テキスト。2026-10-02 監査）

image:
  selector: "img.mol_imageblock_img_medium"

fields:
  species: {selector: "h1"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  age: {label: "推定年齢"}
  color: {label: "毛色"}
  size: {label: "体格"}
  shelter_date: {label: "保護日"}
  location: {label: "保護場所"}
  management_no: {regex: "(?<![0-9A-Za-z])(\\d[A-Za-z]\\d{5,9})(?![0-9A-Za-z])"}

species:
  from: field
  map: {"犬": dog, "猫": cat}

empty_text:
  - "現在、保護犬はいません"
  - "現在、保護猫はいません"
