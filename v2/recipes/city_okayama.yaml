# 岡山市（保護動物情報）: 一覧ページ ul.category_end 内の記事リンクには、個体の
# 個別情報記事に加えて「現在いません」等のお知らせ記事や、既存個体を再掲する
# 集計記事（例: 保護犬情報一覧）が混在する。リンク文字に「個別情報」を含む
# ものだけを辿ることで、これらの重複・非動物記事を除外する。
# 各個別情報記事 = 1 頭。種類（毛色に対する犬種/品種）は breed、動物種別
# (犬/猫) は h1 見出しの文言から判定する。電話番号は自由文のみのため
# 個体側 fields には含めず、代表連絡先として結果に別途記載する。

# 2026-11-24 W006 T653: 個別記事の前に「保護犬情報一覧」の表も辿る（0 頭の根拠に使うだけ。表は動物にしない＝見出しが「情報一覧」の文書は rows から外す）。
steps:
  - follow_all: 'ul.category_end a:-soup-contains("個別情報"), ul.category_end a:-soup-contains("保護犬情報一覧")@href'

rows: "body:not(:has(h1:-soup-contains('情報一覧')))"

row_filter:
  field_lacks: {species: ["死亡"]}   # h1「…個別情報（負傷により死亡）」の死亡記事は捨てる（species 項目は h1 の生テキスト。2026-10-02 監査）

image:
  selector: "img.mol_imageblock_img_medium"

fields:
  species: {selector: "h1"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  age: {label: "推定年齢"}
  color: {label: "毛色"}
  size: {label: "体格"}
  shelter_date: {label: "保護日"}
  location: {label: "保護場所"}
  management_no: {regex: "(?<![0-9A-Za-z])(\\d[A-Za-z]\\d{5,9})(?![0-9A-Za-z])"}

species:
  from: field
  map: {"犬": dog, "猫": cat}

empty_text:
  - "現在、保護犬はいません"
  - "現在、保護猫はいません"

# 2026-11-19: 個別情報の記事は掲載期限で一覧から消える。11/19 は「現在、…いません」の記事も出ず、入口の一覧が
# 「保護猫情報一覧」「保護犬の人馴れ訓練プロジェクト」「保護犬情報一覧」の 3 本だけになり「0 頭で empty_text も無い」で読めなかった
# （保護犬情報一覧の表には期限の切れた行が残り、保護猫情報一覧は「現在、抑留期間中の猫はいません。」。保護犬情報一覧の表は 2026-11-24 から辿り、期限の先の行を 0 頭の確定から外す＝下の live_row）。
# page = 入口の一覧に「保護犬情報一覧」の記事がある（0 頭の日も子のいる日も出る枠）、
# none = 一覧ページ・訓練プロジェクト以外の記事。個別情報の題名が変わった日や、知らない記事が出た日は 0 頭にせず failed で通知される。
empty_absent:
  page: "ul.category_end a:-soup-contains('保護犬情報一覧')"
  none: "ul.category_end a:not(:-soup-contains('情報一覧')):not(:-soup-contains('人馴れ訓練プロジェクト'))"
# 2026-11-24 W006 T653（方針 52）: 一覧の表（保護犬情報一覧。個体番号・保護日…掲載期限）に期限が今日以降の行がある日は、個別記事がまだ無くても
# 保護中の子がいるので 0 頭と確定しない（failed で通知される）。期限の過ぎた行しか無い日・行が無い日は従来どおり 0 頭と確定する。期限が読めない行も保護中とみなす。
# 一覧の表を辿れなかった日も 0 頭にしない（辿るのは全部成功する時だけ）。
  live_row: "body:has(h1:-soup-contains('情報一覧')) table tr:has(td)"
  live_until: "td:last-child"
