# 香川県 西讃保健福祉事務所 迷い犬・迷い猫の情報（/seisanhoken/seisanhoken/doubutuaigo/maigo_info.html）。西讃保健所の収容動物（PDF。pref_kagawa_pdf-3）とは別の一覧。
# PDF のページ（sqvuo1191030100247.html）は「公開期間は収容日の翌日から 7 日間」の最新の収容動物だけで、こちらは公開期間を過ぎても保健所が保護している子（収容日 9/30・10/13・11/2・11/4・11/5 の 5 頭）。
# PDF の読み落としではない（2026-11-17 の PDF は 2640152〜2640165。HTML の 2640145・2640144 は 7 日たって PDF から外れた子）。
# 1 頭ごとに p「個体管理番号2640145」（strong）→ p「保健所収容日：…」「保護場所：…」「動物種：猫」「品種等：…」「毛色：…」「性別：…」「体格：…」「推定年齢：…」「特徴：…」→ 写真の p（1〜3 枚）。
# 2025-04 の版は h5「個体管理番号：2540011」→ ul（li に項目、最後の li に写真）の作りで、今は p の並びに変わっている（中讃 pref_kagawa_html-2 は h5 のまま）。どちらも読む。
# 個体管理番号の p（h5）を 1 頭の始まりにして、次の始まり・h2・ページ末の案内の ul（li の中に strong がある ul。動物の ul には無い）の手前までをまとめる。「飼い主さんに返還しました（されました）」の子は載せない。
# 0 頭の日（Wayback 2025-09・2026-03）は「現在、掲載情報はありません」が出るが、この文は子のいる日（2025-04）にも別の欄に出るので根拠にせず、
# 枠（h2「西讃保健所で保護している迷い犬・迷い猫の情報一覧」）はあるが個体管理番号も写真も無い日を 0 頭にする。
rows: "p:has(> strong:-soup-contains('個体管理番号')), h5:-soup-contains('個体管理番号')"
row_until: "p:has(> strong:-soup-contains('個体管理番号')), h5, h2, ul:has(> li):has(strong)"  # soupsieve 4 の strict で :has() の中に子の連なりを書けない（#129 CI）
row_filter:
  text_lacks: ["返還されました", "返還しました"]
image: "img@src"
fields:
  management_no: {regex: "個体管理番号\\s*[:：]?\\s*(\\d+)"}
  shelter_date: {regex: "保健所収容日[:：]\\s*(\\S+)"}
  location: {regex: "保護場所[:：]\\s*(\\S+)"}
  species: {regex: "動物種[:：]\\s*(\\S+)"}
  breed: {regex: "品種等?[:：]\\s*(\\S+)"}
  color: {regex: "毛色[:：]\\s*(\\S+)"}
  sex: {regex: "性別[:：]\\s*(\\S+)"}
  size: {regex: "体格[:：]\\s*(\\S+)"}
  age: {regex: "推定年齢[:：]\\s*(\\S+)"}
  note: {regex: "特徴[:：]\\s*(.+)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_absent:
  page: "h2:-soup-contains('保護している迷い犬・迷い猫の情報一覧')"
  none: "p:has(> strong:-soup-contains('個体管理番号')), h5:-soup-contains('個体管理番号'), img[src*='/images/6281/']"
