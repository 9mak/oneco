# 群馬県動物愛護センター東部支所（保護犬）: 一覧は「管理番号：…」リンク並び（同一テンプレート）。
# 個別ページへ follow_all していたが、一覧に載っている管理番号のリンク先が
# サイト側で更新されず 404 になることがある（2026-09-29 確認: 管理番号 26-092 →
# /page/766184.html が 404。gunma-1 の他個体は正常な detail ページに遷移できている
# ので、これは全体的な構造変化ではなく個別リンクの張り替え漏れ）。follow_all は
# 1 件でも 404 に当たると全体が失敗するため、follow せず一覧ページ自身の
# 「管理番号：NNN-NNN（場所）」段落から直接 management_no / location を読む。
# 写真・収容日・性別等の詳細は一覧には無いため取らない（旧 legacy: pref_gunma.py
# は detail ページ前提の実装で、この障害には対応していない）。
rows: "div#main_body div.detail_free p:has(> a[href^='/page/'])"
row_filter:
  text_has_any: ["管理番号"]
fields:
  management_no: {regex: "管理番号[:：]\\s*([0-9A-Za-z-]+)"}
  location: {regex: "（(.+?)）"}
# 2026-10-31: 0 頭の日の文は「収容情報」の節に担当者が手で書いていて、言い方が変わる。10/31・11/01 の実ページは「現在、保管期間中の動物はおりません。」
# （10/28〜30 も行 0 で failed。その日の文面は保存が無く未確認）、Wayback 2025-10-09・2026-05-17 は「現在、保護している動物はいません。」。
# どちらも子がいる日（last_ok 10/27 の管理番号 26-123、Wayback 2023-01-19 の旧書式）には出ない。また別の言い方に変わった日は failed で通知される（0 頭にしない）。
empty_text:
  - "保管期間中の犬はおりません"
  - "保管期間中の負傷猫はいません"
  - "保管期間中の猫はいません"
  - "保管期間中の動物はおりません"
  - "保護している動物はいません"
