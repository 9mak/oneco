# 岩手県 二戸保健所 — pref.iwate.jp
# 2026-09-29時点は0頭（管理番号・愛称・仮名のいずれも本文に無く、告知記事のみ）。
# 「二戸保健所保護施設で保護している動物は次のとおりです。」は在庫の有無に関わらず常に載っている
# 案内文（city_hiroshima-1 と同じ手口）なのでこれを empty_text にする。
# 行セレクタは同じ pref.iwate.jp テンプレートの他保健所（釜石・宮古等）で使われている
# 「管理番号：」「愛称：」ラベルを想定した暫定形（実データが無いため未検証・反証未了）。
# 今後動物が掲載された際は collector show pref_iwate_ninohe で再確認し、実際のラベル構造に
# 合わせて breed/sex/color/age/note のラベル名を調整すること。
rows: "p:-soup-contains('管理番号：'), p:-soup-contains('愛称：')"
fields:
  management_no: {label: "管理番号"}
  name: {label: "愛称"}
  species: {label: "動物種"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  color: {label: "毛色"}
  size: {label: "大きさ"}
  age: {regex: "(?:推定)?年齢[:：]\\s*([^\\s　]+)"}
  note: {label: "性格等"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "二戸保健所保護施設で保護している動物は次のとおりです"
