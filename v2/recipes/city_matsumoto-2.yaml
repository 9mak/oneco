# 松本市 保護されている動物の情報（1532）の「個人の方が保護している動物の情報」。h2 の下に h3「保護犬」「保護猫」、
# 各個体は h4「保護猫No.7-3」+ p(img 複数) + table（caption 掲載日・保護年月日・掲載希望者（連絡先）・保護場所・種類・毛色・性別・年齢・体格・不妊手術・装着物・その他）。
# 2026-10-05 は保護猫 1 頭（保護猫No.7-3、掲載 2026-01-29。長く載っている）、保護犬は「現在、保護犬の情報はありません。」。
# 掲載希望者（個人の名前と電話番号）は取らない。末尾に &nbsp; だけの h4 があるが、保護年月日が無いので row_filter で落ちる。
# 0 頭の日の文言: 「現在、保護犬の情報はありません。」「現在、保護猫の情報はありません。」（2024-11〜）、節に犬猫の区別が無い 2022-08〜2023-06 の版は
# 「現在、個人の方に保護されている動物の情報はありません。」。どれか 1 つでも出れば 0 頭になるので、片方だけ 0 頭でもう片方が読めなかった日は 0 頭に見える（注意）。
# 2022-05 の版だけ、個人の保護犬が h3「個人保護犬No.4-4」で並ぶ別の作りで、読めない（それ以降の版は h3「保護犬」「保護猫」の下の h4）。
rows: "h4"
row_until: "h2, h3, h4"
row_filter:
  text_has_any: ["保護年月日", "No"]
  field_has_any: {species: ["保護"]}
image: "img@src"
fields:
  species: {from: heading, selector: "h3"}
  management_no: {selector: "h4", regex: "No[.．]?\\s*(\\S+)"}
  shelter_date: {label: "保護年月日"}
  location: {label: "保護場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  size: {label: "体格"}
  note: {label: "その他"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、保護犬の情報はありません"
  - "現在、保護猫の情報はありません"
  - "現在、個人の方に保護されている動物の情報はありません"
