# 鹿児島県動物愛護ホームページ（一般の方が保護している犬）: 画像ボタンの JavaScript（search_submit）が、入口の form
# （hidden の lost_kubun・search_type と anti-forgery トークン）を POST して一覧を出す作り。
# submit_form で入口の form に lost_kubun=keisai_hogo・search_type=dog を足して POST し、結果のページ送り
# （form[name=paging] の act=next）を「次ページ」のリンクがある間たどる（10 件ずつ）。W006 2026-11-07。
# 1 頭 = 結果の table.t-jouto 1 つ（写真は直前の p.thumbs_left）。0 件の日だけ「検索条件に一致する情報が見つかりませんでした。」が出る。
steps:
  - submit_form:
      form: "form[name=type]"
      set: {search_type: dog, lost_kubun: keisai_hogo}
      require: ["__RequestVerificationToken"]
  - submit_form:
      form: "form[name=paging]"
      set: {act: next}
      repeat_while: "a.paging_next"
      max: 30
rows: "table.t-jouto"
# 写真は読まない: 掲載者個人の氏名がファイル名に入りうる（ID の元にもなるので management_no を使う）。
# 備考の自由記述は読まない: 掲載者本人が書く欄で、氏名・連絡先・家族の事情が入りうる（-6・-7・-11・-12 と同じ）。保護場所・保護日・問い合わせ先だけ読む。
# 子のいる日の形は未確認なので、保護場所が読めない行（市町村名の語が無い）は動物にしない。field_required は「除外」に数えないので、
# 保護場所の書き方が変わって全行が読めなくなった日は 0 頭と確定せず failed になる（一部の行だけなら、読めた行だけ載せる）。
# 除外語は「終わった言い方」だけ（「飼い主が見つかるまで」「返還できるよう」「見つかりましたら」は今いる子の備考に出るので語にしない）。
row_filter:
  text_lacks: ["帰りました", "戻りました", "飼い主が見つかりました。", "飼い主が見つかりました！", "飼い主が見つかりましたので", "飼い主さんが見つかりました。", "飼い主さんが見つかりました！", "飼い主さんが見つかりましたので", "飼主が見つかりました。", "飼主が見つかりました！", "飼主が見つかりましたので", "返還しました", "返還されました", "返還済み", "お返ししました", "解決しました", "解決済み"]
  field_required: {location: ["市", "町", "村", "郡", "島"]}
fields:
  management_no: {label: "No"}
  sex: {label: "性別"}
  age: {label: ["推定年齢", "年齢"]}
  shelter_date: {label: "保護日", regex: "(\\d+年\\d+月\\d+日)"}
  location: {label: "保護場所"}
  note: {join: [{regex: "(お問い合わせ先\\s*\\S+（[0-9\\-]+）)"}], sep: "　"}
empty_text: ["検索条件に一致する情報が見つかりませんでした"]
