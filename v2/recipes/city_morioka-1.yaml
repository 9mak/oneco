# 盛岡市保健所 【譲渡情報】新しい飼い主を募集しています — city.morioka.iwate.jp（2026-10-05 T519 環境省リンク集から追加。2026-10-07 T519v で Wayback の 15 版に当てて直した）
# 構造: article#content > div#voice の直下に平らに並ぶ。1 頭 = h2「【新しい飼い主を探しています】（5－H）」→ p.imagecenter（写真 1・2）→
#   p「【猫（5－H）の情報】<br>仮名：ドラ<br>種類：雑種<br>毛色：茶白<br>性別：オス（去勢手術済み）<br>年齢：…生まれ<br>特徴：」→
#   特徴の続きの p・預かりボランティアさんのメッセージの p …。次の h2 の手前までが 1 頭分。
# 掲載が終わった子の見出しは「【譲渡が決まりました】」「【動物愛護団体に譲渡が決まりました】」（2024-02 の版は「【譲渡決定】新しい飼い主を探している猫（9－C)」で、
#   「探している」を含むので見出しの語だけで選ぶと終わった子を載せてしまう）。「決まり」「決定」「譲渡」「見つかり」「終了」を含む見出しは始まりにしない。
# 版による違い（Wayback 2017〜2026-05 で確認）:
#   - 見出しの文言が揺れる（2019 までは「新しい飼い主を募集している猫25」「…を待っている猫17」、2023 は「新しい飼い主を探している猫（12－A)」、
#     2025-01 は誤字の「【新し飼い主を探しています】」）ので「飼い主」を含む h2 を始まりにする。「【トライアル中です】新しい飼い主を探している猫12」（2019）も載せる
#   - 2 頭まとめの見出し「（11－J、11－G）」の h2 の下に、1 頭ずつの h3「（11－J）」「（11－G）」が付く版（2026-05）、今日（2026-10-05）の「（7－P）、（7－Q）、（7－R）」の
#     集合写真の h3 もある。h3 も始まりにし、「…の情報】」の無い行（まとめの見出し・集合写真）は row_filter で落とす
#   - 管理番号は「【猫（5－H）の情報】」の括弧から（半角の閉じ括弧「（3－E)」・「（6-M )」・括弧なし「【猫12の情報】」の版がある）。見出しの括弧は 2 頭まとめの版があるので使わない
#   - 預かりボランティアさんのメッセージの無い子（8－C ライフ）や「《」の版があるので、特徴は次の「≪」か行末まで
# 既知の読み漏れ: 1 つの見出しの下に 2 頭が続く版（2023-02 の「（12-F)（12-G）」、2025-04 の「（3－E)」に 3－F）は 2 頭目が出ない
#   （1 見出し = 1 行のため。2 頭目だけを始まりにすると、終わった子の見出しの下の 2 頭目を載せてしまうので、今は読まない。2026-05 のように h3 が付けば読める）。
# 種別は「【猫」「【犬」の語（情報の見出し）。
rows: "#voice h2:-soup-contains('飼い主'):not(:-soup-contains('決まり')):not(:-soup-contains('決定')):not(:-soup-contains('譲渡')):not(:-soup-contains('見つかり')):not(:-soup-contains('終了')), #voice h3:-soup-contains('飼い主'):not(:-soup-contains('決まり')):not(:-soup-contains('決定')):not(:-soup-contains('譲渡')):not(:-soup-contains('見つかり')):not(:-soup-contains('終了')), #voice > :not(h2):not(h3):not(.imagecenter) + .imagecenter"
row_until: "h2"
row_filter:
  text_has_any: ["の情報】", "仮名："]
image: "img@src"
fields:
  management_no: {regex: "【(?:猫|犬)[（(]?\\s*([^）)\\s】]+?)\\s*[）)]?\\s*の情報】"}
  name: {regex: "仮名：(\\S+)"}
  breed: {regex: "種類：(\\S+)"}
  color: {regex: "毛色：(\\S+)"}
  sex: {regex: "性別：(オス|メス)"}
  age: {regex: "年齢：(\\S+)"}
  note: {regex: "特徴：\\s*(.*?)\\s*(?:[≪《（]預かりボランティアさん|$)"}
species:
  from: text
  map: {"【猫": cat, "【犬": dog}
# 0 頭の日の文言は未確認（2026-10-05 は 15 頭ぶんの h2 が載っていた）。迷子ページ（city_morioka-2）の 0 頭の文言「…を待っている動物はいません。」に倣った推測。
# 違う文言なら 0 頭の日は「読めなかった」で通知に出る（0 頭と誤判定はしない）。
empty_text:
  - "新しい飼い主を待っている動物はいません"
