# 町田市（収容動物のお知らせ）syuyou.html。保護情報（city_machida-1。hogo.html）とは別のページ・別の子
# （2026-11-17 時点: 収容動物のお知らせは猫 1（保護 11/11 能ヶ谷4丁目）、保護情報の猫 2 頭は保護日 2025-09・2025-11 で場所も違う）。
# h2「現在の収容状況」の下に、動物ごとに div.h3bg（h3「猫（おす）」「犬（おす）」）→ div.wysiwyg_wp の ul（li「性別：」「種類：」「大きさ：」「毛色：」「首輪等：」「マイクロチップ：」「摘要：」「保護日時：」「保護場所：」「収容期間：」）。
# 2022-12 の版は city_machida-1 と同じ div.img-area-r（写真 + ul）。写真は今の版には無い。h3bg を 1 頭の始まりにして、次の始まり・h2bg の手前までをまとめる。
# 犬猫は自分の h3 で決める（始まりが見出しそのものなので selector で取る）。「【動物の現況について】この猫は東京都動物愛護相談センター多摩支所へ移送されました」は note に出す（Wayback 2023-03）。
# 「収容期間」の日付は掲載の書き写しで保護日時と合わない日がある（今日は保護 11/11・収容期間 9/11〜9/17）ので収容期間は取らない。
# 0 頭の日は「現在、町田市保健所に収容され、東京都動物愛護相談センター多摩支所に移送された動物の情報はありません。」（Wayback 2022-08）。子のいる日（2022-12・2023-03・今日）には出ない。
rows: "div.h3bg"
row_until: "div.h2bg, div.h3bg"
image: "img@src"
fields:
  species: {selector: "h3"}
  sex: {regex: "性別[:：]\\s*(\\S+)"}
  breed: {regex: "種類[:：]\\s*(\\S+)"}
  size: {regex: "大きさ[:：]\\s*(\\S+)"}
  color: {regex: "毛色[:：]\\s*(\\S+)"}
  shelter_date: {regex: "保護日時[:：]\\s*(\\S+)"}
  location: {regex: "保護場所[:：]\\s*(\\S+)"}
  note:
    join:
      - {regex: "摘要[:：]\\s*(\\S+)"}
      - {regex: "(【動物の現況について】.+)$"}
    sep: " "
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "東京都動物愛護相談センター多摩支所に移送された動物の情報はありません"
