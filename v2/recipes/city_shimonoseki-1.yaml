# 下関市動物愛護管理センター 犬の飼い主募集一覧 https://www.city.shimonoseki.lg.jp/soshiki/52/69116.html（2026-10-05 T519 で追加。2026-10-07 T519v 検証で項目の読みを直した）
# 猫の一覧（city_shimonoseki-2）と同じ作りの一覧（譲渡番号の p・特徴の p・写真の p が、どれも個体ページ「犬の飼い主を募集しています」へのリンク）。
# 個体ページを follow_all で辿って読む。個体ページ（Wayback 2024-05〜2026-04 の 5 版で確認）は「No.R05-12 / 種類：雑種 / 毛色：黒白 / 性別：オス / 年齢：若齢（または 推定年齢：…）/ 体格:成犬（約14kg）/ 収容日：令和5年7月12日 / 仮の名前：かんたろう / 性格 …」。
# 項目は次の項目名の手前までを取る（推定年齢「不明(推定 中~高齢)」のように空白を含む値がある。値の末尾に零幅空白 U+200B が付くことがある）。
# 年齢の項目名は「推定年齢」の子と「年齢」だけの子がいる。
# 決まった子は個体ページの見出しが「No.R05-05　←飼い主が決まりました。」「No.R06-13→飼い主が決まりました」になり、一覧にも残るので、status に拾って捨てる（捨てた数 = 行数の日は「0 頭」と確定する）。
# 管理番号は R + 数字 + - + 数字で取る（「R06-13→飼い主が決まりました」を丸ごと取らない）。
# 2026-10-05・10-07 は「※現在、譲渡対象の犬はいません。」（0 頭の日の文言。2026-04-19 の保存では 1 頭の日にこの文言が無いことは未確認）。
# 譲渡手続きの案内（1784・1803）は動物ではないので辿らない。404 の古いリンクは skip_errors で捨てる。
steps:
  - follow_all: "div.detail_free a[href*='/soshiki/52/']:not([href$='/1784.html']):not([href$='/1803.html'])@href"
    skip_errors: true
rows: "div.detail_free"
row_filter:
  text_has_any: ["No.", "収容日"]
  field_lacks: {status: ["決まりました", "決定", "譲渡済"]}
image: "img@src"
fields:
  management_no: {regex: "No\\.?\\s*(R\\d+[-‐−－ー]\\d+)"}
  status: {regex: "(飼い主が決まりました|決まりました|譲渡決定|譲渡済)"}
  breed: {regex: "種類[:：]\\s*(.{1,40}?)[\\s\\u200b]*(?=(?:種類|毛色|性別|推定年齢|年齢|体格|収容日|仮の名前|性格)[:：]|$)"}
  color: {regex: "毛色[:：]\\s*(.{1,40}?)[\\s\\u200b]*(?=(?:種類|毛色|性別|推定年齢|年齢|体格|収容日|仮の名前|性格)[:：]|$)"}
  sex: {regex: "性別[:：]\\s*(.{1,40}?)[\\s\\u200b]*(?=(?:種類|毛色|性別|推定年齢|年齢|体格|収容日|仮の名前|性格)[:：]|$)"}
  age: {regex: "年齢[:：]\\s*(.{1,40}?)[\\s\\u200b]*(?=(?:種類|毛色|性別|推定年齢|年齢|体格|収容日|仮の名前|性格)[:：]|$)"}
  size: {regex: "体格[:：]\\s*(.{1,40}?)[\\s\\u200b]*(?=(?:種類|毛色|性別|推定年齢|年齢|体格|収容日|仮の名前|性格)[:：]|$)"}
  shelter_date: {regex: "収容日[:：]\\s*([^\\s\\u200b]+)"}
  name: {regex: "仮の名前[:：]\\s*([^\\s\\u200b]+)"}
empty_text: ["現在、譲渡対象の犬はいません"]
