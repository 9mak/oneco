# 川越市保健所（保護収容猫）: city_kawagoe-1 と同じページの h2「保護猫情報」節。作りは同じ（li 1 行 = 1 頭、写真は PDF の中だけ）。
# 管理番号は犬と重なる（No005）ので slug を分けてある。負傷の子は li の中に「※負傷のため写真は掲載しません。」が br で続く（2025-10 確認）ので
# 品種・毛色・年齢は「収容（場所）」の直後の 3 語で取る。注記は note。
# 0 頭の文言は犬と同じ「現在、情報はございません。」。犬の節だけが 0 頭で猫が載っている日に 0 頭と誤認しないよう、猫の見出しの直後の文言だけを 0 頭の印にする。
rows: "#content h2:-soup-contains('保護猫情報') + ul > li"
row_filter:
  text_has_any: ["収容"]
fields:
  management_no: {regex: "((?:R\\d+\\s*)?No\\.?\\s*\\d+)"}
  shelter_date: {regex: "(\\d+月\\d+日)収容"}
  location: {regex: "収容（([^）]+)）"}
  breed: {regex: "収容（[^）]+）\\s*(\\S+)\\s+\\S+\\s+\\S+"}
  color: {regex: "収容（[^）]+）\\s*\\S+\\s+(\\S+)\\s+\\S+"}
  age: {regex: "収容（[^）]+）\\s*\\S+\\s+\\S+\\s+(\\S+)"}
  note: {regex: "(※.+)$"}
empty_text:
  - "保護猫情報 現在、情報はございません"
  - "保護猫情報（詳細画像はページ下の添付ファイルをご確認ください。） 現在、情報はございません"
