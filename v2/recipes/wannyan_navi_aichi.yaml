# 愛知県わんにゃんナビ https://wannyan-navi.pref.aichi.jp/?page=list_dc
# Bubble 製 SPA。一覧には <a href> が無く、描画中の POST /elasticsearch/search の応答（hits.hits[]._id）に全頭の id が入る。
# render_json でその id を ?page=list_dc_m&no=<id> に差し込んで個体ページを描画し、1 ページ = 1 頭で読む（2026-09-30 実測 30 頭）。
# 個体ページの「基本情報」は見出しの無い値の羅列: No. 管理番号 → 支所(市) → 品種 → 毛色 → 性別 → 体重 → 年齢。
# 犬猫はページ下部の「犬の飼い方講習会へ」「猫の飼い方講習会へ」リンクで決める（ヘッダーの「犬の飼い方講習会」には「へ」が無い）。
steps:
  - render_json:
      match: "elasticsearch/search"
      path: "hits.hits[]._id"
      follow: "https://wannyan-navi.pref.aichi.jp/?page=list_dc_m&no={value}"
      max: 200
rows: "body"
image: {selector: "img[src*='w=1024']@src"}
fields:
  management_no: {regex: "No\\s*\\.\\s*(\\S+)"}
  location: {regex: "No\\s*\\.\\s*\\S+\\s+(\\S*(?:支所|本所)\\S*)"}
  breed: {regex: "No\\s*\\.\\s*\\S+\\s+\\S+\\s+(\\S+)"}
  color: {regex: "No\\s*\\.\\s*\\S+\\s+\\S+\\s+\\S+\\s+(\\S+)"}
  sex: {regex: "No\\s*\\.\\s*\\S+(?:\\s+\\S+){3}\\s+(オス|メス)"}
  age: {regex: "kg\\s+(\\d+歳\\S*)"}
  note: {regex: "特徴\\s+(.*?)\\s+管理番号"}
species:
  from: text
  map: {"犬の飼い方講習会へ": dog, "猫の飼い方講習会へ": cat}
