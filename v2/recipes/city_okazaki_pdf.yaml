# 岡崎市（保護動物）。一覧 HTML に PDF リンクが複数本（犬1本・猫は複数本、1PDF=1頭）。
# 各 PDF は「保護動物情報 犬/猫 YYYY年M月D日 現在」の見出し＋1頭分の表（管理番号/保護場所/保護月日/種類/毛色/性別/体格/首輪/その他特徴）。
# 表の「保護月日」は年なし（M月D日）。年は見出しにしか無く、レシピの1フィールド1正規表現では
# 見出しの年と表の月日を跨いで結合できないため、shelter_date は月日のみを保持する（管理番号があるので動物判定には影響しない）。
# 性別セルが稀に前後の行へ改行で割れる（実例: 8/2付け猫PDF）ため、位置指定でなくキーワード検索で拾う。
steps:
  - pdf_links: "a[href$='.pdf']"
pdf:
  mode: text
rows_regex: "保護動物情報"
fields:
  # すべて「管理番号 NNNN-N」を起点に regex を書く。見出し行にも似た日付表記
  # 「YYYY年M月D日」があり、起点無しの regex だと見出し側を誤って拾うため。
  management_no: {regex: "(\\d{3,4}-\\d{1,2})"}
  location: {regex: "\\d{3,4}-\\d{1,2}\\s+(\\S+?)\\s+\\d{1,2}月\\d{1,2}日"}
  shelter_date: {regex: "\\d{3,4}-\\d{1,2}\\s+\\S+?\\s+(\\d{1,2}月\\d{1,2}日)"}
  breed: {regex: "\\d{3,4}-\\d{1,2}\\s+\\S+?\\s+\\d{1,2}月\\d{1,2}日\\s+(\\S+)"}
  color: {regex: "\\d{3,4}-\\d{1,2}\\s+\\S+?\\s+\\d{1,2}月\\d{1,2}日\\s+\\S+\\s+(\\S+)"}
  sex: {regex: "(オス|メス|♂|♀)"}
species:
  from: text
  map: {"犬": dog, "猫": cat}
empty_text: ["現在、保護している犬や猫はいません", "保護している犬や猫はいません"]
