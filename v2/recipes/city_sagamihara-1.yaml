# 相模原市 市の譲渡対象猫情報（kosodate/kenko/1026628/pet/1023495.html）。
# h2「市の譲渡対象猫」の下に、1 頭ごとに h3「譲渡対象猫」→ p.imageright（写真）→ p（仮名：…<br>種類：…<br>性別：…<br>毛色：…<br>年齢：…<br>備考：…）
# → h4「預かりサポーターさんからのメッセージ」→ p（紹介文。無い子もいる）が平らに並ぶ。
# h3 を 1 頭の始まりにして、次の h2・h3 の手前までをまとめる（row_until）。管理番号は無い（仮名と写真で見分ける）。
# 台帳で species: cat。2026-10-05 時点: 本文「現在、10 頭の猫たち」と h3 が 10 個で一致。
# 0 頭の日の文言は未確認（外れても「読めなかった」の通知になるだけで安全側。「現在、◯頭の猫たちの新しい飼い主さんを募集しています」の
# 行が 0 頭のときどう変わるかも不明なので、empty_text には入れない）。
rows: "h3:-soup-contains('譲渡対象猫')"
row_until: "h2, h3"
fields:
  name: {regex: "仮名[:：]\\s*(\\S+)"}
  breed: {regex: "種類[:：]\\s*(\\S+)"}
  sex: {regex: "性別[:：]\\s*(\\S+)"}
  color: {regex: "毛色[:：]\\s*(\\S+)"}
  age: {regex: "年齢[:：]\\s*(\\S+)"}
  note: {selector: "p:-soup-contains('備考')", regex: "備考[:：]\\s*(.+)"}
image: "p.imageright img@src"
