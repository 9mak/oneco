# 熊本県動愛 団体譲渡犬（登録譲渡ボランティア団体からの譲渡犬情報）。
# 一覧 ul.list-4col li = 1 頭。センター譲渡と項目が異なり、収容日→保護日、
# 保健所/電話番号→掲載者（団体名）に変わる（個体管理ナンバーも無い）。
# 実査時点（2026-09-29）は 0 件で dl 自体が現れない（0件中 0～0件目を表示）。
steps:
  - paginate: ".paging .next a@href"
rows: "ul.list-4col li"
image: "img@src"
fields:
  shelter_date: {label: "保護日", regex: "(\\d{4}年\\d{1,2}月\\d{1,2}日)"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  note: {label: "掲載者"}
  detail: {selector: "a", attr: "href"}
empty_text: ["0件中 0～0件目を表示"]
