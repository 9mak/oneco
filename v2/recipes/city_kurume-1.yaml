# 久留米市 保護犬・猫の情報（3115doubutsuaigo/2016-0406-1637-187.html）。飼い主のお迎えを待つ迷い犬・猫（まだ里親募集ではない）。
# 子のいる日（Wayback 2020-10・2021-07・2023-11・2024-05）は h2「保護犬・猫の情報」の下に、1 頭ごとに
# h3「保護犬猫番号：6003　保護日：令和６年５月７日」→ p（写真）→ p（種類・毛色・性別）→ p（保護場所）… が平らに並ぶ。
# h3 を 1 頭の始まりにして、次の h3・h2（「保護犬の返還」）の手前までをまとめる。
# 0 頭の日（2026-11-07）は h3 が無く「現在お迎えを待っている犬・猫はいません。」だけが出る。この文は子のいる 4 版のどれにも無い
# （audit_empty で last_ok に当たらないことも確かめる）。作りが変わって h3 が取れなくなった日は文も出ないので「読めなかった」になる。
rows: "h3:-soup-contains('番号')"
row_until: "h2, h3"
fields:
  management_no: {regex: "番号[:：]?\\s*(\\d+)"}
  shelter_date: {regex: "保護(?:年月)?日[:：]?\\s*(令和\\S+?日)"}
  breed: {regex: "(?:種類|犬種)[:：]\\s*([^、，\\s]+)"}
  color: {regex: "毛色[:：]\\s*([^、，\\s]+)"}
  sex: {regex: "性別[:：]\\s*(オス|メス|不明)"}
  note: {regex: "(保護(?:された)?場所[:：]\\s*\\S+)"}
image: {selector: "img@src", exclude: ["blank.gif"]}
empty_text: ["現在お迎えを待っている犬・猫はいません"]
