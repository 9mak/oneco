# 高崎市 動物愛護センターで保護している動物一覧（負傷している猫、その他）: city_takasaki-1 と同じ表。
# 2026-10-05 は全部空欄の行が 1 本あるだけ（0 頭。更新日 2026-01-20）。0 頭の日の作りは 3 通り（Wayback 2024〜2025 で確認）: ①見出しの行だけ ②見出し + 空欄の td の行（td の中が空の p のことも）③見出し + 空欄の th の行。見出しの行（th）は row_filter の field_lacks で「該当なし」に数え、文字が 1 つも無い行は min_text_length で数えないので、どれも 0 頭になる。文字の入った行なのに番号が取れない日は「読めなかった」通知。 動物が載った日の作りは未確認（保存ページ 3 版は全部 0 頭。-1 と同じ表と推測）。種別は種類の欄の「猫」「犬」で決め、書いていない子は種別なし。
rows: "table tr"
row_filter:
  min_text_length: 1                                  # 文字が 1 つも無い行（空欄の行。td が空・空の p・空の th のどれも）は数えない
  field_lacks: {head: ["管理番号", "受付日時"]}        # 見出しの行（th）は「該当なし」として数える。見出しの行だけ残った日は 0 頭
image: "img@src"
species:
  from: field
  map: {"猫": cat, "犬": dog}   # 種類の欄だけで決める（特徴欄の「犬に襲われた」で猫を犬にしない）。欄に猫・犬の語が無い子は種別なしで載せる
fields:
  head: {selector: "th"}   # row_filter 用で出力しない
  management_no: {selector: "td:nth-of-type(1)", regex: "(\\d{4}\\s*[-‐‑₋−ー－–]\\s*(?:[A-Za-z]\\s*[-‐‑₋−ー－–]\\s*)?\\d+)"}
  shelter_date: {selector: "td:nth-of-type(2)"}
  species: {selector: "td:nth-of-type(3)"}
  breed: {selector: "td:nth-of-type(3)", regex: "^(?:猫・|犬・)?(.+)$"}
  sex: {selector: "td:nth-of-type(5)"}
  location: {selector: "td:nth-of-type(6)"}
  detail: {selector: "a", attr: href}
empty_selector: "table tr:has(td) td"
