# 長野市 犬猫譲渡情報（保健所収容）。h2「譲渡対象動物」の下に h3「犬譲渡」「猫譲渡」があり、動物がいない日は
# 「現在、譲渡対象の犬は収容していません。」「現在、譲渡対象の猫は収容していません。」の p が出る（2026-10-07 は両方 0 頭）。
# 動物が載った日（2023-03・2023-06・2025-08・2025-10・2025-11・2026-04 の保存版で確かめた）は、各動物が h4「登録番号／13号」+ p(img) + ul（掲載期間・連絡先・種類・
# 毛色・性別・年齢・体格・情報）で、1 つの登録番号に「雑種 2 頭」「3 頭」とまとまる子がいる（A・B・C。写真は 1〜複数枚）。この形のまま 1 件として載せる。
# 見出しの階層は他の長野市のページ（-3〜-7）では 2026-10 に h2/h3 に変わった。ここは 2026-04・2026-10 とも h3 の下に h4 だが、変わっても読めるよう
# 動物の見出しは h3・h4 の両方を始まりにし、動物かどうかは「登録番号」で決める。
# 2023-03・2023-06 の保存版に、HTML が壊れた子（table の中に div。「登録番号／4-7号の4」など）があり、見出しの後ろの中身が次の見出しの中に入って写真も項目も取れず、
# 番号が 1 桁で動物とみなされず落ちた（その日 1〜2 頭の取りこぼし。自治体の HTML の誤りで、2025-08 以降の保存版は全部読めた）。
# 1 つの登録番号に「雑種 37 頭」のようにまとまる掲載（2025-08 の 7-42 号）はそのまま 1 件。
# 注意: empty_text は犬・猫の片方だけの文言でも「0 頭」になる。片方に動物がいて読めなかった日は、もう片方の文言のせいで 0 頭に見える
# （猫がいて犬が 0 頭の日は、犬の文言が出ても猫の行が読めれば 0 頭にならない。保存版 2025-08〜2026-04 は全部読めた）。
rows: "h3, h4"
row_until: "h2, h3, h4"
row_filter:
  text_has_any: ["登録番号"]
image: "img@src"
fields:
  management_no: {selector: "h3, h4", regex: "／(\\S+)"}
  breed: {regex: "種類／(\\S+)"}
  color: {regex: "毛色／(\\S+)"}
  sex: {regex: "性別／(\\S+)"}
  age: {regex: "(?:推定)?年齢／(\\S+)"}
  size: {regex: "(?:体格|体重)／(\\S+)"}
  note: {regex: "情報／(.+?)(?= 情報／|$)"}
species:
  from: heading
  selector: ":is(h2, h3):-soup-contains('犬譲渡', '猫譲渡')"
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、譲渡対象の犬は収容していません"
  - "現在、譲渡対象の猫は収容していません"
