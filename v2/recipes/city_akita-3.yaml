# 秋田市保健所（市民が保護している犬猫）。
# #voice の中に h2「保護されている犬の情報」「保護されている猫の情報」→ h3「届出番号　R8-9」→（写真の p.imagecenter）→ table（th が項目名・td が値）。
# h3 を 1 頭の始まりにし、次の h3 か h2 の手前までをまとめる。種別は直前の h2（犬／猫）から決める。写真が付かない子もいる（届出番号か保護日で拾う）。
# 見出し枠の「犬のイラスト」（p.imageleft の mini.jpg 等）は h2 の前にあるので行に入らない。
# 表の項目名は日によって 3 種類あった（Wayback 2022-06・2024-03・2025-04・2025-11・2026-03・2026-06 と今日で確認。2026-10-08）。どれでも読めるよう項目は label（th）で探す:
#   今日（2026-06〜）: 「保護した日」「保護した場所」「種類、性別、推定年齢」（雑種、オス、推定2歳）「大きさ、毛色」（小型、黒）「毛の長さ、尾の長さ」「首輪の有無」「人馴れの有無」「その他」
#   2022〜2024-07:     「保護した日」「場所」「猫の種類、性別、年齢」（雑種、オス、3歳）「首輪、大きさ、毛色」（なし、中、グレー・茶）「その他」
#   2025-04〜2026-03:  「保護した月日」「場所」「猫の種類、性別」（雑種、メス）「年齢」（推定1歳）「毛色、毛長、大きさ、首輪、人慣れ」（黒白、毛短い、小、なし、あり）「その他」
# label の値に regex を付けた項目は、その label が表に無い作りだと行の全文に regex が当たる（届出番号 R4-1 保護猫情報 … が breed に入った）。
# そのため regex は先頭を (?!届出番号) で始め、行の全文（届出番号で始まる）には当たらないようにしてある（未知の作りは項目が空になるだけで誤った値は載らない）。
# 大きさ・毛色は項目名ごとに並びが違う（大きさが先／首輪が先で次が大きさ／毛色が先で大きさは後ろから 3 番目）ので join で作りごとの指定を並べ、表にある作りの 1 つだけが値になる。
# 0 頭の日の雛形（犬の表が「届出番号　R4-」と「該当なし」だけ。2022-06）は届出番号に数字が無く落ちる。
# 2026-10-07 時点: 犬 0 件（「保護されている犬の情報はありません」）・猫 5 件を実ページで確認。猫の 0 件の日の文言は未確認（犬の書き方からの推測）。
rows: "#voice > h3"
row_until: "h2"
row_filter:
  text_has_any: ["届出番号"]
species:
  from: heading
  selector: "h2"
  map: {"犬": dog, "猫": cat}
fields:
  management_no: {selector: "h3", regex: "届出番号\\s*(\\S+)"}
  shelter_date: {label: ["保護した日", "保護した月日"]}
  location: {label: ["保護した場所", "場所"]}
  breed: {label: "種類、性別", regex: "^(?!届出番号)([^、]+)、"}
  sex: {label: "種類、性別", regex: "^(?!届出番号)[^、]+、([^、]+)"}
  age: {label: "年齢", regex: "^(?!届出番号)(?:[^、]+、[^、]+、)?(.+)$"}
  size:
    join:
      - {selector: "th:-soup-contains('大きさ、毛色'):not(:-soup-contains('首輪')) + td", regex: "^(?!届出番号)([^、]+)、"}
      - {label: "首輪、大きさ、毛色", regex: "^(?!届出番号)[^、]+、([^、]+)、"}
      - {label: "毛色、毛長、大きさ、首輪", regex: "^(?!届出番号).*、([^、]+)、[^、]+、[^、]+$"}
  color:
    join:
      - {selector: "th:-soup-contains('大きさ、毛色'):not(:-soup-contains('首輪')) + td", regex: "^(?!届出番号)[^、]+、(.+)$"}
      - {label: "首輪、大きさ、毛色", regex: "^(?!届出番号)[^、]+、[^、]+、(.+)$"}
      - {label: "毛色、毛長、大きさ、首輪", regex: "^(?!届出番号)(.+)、[^、]+、[^、]+、[^、]+、[^、]+$"}
  note: {label: "その他"}
image: {selector: "img[alt*=写真]@src", exclude: ["121\\.jpg", "0075\\.jpg", "mini"]}
# 犬の「保護されている犬の情報はありません」は猫がいる日にも出ているので empty_text にしない（猫の読み取りが壊れた日も 0 頭に見える）。
empty_text:
  - "保護されている猫の情報はありません"
  - "保護されている猫の情報は、ありません"
