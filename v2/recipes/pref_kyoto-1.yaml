# 京都府 山城北保健所（迷子犬） — single_page（京都府 CMS 共通テンプレート）
# 収容中: div#tmp_contents 内に table が動物 1 頭 = 1 個（縦並び: 種類/毛色/性別/体格/年齢/収容日等）で並ぶ想定。
# 現状（2026-09 確認）は 0 頭で「令和8年6月4日現在、当所で保護されている犬はありません。」の告知文のみ。
rows: "div#tmp_contents table"
image: "img@src"
fields:
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  age: {label: "年齢"}
  shelter_date: {label: "収容日"}
  location: {label: "保護場所"}
  management_no: {regex: "(\\d{2,}[-‐－–]\\d+)"}
empty_text:
  - "当所で保護されている犬はありません"
  - "当所犬舎に収容されている動物はいません"
