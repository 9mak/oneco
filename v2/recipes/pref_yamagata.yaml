# 山形県: ハブページ(keijiban.html)自体には動物情報が無く、村山/最上/置賜/庄内
# 4保健所の「県で保護・収容している動物の情報」個別ページへのリンクが並ぶだけ。
# follow_all で4ページ全部を辿り、各ページ #tmp_main 内の table(迷い犬/負傷犬/負傷猫等、
# 見出し行+実データ0〜1行)を rows として合算する。空欄行・「現在〜いません」の行は
# 写真も収容日も管理番号も無いため動物とみなす条件を満たさず自動的に捨てられる。
# 2026-10-05 監査: 毛色の欄は無く、特徴の文中（「メス、5歳前後と推定、黒毛、しっぽ短め」）に書かれているので、「黒毛」のように色の字 + 毛で終わる語を color に取る（「短毛」「首輪」は色の字でないので拾わない）。

steps:
  - follow_all: "h2:-soup-contains(\"県で保護・収容している動物の情報\") ~ ul a@href"

# 2026-10-05 T518: th だけの見出し行は落とす（最上保健所の表では見出し行が label で下の行の値を拾い、写真の無い 2 頭目になる。
# これまでは見出し行に「犬」の字が無く犬か猫か決まらないことで偶然落ちていた）。td で見出しを書く表（置賜・庄内）は値が日付にならず落ちる
rows: "#tmp_main table tr:has(> td), #tmp_main table tr:has(img)"
row_filter:
  text_lacks: ["返還することができました"]
image: "img@src"
fields:
  shelter_date: {label: "収容"}
  location: {label: "保護"}
  breed: {label: "種類"}
  note: {label: "特徴"}
  color: {regex: "([黒白茶赤黄灰褐]+毛)"}
  sex: {regex: "(オス|メス)"}
  age: {regex: "(\\d+歳[^、。]*)"}

# 0 頭の根拠（W006 T631）: 4 保健所のページに節ごとの 0 頭の文があり、1 つでも出るだけでは 0 頭でない
# （村山の「負傷犬はいません」「負傷猫はいません」は迷い犬が 1 頭の日にも出る。2026-10-22 の保存ページ、Wayback 2026-07-15 は子のいる版）。
# 村山・最上・置賜の全部の節の文が揃った日だけ 0 頭にする。置賜の「迷い犬：0頭」は子のいる日は「迷い犬：1頭」に変わる（Wayback 2021・2022・2025）。
# 庄内保健所は 0 頭の日に文を出さず（表の見出しだけ）、文では確かめられない。庄内の行が読めない日に他の 3 保健所が 0 頭だと 0 頭に見える残りのリスク。
empty_text_all:
  - "現在、保護している迷い犬はいません"
  - "現在、保護している負傷犬はいません"
  - "現在、保護している負傷猫はいません"
  - "迷い犬保護情報0頭"
  - "負傷犬・ねこ情報0頭"
  - "迷い犬：0頭"
  - "負傷動物：0頭"
