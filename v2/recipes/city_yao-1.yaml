# 八尾市 迷い犬・猫（保健所に収容されている犬・猫など）。本文は #voice。h2「保健所に収容されている犬・猫などについて」の下に、
# 0 頭の日は <p>※現在、保健所では、保護されている動物はいません。</p> が出る（2026-10-05 確認）。
# 動物が載った日の作り（li か表か）は未確認（T519）。#voice 直下の li と表のうち、収容日・収容場所・管理番号などの語が
# あるものだけを 1 頭とする。同じページの問合せ先の表（担当部署・電話）と電子申請リンクの li は語を持たないので落ちる。
# 作りが違えば 0 行→「読めなかった」で通知に出る（誤掲載しない側に倒す）。
# 種別は台帳が mixed で作りも未確認なので決めない（種別なしで載る。記述の項目が 2 つ以上取れる行だけ）。
rows: "#voice > ul > li, #voice table"
row_filter:
  text_has_any: ["収容日", "保護日", "収容場所", "保護場所", "管理番号", "収容年月日"]
fields:
  management_no: {label: "管理番号"}
  shelter_date: {label: ["収容日時", "収容日", "収容年月日"], regex: "((?:令和|平成)?\\s*\\d+年\\s*\\d+月\\s*\\d+日)"}
  location: {label: "収容場所"}
  breed: {label: "犬種"}
  species: {label: ["種類", "犬種"]}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  size: {label: "体格"}
  note: {label: "特徴"}
species:
  from: field
  map: {"猫": cat, "ねこ": cat, "ネコ": cat, "犬": dog, "いぬ": dog, "イヌ": dog}
  infer: true
empty_text:
  - "保護されている動物はいません"
