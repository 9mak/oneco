# 京都動物愛護センター 迷子の犬猫の保護情報（迷子猫）
# 迷子犬ページ（kyoto_ani_love-1）と完全に同一テンプレート。div.content 配下の table.info が1頭=1個。
# 写真は無し。保護日/受入日は年無しの日付（例:「8月12日」）。
# 2026-10-04: 備考（左耳カット等）は table.info の外（同じ div.content 内の h3「備考」＋div.note）にあり落ちていたので、行を div.content に広げ note を div.note から取る。
rows: "div.information-care-lost-content div.content"
fields:
  location: {label: "保護場所"}
  breed: {label: "品種"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  age: {label: "推定年齢"}
  shelter_date: {label: "保護日"}
  note: {selector: "div.note"}
empty_text:
  - "現在、保護情報はありません"
