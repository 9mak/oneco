# 札幌市（迷子犬） — 1 ページに犬ごとの <h2>管理番号</h2><table>写真+ラベル値ul</table> が並ぶ。
# 表内 li は「収容年月日：令和8年9月28日」のように区切りがコロンのみ（空白なし）でラベル抽出が効く。
# 表の後ろに無関係な啓発ポスター画像だけの table（迷子犬ページのみ）が挟まるので rows は "h2 + table" に限定して除外する。
rows: "h2 + table"
row_filter:
  text_has_any: ["収容年月日", "保護場所"]
image: "img@src"
fields:
  management_no: {from: heading, selector: "h2", regex: "([A-Za-z]{1,3}\\d{6}-\\d+)"}   # 2026-11-07: 見出しから読む。市が写真のファイル名を打ち間違える（見出し LC081104-01 の 1 枚目が lc081104-03_1.jpeg）ので、写真の名前からは取らない（写真・ID は変えない）
  shelter_date: {label: "収容年月日"}
  location: {label: "保護場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  note: {label: "首輪等"}
# 0 頭の根拠: 見出し h2 の文（実ページで見たものだけ。以前は猫ページからの類推で一度もページに出ていない文を並べていた）。
#   Wayback 2025-02「迷子収容犬はいません。」、2025-06「現在、迷子犬は収容されていません。」、2025-11・2026-03「現在、迷子収容犬はいません。」、2026-11-06「現在迷子犬は収容されていません」。
#   0 頭の日の表は値の無い雛形だけが残る（行 1・捨てた 1。写真も無い）。
#   2026-11-25: 見出しが「現在迷子犬は収容されていません」のまま、下の表に子（柴犬）が入った日があった（市が見出しを直し忘れる）。
#   文は子のいる日にも出うるので empty_text にせず、見出しの文があり、しかも見出しの直後の表・枠に写真（img）が 1 枚も無い日だけを 0 頭にする（empty_absent。W006 2026-11-25）。
#   見出しの文が無い日（子のいる版の管理番号の見出し・作り替え）は 0 頭にしない。
empty_absent:
  page: "h2:-soup-contains('迷子収容犬はいません'), h2:-soup-contains('現在迷子犬は収容されていません'), h2:-soup-contains('現在、迷子犬は収容されていません'), h2:-soup-contains('現在、迷子収容犬はいません')"
  none: "h2 + * img[src]"
