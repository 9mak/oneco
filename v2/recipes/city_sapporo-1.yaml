# 札幌市（迷子犬） — 1 ページに犬ごとの <h2>管理番号</h2><table>写真+ラベル値ul</table> が並ぶ。
# 表内 li は「収容年月日：令和8年9月28日」のように区切りがコロンのみ（空白なし）でラベル抽出が効く。
# 表の後ろに無関係な啓発ポスター画像だけの table（迷子犬ページのみ）が挟まるので rows は "h2 + table" に限定して除外する。
rows: "h2 + table"
row_filter:
  text_has_any: ["収容年月日", "保護場所"]
image: "img@src"
fields:
  management_no: {selector: "img", attr: "src", regex: "([A-Za-z]{1,3}\\d{6}-\\d+)"}
  shelter_date: {label: "収容年月日"}
  location: {label: "保護場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  note: {label: "首輪等"}
# 0 頭の日の文: 実ページで見たものだけを置く（以前は猫ページからの類推で一度もページに出ていない文を並べていた）。
#   Wayback 2025-02「迷子収容犬はいません。」、2025-06「現在、迷子犬は収容されていません。」、2025-11・2026-03「現在、迷子収容犬はいません。」、2026-11-06「現在迷子犬は収容されていません」。
#   子のいる版（2026-11-05 の保存ページ、Wayback 2019-04・2019-07・2020-01）にはどれも出ない。0 頭の日の表は値の無い雛形だけが残る（行 1・捨てた 1）。
#   2026-11-06 変更: 「現在迷子犬は収容されていません」「現在、迷子犬は収容されていません」を足し、見たことの無い類推の 4 文を外した。
empty_text:
  - "迷子収容犬はいません"
  - "現在迷子犬は収容されていません"
  - "現在、迷子犬は収容されていません"
  - "現在、迷子収容犬はいません"
