# 千葉市 新しい飼い主さんを待っている動物たちの情報（犬）（transferdogs.html）。千葉市動物保護指導センターの譲渡候補犬。
# city_chiba-4（市民保護犬）と同じ作り: div#contents_editable の直下に h2「譲渡可能な犬たち」→ h4「26101501（クール）」→ p 写真 → p 種類・毛色・性別・年齢・予防歴・コメント（br 区切りの 1 つの p）が平らに並ぶ。
# h4 を 1 頭の始まりにして、次の h2・h4 の手前までをまとめる。先頭の h4「更新の履歴」と「動物愛護基金のご案内」は「種類：」が無いので捨てる。
# 「お見合いが決まりました！」の子（h4 の中の span。2026-11-17 に 1 頭）は、まだ譲渡が決まったのではなく見学の約束が入った状態なので、
# トライアル中と同じく載せて note に出す（2026-10-07 の方針。譲渡が決まった子を載せないのとは別）。
# 0 頭の日の文言は未確認なので empty_text は置かない。0 頭は「枠（h2 譲渡可能な犬たち）はあるが、動物の h4 も「種類：」の p も無い」ことで決める。
rows: "div#contents_editable > h4"
row_until: "h2"
row_filter:
  text_has_any: ["種類："]
  text_lacks: ["譲渡が決まりました", "譲渡されました"]
image: "p > img@src"
fields:
  management_no: {selector: "h4", regex: "^\\s*(\\d{6,10})"}
  name: {selector: "h4", regex: "[（(]([^）)]+)[）)]"}
  breed: {regex: "種類[:：]\\s*(\\S+)"}
  color: {regex: "毛色[:：]\\s*(\\S+)"}
  sex: {regex: "性別[:：]\\s*(オス|メス)"}
  age: {regex: "年齢[:：]\\s*(\\S+)"}
  note:
    join:
      - {selector: "h4", regex: "(お見合い\\S*)"}
      - {selector: "p:-soup-contains('コメント')", regex: "コメント[:：]\\s*(.+)"}
    sep: "。"
empty_absent:
  page: "div#contents_editable h2:-soup-contains('譲渡可能な犬たち')"
  none: "div#contents_editable h4:-soup-contains('（'), div#contents_editable p:-soup-contains('種類：')"
