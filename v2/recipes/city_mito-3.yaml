# 水戸市動物愛護センター 愛護センター収容猫の譲渡（里親募集）（2039.html）。迷子ペット（city_mito-1）・収容中（-2）とは別のページ。
# 見出し「里親募集中の猫（子猫3頭、成猫2頭）」の下に、猫の表が並ぶ。ふつうは 1 頭 = 1 表（th の見出し列 + td の値列）だが、
# 子猫の兄妹は 1 つの表に 2 頭が横に並ぶ（キキ・ララ。年齢・ワクチン・性格は 2 頭共通の 1 セル）。
# → 転置表（1 列 = 1 頭）で読む。th の見出し列は「譲渡猫」を含まないので row_filter で落ちる。2 頭組の共通の行（セルが 2 個）は読めず、年齢などは取れない。
# 「※譲渡が決まりました。」の表（写真の下に名前だけ）は載せない。「※トライアル希望の方がいます。」は note に出す（トライアル中と同じ扱い）。
# 管理番号は「R8-29」のほか「34」だけのこともある（「譲渡猫34　(名前：しー）」）。
# 0 頭の日は犬のページ（city_mito-4）の Wayback 2025-07-30 に「里親募集中の犬（0件）」の見出しと譲渡決定の表だけが残る。猫の 0 頭の日の版は見つからないので同じ見出し（0件・0頭）を根拠にする。
transpose: "div#main_body table"
image: "img@src"
row_filter:
  text_has_any: ["譲渡猫"]
  text_lacks: ["譲渡が決まりました"]
fields:
  management_no: {regex: "譲渡猫\\s*(\\S+?)\\s*[（(]\\s*名前"}
  name: {regex: "名前[:：]\\s*([^）)]+)[）)]"}
  sex: {regex: "((?:オス|メス)\\S*)"}
  age: {regex: "(\\d+(?:ヶ月|か月|カ月|才|歳)\\S*)"}
  note: {regex: "(※トライアル\\S+)"}
empty_text:
  - "里親募集中の猫（0件）"
  - "里親募集中の猫（0頭）"
