# 西宮市 動物の譲渡事業について（譲渡犬・譲渡猫）。本文は div.wysiwyg_wp で、1 頭が兄弟要素に平らに並ぶ（2026-10-05 確認）:
#   <div class="h2bg"><div><h2>譲渡犬653　NEW！</h2></div></div> → <p class="img-only"><img 写真></p> → <br>
#   → <table><caption>犬の情報（653）</caption> 種類・毛色・性別・体格・毛足・その他特徴（th/td）</table> → <p>譲渡申し込みリンク（img click-white.png）</p>
# 猫も「譲渡猫NNN」の見出しで同じ作り。番号 NNN が管理番号。名前・年齢の欄は無い（年齢は特徴の文中）。
# 版による違い（Wayback 2023-05・2025-02・2026-05 で確認。2026-10-07 T519v）:
#   - 写真の p に class="img-only" が付かない版がある（2026-05 の 625・626・580。p の中は konnbu.png 等）ので、行の中で最初の写真を取り、
#     申し込みリンクの画像（click-white.png）と間隔の画像（spacer.gif）は外す
#   - 「譲渡猫580　体験飼育が決まりました」（トライアル中の子）は載せる。譲渡先が決まった子は「譲渡先が決まりましたので、お知らせします」の見出しの下に
#     写真だけで並ぶ（見出し「譲渡犬／譲渡猫」で始まらないので行にならない）
#   - 2 頭で 1 枚の写真（Wayback 2025-05 の「譲渡猫579（右）」「譲渡猫581（左）」はどちらも neko579-581.JPG）は、ID が写真で決まるため 2 頭目が
#     「同じ ID の行が既にある」で落ちて掲載漏れになる。管理番号が「NNN-NNN」の形で並ぶ集合写真のファイル名は写真として取らず（写真なしで管理番号の ID になる）、2 頭とも載せる。
#     エンジン側で ID が重なったときに管理番号で別の ID にする直しが入れば、この除外は外してよい
# 種別（犬か猫か）は見出しの「譲渡犬／譲渡猫」から。
rows: "div.h2bg:-soup-contains('譲渡犬'), div.h2bg:-soup-contains('譲渡猫')"
row_until: "div.h2bg"
image: {selector: "img@src", exclude: ["spacer.gif", "click-white", "\\d{3}-\\d{3}"]}
fields:
  management_no: {selector: "h2", regex: "譲渡[犬猫]\\s*(\\d+)"}
  species: {selector: "h2", regex: "譲渡([犬猫])"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  note: {label: "その他特徴"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
# 載っていない日は、犬・猫それぞれ h2 が「現在、譲渡可能な犬／猫はいません。」（猫は 2026-10-05 の実ページで確認。犬側は推定で未確認）。
# 片方だけ載っていて片方が空の日に 0 頭と誤判定しないよう、犬→猫の 2 節をつなげて照合する（つなげた形も未確認の推定。違えば 0 頭の日は「読めなかった」で通知に出る）。
empty_text:
  - "現在、譲渡可能な犬はいません。 現在、譲渡可能な猫はいません"
