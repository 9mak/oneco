# 大分県 北部保健所豊後高田保健部の犬の保護情報 https://www.pref.oita.jp/site/doubutuaigo/hogo-bungotakada.html（2026-10-05 T519 で追加）
# 1 頭 = 1 つの表。最初の行が「１．保護・収容しました」、次が写真、収容日・推定年齢 / 保護場所・毛色 / 種類・毛の長さ / 大きさ・首輪 / 性別・その他。
# 項目名のセルは strong が無く、保護日時でなく「収容日」。空の雛形が 1 つ（2026-10-05 は犬 0 頭）。
# 収容日（保護日時）に月日がある表だけを通す（field_has_any）。捨てた数 = 行数の日は「0 頭」と確定する。「返還」「見つかりました」と書かれた表は捨てる。
# 見出しは「犬の保護情報」なので犬。保護中の子が載った日の読み方は Wayback 2020〜2025 の版で確認した（項目名は「収容日」と「保護日時」の両方がある）。
# 2026-10-07 T519v: 空の雛形は保護日時（収容日）が空の表。以前の「保護場所に市町村の語がある表」は、雛形の保護場所に市の名前だけが入る日（Wayback 2019〜2023 の豊後高田）に雛形を動物と読んで失敗していた。
# 返還済みの表の語は「見つかりました」「返還しました」のほか、2016〜2017 の「飼い主のところへ戻れました」も捨てる（以前は戻れた犬を保護中として載せていた）。
# 保護日時は「令和元年10月1日」（元年）・年なしの「10月1日」も取る。Wayback 2015 以前の作り（div.detail_free が無い）と、2016 の北部（一覧が無かった版）は読めなかったとして通知に載る。
rows: "div.detail_free table"
row_filter:
  text_has_any: ["保護場所"]
  field_lacks: {status: ["見つかりました", "返還しました", "返還済", "戻れました", "戻りました", "返還されました"]}
  field_has_any: {shelter_date: ["月"]}
image: "img@src"
fields:
  status: {selector: "tr:first-of-type td"}
  shelter_date: {label: ["収容日", "保護日時"], regex: "((?:(?:令和|平成)?\\s*(?:\\d+|元)\\s*年)?\\s*\\d+\\s*月\\s*\\d+\\s*日)"}
  age: {label: "推定年齢"}
  location: {label: "保護場所"}
  color: {label: "毛色"}
  breed: {label: "種類"}
  size: {label: "大きさ"}
  sex: {label: "性別"}
  note: {label: "その他"}
