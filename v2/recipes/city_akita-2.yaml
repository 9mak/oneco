# 秋田市保健所（飼い主が探している迷子の犬猫）。
# #voice の中に h2「紛失犬の情報」「紛失猫の情報」→ h3「届出番号　R8-2」→（写真の p.imageleft）→ table（th が項目名・td が値）。
# h3 を 1 頭の始まりにし、次の h3 か h2 の手前までをまとめる。先頭の h3「飼い⽝、飼い猫の情報をオンラインで届出…」は届出番号が無いので落とす。
# 種別は直前の h2（紛失犬／紛失猫）から決める。写真が付かない子もいる（届出番号で拾う）。飼い主の氏名・連絡先は載らない。
# 項目名と値の区切りは日によって 4 種類あった（Wayback 2022-12・2024-05・2025-11 と今日で確認。2026-10-07）。どの作りでも読めるよう、
# 項目は label（th）で探す:
#   2022〜2024: 「紛失した月日」「場所」「犬の種類、性別」（雑種、オス）「名前、年齢」（トラ、6歳）「毛色、大きさ、首輪」（茶、小型、首輪なし）「その他」  区切りは「、」
#   2025-11〜: 「紛失日時」「紛失した地域」「品種・性別・年齢」（雑種・オス・2歳）「毛色・大きさ・毛の長さ」（2026〜は「…・尾の形」付き）「その他特徴」  区切りは「・」
# label の値に regex を付けた項目は、その label が表に無い作りだと行の全文に regex が当たって届出番号や見出しが入る（2025-11 で color に行全文が入った）。
# そのため regex は先頭を (?!届出番号) で始め、行の全文（届出番号で始まる）には当たらないようにしてある。
# 0 件の日の雛形（犬の表が「届出番号　R8-」と項目名だけ）は届出番号に数字が無く落ちる。
# 2026-10-05 時点: 犬 1 件・猫 6 件を実ページで確認。0 件の日の文言（「紛失した犬の情報はありません」等）は未確認。
rows: "#voice > h3"
row_until: "h2"
row_filter:
  text_has_any: ["届出番号"]
species:
  from: heading
  selector: "h2"
  map: {"紛失犬": dog, "紛失猫": cat}
fields:
  management_no: {selector: "h3", regex: "届出番号\\s*(\\S+)"}
  name: {label: "名前、年齢", regex: "^(?!届出番号)([^、]+)、"}
  shelter_date: {label: ["紛失日時", "紛失した月日"]}
  location: {label: ["紛失した地域", "場所"]}
  breed: {label: ["品種・性別・年齢", "犬の種類、性別", "猫の種類、性別"], regex: "^(?!届出番号)([^・、]+)[・、]"}
  sex: {label: ["品種・性別・年齢", "犬の種類、性別", "猫の種類、性別"], regex: "^(?!届出番号)[^・、]+[・、]([^・、]+)"}
  age: {label: ["品種・性別・年齢", "名前、年齢"], regex: "^(?!届出番号)(?:[^・、]+[・、])+([^・、]+)$"}
  color: {label: ["毛色・大きさ・毛の長さ", "毛色、大きさ、首輪"], regex: "^(?!届出番号)(.+?)[・、](?:超)?[大中小]"}
  size: {label: ["毛色・大きさ・毛の長さ", "毛色、大きさ、首輪"], regex: "^(?!届出番号).*?[・、]((?:超)?[大中小][^・、]*)"}
  note: {label: ["その他特徴", "その他"]}
image: {selector: "img[alt*=写真]@src", exclude: ["121\\.jpg", "0075\\.jpg", "mini"]}
empty_text:
  - "紛失した犬の情報はありません"
  - "紛失した猫の情報はありません"
