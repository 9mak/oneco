# 岐阜市 保健所にいる猫を飼いたい（譲渡猫）。「現在、譲渡可能な猫は N頭です」の下に 1 頭（または 1 組）ごとの見出し + p.imagecenter（写真）+ 項目。
# 見出しと項目の作りは日によって違う（Wayback 2024-05〜2026-06 の保存版で確かめた）:
#   2024-05・06: h2「令和6年度 No.44 写真掲載日： 5月 29日」+ table（th 収容日・種類・毛色・雌雄・年令・体格・特徴・その他）。「No.57 とNo.58」のように兄弟 2 頭が 1 つの見出し・1 つの表の掲載もある（掲載のとおり 1 件）。
#   2024-08 以降: h3「管理番号 令和6年度 No.105」（名前が付く子は「No.149 （ライくん）」「No.64 けいと」）+ dl（収容日・種類・毛色・性別・年齢・体格・その他・特徴）。
#   0 頭の日の雛形: h2/h3「収容番号 No.」または「管理番号 令和 年度」+ 中身が空の dl（収容日は「令和　年　月　日」）。動物にならない（管理番号の数字も日付の数字も無い）。
# 0 頭の日の文言は「現在、譲渡可能な猫は 0頭 です」。頭の字が別の要素（strong 等）に分かれる日があり、行の文字にすると空白が入る位置が日によって違うので、空白の有無の 4 通りを置く。
#   動物がいる日は「10頭」「2頭」のように数字が入る（「10頭」は「は0頭」に当たらない）。
# 掲載の見出しに「いない」の注記（「※現在、岐阜市畜犬管理センターにはお譲りできる猫はいません。」）が付く日がある（h2。動物ではない）。
rows: "h2:-soup-contains('写真掲載日'), h3:-soup-contains('管理番号'), h2:-soup-contains('収容番号'), h3:-soup-contains('収容番号')"
row_until: "h2, h3"
image: {selector: "p.imagecenter img@src"}
fields:
  management_no: {selector: "h2, h3", regex: "No[.．]?\\s*([0-9０-９]+)"}
  name: {selector: "h2, h3", regex: "No[.．]?\\s*[0-9０-９]+\\s*[（(]?(?!写真|と\\s*No)([^）)\\s0-9０-９][^）)\\s]*)"}
  shelter_date: {label: ["収容年月日", "収容日"], regex: "((?:令和|平成)\\s*[0-9０-９]+\\s*年\\s*[0-9０-９]+\\s*月\\s*[0-9０-９]+\\s*日)"}
  breed: {label: "種類"}
  sex: {label: ["性別", "雌雄"]}
  age: {label: ["年齢（月齢）", "年齢", "年令"]}
  color: {label: "毛色"}
  note: {label: "特徴"}
empty_text:
  - "現在、譲渡可能な猫は0頭"
  - "現在、譲渡可能な猫は 0頭"
  - "現在、譲渡可能な猫は0 頭"
  - "現在、譲渡可能な猫は 0 頭"
