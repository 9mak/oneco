# 奈良市（飼い主さん募集中！犬・猫の譲渡） https://www.city.nara.lg.jp/soshiki/97/10799.html（2026-11-07 W006 監査 C で追加）
# 「現在、譲渡の準備ができた犬・猫たちのご紹介」の下に p > img が 1 頭 1 枚で並ぶだけ（2026-11-07 は 13 枚）。名前・種別・性別・年齢は画像の中にあるだけで、
# 本文に文字が無い。alt は「don」「haru」「あ」「f」「エイズ」「ni」のように名前とは限らないので読まない。種別は決めない（種別なし）。
# 2026-05（Wayback）は div に id が無く class=detail_free だけ（17 枚）なので class で指す。行は h2「現在、譲渡の準備ができた犬・猫たちのご紹介」と次の h2 の間の p だけ（先頭の「愛護フェスティバル」の告知画像は節の前、後ろの節の画像も動物にしない）。
# 節の中の alt「エイズ」の画像（/uploaded/image/233863.jpg）は「猫エイズってなに？」の FIV 解説ポスターで動物の紹介ではない（実物で確認。2026-05 の 17 枚版にも載る）ので除く。
# 他にも解説・告知の画像が混ざったら、alt か画像 ID を足して除く。
# 0 頭の日の文言は未確認（Wayback に保存が無い）。0 頭の根拠は置かず、画像が 1 枚も取れない日は failed（通知）にする。
rows: "h2:-soup-contains('現在、譲渡の準備ができた') ~ p:has(img[src*='/uploaded/image/']):not(:has(img[alt='エイズ'])):not(h2:-soup-contains('現在、譲渡の準備ができた') ~ h2 ~ p)"
image: "img@src"
