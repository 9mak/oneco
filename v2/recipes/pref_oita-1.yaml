# 大分県 西部保健所の犬・猫の保護情報 https://www.pref.oita.jp/site/doubutuaigo/hogo-seibu.html（2026-10-05 T519 で追加）
# 1 頭 = 1 つの表（4 列: 項目名・値・項目名・値）。最初の行が「１　保護されている犬の情報」、次が写真（複数枚あり）、
# 保護日時・推定年齢 / 保護場所・毛色 / 種類・毛の長さ / 大きさ・首輪 / 性別・その他。使わない枠は空の雛形のまま残る（表 2・3 は空）。
# 下半分に「飼い主さんが見つかりました」の表（返還済み）が並ぶので、最初の行に「見つかりました」がある表は捨てる（field_lacks）。
# 空の雛形は保護日時が空なので捨てる（field_has_any）。捨てた数 = 行数の日は「0 頭」と確定する。
# 犬か猫かは最初の行の「保護されている犬（猫）の情報」で決める。猫の表の見出しは未確認（2026-10-05 は犬 1 頭だけ。返還済みの 1 頭が成猫）。
# 2026-10-05: 保護中 1 頭（令和8年9月14日、九重町、雑種、オス）。
# 2026-10-07 T519v: 空の雛形は保護日時（収容日）が空の表。以前の「保護場所に市町村の語がある表」は、雛形の保護場所に市の名前だけが入る日（Wayback 2019〜2023 の豊後高田）に雛形を動物と読んで失敗していた。
# 返還済みの表の語は「見つかりました」「返還しました」のほか、2016〜2017 の「飼い主のところへ戻れました」も捨てる（以前は戻れた犬を保護中として載せていた）。
# 保護日時は「令和元年10月1日」（元年）・年なしの「10月1日」も取る。Wayback 2015 以前の作り（div.detail_free が無い）と、2016 の北部（一覧が無かった版）は読めなかったとして通知に載る。
rows: "div.detail_free table"
row_filter:
  text_has_any: ["保護場所"]
  field_lacks: {status: ["見つかりました", "返還しました", "返還済", "戻れました", "戻りました", "返還されました"]}
  field_has_any: {shelter_date: ["月"]}
image: "img@src"
fields:
  status: {selector: "tr:first-of-type td"}
  species: {selector: "tr:first-of-type td"}
  shelter_date: {label: ["保護日時", "収容日"], regex: "((?:(?:令和|平成)?\\s*+(?:\\d++|元)\\s*+年)?\\s*+\\d++\\s*+月\\s*+\\d++\\s*+日)"}
  age: {label: "推定年齢"}
  location: {label: "保護場所"}
  color: {label: "毛色"}
  breed: {label: "種類"}
  size: {label: "大きさ"}
  sex: {label: "性別"}
  note: {label: "その他"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
