# 山口県動物愛護センター: このURL自体は県内8健康福祉センター(周南/岩国/山口/山口防府保健部/
# 長門/萩/宇部/柳井)への収容動物情報リンク集(ハブ)で、本文に動物個別データは無い。
# 8センターのリンクを全部辿り(follow_all)、各センターのページにある
# 縦並びtable(1頭=table 1つ、rowspanで写真セルを共有)から抽出して合算する。
# 動物がいないセンターは「管理番号」欄が空/テンプレ値("8-3-"等)のままなので、
# management_noは末尾に数字が続く形だけを正規表現で許可し、テンプレ値を弾く。
#
# 2026-09-29 T508反証対応: 反証は expected_count=2 に対し actual_count=5 で fail 報告。
# 実ページで再確認した結果、5件(柳井: 8-2-3/8-2-4/8-2-5 猫3頭、岩国: 8-1-11 犬、
# 長門: 8-7-11 犬)はいずれも該当センターのページ(10025/10020/10021.html)に実在し、
# 更新日も2026-09-24〜09-29と直近、写真・管理番号・収容日とも本物。レシピは9センター
# 全リンクを正しく辿り、テンプレ値("8-3-"等)は正しく捨てている。expected_count=2 の方が
# 古い/誤った基準値であり、レシピの修正は不要と判断。
#
# 2026-10-04 shelter_date が「令和8年9月30日」から「令和」を落として「8年9月30日」になっていたので、
# 元号付きで取る（regex に 令和|平成 を足し、ラベル指定をやめて行全文の「収容年月日」「掲載年月日」直後から取る。
# 周南センターのページだけ見出しが「掲載年月日」で、これまで収容日が取れていなかった）。
# 周南（10022.html）の 4 頭（8-3-98〜101）は表に「動物種」欄が無く犬猫が判別できず「犬か猫か分からない」で
# 落ちる（写真を見ると 8-3-99 は猫・他は犬で混在）。species に既定値を置くと猫を犬と誤表示するので置かない。
# → engine_needs（動物種の無い行の判別）。
#
# 2026-10-05 T517 ⑧ species に infer: true を足した。動物種の欄で決まらない行（周南だけ）は、品種・毛色の欄に
# 犬だけ・猫だけの語（柴・チワワ・キジトラ・三毛 等）があればそれで決める。周南は 2023 年 3 月から動物種欄が無く、
# Wayback の 2023-03〜2026-06 のスナップショット 12 本・延べ 52 頭は品種が全部「雑種」、大きさ（小・中・大）は猫にも使う（8-3-99 は猫で「小」）。
# 決まるのは毛色「キジトラ」の猫（2025-12 の 7-3-185・187）のような子だけで、10/5 の 4 頭（雑種・白茶/黒白/うす茶）は
# 従来どおり「犬か猫か分からない」で落ちる。残りは open question（種別不明の区分を作るか）。
# 2026-10-05 T518（おまえさん判断「犬猫が判断できなければフィルターやデータに格納する必要はない」）: 決まらない子は
# 捨てずに種別なし（species: null）で載る。サイトでは犬・猫の絞り込みに出ず「すべて」でだけ出る。
# 2026-10-05 夕方: 周南（10022.html）が 404 になり、1 本のために 8 センター全部が failed になった。404 の子だけ捨てる（skip_errors）。
steps:
  - follow_all: "#main_body .article_title a@href"
    skip_errors: true
rows: "table"
fields:
  management_no: {label: "管理番号", regex: "\\d+-\\d+-\\d+"}
  shelter_date: {regex: "(?:収容|掲載)年月日\\s*((?:令和|平成|昭和|[RHS])?\\s*\\d+[.年/]\\s*\\d+[.月/]\\s*\\d+日?)"}
  location: {label: "保護場所"}
  breed: {label: "品種"}
  sex: {label: "性別"}
  size: {label: "大きさ"}
  color: {label: "毛色"}
  note: {label: "その他"}
  species: {label: "動物種"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
  infer: true
empty_text:
  - "現在収容している動物はいません"
  - "現在、収容動物に関する情報はありません"
  - "現在、犬猫の収容はありません"
  - "現在収容中の犬・猫はいません"
