# 山口県動物愛護センター: このURL自体は県内8健康福祉センター(周南/岩国/山口/山口防府保健部/
# 長門/萩/宇部/柳井)への収容動物情報リンク集(ハブ)で、本文に動物個別データは無い。
# 8センターのリンクを全部辿り(follow_all)、各センターのページにある
# 縦並びtable(1頭=table 1つ、rowspanで写真セルを共有)から抽出して合算する。
# 動物がいないセンターは「管理番号」欄が空/テンプレ値("8-3-"等)のままなので、
# management_noは末尾に数字が続く形だけを正規表現で許可し、テンプレ値を弾く。
steps:
  - follow_all: "#main_body .article_title a@href"
rows: "table"
fields:
  management_no: {label: "管理番号", regex: "\\d+-\\d+-\\d+"}
  shelter_date: {label: "収容年月日", regex: "([RHS]?\\d+[.年/]\\s*\\d+[.月/]\\s*\\d+日?)"}
  location: {label: "保護場所"}
  breed: {label: "品種"}
  sex: {label: "性別"}
  size: {label: "大きさ"}
  color: {label: "毛色"}
  note: {label: "その他"}
  species: {label: "動物種"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在収容している動物はいません"
  - "現在、収容動物に関する情報はありません"
  - "現在、犬猫の収容はありません"
  - "現在収容中の犬・猫はいません"
