# 福岡県動物愛護センター（センター譲渡猫）
# 一覧ページに全頭。1 頭 = div.animals-list li（写真 figure.list-pht img、番号 p.no-data、状態 span.ico-animal、dl > dt/dd に性別・登録日・推定年齢・大きさ、a は詳細ページ）。
# 品種と仮名は詳細ページの見出しにしか無いので取らない。登録日は収容日ではないので shelter_date にしない。
# 募集中以外（面会決定・トライアル中・募集一時停止・譲渡準備中）も一覧に載るので note に状態を入れる。
rows: "div.animals-list li"
image: "figure.list-pht img@src"
fields:
  management_no: "p.no-data"
  sex: {label: "性別"}
  age: {label: "推定年齢"}
  size: {label: "大きさ"}
  note: "span.ico-animal"
  detail: {selector: "a", attr: "href"}
empty_text: ["現在、掲載されている情報はありません"]
