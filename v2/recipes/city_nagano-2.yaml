# 長野市 犬猫等保護情報（保健所収容）。h2「負傷動物の保護」「迷い犬の抑留」の下に h3「負傷動物／第9号」「迷い犬／第7号」+ p(img) + ul（保護日時／…・保護場所／…・
# 保護時の状況／…・種類／猫・雑種・毛色／…・性別／…・推定年齢／…・体格／…）が 1 頭ずつ並ぶ（2026-10-07 は負傷猫 1 頭。2025-09 の保存版は迷い犬 1 頭）。
# 種別: 迷い犬の h3 は「迷い犬／第7号」で「種類／ボーダーコリー」と品種だけが書かれる（犬の語が無い）ので、h3 の「迷い犬」を先に見る。
#   負傷動物は「種類／猫・雑種」の先頭の語（猫・犬）で決める。どちらにも当たらない子（鳥など）は種別なしで載せる（犬猫以外とは言い切れない）。
# 0 頭の日（保存版 2023-09〜2025-01）は h2「現在、迷い犬は収容していません。」（〜2024-04）→「保健所で保護している迷い犬・負傷猫などはいません。」（2024-09〜2025-04）→ h2「迷い犬、負傷動物は保護していません（譲渡対象動物の情報は…）」（2026-04）。
# 見出しの階層が h2/h3 → h3/h4 に戻る日（長野市の他のページは 2024-11 まで h3/h4 だった）も読めるよう、動物の見出しは h3・h4 の両方を始まりにする。
rows: "h3, h4"
row_until: "h2, h3, h4"
row_filter:
  text_has_any: ["保護日時"]
image: "img@src"
fields:
  management_no: {selector: "h3, h4", regex: "／(\\S+)"}
  shelter_date: {regex: "保護日時／(\\S+)"}
  location: {regex: "保護場所／(\\S+)"}
  species: {regex: "(迷い犬|迷い猫|種類／(?:猫|犬))"}
  breed: {regex: "種類／(?:猫・|犬・)?(\\S+)"}
  color: {regex: "毛色／(\\S+)"}
  sex: {regex: "性別／(\\S+)"}
  age: {regex: "推定年齢／(\\S+)"}
  size: {regex: "(?:体格|体重)／(\\S+)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、迷い犬は収容していません"
  - "保護している迷い犬・負傷猫などはいません"
  - "迷い犬、負傷動物は保護していません"
