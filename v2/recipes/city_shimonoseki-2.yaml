# 下関市動物愛護管理センター 猫の飼い主募集一覧 https://www.city.shimonoseki.lg.jp/soshiki/52/59422.html（2026-10-05 T519 で追加。2026-10-07 T519v 検証で項目の読みを直した）
# 一覧は 1 頭 = 3 つの p（譲渡番号 R08-1002 のリンク・「雑種・白グレー・オス・成猫・名（オセロ）」・写真）で、どれも個体ページへのリンク。
# 個体ページ（「猫の飼い主を募集しています（No.R08-1002）」）に 種類・毛色・性別・推定年齢・体格・収容日・仮の名前・検査結果・写真 が p で並ぶので、そちらを読む（follow_all）。
# 一覧には中身が空のリンク（/soshiki/52/75381.html 等。個体ページが消えて 404）が残っているので skip_errors で捨てる。
# 譲渡手続きの案内（1784・1803）は動物ではないので辿らない。
# 項目は次の項目名の手前までを取る（値に空白が入る子がいる。値の末尾に零幅空白 U+200B が付くことがある）。年齢の項目名は「推定年齢」「年齢」の両方がある。
# 決まった子は個体ページの見出しが「No.R05-04→飼い主が決まりました」になり、一覧にも残るので、status に拾って捨てる（捨てた数 = 行数の日は「0 頭」と確定する）。
# 2026-10-05・10-07 は 5 頭（R08-1002・1003・1006・1008・1010）。0 頭の日の文言は犬の一覧（city_shimonoseki-1）の「現在、譲渡対象の犬はいません」から推した（未確認。
# Wayback 2022〜2026 の 8 版はどれも 1 頭以上で、0 頭の版は無かった）。0 頭で文言が違うと failed として通知される（0 頭にはしない）。
steps:
  - follow_all: "div.detail_free a[href*='/soshiki/52/']:not([href$='/1784.html']):not([href$='/1803.html'])@href"
    skip_errors: true
rows: "div.detail_free"
# 2026-10-09 W006 T605: 全行除外の 0 頭を確定する根拠（rows が単一段なので親が取れない）。ページ本文の枠
empty_container: "div#main_body"
row_filter:
  text_has_any: ["No.", "収容日"]
  field_lacks: {status: ["決まりました", "決定", "譲渡済"]}
image: "img@src"
fields:
  management_no: {regex: "No\\.?\\s*(R\\d+[-‐−－ー]\\d+)"}
  status: {regex: "(飼い主が決まりました|決まりました|譲渡決定|譲渡済)"}
  breed: {regex: "種類[:：]\\s*(.{1,40}?)[\\s\\u200b]*(?=(?:種類|毛色|性別|推定年齢|年齢|体格|収容日|仮の名前|性格)[:：]|$)"}
  color: {regex: "毛色[:：]\\s*(.{1,40}?)[\\s\\u200b]*(?=(?:種類|毛色|性別|推定年齢|年齢|体格|収容日|仮の名前|性格)[:：]|$)"}
  sex: {regex: "性別[:：]\\s*(.{1,40}?)[\\s\\u200b]*(?=(?:種類|毛色|性別|推定年齢|年齢|体格|収容日|仮の名前|性格)[:：]|$)"}
  age: {regex: "年齢[:：]\\s*(.{1,40}?)[\\s\\u200b]*(?=(?:種類|毛色|性別|推定年齢|年齢|体格|収容日|仮の名前|性格)[:：]|$)"}
  size: {regex: "体格[:：]\\s*(.{1,40}?)[\\s\\u200b]*(?=(?:種類|毛色|性別|推定年齢|年齢|体格|収容日|仮の名前|性格)[:：]|$)"}
  shelter_date: {regex: "収容日[:：]\\s*([^\\s\\u200b]+)"}
  name: {regex: "仮の名前[:：]\\s*([^\\s\\u200b]+)"}
  note: {regex: "(猫白血病ウイルス・猫エイズウイルス検査[:：]\\s*[^\\s\\u200b]+)"}
empty_text: ["現在、譲渡対象の猫はいません"]
