# 長野市 その他動物譲渡情報（市民・ボランティア）。犬猫以外の動物の掲示。2026-10-05 は「現在、犬猫以外の譲渡対象動物はいません。」
# （h2）で 0 頭。動物が載った日（Wayback 2024-12・2025-09・2026-01 のカメ）は、同じ市の犬・猫（city_nagano-5/6）と同じ h3「登録番号／…」+ p(img) + ul の形で読める。
# 0 頭の日の h2 の文言は「現在、犬猫以外の譲渡対象動物はいません。」（2026-10）と「現在、譲渡希望の犬猫以外の動物はいません。」（2026-05）、「現在、市民やボランティアの方からの犬・猫以外の動物の譲渡希望の掲載はありません。」（Wayback 2023-06）。連絡先（個人の電話番号）は取らない。
# このページは犬猫以外の掲示なので、種類に犬・猫の語が無い子は other（allow_other）。
# 見出しの階層は日によって違う: 2026-10 は h2（犬・猫・その他／譲渡希望／保護情報）の下に動物ごとの h3、2024-11 以前の保存版は h3 の下に h4。
# どちらも読めるよう動物の見出しは h3・h4 の両方を始まりにする（以前は h3 だけで、旧階層の日は節の見出しの h3 が始まりになり、節の最初の 1 頭だけが載った）。
rows: "h3, h4"
row_until: "h2, h3, h4"
row_filter:
  text_has_any: ["登録番号"]
image: "img@src"
fields:
  management_no: {selector: "h3, h4", regex: "／(\\S+)"}
  species: {regex: "種類／(\\S+)"}
  breed: {regex: "種類／(\\S+)"}
  color: {regex: "毛色／(\\S+)"}
  sex: {regex: "性別／(\\S+)"}
  age: {regex: "年齢／(\\S+)"}
  note: {regex: "(?:その他の?)?情報／(.+)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
  allow_other: true
empty_text:
  - "現在、犬猫以外の譲渡対象動物はいません"
  - "現在、譲渡希望の犬猫以外の動物はいません"
  - "犬・猫以外の動物の譲渡希望の掲載はありません"
