# 盛岡市保健所 【迷子情報】迷子の犬・猫の飼い主を探しています — city.morioka.iwate.jp（2026-10-05 T519 環境省リンク集のリンク先。2026-10-07 T519v で Wayback の版に当てて直した）
# 2026-10-05 の実ページは 0 頭（「現在、盛岡市保健所で、元の飼い主を待っている動物はいません。」）。
# 動物が載った日の作りは city_morioka-1（譲渡情報）と違う（Wayback 2021-10・2024-04・2025-10・2026-01 で確認）:
#   div#voice の p.outline「現在、盛岡市保健所で、元の飼い主を待っている動物は次のとおりです。」の次に、1 頭 = h2「元の飼い主を探している猫(3-D)」→
#   p.imagecenter（写真 1・2）→ p「【猫（3-D）の情報】<br>保護された日：3月28日<br>保護された場所：東新庄一丁目<br>種類：雑種<br>毛色：白キジ<br>性別：オス<br>年齢：…<br>特徴：…」。
#   2026-01 は「【猫（12-A）の情報】」の p の次の ul に「保護された日：令和7年12月5日」「保護された場所：…」「毛色」「性別」「年齢」「特徴」が li で並ぶ（種類の欄は無い）。
#   2021-10 は見出しが「もとの飼い主を待っている猫（10-B）」で、p が「【保護年月日】令和3年10月2日 【保護した場所】北山一丁目 【種類】雑種 【毛色】… 【特徴】…」（項目名を【】で囲み、コロン無し）。
#   次の h2（犬の返還に必要なもの・注意事項 …）の手前までが 1 頭分。
# 管理番号は見出しの「猫(3-D)」の括弧から（半角・全角の括弧が混ざる。「【猫（3-D）の情報】」の括弧も同じ値）。見出しは「飼い主」を含む h2 を始まりにする
#   （同じページの他の h2「犬の返還に必要なもの」「注意事項」「盛岡市以外で…」「愛護動物の遺棄・虐待は犯罪です。」は含まない）。
rows: "#voice h2:-soup-contains('飼い主'), #voice h2:-soup-contains('に保護した'):not(:-soup-contains('譲渡')):not(:-soup-contains('返還'))"
row_until: "h2"
row_filter:
  text_has_any: ["の情報】", "保護された日", "保護された場所", "【保護年月日】"]
image: "img@src"
fields:
  management_no: {regex: "(?:猫|犬)\\s*\\d*\\s*[（(]\\s*([^）)\\s]+?)\\s*[）)]"}
  species: {selector: "h2", regex: "(猫|犬)"}
  name: {regex: "仮名：(\\S+)"}
  breed: {regex: "(?:種類：|【種類】)\\s*(\\S+)"}
  color: {regex: "(?:毛色等?：|【毛色】)\\s*(\\S+)"}
  sex: {regex: "(?:性別：|【性別】)\\s*((?:去勢|避妊)?(?:オス|メス))"}
  age: {regex: "(?:年齢：|【年齢】)\\s*(\\S+)"}
  shelter_date: {join: [{regex: "(?:保護された日：|【保護年月日】|引取り年月日：)\\s*(\\S+)"}, {regex: "^\\s*(?!.*(?:保護された日：|【保護年月日】|引取り年月日：))(\\d+月\\d+日)に保護した"}]}
  location: {regex: "(?:保護された場所：|保護した場所：|【保護した場所】)\\s*(\\S+)"}
  note: {regex: "(?:特徴：|【特徴】|その他：)\\s*(.+?)(?=\\s*なお[,，、]\\s*盛岡市以外|\\s*※?\\s*愛護動物の遺棄|$)"}
species:
  from: field
  map: {"猫": cat, "犬": dog}
# 0 頭の日だけ出る文言（動物がいる日は「…動物は次のとおりです」「…猫がいます」）。「元の」「もとの」「保護施設では、」の言い方の違いに当たるよう「飼い主を待っている動物はいません」。
empty_text:
  - "飼い主を待っている動物はいません"
  - "飼い主を待っている動物は，いません"
