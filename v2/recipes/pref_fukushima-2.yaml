# 福島県動物愛護センター本所（中通り）迷子猫情報
# pref_fukushima-1（迷子犬）と同一テンプレート。県北/県中/県南ごとに <table>、1 table = 1 頭。
# 現状（2026-09-29確認）は県北地区に1頭（「チャオ」写真あり）、県中・県南は空テンプレート。

rows: "div#main_body table"
image: "img@src"
fields:
  management_no: {label: "保護日", regex: "[（(]([^（）()]+)[）)]\\s*$"}
  shelter_date: {label: "保護日", regex: "(令和\\d+年\\d+月\\d+日)"}
  location: {label: "保護場所"}
  breed: {label: "種類", regex: "^([^／/]+)"}
  size: {label: "種類", regex: "[／/]\\s*(.+)$"}
  color: {label: "毛の色", regex: "^([^／/]+)"}
  sex: {label: "性別"}
  age: {label: "推定年"}
  note: {label: "その他の特徴", default: null}
empty_text:
  - "現在収容されている迷子猫は0匹です"
  - "現在収容されている迷子猫は 0 匹です"
