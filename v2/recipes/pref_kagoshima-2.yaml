# 鹿児島県動物愛護ホームページ（動物愛護センターの譲渡対象犬）: 画像ボタンの JavaScript（search_submit）が、入口の form
# （hidden の jouto_kubun・search_type と anti-forgery トークン）を POST して一覧を出す作り。
# submit_form で入口の form に jouto_kubun=douai・search_type=dog を足して POST し、結果のページ送り
# （form[name=paging] の act=next）を「次ページ」のリンクがある間たどる（10 件ずつ）。W006 2026-11-07。
# 1 頭 = 結果の table.t-jouto 1 つ（写真は直前の p.thumbs_left）。0 件の日だけ「検索条件に一致する情報が見つかりませんでした。」が出る。
steps:
  - submit_form:
      form: "form[name=type]"
      set: {search_type: dog, jouto_kubun: douai}
      require: ["__RequestVerificationToken"]
  - submit_form:
      form: "form[name=paging]"
      set: {act: next}
      repeat_while: "a.paging_next"
      max: 30
rows: "table.t-jouto"
image: {selector: "a.popup-image img@src", scope: prev_siblings}
# 譲渡済みの印が付いた行は載せない（取り下げ前の掲載が残る日がある）。「決まりましたら」（これから）や、複数匹の行の中の 1 匹だけ「既に譲渡済み」は
# 行ごと落とすと載っている子が消えるので、終わった言い方だけを語にする（今日の実ページで確認）。
# 2026-11-21（T656 直し 2 回目）: 備考が「※新しい飼い主さんが決まりました」の 26D0219 が載っていたので、主語つきの「飼い主（さん）が決まりました」を足した（「里親さんが決まりましたら」「譲渡が決まりましたら」には当たらない）。
# 備考の頭が「※一時譲渡を取り下げています※」の子は、募集を一時止めているので載せない（掲載元が再開したら戻る。2026-11-23 26D0244。POLICY.md 方針 22）。
# text_lacks でなく field_lacks（closed 項目。animals には出ない）で落とす: 全行がこれで外れた日を「捨てた行」として数え、見出しの項目名一致で 0 頭と確定するため。
row_filter:
  text_lacks: ["譲渡済みです", "譲渡済みとなり", "譲渡済みになり", "譲渡しました", "譲渡されました", "決まりました。", "決まりました！", "新しい飼い主さんのもと", "新しい飼い主のもと", "新しい家族のもと", "新しい家族になりました", "飼い主さんが決まりました", "飼い主が決まりました"]
  field_lacks: {closed: ["譲渡を取り下げ"]}
fields:
  closed: {label: "備考", regex: "(譲渡を取り下げ)"}
  management_no: {label: "No"}
  sex: {label: "性別"}
  age: {label: ["推定年齢", "年齢"]}
  note: {join: [{label: "備考"}, {regex: "(お問い合わせ先\\s*\\S+（[0-9\\-]+）)"}], sep: "　"}
empty_text: ["検索条件に一致する情報が見つかりませんでした"]
