# 川口市保健所（譲渡犬猫）: 「飼い主募集中の動物たち」節の h3「犬」「猫」の下に、1 頭 = div.cmstag（写真 + 「管理番号：…」「品種：…」の p 並び）。
# 種別は直前の節見出し（h3 の中で span.bg を持つもの＝犬・猫）。トライアル中の子は自分のブロックの中に h3「※トライアル中です※」を持つので、
# それを直前の見出しに数えると後ろの子が種別なしになる（strong だけの h3 は節見出しでない）。
# 管理番号を持たない div.cmstag（2025 年 5 月の「R6-0020 白猫 男の子」だけを並べた写真ギャラリー。同じ子の写真の再掲）は動物でないので落とす。
# 2 頭を 1 ブロックにまとめた日（2025 年 5 月の R6-0020・R6-0021）は 1 頭目の備考に 2 頭目の項目が入る（エンジンが 1 ブロック 1 行のため）。
# 年齢は「推定年齢」の日と「年齢：推定2歳」の日がある。2023 年は「品  種：」「性  別：」のように項目名の字の間に空白が入り、2022 年は「種類：チワワ」。
# 2022〜2024 年は犬・猫の見出しが h2（中に span.bg）、2025 年以降は h3。2023-05・09 は見出しが無く種別は決まらない（種別なしで載る）。
# 0 頭の日の文言（猫の節）: 2022〜2024 年は「現在、譲渡できる猫はいません。（令和6年7月5日時点）」（Wayback で確認）。
# 2026-10 の実ページは犬が「現在、譲渡対象の犬はおりません。」なので猫は「現在、譲渡対象の猫はおりません」と推測（未確認）。
# 2025 年の犬は「現在、譲渡可能な犬はいません。」だったので猫の「現在、譲渡可能な猫はいません」も推測（未確認）。外れた日は「読めなかった」通知が出る。
# 犬の文言だけを empty_text にしない（猫が載っていて構造が変わった日に 0 頭と誤認するため）。
rows: "#contents-in div.cmstag:-soup-contains('管理番号')"
row_filter:
  text_has_any: ["管理番号"]
image: "img@src"
species:
  from: heading
  selector: "h2:has(> span.bg), h3:has(> span.bg)"
  map: {"犬": dog, "猫": cat}
fields:
  management_no: {regex: "管理番号[:：]\\s*(\\S+)"}
  breed: {regex: "(?:品\\s*種|種類)[:：]\\s*(\\S+)"}
  sex: {regex: "性\\s*別[:：]\\s*(\\S+)"}
  color: {regex: "毛\\s*色[:：]\\s*(\\S+)"}
  age: {regex: "(?:推定)?年齢[:：]\\s*(\\S+)"}
  note: {regex: "性\\s*格[:：]\\s*(.+)$"}
empty_text:
  - "現在、譲渡対象の猫はおりません"
  - "現在、譲渡できる猫はいません"
  - "現在、譲渡可能な猫はいません"
