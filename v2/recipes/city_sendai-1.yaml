# 仙台市アニパル 譲渡犬情報（旧レイアウト）。
# 1頭 = <h3>管理番号 D24018（愛称：平助）</h3> の直後の <table>（左セルに写真、右セルに
# 「種類/性別/年齢/体重/毛色」を p タグで並べたラベル:値）。その直後にもう1つ、写真もラベルも
# 無い「性格・健康メモ」だけの <table> が続く。
# 2026-10-05 監査: h3 から次の h3・h2 の手前までを 1 頭にまとめ（row_until）、管理番号と愛称を h3 から、
#   性格・健康メモの表を note に取るようにした（旧: rows: "table" で h3 の管理番号・愛称が取れず、メモの表は捨てていた）。
#   種類は「雑種（M.ピンシャー ×ポメラニアン）」のように p が分かれるので、性別の手前まで取る。ID は写真から作るので変わらない。
rows: "#tmp_contents2 > h3:-soup-contains('管理番号')"
row_until: "h2, h3"
image: "img@src"
fields:
  management_no: {selector: "h3", regex: "管理番号\\s*([A-Za-z]*\\d[A-Za-z0-9-]*)"}
  name: {selector: "h3", regex: "愛称[：:]\\s*([^）)]+)"}
  breed: {regex: "種類[：:]\\s*(.+?)\\s*性別[：:]"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  size: {label: "体重"}
  color: {label: "毛色"}
  note: {selector: "table:nth-of-type(2)"}
empty_text:
  - "現在、譲渡対象の犬はいません"
  - "現在譲渡対象の犬はいません"
  - "現在、犬はいません"
