# 仙台市アニパル 譲渡犬情報（旧レイアウト）。
# 1頭 = <h3>管理番号 D24018（愛称：平助）</h3> の直後の <table>（左セルに写真、右セルに
# 「種類/性別/年齢/体重/毛色」を p タグで並べたラベル:値）。その直後にもう1つ、写真もラベルも
# 無い「性格・健康メモ」だけの <table> が続くが、写真も管理番号相当の値も取れないため自動で
# 捨てられる（rows: "table" のまま両方拾ってよい）。
# 管理番号・愛称は h3 側にあり、行（table）のテキストに含まれないためレシピの fields では
# 取得できない（既知の制約。写真の有無で動物判定は成立する）。
rows: "table"
image: "img@src"
fields:
  breed: {label: "種類"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  size: {label: "体重"}
  color: {label: "毛色"}
empty_text:
  - "現在、譲渡対象の犬はいません"
  - "現在譲渡対象の犬はいません"
  - "現在、犬はいません"
