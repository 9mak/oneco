# 久留米市 犬・猫の譲渡（3115doubutsuaigo/2010-0707-1600-465.html）。動物愛護センターが保護して新しい飼い主を募集している犬・猫。
# h2「譲渡犬・猫の情報」の下に、h3「譲渡犬猫番号：J8013」→ p（写真）→ p（動物種・種類・性別・毛色・推定年齢…）が平らに並ぶ。
# きょうだいは 1 つの h3 に番号が並ぶ（「J8014、J8015」「J8008、J8009、J8010」）。ページが 1 組として載せているので 1 件にし、番号は載っているまま。
# h3 に「（新しい飼い主さんが決まりました）」が付いた子は載せない（2021 年の版は h3 の後ろの p に「新しい飼い主さんが決まりました。」）。
# h3 を始まりにして、次の h2・h3 と区切りの hr（注意事項の前）の手前までをまとめる。
# 0 頭の日は「現在、譲渡対象の犬猫はおりません。」（Wayback 2026-03-11）。子のいる日（2021-08・2026-11）には出ない。
rows: "h3:-soup-contains('譲渡犬猫番号')"
row_until: "h2, h3, hr"
row_filter:
  text_lacks: ["決まりました"]
fields:
  management_no: {regex: "番号[:：]?\\s*(J\\d+(?:\\s*[、,，]\\s*J\\d+)*)"}
  species: {regex: "(?:動物種|種類)[:：]\\s*(犬|猫)"}
  breed: {regex: "種類[:：]\\s*(?!犬|猫)([^、，\\s]+)"}
  color: {regex: "毛色[:：]\\s*([^、，\\s]+)"}
  sex: {regex: "性別[:：]\\s*(オス|メス|不明)"}
  # 「推定生年月日」のときだけ頭に「推定」を付ける（「…生まれ（推定）」。#124 reviewer F-01）
  age: {join: [{regex: "(推定)生年月日[:：]"}, {regex: "(?:推定生年月日|推定年齢|年齢)[:：]\\s*([^、，\\s]+)"}], sep: " "}
  note: {regex: "([^。]*正式な募集前[^。]*。)"}   # 「人ならし中につき正式な募集前」の但し書き（J8008〜J8010）。無い子には付かない
species:
  from: field
  map: {"犬": dog, "猫": cat}
image: {selector: "img@src", exclude: ["blank.gif"]}
empty_text: ["現在、譲渡対象の犬猫はおりません"]
