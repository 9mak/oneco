# 福岡市動物愛護管理センターに収容されている犬・猫（市の公式サイト www.city.fukuoka.lg.jp の暫定ページ。犬 doghoused-.html・猫 cathoused.html の 2 ページで共用）
# わんにゃんよかネット（www.wannyan.city.fukuoka.lg.jp）は 2026-10-21 からメンテナンスで一時停止（全 URL が HTTP 503・Retry-After 3600・再開時期は未定）。
# 停止中の画面が「センターに収容されている犬／猫」として案内するのがこの 2 ページ。手で編集した CMS ページで、台帳の city_fukuoka_interim-1・-2 が読む。
# 元の wannyan_fukuoka-1・-2 は旧 URL のまま毎晩見に行き、再開した日に通知が出る（再開の合図と止め方は台帳の note）。
# 1 頭 = h2「収容犬一覧」「収容猫一覧」の後ろの div.f_parallel2（写真の div と、li「管理番号」> ul > li「d1877」…の入れ子の ul。猫の子には写真が無く「写真は掲載しておりません」）。
# 犬のページは ul が div に包まれ、猫のページは包まれていないので、項目は構造でなく li の項目名で引く。収容日の欄は無い。
# 行にするのは、li「状況」を持つブロックだけ（:has）。項目名が変わると状況を読めず、返還済・死亡の子が収容中として載ってしまう（fail-open）ので、
#   「状況」の項目が無いブロックは行にせず、行が 0 になって読めなかったこと（failed）にする。状況の欄が空の子（収容中と思われる）は項目名があるので行になる。
#   一部のブロックだけ項目名が違うと、そのブロックは載らない（全部が違えば failed）。
# 品種と毛色は 1 つの欄（「品種・毛色」→「ハスキー・灰白」「雑種・キジ」）。「・」がちょうど 1 つで、頭の語が「・」入りの犬猫種の頭でないときだけ分ける。
#   頭の語（正規表現の中の一覧）: トイ・ミニチュア・シー・ジャック・ヨークシャー・ウェルシュ（ウエルシュ）・ゴールデン・ラブラドール・ボーダー・ジャーマン・セント・フレンチ・
#   イングリッシュ・アメリカン・ビション・ブル・ボストン・スコティッシュ・シベリアン・チャウ・ロシアン・メイン・ブリティッシュ・ノルウェージャン・グレート・バセット・キャバリア・ジャパニーズ
#   （トイ・プードル、シー・ズー、ミニチュア・ダックスフンド、ジャック・ラッセル・テリア、ゴールデン・レトリバー、アメリカン・ショートヘア 等。毛色の無い欄を「品種・毛色」と取り違えて分けない）。
#   「・」が 2 つ以上（シー・ズー・白茶）、または頭の語が一覧にある欄は、どこで切るか決められないので、欄をそのまま品種に入れて毛色は空にする（誤って切らない）。
#   一覧に無い「・」入りの犬猫種で毛色が無いと、品種と毛色にずれる（例: 「ボーダー・コリー」は一覧にあるので分けないが、一覧に無い新しい名前は分けてしまう）。見つけたら頭の語を足す。
#   レシピの正規表現は 200 文字までで（recipe_schema）、breed は 195 文字・color は 183 文字。足すなら使われない頭の語を外す。
# 状況: 返還・譲渡・死亡の語がある子と、備考に「死亡」とある子は載せない（わんにゃんよかネット時代の 2026-10-05 監査と同じ）。2026-10-31 は犬 d1877 が「返還済」、猫 c1937 が「死亡」の各 1 件だけで、
#   載せる子は 0。収容中の子の状況の書き方は実例が無い（空かもしれない）ので、除外する語だけを決め、それ以外は載せる。
# 載っている子が全部除外された日は 0 頭（全行除外＋一覧の見出し h2 が残っていること）。
# 一覧に 1 頭もいない日（犬ページ 2026-11-06）: h2「収容犬一覧」の下の div.f_parallel2 に「現在、飼い主不明の迷い犬はセンターに収容されていません。」の p だけが入る。
#   子のいる版が 1 つ（2026-10-31 の保存ページ。返還済の 1 件）しか無く Wayback にも版が無い（ページが 10 月に作られたため）ので、文言だけを根拠にする empty_text は置かない。
#   代わりに empty_absent: その文の p があり、同じ div.f_parallel2 に li（管理番号などの項目）も写真も無い日だけ 0 頭。手編集で文だけ残したまま子を足した日は li が出るので 0 頭にならず、行が読めなければ failed のまま。
#   猫ページ（cathoused.html）は 0 頭の日の文言が未確認なので、猫ではこの文に当たらず従来どおり（ブロックが無い・読めない日は通知に出す。その日の文言が分かったらページを保存して足す）。
# 管理番号も写真も収容日も無い子は動物とみなされず捨てられるが、管理番号（d1877・c1937）があれば写真が無くても載る。
# 2026-11-12 から作りが変わった（上の li の入れ子・「品種・毛色」の 1 欄の説明は 11/11 までの作り。その試験は test_w006_fix_20261113.py に移した）:
#   1 頭 = h3「d1878　返還済」「ｃ４９３８」（管理番号。全角のこともある）と、その後ろの div.f_parallel2（写真の div と、td「犬種｜雑種」
#   「品種｜雑種」のような 2 列の表）。品種と毛色は別の行になった。収容日は「収容期間　令和８年１１月１１日～令和８年１１月１９日」の頭。
#   h3 から次の h3 か h2 の手前までを 1 行にまとめる。行にするのは表に「状況」の行がある子だけ（項目名が変わって状況を読めない日に、
#   返還済・死亡の子を収容中として載せない。全部読めなければ failed）。
rows: "div.wb-contents h3"
row_until: "h2, h3"
row_filter:
  text_has_any: ["状況"]
  field_lacks: {status: ["返還", "譲渡", "死亡"], note: ["死亡"], h3_text: ["返還", "譲渡", "死亡"]}   # 見出しにも「返還済」と書く（d1878　返還済）。表の状況が空でも見出しに書いてあれば載せない（reviewer F-03）
image: "img@src"
fields:
  h3_text: {selector: "h3"}   # 除外判定用（animals には出ない）
  management_no: {selector: "h3", regex: "([A-Za-zＡ-Ｚａ-ｚ]\\s*[0-9０-９]{3,})"}
  breed: {label: ["品種", "犬種", "猫種"]}
  color: {label: "毛色"}
  age: {label: ["推定年齢", "年齢"]}
  sex: {label: "性別"}
  size: {label: "体格"}
  shelter_date: {label: "収容期間", regex: "^(.+?)\\s*[～〜~]"}
  status: {label: "状況"}   # 除外判定用（animals には出ない）
  location: {label: "収容場所"}
  note: {label: "備考"}
empty_absent:
  page: "div.f_parallel2 p:-soup-contains('飼い主不明の迷い犬はセンターに収容されていません')"
  none: "div.f_parallel2 li, div.f_parallel2 img, div.f_parallel2 table"
