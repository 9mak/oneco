# 岐阜市 保健所にいる犬を飼いたい（譲渡犬）。h2「譲渡対象（犬）の紹介」の下に、1 頭ごとに h3「令和6年度　管理番号No.17-4　暖君（だんくん）」+ p.imagecenter（写真）+ dl（犬種・性別・体格・年齢・毛色・収容日・コメント）。
# 2026-10-05 は 1 頭（暖君）。0 頭の日は「現在、譲渡可能な犬は0頭です。」と推測（0 頭の日の実物は未確認）。
rows: "h3:-soup-contains('管理番号')"
row_until: "h2, h3"
image: {selector: "p.imagecenter img@src"}
fields:
  name: {selector: "h3", regex: "No[.．]?\\s*[0-9０-９][0-9０-９\\-－]*\\s*(\\S.*)"}
  management_no: {selector: "h3", regex: "No[.．]?\\s*([0-9０-９][0-9０-９\\-－]*)"}
  breed: {label: "犬種"}
  sex: {label: "性別"}
  size: {label: "体格"}
  age: {label: "年齢"}
  color: {label: "毛色"}
  shelter_date: {label: "収容日"}
  note: {label: "コメント"}
empty_text: ["現在、譲渡可能な犬は0頭", "現在、譲渡可能な犬は 0頭"]
