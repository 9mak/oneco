# 川越市保健所（譲渡犬猫）: 1 頭 = h4「R5―犬No.8」→ p「譲渡が決まりました」（決まった子だけ）→ p.imageleft（写真）→ dl（種類・性別・毛色・年齢）→ p（紹介文）。
# h3「譲渡犬情報」「譲渡猫情報」の下に h4 が並ぶ平らな構造なので h4 を始まりにして次の h4 / h3 / h2 でまとめる。種別は直前の h3。
# 「譲渡が決まりました」の子は載せない。2026-10-05 は 4 頭とも決定済み（ページ更新日 2024-11-22）で 0 頭扱い。
# 0 頭の日の文言は未確認（Wayback は 2025-01 以降の 3 版しか無く、どれも決定済みの 4 頭のまま）。決定済みの子だけが残っている日は、
# 「行が全部、除外語（field_lacks）で捨てられた」ことでエンジンが 0 頭と確認する（行の全文の text_lacks では行が数えられず 0 頭と確認できない）。
# 「譲渡が決まりました」を empty_text にすると、新しい子が別の作りで載った日にも決定済みの文言が残っているので 0 頭に見えてしまうため使わない。
# h4 が 1 つも無くなった日は「読めなかった」通知になる。
# 新しい子（「譲渡が決まりました」の無い h4）が載った日の読み方は未確認（同じ作りで増える想定）。
rows: "#content h4"
row_until: "h4, h3, h2"
row_filter:
  field_lacks: {note: ["譲渡が決まりました"]}
species:
  from: heading
  selector: "h3"
  map: {"犬": dog, "猫": cat}
image: "p.imageleft img@src"
fields:
  management_no: {selector: "h4"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  color: {label: "毛色"}
  age: {label: "年齢"}
  note: {selector: "p > strong.red"}   # 「譲渡が決まりました」（決まった子だけ）。決まっていない子では無いか、別の注記
