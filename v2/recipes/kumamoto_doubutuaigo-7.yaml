# 熊本県動愛 迷子犬（保健所・センターに収容された迷い犬の情報）。
# センター譲渡犬と同一テンプレート。一覧 ul.list-4col li = 1 頭で
# 収容日・種類・性別・個体管理ナンバー・保健所・電話番号が全て揃う。
steps:
  - paginate: ".paging .next a@href"
rows: "ul.list-4col li"
image: "img@src"
fields:
  shelter_date: {label: "収容日", regex: "(\\d{4}年\\d{1,2}月\\d{1,2}日)"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  management_no: {label: "個体管理ナンバー"}
  location: {label: "保健所"}
  note: {label: "電話番号"}
  detail: {selector: "a", attr: "href"}
empty_text: ["0件中 0～0件目を表示"]
