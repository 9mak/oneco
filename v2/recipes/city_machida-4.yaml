# 町田市（迷子その他・捜索）: single_page。犬・猫以外（鳥・カメ等）専用ページなので
# 全行が種別「その他」になる（allow_other必須）。構造は city_machida-2/3 と同じ CMS
# テンプレート（<div class="h3bg"><h3>見出し</h3></div> + 直後 <div class="img-area-r">）。
# 2026-10-04: 写真なしの 2 頭は <div class="wysiwyg_wp"><ul>...</ul></div> だけで img-area-r が無く行ごと落ちていたため rows に追加（失踪場所を含む行だけ通す）。
# 2026-10-04: 日時のコロン無し表記に備えコロンを省略可に。色のラベルゆれ（毛色/色）を 1 つの regex で拾い、名前も取る。
rows: "div.img-area-r, div.wysiwyg_wp:has(> ul > li)"
image: "img@src"
row_filter:
  text_has_any: ["失踪場所", "逸走場所"]
species:
  allow_other: true
fields:
  name: {label: "名前"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  color: {regex: "(?:毛色|色柄|色|柄)[:：]\\s*(.+?)\\s+(?:首輪|足環|足輪|マイクロチップ|特徴|体重|体長|年齢|名前|しっぽ|失踪|逸走|性別|種類)"}
  age: {label: "年齢"}
  note: {label: "特徴"}
  shelter_date: {regex: "(?:失踪日時|失踪日|逸走日時|逸走日)[:：]?\\s*(\\S+)"}
  location: {regex: "(?:失踪場所|逸走場所)[:：]\\s*(\\S+)"}
empty_text: ["現在、迷子のその他の情報はありません", "現在迷子のその他の情報はありません", "現在の迷子のその他情報はありません", "現在、迷子のペット（犬・猫以外）の情報はありません"]
