# 長野県動物愛護センター（ハローアニマル）譲渡犬: single_page。
# 「飼い主募集中の犬の情報」h2 の後、犬 1 頭 = <div class="section"> 1 つ（h3=名前＋種類/性別/生年月/備考の<p>）。
# 犬ページは1頭=1 div.sectionなので div ごと拾える（猫ページは複数頭が1つのdivに同居するため別方式）。
rows: "div.section:has(h3)"
# 0 頭の日は h3 が「現在、飼い主募集中の犬はいません」の雛形（写真 dogs_are_not.jpg と空の 種類：・性別：…）が 1 つ残り、
# 偽の犬として 11/04 から公開されていた（W006 2026-11-07）。子のいる日は h3 が名前になり、この文は出ない（11/03 までの やまと の日）。
# 雛形の行は捨て、同じ文を 0 頭の根拠にする。文が変わった日は根拠が無いので「読めなかった」になる。
row_filter:
  field_lacks: {name: ["いません", "ありません", "おりません", "ございません"]}   # 名前（h3）が不在の知らせになっている行。文面が変わっても偽の犬にしない
empty_text: ["現在、飼い主募集中の犬はいません"]
image: "img@src"
fields:
  name: {selector: "h3"}
  breed: {label: "種類", regex: "^([^（(]+)"}
  color: {label: "種類", regex: "[（(]([^）)]+)[）)]"}
  sex: {label: "性別"}
  age: {label: "生年月"}
  note: {label: "備考"}
