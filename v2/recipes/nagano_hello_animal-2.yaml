# 長野県動物愛護センター（ハローアニマル）譲渡猫: single_page。
# 「飼い主募集中の猫の詳細」h2 の後、猫が複数頭ぶん h3.section（管理番号）→ p 写真 → p 種類： → p 性別： → p 生年月： → p 備考：
# が 1 つの div.section にフラットに並ぶ。h3 を 1 頭の始まりにし、row_until で次の h3（または h2）までをまとめる（T517。
# 以前は「写真を持つ p」を行にして頭数と写真だけ取っていた）。
# 2026-10-05 監査: 種類「ミックス（白灰）」は括弧の中が毛色なので、品種（括弧の前）と毛色（括弧の中）に分ける。括弧が無い値は品種のみで毛色は空。
# 管理番号は始まりの h3 自身（selector: h3。from: heading にすると前の子の番号になるので使わない）。
# 備考は文中に空白が入ることがあるので、label でなく regex で行末まで取る。
rows: "div.section > h3"
row_until: "h2, h3"
image: "img@src"
fields:
  management_no: {selector: "h3", regex: "(\\d{4}-\\d+)"}
  # 種類の行が無い子（Wayback 2023-03 の h3 と写真・種類が別の div にある作り）では label が見つからず、regex が行の全文の先頭
  # （管理番号）に当たって品種になっていた（T521 ゲート F-01）。種類の p に絞り、regex も「種類：」から書く
  breed: {selector: "p:-soup-contains('種類')", regex: "種類[：:]\\s*([^（(\\s]+)"}
  color: {selector: "p:-soup-contains('種類')", regex: "種類[：:][^（(]*[（(]([^）)]+)[）)]"}
  sex: {label: "性別"}
  age: {label: "生年月"}
  note: {selector: "p:-soup-contains('備考')", regex: "備考[:：]\\s*(.+)"}
