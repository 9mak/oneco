# 長野県動物愛護センター（ハローアニマル）譲渡猫: single_page。
# 「飼い主募集中の猫の詳細」h2 の後、猫が複数頭ぶん h3(管理番号)+<p>(写真/種類/性別/生年月/備考) が
# 1つの <div class="section"> にフラットに並ぶ（h3 で区切られた範囲という概念が無い）。
# rows エンジンは行=1タグの子孫しか読めないため、h3 起点では隣接pの属性が取れない。
# 写真は1頭1枚・出現順が管理番号と一致するので、写真を持つ<p>を行にして「頭数と写真」だけ正確に取る。
# 性別・年齢・備考は構造上このレシピでは取得できない（下の 2026-10-04 のコメント参照）。
rows: "p:has(img)"
image: "img@src"
# 2026-10-04: 管理番号は行（写真の p）より前の直近の h3 から取れる（from: heading）。
# 種類・性別・生年月・備考は写真の p の「後ろの兄弟 p」にあり、今のエンジンでは行の外なので取れない（engine_needs）。
fields:
  management_no: {from: heading, selector: "h3", regex: "(\\d{4}-\\d+)"}
