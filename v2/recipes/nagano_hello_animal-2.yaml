# 長野県動物愛護センター（ハローアニマル）譲渡猫: single_page。
# 「飼い主募集中の猫の詳細」h2 の後、猫が複数頭ぶん h3(管理番号)+<p>(写真/種類/性別/生年月/備考) が
# 1つの <div class="section"> にフラットに並ぶ（h3 で区切られた範囲という概念が無い）。
# rows エンジンは行=1タグの子孫しか読めないため、h3 起点では隣接pの属性が取れない。
# 写真は1頭1枚・出現順が管理番号と一致するので、写真を持つ<p>を行にして「頭数と写真」だけ正確に取る。
# 名前・性別・年齢・備考は構造上このレシピでは取得できない（管理番号(h3)はimgの前の兄弟で読めないため空）。
rows: "p:has(img)"
image: "img@src"
fields: {}
