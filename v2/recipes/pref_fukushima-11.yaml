# 福島県動物愛護センター相双支所の譲渡犬情報（joto-dog-soso.html）。相双支所の譲渡猫（pref_fukushima-9）と同じテンプレート。
# 2026-11-17 は 0 頭（掲載日 2026年8月24日更新）: h2「現在飼い主さんを募集している犬」の下に、セルが空の雛形の表だけが残り、「現在…ありません」の文言は無い。
# 犬が載った日の読み方は未確認（猫の表と同じ作りと推測して書いている）。0 頭は「表の中に写真が無い」ことで決める。
rows: "div#main_body table:has(thead th)"
row_filter:
  text_has_any: ["管理番号"]
image: "img@src"
fields:
  name: {selector: "thead th:nth-of-type(2) p:nth-of-type(1)"}
  management_no: {selector: "thead th:nth-of-type(2) p:nth-of-type(2)", regex: "[（(]\\s*([^）)\\s]+)\\s*[）)]"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  age: {label: "推定年齢"}
  size: {label: "体格"}
  note: {label: "性格等"}
empty_absent:
  page: "div#main_body h2:-soup-contains('現在飼い主さんを募集している犬')"
  none: "div#main_body table img"
