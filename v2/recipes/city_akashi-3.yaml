# 2026-10-05 監査: note を「トライアル中」の印から表の「性格」（子猫は「性格・その他」）の本文に変えた（性格が取れていなかった）。
# 2026-10-07: 印が消えたので（ゲート F6）、印と性格を join で両方出す（「トライアル中。<性格>」）。Wayback 2024-10 は印が品種の行にあり「トライアル予定」もある。
# あかし動物センター（飼い主募集の猫）
# 2026-10-04 新規作成: 台帳に里親募集ページが無く、子猫・成猫が載っていなかった。
# 構造: div#tmp_contents 直下に <p><img×3></p><table>（仮名 / 品種（年齢） / 性別 / 性格・その他）</table><hr/> の繰り返し。
# 1 頭 = table 1 つ。写真は表の直前の p（直前の表で止まる）。p.col-md-4 の koneko.png / seineko.png は見出し画像なので除外。
# 仮名の見出しに「譲渡が決まりました！」が付いた子は掲載終了なので捨てる。「トライアル中」は載せて note に状態を入れる。
rows: "#tmp_contents table"
row_filter:
  text_lacks: ["譲渡が決まりました"]
image: {selector: "img@src", scope: prev_siblings, exclude: ["koneko", "seineko"]}
fields:
  name: {label: "仮名", regex: "^\\s*(\\S+)"}
  breed: {label: "品種", regex: "^([^（(]+)"}
  age: {label: "品種", regex: "[（(]([^）)]+)[）)]"}
  sex: {label: "性別"}
  note:   # 「トライアル中」等の印（今は仮名の行、2024-10 の作りでは品種の行）と性格（子猫は「性格・その他」）を「。」でつなぐ
    join:
      - {label: "仮名", regex: "(トライアル(?:中|予定))"}
      - {label: "品種", regex: "(トライアル(?:中|予定))"}
      - {label: "性格"}
    sep: "。"
empty_text:
  - "現在、飼い主を募集している子猫は0頭です"
  - "現在、飼い主を募集している成猫は0頭です"
