# 岩手県 中部保健所（花巻保健福祉環境センター）— pref.iwate.jp
# 台帳 url は 動物の愛護・管理関係情報 の索引ページ（follow_all で迷子情報ページと譲渡情報ページの
# 両方を辿って合算。迷子ページは通常0件、譲渡ページが本体）。
# 譲渡ページの構造は県央保健所と同じ「フラットな並び」:
#   <h2>【譲渡】新しい飼い主さんを募集しています。</h2>
#   <p class="imageright"><img alt="新しい飼い主を捜している猫の写真"></p>
#   <p>仮名：...<br>動物種：猫<br>...備考：...</p>
# 2026-10-04: 行を写真の p から説明文の p（h2【譲渡】+ 写真 p の直後）に変え、写真は直前の兄弟から取る
# （image.scope: prev_siblings, stop_at: row。行も写真も p なので「前の行」まで遡る）。仮名・種類・性別・大きさ・
# 生年月日・備考が取れる。兄弟まとめて 1 ブロックの紹介は 1 件のまま。【里親募集】（飼い主宅で飼養中の個人募集）は除外のまま。
steps:
  - follow_all: "a:-soup-contains('岩手県中部保健所保護動物情報'), a:-soup-contains('犬、猫の譲渡情報')"
rows: "h2:-soup-contains('【譲渡】') + p.imageright + p"
image: {selector: "p.imageright img@src", scope: prev_siblings, stop_at: row}
fields:
  name: {label: "仮名"}
  species: {label: "動物種"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  size: {label: "大きさ"}
  age: {regex: "生年月日[:：]\\s*(\\S+)"}
  note: {regex: "備考[:：]\\s*(.+)"}
species:
  from: field
  map: {"猫": cat, "ネコ": cat, "犬": dog, "イヌ": dog}
empty_text:
  - "現在、保護されている犬、猫はいません"
  - "保護されている犬、猫はいません"
