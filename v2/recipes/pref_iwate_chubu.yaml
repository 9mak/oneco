# 岩手県 中部保健所（花巻保健福祉環境センター）— pref.iwate.jp
# 台帳 url は 動物の愛護・管理関係情報 の索引ページ（follow_all で迷子情報ページと譲渡情報ページの
# 両方を辿って合算。迷子ページは通常0件、譲渡ページが本体）。
# 譲渡ページの構造は県央保健所と同じ「フラットな並び」:
#   <h2>【譲渡】新しい飼い主さんを募集しています。</h2>
#   <p class="imageright"><img alt="新しい飼い主を捜している猫の写真"></p>
#   <p>仮名：...<br>動物種：猫<br>...備考：...</p>（img は兄弟要素なのでこのエンジンからは届かない）
# 行 = 写真の p（p.imageright）。1 枚の写真に対し「仮名：シロ、オッド、グレ」のように兄弟3頭が
# まとめて写っている/紹介されているブロックがいくつかあり、その場合は1行=1枚の写真（複数頭まとめて1件）
# として数える（写真をこの子個体まで分解する手段がエンジンに無いため）。テキスト詳細（仮名・特徴等）は
# img と兄弟関係の別 p にあり row からは届かないため name 等は取らず、種別だけ alt から判定する。
steps:
  - follow_all: "a:-soup-contains('岩手県中部保健所保護動物情報'), a:-soup-contains('犬、猫の譲渡情報')"
rows: "p.imageright"
fields:
  species: {selector: "img", attr: "alt"}
species:
  from: field
  map: {"猫": cat, "ネコ": cat, "犬": dog, "イヌ": dog}
empty_text:
  - "現在、保護されている犬、猫はいません"
  - "保護されている犬、猫はいません"
