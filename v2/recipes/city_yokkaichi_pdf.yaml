# 四日市市保健所 収容動物の公示（衛生指導課）
# 台帳 url の HTML が公示ページそのもの。動物がいる日は本文に PDF リンク（a[href$='.pdf']）が現れる。
# PDF は写真＋文字情報のみ（表は使わない）。「収容日」が現れた行を1頭の境界とし、
# 以降の「種類/性別/年齢/毛色/体格/収容場所」ラベル行を正規表現で拾う（旧 adapter の境界ロジックを移植）。
# 動物が0のときは本文に「現在、掲載対象となる動物はおりません。」が出て PDF リンク自体が消える（2026-09-29 確認）。
steps:
  - pdf_links: "a[href$='.pdf']@href"
pdf:
  mode: text
rows_regex: "収容日\\s*[:：]?\\s*\\d{4}\\s*[年/\\-\\.]\\s*\\d{1,2}\\s*[月/\\-\\.]\\s*\\d{1,2}\\s*日?"
fields:
  shelter_date: {regex: "収容日\\s*[:：]?\\s*(\\d{4}\\s*[年/\\-\\.]\\s*\\d{1,2}\\s*[月/\\-\\.]\\s*\\d{1,2}\\s*日?)"}
  species: {regex: "(?:種類|種別)\\s*[:：]?\\s*(犬|猫|その他|\\S+)"}
  sex: {regex: "性別\\s*[:：]?\\s*([^\\s　]+)"}
  age: {regex: "年齢\\s*[:：]?\\s*([^\\s　]+)"}
  color: {regex: "毛色\\s*[:：]?\\s*([^\\s　]+)"}
  size: {regex: "(?:体格|大きさ)\\s*[:：]?\\s*([^\\s　]+)"}
  location: {regex: "収容場所\\s*[:：]?\\s*([^\\n]+?)(?:\\s{2,}|$)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text: ["現在、掲載対象となる動物はおりません", "掲載対象となる動物はおりません"]
