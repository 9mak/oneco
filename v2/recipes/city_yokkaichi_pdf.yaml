# 四日市市保健所 収容動物の公示（衛生指導課）
# 台帳 url の HTML が公示ページそのもの。動物がいる日は本文に PDF リンク（a[href$='.pdf']）が現れる
# （リンク文言は「令和8年10月5日 平尾町（犬）」、PDF は公示 1 件ごと）。
# 動物が0のときは本文に「現在、掲載対象となる動物はおりません。」が出て PDF リンク自体が消える（2026-09-29 確認）。
#
# 2026-10-05 夕方から PDF が「第１号様式 公告 保護・収容犬の公示」の表に変わった（T518）。pdfplumber の文字では:
#   保護・収容犬の公示 / 令和8年10月5日 、 保護収容した犬について、 / …（本文）… / 抑留期限 令和8年10月9日 まで /
#   見出し（番号・保護・収容した場所・種類・色・性別・体格・年齢・その他）/ 四日市市 / 1 洋雑 茶 オス 中 91日以上 / 平尾町 / 連絡先 …
# 表の 1 行が 1 頭だが、番号は「1」（1 桁で管理番号とみなされない）で、収容日は表の外の本文にしか無い。
# エンジンの table モードは行の外の文字を取れず、PDF の行には写真も付かないため、表の行だけでは動物として通らない。
# そこで text モードで公示 1 枚（題名「保護・収容…の公示」から文書の終わりまで）を 1 行として読み、
# 収容日は本文の「令和8年10月5日 、 保護収容」から、種類・色・性別・体格・年齢は表の 1 行目（番号で始まる行）から、
# 場所はその次の行（セルの 2 行目。1 行目の「四日市市」は市名なので取らない）から取る。
# 制約（T518 open_questions）:
#   - 1 枚の公示に 2 頭以上が並ぶと、2 頭目以降は読まない（表の 1 行目だけ）
#   - 管理番号も写真も無いため ID は収容日から決まる。同じ日付の公示が 2 枚あると 2 枚目は「同じ ID の行が既にある」で捨てる
#   - 体格や年齢が空欄だと、空白区切りの位置がずれて後ろの列の値が入ることがある
# 種別は題名の「犬」「猫」で決める（決まらない公示は、種別なしで載せる変更が入るまでは「犬か猫か分からない」で捨てる）。
steps:
  - pdf_links: "a[href$='.pdf']@href"
pdf:
  mode: text
rows_regex: "^.*収容\\S*の公示"
fields:
  shelter_date: {regex: "(令和\\s*\\d+\\s*年\\s*\\d+\\s*月\\s*\\d+\\s*日)\\s*[、,，]?\\s*保護収容"}
  species: {regex: "収容(犬|猫)の公示"}
  breed: {regex: "(?m)^\\d+ (?:[^\\n]* )?(\\S+) \\S+ (?:オス|メス|雄|雌|不明)"}
  color: {regex: "(?m)^\\d+ (?:[^\\n]* )?(\\S+) (?:オス|メス|雄|雌|不明)"}
  sex: {regex: "(?m)^\\d+ [^\\n]*?((?:オス|メス|雄|雌|不明)\\S*)"}
  size: {regex: "(?m)^\\d+ [^\\n]*?(?:オス|メス|雄|雌|不明)\\S* (\\S+)"}
  age: {regex: "(?m)^\\d+ [^\\n]*?(?:オス|メス|雄|雌|不明)\\S* \\S+ (\\S+)"}
  location: {regex: "(?m)^\\d+ [^\\n]*(?:オス|メス|雄|雌|不明)[^\\n]*\\n(?!連絡先)([^\\n]+)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text: ["現在、掲載対象となる動物はおりません", "掲載対象となる動物はおりません"]
