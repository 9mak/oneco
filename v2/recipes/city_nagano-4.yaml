# 長野市 猫等保護情報（市民・ボランティア）。市民が保護した猫・鳥などの掲示。h2「保護情報」の下に
# h3「登録番号／6-2号」+ p(img) + ul（保護日時／…・保護場所／…・保護主／…・連絡先／…・保護時の状況／…・種類／猫・雑種・毛色／…・性別／…・推定年齢／…）。
# 保護主の名前・連絡先（個人の電話番号）は取らない。0 頭の日は h3「保護情報」の下に「現在保護情報はありません」（2023-06 の保存版）。
# 見出しの階層は日によって違う: 2026-10 は h2（犬・猫・その他／譲渡希望／保護情報）の下に動物ごとの h3、2024-11 以前の保存版は h3 の下に h4。
# どちらも読めるよう動物の見出しは h3・h4 の両方を始まりにする（以前は h3 だけで、旧階層の日は節の見出しの h3 が始まりになり、節の最初の 1 頭だけが載った）。
# 保護日時の項目名が無い版がある（2024-02・07 の保存版: 先頭の li が「令和5年12月10日（日曜日）午前11時」だけ。以前は「保護日時」で動物を決めていて 3 頭が読めなかった）ので、
# 動物の行は「保護日時」か「保護場所／」で決め、日付は項目名の有無にかかわらず「令和…」で始まる 1 つ目を取る。
# 種別は「種類／猫・雑種」の語（犬・猫）で決める。鳥など犬猫のどちらでもない子は種別なしで載せる（種類が「柴」「ポメラニアン」のように犬の語を含まない犬を犬猫以外と言い切れないため。以前は allow_other で other にしていた）。
rows: "h3, h4"
row_until: "h2, h3, h4"
row_filter:
  text_has_any: ["保護日時", "保護場所／"]
image: "img@src"
fields:
  management_no: {selector: "h3, h4", regex: "／(\\S+)"}
  shelter_date: {regex: "(?:保護日時／)?((?:令和|平成)\\S+)"}
  location: {regex: "保護場所／(\\S+)"}
  species: {regex: "種類／(\\S+)"}
  breed: {regex: "種類／(?:猫・|犬・)?(\\S+)"}
  color: {regex: "毛色／(\\S+)"}
  sex: {regex: "性別／(\\S+)"}
  age: {regex: "推定年齢／(\\S+)"}
  size: {regex: "(?:体格|体重)／(\\S+)"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在保護情報はありません"
