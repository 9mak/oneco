# ワンニャピアあきた（譲渡犬・秋田県動物愛護センター）
# 一覧 (protective-dogs) はカード（写真+種類+性別+名前+詳細リンク）。詳細は a.btn-brown@href の個別ページ (pages/animals/pNNNN) で 1 頭 = 1 ページ。
# 個体ページの table.style-simple (th/td 2 組×行) から性別・年齢・体重・毛色・備考・個体管理ナンバーを取る。名前は見出し h1。
steps:
  - follow_all: "a.btn-brown@href"
rows: "body"
image: "img[src*='/uploads/contents/animals']@src"
fields:
  name: {selector: "div.page-header h1"}
  management_no: {label: "個体管理ナンバー"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  size: {label: "体重"}
  color: {label: "毛色"}
  note: {label: "備考"}
empty_text:
  - "現在譲渡可能な犬はおりません"
  - "現在譲渡可能な犬はいません"
