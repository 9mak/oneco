# 埼玉県 動物指導センター 本所 管内 個人保護猫情報: 住民が迷子を保護して飼い主を探している情報（職員が手で更新するページ）。1 頭 = 受付番号の行を持つ table 1 つ。
# 番号の欄の見出しは時期で「受付番号」（本所 2021〜）と「管理番号」（本所 2019・南支所）に変わるので、どちらの表も読む（2019 年の本所は見出しが違うせいで 4 頭が全部読めなかった）。番号は「H2021-05-001」「H30-91」（平成30年度）「2026-1061」の形（電話番号 048-536-2465 を番号と取らない）。
# 写真は table の中か直前の p（ページごとに作りが違うので self_or_prev_siblings）。
# 0 頭の日は空欄の雛形 table（番号「2026-」、保護日「2026年月日」等）が残り、新着情報に「保護情報はありません」等と書く。
# 雛形を動物にしないよう、番号は「西暦-連番」、保護日は日まで入った日付が取れたときだけ読む。
rows: "#tmp_contents table:-soup-contains('受付番号'), #tmp_contents table:-soup-contains('管理番号')"
image: {selector: "img@src", scope: self_or_prev_siblings, exclude: ["new.gif"]}
fields:
  management_no: {label: ["受付番号", "管理番号"], regex: "(H\\d{4}\\s*[-‐‑₋−ー－–]\\s*\\d+\\s*[-‐‑₋−ー－–]\\s*\\d+|H\\d{2}\\s*[-‐‑₋−ー－–]\\s*\\d+|\\d{4}\\s*[-‐‑₋−ー－–]\\s*(?:[A-Za-z]\\s*[-‐‑₋−ー－–]\\s*)?\\d+)"}
  shelter_date: {label: "保護日", regex: "((?:令和|平成)?\\s*\\d+年\\s*\\d+月\\s*\\d+日)"}
  location: {label: "保護場所"}
  size: {label: "大きさ"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  age: {label: "推定年齢"}
  color: {label: "毛色"}
  note: {label: "備考"}
empty_text:
  - "掲載している情報はありません"
  - "保護情報はありません"
  - "掲載を希望する迷子猫の保護情報はありません"   # 2023 年の本所の言い方
  - "新着情報はありません"   # 2025-02 の本所の言い方（【2025年2月7日更新】新着情報はありません。雛形の表だけ）
  - "現在、情報はありません"   # 0 頭の日の言い方（2019〜2022 の本所・南支所）
  - "現在情報はありません"   # 0 頭の日の言い方（2019〜2022 の本所・南支所）
  - "現在、掲載情報はありません"   # 0 頭の日の言い方（2019〜2022 の本所・南支所）
