# 広島県動物愛護センター（迷い犬）: div.detail_free 配下に「管理番号 h2」+「写真 p」+「属性 p」が
# 並ぶ single_page（フリーテキスト、表なし）。h2 と p は基本は兄弟だが、稀に <div> で 1 頭分が
# 入れ子にされる（2026-09 時点の実データで確認）。このエンジンは行=1要素の子孫しか見ないため、
# h2（管理番号）と属性 p は別要素になり両方を同時には拾えない。実データが必ず持つ「センターに
# 収容された日：」を含む属性 p を row として選ぶ方式（入れ子・兄弟どちらの構造でも
# `div.detail_free p` は該当 p を子孫として拾える）を採用し、確実性を優先。
# 引き換えに管理番号(h2内)・写真(直前のp内)は行の子孫にならず取得不可（既知の制限）。
# 属性 p の中身: 「雑種、推定7歳、雄<br>センターに収容された日：…<br>保護された状況：…」。
# 0 件時は該当 p が無くなり案内文のみ残る。
rows: "div.detail_free p:-soup-contains('収容された日')"
fields:
  breed: {regex: "^([^、,，\\n]+)"}
  age: {regex: "(推定\\s*\\d+\\s*歳|\\d+\\s*歳|\\d+\\s*(?:ヶ月|か月|カ月)|成犬|成猫|子犬|子猫|幼犬|幼猫)"}
  sex: {regex: "(雄|雌)"}
  shelter_date: {regex: "収容された日[:：]\\s*([^\\s]+)"}
  location: {regex: "保護された状況[:：]\\s*(?:(?:令和|平成|昭和)?\\s*\\d+\\s*年\\s*\\d+\\s*月\\s*\\d+\\s*日[^に]*に\\s*)?(.+?)(?:で(?:保護|発見)されました|$)"}
empty_text:
  - "現在、迷い犬情報はありません"
  - "現在迷い犬情報はありません"
  - "該当する迷い犬はいません"
