# proposal: run の日付 2026-10-31・元の失敗理由 0 頭で empty_text も無い（行 0・捨てた 0）・取れた頭数 1・採用条件は次の行（人が差分を見て recipes/ へ反映する。今日の HTML は <slug>.today.html）
# 採用条件: 合格 a 必須項目・b 重複・c 行数・d 回帰（保存 HTML で 1 頭・前回 1 頭）
# agy note: 収容日表記の変更（「センター収容日」への表記ゆれ）に対応して row_filter、shelter_date、location の正規表現を修正しました。また、0頭時に文言が出ず該当要素が丸ごと非表示となる構造に対応するため empty_absent を追加しました。
# 広島県動物愛護センター（迷い犬）: div.detail_free 配下の管理番号を含む h2 を 1 頭の始まりとし、
# row_until: h2 で後ろの兄弟要素（写真 img と属性情報 p）を次の h2 手前までまとめて 1 頭とする。
rows: "div.detail_free h2:-soup-contains('管理番号')"
row_until: "h2"
row_filter:
  text_has_any: ["収容日", "収容された日"]
  text_lacks: ["返還されました"]
image: "p > img@src"
fields:
  management_no: {selector: "h2", regex: "管理番号[:：]?\\s*(\\S+)"}
  breed: {regex: "(?:^|[、,，\\s])((?:(?!推定|雄|雌|\\d)[^、,，\\s])+)[、,，]"}
  age: {regex: "(推定\\s*\\d+\\s*歳|\\d+\\s*歳|\\d+\\s*(?:ヶ月|か月|カ月)|成犬|成猫|子犬|子猫|幼犬|幼猫)"}
  sex: {regex: "(雄|雌)"}
  shelter_date: {regex: "収容(?:された)?日[:：]\\s*((?:(?:令和|平成|昭和|\\d{4})\\s*年)?\\s*\\d+\\s*月\\s*\\d+\\s*日)"}
  note: {regex: "(?:保護|発見)されました。\\s*(\\S.*)$"}
  location: {regex: "(?:\\d+日[^に]*に|状況[:：]|収容(?:された)?日[:：])\\s*(.+?)で(?:保護|発見)されました"}
empty_text:
  - "現在迷い犬はいません"
  - "現在、迷い犬情報はありません"
  - "現在迷い犬情報はありません"
  - "該当する迷い犬はいません"
empty_absent:
  page: "#main_header h1:-soup-contains('迷い犬一覧')"
  none: "div.detail_free h2"
