# 長野市 飼い主が探しています！（飼い主が逸走した犬猫等の告知）。h2「犬」「猫」「その他」の下に
# h3「登録番号／6-3号」+ p(img) + ul（逸走日時／…・逸走場所／…・連絡先／…・種類／…・毛色／…・性別／…・年齢／…・体重か体格／…・情報／…）。
# 連絡先（飼い主個人の電話番号）は取らない。0 頭の日の文言は未確認（0 頭の日は「読めなかった」扱いで通知に出る）。
# 見出しの階層は日によって違う: 2026-10 は h2（犬・猫・その他／譲渡希望／保護情報）の下に動物ごとの h3、2024-11 以前の保存版は h3 の下に h4。
# どちらも読めるよう動物の見出しは h3・h4 の両方を始まりにする（以前は h3 だけで、旧階層の日は節の見出しの h3 が始まりになり、節の最初の 1 頭だけが載った）。
rows: "h3, h4"
row_until: "h2, h3, h4"
row_filter:
  text_has_any: ["逸走日時"]
image: "img@src"
fields:
  management_no: {selector: "h3, h4", regex: "／(\\S+)"}
  shelter_date: {regex: "逸走日時／(\\S+)"}
  location: {regex: "逸走場所／(\\S+)"}
  breed: {regex: "種類／(\\S+)"}
  color: {regex: "毛色／(\\S+)"}
  sex: {regex: "性別／(\\S+)"}
  age: {regex: "年齢／(\\S+)"}
  size: {regex: "(?:体格|体重)／(\\S+)"}
  note: {regex: "(?:その他の?)?情報／(.+)"}
species:
  from: heading
  selector: ":is(h2, h3):-soup-contains('犬', '猫', 'その他')"
  map: {"犬": dog, "猫": cat, "その他": other}
  allow_other: true
