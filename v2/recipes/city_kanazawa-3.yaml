# 金沢市動物愛護管理センター（一般の方に保護されている動物） — www4.city.kanazawa.lg.jp/soshikikarasagasu/dobutsuaigokanricenter/gyomuannai/1/3/3489.html
# 2026-10-05 T519 新規作成（環境省リンク集のリンク先 .../1/3/index.html の「一般の方に保護されている動物の情報」。センターでなく市民が預かっている子。掲載は原則 3 か月）。
# 確認済み（2026-10-05・0 頭）: h2「一般の方が保護している動物の情報」の下に「現在保護されている動物はいません」の 1 行だけ。
# 未確認: 動物が載った日の作り。同じ金沢市の他のページと同じ「figure.img-item（写真）→ div.wysiwyg > table」の並びで、項目は「動物種類：犬」「種類：…」と仮定している。
#   犬猫は li/p の「動物種類：」から。無ければ種別なしで載る（種別なしの行は、写真が無く項目が 2 つ未満のとき自動で捨てられる）。
#   外れた日は行が取れず、empty_text の文言も消えるので「読めなかった」で通知に出る（0 頭に見せない）。
# 写真（2026-10-07 T519 v-g3）: 表の前の figure.img-item の img（か、2025-01 の猫の譲渡ページのように直前の div.wysiwyg の p > img）から読む。本文冒頭の飾りのイラスト
#   （ファイル名 pet_inu.jpg・pet_doubutu_*.jpg、alt「…のイラスト」）は除く。以前の「前の兄弟の最初の 1 枚」は、前の行が無い 1 頭目で本文冒頭のイラストまで遡り、
#   1 頭目に別の写真（イラスト）を付けた（猫の収容 2024-08 の 1 頭目、犬の譲渡 2024-04 の 1 頭目）。0 頭の日の空の雛形の表にもこのイラストだけが写真になり、
#   中身が空の「動物 1 頭」が載った（犬の譲渡 2024-08・2024-11。偽の動物）。写真が無い子は写真なしで載る。
# 0 頭の日の文言は今日の「現在保護されている動物はいません」だけ確認できた（この URL の Wayback の保存は無い）。他の 2 ページと同じ言い換えも念のため入れた。動物が載った日の作りは未確認（0 頭の日は雛形の表も出ない）。
rows: "div.wysiwyg:has(> table)"
row_filter:
  text_has_any: ["保護月日", "保護場所", "毛色"]
image: {selector: "figure.img-item img:not([alt*='イラスト']), div.wysiwyg > p > img:not([alt*='イラスト'])@src", exclude: ["/pet_"], scope: prev_siblings, stop_at: row}
species:
  from: field
  map: {"犬": dog, "猫": cat}
fields:
  management_no: {from: heading, selector: "h2, h3", regex: "([A-Z]\\d{7,10})"}
  species: {selector: "td li:-soup-contains('動物種類'), td p:-soup-contains('動物種類')", regex: '動物種類[:：]\s*(\S+)'}
  breed: {selector: "td li:-soup-contains('種類'):not(:-soup-contains('動物種類')), td p:-soup-contains('種類'):not(:-soup-contains('動物種類'))", regex: '種類[:：]\s*(\S.*)'}
  color: {selector: "td li:-soup-contains('毛色'), td p:-soup-contains('毛色')", regex: '毛色[:：]\s*(\S.*)'}
  sex: {selector: "td li:-soup-contains('性別'), td p:-soup-contains('性別')", regex: '性別[:：]\s*(\S.*)'}
  age: {selector: "td li:-soup-contains('年齢'), td p:-soup-contains('年齢')", regex: '年齢[:：]\s*(\S.*)'}
  size: {selector: "td li:-soup-contains('体格'), td p:-soup-contains('体格')", regex: '体格[:：]\s*(\S.*)'}
  shelter_date: {label: "保護月日"}
  location: {label: "保護場所"}
  note: {label: "その他"}
empty_text: ["保護されている動物はいません", "保護している動物はいません", "保護されている動物は、いません"]
