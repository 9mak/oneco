# あかし動物センター（迷子犬）
# 一覧ページ https://.../info/maigo/dog.html は akashippo CMS が保護動物 0 頭の間は
# ページ自体を非公開（404）にする方式で、2026-09-29 現在も dog.html は 404（実 fetch で確認）。
# info/maigo.html（直上）も現在は説明文のみで「いません」の明言は無いが、
# dobutsu/ トップ（index.html）に「現在、当センターで保護している迷子動物はいません」と明記されている
# （犬猫共通の文言。実 fetch HTTP 200 で確認）ため、入口をトップページに差し替えて empty 判定する。
# 動物が出た際は本来 #tmp_contents table tr（1行目 th ヘッダ、以降 1行=1頭）の想定（旧 adapter 準拠）だが、
# その場合 dog.html 自体が復活するはずなので、その時点で入口 URL を戻す必要がある。
url: https://www.city.akashi.lg.jp/kankyou/dobutsu/index.html
rows: "#tmp_contents table tr"
row_filter:
  text_lacks: ["収容日"]
image: "img@src"
fields:
  shelter_date: {selector: "td:nth-of-type(1)"}
  breed: {selector: "td:nth-of-type(3)"}
  sex: {selector: "td:nth-of-type(4)"}
  color: {selector: "td:nth-of-type(5)"}
  size: {selector: "td:nth-of-type(6)"}
  location: {selector: "td:nth-of-type(7)"}
empty_text:
  - "現在、当センターで保護している迷子動物はいません"
  - "現在、迷子の犬はいません"
  - "現在、保護している犬はいません"
