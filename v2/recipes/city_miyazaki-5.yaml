# 宮崎市 市民の皆さんが迷子の犬を探しています（57782.html）。飼い主が探している迷子犬（kind: lost）。city_miyazaki-4（猫）と同じ作り。
# 「迷子犬情報 20261106」のように番号の前が空白（猫は「:」）。ページには 2025-07・2024 の古い掲載（今日は 20250704）も残る。
# おまえさん決定（2026-11-18）: こちらで期間を決めず、掲載元が載せている届け出は全部出す（毎年直す作り込みはバグのもと）。写真は出さない（photo: no）。
# 犬の行方不明の文は「令和8年10月31日(土)の午後0時30分頃、宮崎市佐土原町下田島の「宮崎国際ゴルフ倶楽部」付近より行方不明です。」（曜日が付く）。
# 2026-11-21（T656 直し 2 回目）: 迷子犬 20250704 の場所が「令和7年7月1日(火)夕方から夜にかけて、吉村町西田甲より行方不明です」で空になっていたので、前置きの「にかけて」を許した。掲載番号が 9 桁の届け出（202502212）が 8 桁に切れて別の届け出（20250221）と同じ番号になっていたので `\d{8,9}` にした。
rows: "article.body div.imgRTxtL, article.body div.imgTxtL"
row_filter:
  min_text_length: 10   # 1 つの届け出の 2 枚目以降の写真は文字の無い枠に入る（20260302 の 202603022.jpg）。それを 1 頭にしない
  text_has_any: ["迷子猫情報", "迷子犬情報", "猫保護情報", "犬保護情報", "行方不明", "保護しています"]   # 届け出の枠だけ。注意書きの枠（「迷子の犬を探している方へお願い」）に絵が付いても 1 頭にしない（#130 再レビュー F-02）
image: "img@src"
fields:
  management_no: {regex: "(?:迷子猫情報|迷子犬情報|猫保護情報|犬保護情報)\\s*[:：]?\\s*(\\d{8,9}(?:-\\d+)?)"}
  breed: {regex: "(?:迷子猫情報|迷子犬情報|猫保護情報|犬保護情報)\\s*[:：]?\\s*\\d{8,}(?:-\\d+)?\\s*([^、,\\s]+)"}   # 掲載番号の直後の語。番号と同じ段落・次の段落・空の段落を挟む並びがある（#130 reviewer F-06）
  sex: {regex: "(オス|メス)"}   # 2 段落目に無く 3 段落目に「オス（去勢済み） 1才8ヶ月」と書く届け出もある（2026-11-17 迷子猫 20260719。#130 reviewer F-06）
  age: {selector: "p:nth-of-type(2)", regex: "(老齢|成齢|\\d+歳|\\d+(?:ヶ|か|カ)月|推定[^、,]+)"}
  shelter_date: {regex: "(令和\\d+年\\d+月\\d+日)"}
  location: {regex: "(?:頃|朝|昼|夕方|夜|晩|日(?:\\([^)]*\\))?)(?:にかけて)?(?:の[^、,]{0,12}頃)?[、,]\\s*([^、,]+?)\\s*より行方不明"}
  note:
    join:
      - {selector: "p:nth-of-type(2)"}
      - {selector: "p:nth-of-type(3)"}
      - {selector: "p:nth-of-type(4)"}
      - {selector: "p:nth-of-type(5)"}
      - {selector: "p:nth-of-type(6)"}
    sep: " "
empty_text:
  - "現在、掲載情報はありません"
  - "現在、掲載する犬の情報はありません"
