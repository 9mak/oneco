# 岩手県 奥州保健所 — pref.iwate.jp
# 2026-10-04: 古い「既知の制限」コメントを訂正（管理番号「R8-6-5」形式はエンジンの _MGMT_RE が既に対応済みで、4 頭とも通る）。
#   写真は h2 の直後の p.imagecenter（行と同じ p タグ）。image に prev_siblings を足したが、エンジンは同じ p タグで遡りを
#   止めるため現状は届かない（engine_needs。エンジンが「前の行」で止めるようになれば 4 頭に写真が付く）。
# ページ全体が <h2>保護猫</h2> の下（猫のみ。犬のセクションは無い）。
# 構造は県央/中部と同じフラットな並び（<h2>【譲渡】…</h2><p class="imagecenter"><img></p><p>管理番号：R8-6-5<br>愛称：…</p>）。
# 行 = 「管理番号：」を含む p（全個体に管理番号があり欠落なし）。
rows: "p:-soup-contains('管理番号：')"
image: {selector: "h2 + p.imagecenter img@src", scope: prev_siblings, stop_at: row}   # 2026-10-04: 行も写真も p なので前の行まで遡る
fields:
  management_no: {label: "管理番号"}
  name: {label: "愛称"}
  location: {label: "保護された場所"}
  shelter_date: {label: "保護された日"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  note: {label: "備考"}
# empty_text は置かない: 旧来の「記載欄が空白の場合は、該当する動物がいない状態です」は動物がいる日も冒頭に常時出ている
#   説明文で、構造が変わって 0 頭に見えた日も「本当に 0 頭」と誤判定して通知が来なくなる。0 頭の日だけ出る文言は未確認
#   （2026-10-04 時点で 4 頭掲載中のため確かめられない）。0 頭の日は「読めなかった」扱いで通知される（誤報より見逃しを避ける）。
