# 岩手県 奥州保健所 — pref.iwate.jp
# 2026-10-04: 古い「既知の制限」コメントを訂正（管理番号「R8-6-5」形式はエンジンの _MGMT_RE が既に対応済みで、4 頭とも通る）。
#   写真は h2 の直後の p.imagecenter（行と同じ p タグ）。image に prev_siblings を足したが、エンジンは同じ p タグで遡りを
#   止めるため現状は届かない（engine_needs。エンジンが「前の行」で止めるようになれば 4 頭に写真が付く）。
# ページ全体が <h2>保護猫</h2> の下（猫のみ。犬のセクションは無い）。
# 構造は県央/中部と同じフラットな並び（<h2>【譲渡】…</h2><p class="imagecenter"><img></p><p>管理番号：R8-6-5<br>愛称：…</p>）。
# 行 = 「管理番号：」を含む p（全個体に管理番号があり欠落なし）。
# R8-9-3 は R8-9-2 と同じ写真。R8-9-2 が消えても ID が写真由来（R8-9-2 の ID）に移らないよう管理番号から ID を作る（公開ゲート F-02）
id_by_management_no: ["R8-9-3"]
# 2026-11-20 T656: 決まった子は見出しで外す。h2「【決定】譲渡が決まりました！」の下の子が載っていた（R8-9-4 ソラくん・R8-9-5 リクちゃん）。
#   見出しは行の前の直近の h2（section）で見る。行の文には「決定」と書かれないので、行の文では外せない（宮古 pref_iwate_miyako の「【御報告】」と同じ読み方）。
#   行としては残すので、写真の遡り（stop_at: row）は決まった子の行で止まり、残った子に決まった子の写真が付かない。
# 2026-11-24 方針 22: 見出しに「（受付一時停止）」と書かれた子（R8-9-2・R8-9-3）も決まった子と同じく見出しで外す（掲載元が受付を再開して見出しが変われば戻る）。
#   以前は「募集中の見出し」として載せていた（方針 22 を決めた 11/21 より前の判断）。
rows: "p:-soup-contains('管理番号：')"
row_filter:
  field_lacks: {section: ["決定", "決まりました", "受付一時停止"]}   # 「【譲渡調整中】…（受付一時停止）」は募集を一時止めているので載せない（2026-11-24 方針 22）。「【譲渡調整中】」だけの見出しは載せる
empty_container: "h1:-soup-contains('奥州保健所保護動物情報')"   # 全部の子が決まった・受付一時停止の日は、行はあるが全行除外。ページの h1 が残っていることで 0 頭と確定する（宮古・松本と同じ）
image: {selector: "h2 + p.imagecenter img@src", scope: prev_siblings, stop_at: row}   # 2026-10-04: 行も写真も p なので前の行まで遡る
fields:
  section: {from: heading, selector: "h2"}   # 除外判定用（animals には出ない）
  management_no: {label: "管理番号"}
  name: {label: "愛称"}
  location: {label: "保護された場所"}
  shelter_date: {label: "保護された日"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  note: {label: "備考"}
# empty_text は置かない: 旧来の「記載欄が空白の場合は、該当する動物がいない状態です」は動物がいる日も冒頭に常時出ている
#   説明文で、構造が変わって 0 頭に見えた日も「本当に 0 頭」と誤判定して通知が来なくなる。0 頭の日だけ出る文言は未確認
#   （2026-10-04 時点で 4 頭掲載中のため確かめられない）。0 頭の日は「読めなかった」扱いで通知される（誤報より見逃しを避ける）。
