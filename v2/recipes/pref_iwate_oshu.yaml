# 岩手県 奥州保健所 — pref.iwate.jp
# ページ全体が <h2>保護猫</h2> の下（猫のみ。犬のセクションは無い）。
# 構造は県央/中部と同じフラットな並び（写真 p.imagecenter が兄弟要素でこのエンジンからは届かないため画像なし）。
# 行 = 「管理番号：」を含む p（全個体に管理番号があり欠落なし）。
# 既知の制限（エンジン側の管理番号判定 _MGMT_RE の対象外）: 「R8-6-5」のように年-月-通番が
# それぞれ1桁ずつハイフン区切りの形式は、2桁以上の連続数字を要求する _MGMT_RE / \d{2,} に
# マッチせず、収容日も無い個体（迷子ではなく元々譲渡候補で保護日未記載）は「写真も管理番号も
# 収容日も無い」として自動的に捨てられる（2026-09-29時点: 4頭中1頭のみ通過）。
# 実データは正しく「管理番号：R8-6-5」を保持しており捨てた理由の文言もゴミではない。
# collector/*.py の編集はこのタスクの権限外のため、レシピ側では解消できない既知の反証未了点。
rows: "p:-soup-contains('管理番号：')"
fields:
  management_no: {label: "管理番号"}
  name: {label: "愛称"}
  location: {label: "保護された場所"}
  shelter_date: {label: "保護された日"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  note: {label: "備考"}
empty_text:
  - "記載欄が空白の場合は、該当する動物がいない状態です"
