# 2026-10-05 監査: 収容日（直前の h2「【収容日】…」から from: heading で）と毛色（品種・毛色・性別の行の 2 番目）を取るようにした
# 千葉県動愛センター東葛飾支所（収容猫）。本所と同一テンプレート。
# 末尾の「テンプレート」ダミーブロックは管理番号 260000-0-0 固定なので row_filter で除外。
# 2026-10-02 は実データが無くダミーのみ（0 頭）、2026-10-04 は 1 頭（260930-1-1）掲載中。
rows: "div.col2"
row_filter:
  text_lacks: ["260000-0-0"]
image: "img@src"
fields:
  shelter_date:
    from: heading
    selector: "h2"
    regex: "(\\d+年\\d+月\\d+日)"
  color:
    regex: "収容場所】\\s*\\S+\\s+[^・\\s]+・([^・\\s]+)・"
  management_no:
    regex: "管理番号】\\s*([^\\s（(]+)"
  location:
    regex: "収容場所】\\s*([^\\s【]+)"
  breed:
    regex: "収容場所】\\s*\\S+\\s+([^・\\s]+)・"
  sex:
    regex: "(オス|メス)"
  size:
    regex: "(超小型|超小|小型|中型|大型)"
  age:
    regex: "(成猫|子猫|幼猫|老猫)"
# 「いません」文言は無い。実データが無い日はテンプレートのダミーブロック（管理番号 260000-0-0）だけが
# 本文に残る（2026-10-02 の 0 頭の日に確認。1 頭いる日は本文にダミーが無い）ので、これを 0 頭の目印にする。
# 2026-10-04: 常時出ている案内文「…収容している猫の情報を掲載しています」は empty_text から外した
# （構造が変わって行が取れなくなった日も 0 頭に見えて通知が来なくなるため）。
empty_text: ["収容されている動物はいません", "現在収容している猫はいません", "260000-0-0"]
