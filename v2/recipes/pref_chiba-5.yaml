# 千葉県動愛センター東葛飾支所（収容猫）。本所と同一テンプレート。
# 末尾の「テンプレート」ダミーブロックは管理番号 260000-0-0 固定なので row_filter で除外。
# 現時点では実データが無く、ダミーのみ（0 頭）。
rows: "div.col2"
row_filter:
  text_lacks: ["260000-0-0"]
image: "img@src"
fields:
  management_no:
    regex: "管理番号】\\s*([^\\s（(]+)"
  location:
    regex: "収容場所】\\s*([^\\s【]+)"
  breed:
    regex: "収容場所】\\s*\\S+\\s+([^・\\s]+)・"
  sex:
    regex: "(オス|メス)"
  size:
    regex: "(超小型|超小|小型|中型|大型)"
  age:
    regex: "(成猫|子猫|幼猫|老猫)"
empty_text: ["収容されている動物はいません", "現在収容している猫はいません"]
