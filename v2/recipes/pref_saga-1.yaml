# 佐賀県（佐賀市・多久・小城・神埼）保護犬猫 — 佐賀中部保健福祉事務所
# 1 頭 = table.__wys_table 1 つ（縦並び: 先頭セル「保護犬（260920-1）」/ 保護した場所 / 種類 / 毛色 / 性別 / 体格 / 推定年齢 / その他 / 収容日）。
# 犬猫は先頭セルの「保護犬」「保護猫」で決める（見出しは h2/h3 が事務所ごとに揺れるので使わない）。
# 動物がいない欄は値が空の雛形（「現在保護中の動物はいません」）で、写真も番号も無いので自動で落ちる。
rows: "table.__wys_table"
image: "img@src"
fields:
  species: {selector: "td"}
  management_no: {selector: "td", regex: "(\\d{4,}(?:[-‐－–]\\w+)?)"}
  location: {label: "保護した場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  age: {label: "推定年齢"}
  note: {label: "その他"}
  shelter_date: {label: "収容日", regex: "((?:令和|平成)\\s*\\d+\\s*年.*?\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日)"}
species:
  from: field
  map: {"保護犬": dog, "保護猫": cat}
# 0 頭の日の根拠: 犬・猫・その他の 3 つの表に、子がいない表ごとに「現在保護中の犬はいません」「…猫は…」「…動物は…」が入る雛形が出るので、
# 文は犬に子がいる日にも出る（2026-11-28 に子のいる日の保存ページで「現在保護中の動物はいません」に audit_empty が当たった）。empty_text にすると、
# 子がいる日に行の読み方が崩れただけで「本日は 0 頭」と出る（POLICY.md 方針 52）。佐賀県の他の事務所（-2〜-5）と同じく、表の中に写真（img）が
# 1 枚も無いことを 0 頭の根拠にする（Wayback 2025-12-05 の 0 頭の版と 11/28 の子のいる日の実ページで確かめた）。表そのものが無い日は読めなかった扱い。
empty_absent:
  page: "table.__wys_table"
  none: "table.__wys_table img"
