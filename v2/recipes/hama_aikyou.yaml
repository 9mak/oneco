# 浜松市はぴまるの丘（保護犬）: 単一ページ。中央区/浜名区/天竜区の見出しごとに
# 犬情報テーブル（問合せ番号/犬種/性別/毛色/推定年齢/保護日/保護場所）か
# 「現在、○○区で保護された犬はいません。」の告知が入る。
# 引取手続き説明セクションにも無関係な表（受付窓口・提出書類等）があるが、
# 動物とみなす条件（写真 or 管理番号/収容日）を満たさないため自動で除外される。
rows: "table tr"
image: "img@src"
fields:
  management_no: {label: "問合せ番号"}
  breed: {label: "犬種"}
  sex: {label: "性別"}
  color: {label: "毛色"}
  age: {label: "推定年齢"}
  shelter_date: {label: "保護日"}
  location: {label: "保護場所"}
# 0 頭の根拠（W006 T631）: 区ごとの節に 3 つの文があり、1 つでも出るだけでは 0 頭でない（2026-11 は中央区に 1 頭・浜名区と天竜区の文が出ている）。
# 3 つが揃った日だけ 0 頭（Wayback 2025-11-07・2026-02-09 が 3 つとも出ている版）。
empty_text_all:
  - "現在、中央区で保護された犬はいません"
  - "現在、浜名区で保護された犬はいません"
  - "現在、天竜区で保護された犬はいません"
