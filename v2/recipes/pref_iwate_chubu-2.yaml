# 岩手県 中部保健所（花巻保健福祉環境センター）の保護（迷子）情報（kennan/hana_hoken/1013542/1020659.html）。pref_iwate_chubu（譲渡）は索引から follow_all でこのページも開くが、
# rows が h2【譲渡】の節だけなので、迷子の子が載っていなかった。同じ岩手県の保健所（県央 pref_iwate_kennan-2・大船渡 -ofunato-2・宮古 -miyako-2）に合わせ、迷子の節だけを別 slug（kind = stray）で読む。
# 掲載漏れの棚卸しで追加（2026-11-18 W006 T640 3 回目）。2026-11-18 は 4 頭（犬 2・猫 2）。
# 作り: 見出し（1 頭ごとに繰り返される）→ p.imageright（写真。alt は「もとの飼い主を探している猫の写真」で、犬の子（R8-51）にも猫と付くので動物種の欄を使う）→
#   p（管理番号・動物種・収容日・収容場所・収容期限・種類・毛色・性別・推定年齢・識別器具・特記事項を <br> 区切り）。見出しは日で変わる: 今日・2026-02 は h2「犬、猫の保護(迷子）情報」、
#   2022・2024-04 は h2 の次の h3「【保護】もとの飼い主さんを捜しています。」、2025-10 は h2「【保護】もとの飼い主さんを探しています。」（この版は動物種の欄が無く、犬か猫かは決めない）。
#   h2 の前に「岩手県中部保健所動物管理施設で保護している犬、猫は次のとおりです」の案内の p が並ぶ（p.imageright が続かないので行にしない）。
#   行は、見出し（保護・迷子を含む h2 / h3）の次の p.imageright の、次の p。【譲渡】【里親募集】の見出しは当たらない（このページには出ないが、出ても載せない）。写真は直前の p.imageright（前の行まで遡る）。
# 収容期限（R8年11月18日 等。収容日から 2 週間ほど）は note に出す。期限を過ぎた行をページが外すのは掲載元の運用なので、期限で絞らず載っている子を全部読む（宮古・県央・大船渡の迷子と同じ。おまえさん 2026-11-18「古い掲載の年の絞り込みはしない」）。
#   識別器具・特記事項は「なし」を出さない。
# 0 頭の日（Wayback 2020-11・2026-02）は 0 頭の文が出ず、案内の p だけになる（案内の「新しい飼い主さんを探すものではありません」は子のいる日にも出る）。
#   枠（h1 岩手県中部保健所保護動物情報）はあるが、p.imageright（写真）も「管理番号」の p も 1 つも無い日だけ 0 頭にする。見出しの言い回しが変わっても写真か管理番号が残る日は failed で通知される。
rows: "h2:-soup-contains('保護') + p.imageright + p, h3:-soup-contains('保護') + p.imageright + p, h2:-soup-contains('迷子') + p.imageright + p"
image: {selector: "p.imageright img@src", scope: prev_siblings, stop_at: row}
fields:
  management_no: {label: "管理番号"}
  species: {label: "動物種"}
  shelter_date: {label: "収容日"}
  location: {regex: "収容場所[:：]\\s*(.+?)(?=\\s+収容期限[:：]|$)"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  age: {label: "推定年齢"}
  note:
    join:
      - {regex: "収容期限[:：]\\s*(\\S+)", prefix: "収容期限："}
      - {regex: "識別器具[:：]\\s*(?!なし)(.+?)(?=\\s+特記事項[:：]|$)", prefix: "識別器具："}
      - {regex: "特記事項[:：]\\s*(?!なし)(.+)"}
    sep: " "
species:
  from: field
  map: {"猫": cat, "ネコ": cat, "犬": dog, "イヌ": dog}
empty_absent:
  page: "h1:-soup-contains('中部保健所保護動物情報')"
  none: "p.imageright, p:-soup-contains('管理番号')"
