# 2026-10-05 監査: カードの「性格等：」の本文を note に追加（行末まで。性格等は各カードの最後の行）。
# 和歌山市動物愛護管理センター（譲渡候補）: single_page、犬猫混在。
# article#content 内、「飼い主さん募集中の猫」「飼い主さん募集中の犬」の h3 見出しの下に
# div.imglows カードが1頭ずつ（写真 + 仮名/種類/年齢（推定）/性別 を <br> 区切りの1つの<p>に記載）。
# 管理番号・収容日はページに無いため写真の有無だけで動物として通る。

# 2026-11-28 POLICY.md 方針 24（11/28 変更）: 兄弟を写真 1 枚・1 件にまとめた掲載（「仮名：むさし(手前)、あけぼの(奥)」）は分けずに 1 件で載せる（split_names は使わない。#172 で分けたのを戻した）。
rows: "div.imglows"
image: "p.imagecenter img@src"
fields:
  name: {label: "仮名"}
  breed: {label: "種類"}
  age: {label: "年齢（推定）"}
  sex: {label: "性別"}
  note: {regex: "性格等[:：]\\s*(.+)"}   # 性格等は各カードの最後の行（検査等は載せない）
species:
  from: heading
  selector: "h3"
  map: {"猫": cat, "犬": dog}
empty_text: ["現在、保護収容している", "募集中の動物はいません", "新しい飼い主さんを募集している動物はいません"]
