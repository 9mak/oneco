# 和歌山市動物愛護管理センター（譲渡候補）: single_page、犬猫混在。
# article#content 内、「飼い主さん募集中の猫」「飼い主さん募集中の犬」の h3 見出しの下に
# div.imglows カードが1頭ずつ（写真 + 仮名/種類/年齢（推定）/性別 を <br> 区切りの1つの<p>に記載）。
# 管理番号・収容日はページに無いため写真の有無だけで動物として通る。

rows: "div.imglows"
image: "p.imagecenter img@src"
fields:
  name: {label: "仮名"}
  breed: {label: "種類"}
  age: {label: "年齢（推定）"}
  sex: {label: "性別"}
species:
  from: heading
  selector: "h3"
  map: {"猫": cat, "犬": dog}
empty_text: ["現在、保護収容している", "募集中の動物はいません", "新しい飼い主さんを募集している動物はいません"]
