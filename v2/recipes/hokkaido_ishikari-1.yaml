# 北海道 石狩振興局 江別保健所 迷い犬猫と新しい飼い主さん募集情報（/hk/hgc/se/inu-neko-newpage.html）の迷子の節。
# h4「【迷い猫】（保管場所、保護年月日、保護場所、…）」の下に、1 頭ごとに p「振興局3158(江別保健所、令和8年11月2日、当別町、雑種、中、キジトラ、成猫、11月13日、負傷猫）」。
# 先頭の太字が番号。丸括弧の中は見出しの順（保管場所、保護年月日、保護場所、種類推定、性別、体格、毛色、年齢推定、掲載期限）だが、行によって項目が抜ける（上の例は性別が無い）ので
# 項目に割らず括弧の中をそのまま note に載せる。保護年月日は括弧の中の 2 番目（令和…日）。写真は無い（詳細は別ページ）。
# 犬の節は「現在はいません」の p だけ（番号の太字が無いので行にならない）。0 頭の日は犬猫とも「現在はいません」だが、犬の節の「現在はいません」は猫に子のいる日にも出るので、文だけでは 0 頭にしない。
# 0 頭にするのは、【迷い犬】と【迷い猫】それぞれの見出しの直後に「現在はいません」が出た日だけ（empty_text_all。猫に子がいる日は見出しの直後が番号の行になるので成立しない）。
rows: "h4:-soup-contains('迷い') ~ p:has(> strong)"
fields:
  management_no: {selector: "strong"}
  shelter_date: {regex: "[（(][^、]+、(令和[^、]+?日)、"}
  note: {regex: "[（(]([^）)]+)[）)]"}
species:
  from: heading
  selector: "h4"
  map: {"迷い犬": dog, "迷い猫": cat}
empty_text_all:
  - "【迷い犬】 （保管場所、保護年月日、保護場所、種類推定、性別、体格、毛色、年齢推定、掲載期限） 現在はいません"
  - "【迷い猫】 （保管場所、保護年月日、保護場所、種類推定、性別、体格、毛色、年齢推定、掲載期限） 現在はいません"
