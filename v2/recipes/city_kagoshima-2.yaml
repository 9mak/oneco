# 鹿児島市（保護猫）: city_kagoshima-1 と同一テンプレート (URL が neko.html)。
# #tmp_contents 直下に <h2>No.XXXXXX</h2> + 直後の <p> 群 (写真・保護日・毛色・性別等) が並ぶ flat な構造。
# row_until で h2 から次の h2 の手前までを 1 頭にまとめ、項目と写真をその中から取る（2026-10-05 T517）。
# 写真が保護日の p に入っている子と、写真だけの p が先にある子（No.250098）がいるが、どちらもまとめた行の中にある。
# 管理番号は自分の h2 を selector で取る（from: heading だと前の子の h2 を指す）。
# h2 に「飼い主のもとに戻りました」を含むものは返還済みなので除外する。
rows: "#tmp_contents > h2"
row_until: "h2"
row_filter:
  text_has_any: ["No"]
  text_lacks: ["戻りました"]
fields:
  management_no: {selector: "h2", regex: "No\\.?\\s*(\\d+)"}
  shelter_date: {label: "保護日", regex: "(令和\\s*\\d+\\s*年\\s*\\d+\\s*月\\s*\\d+\\s*日)"}
  location: {label: "保護場所"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  color: {label: "毛色"}
  age: {label: "推定年齢"}
  note: {regex: "(首輪[^:：\\s]*[:：]\\s*\\S+)"}
empty_text:
  - "現在、保護猫はいません"
  - "保護している猫はいません"
  - "現在いません"
