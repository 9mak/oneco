# 兵庫県動物愛護センター（収容動物） https://hyogo-douai.sakura.ne.jp/shuuyou.html
# 一覧 shuuyou.html のサマリー表 #sp-table-7 内に本所/三木/龍野/但馬/淡路 × 犬/猫の
# 6セル×2行があり、収容ありのセルだけ hogo*.html への <a> が入る（無いセルはリンク無し）。
# follow_all で全 hogo*.html を辿る。各詳細ページは #content 内に見出し「犬」「猫」(h1.entry-title)
# があり、その直後の div に収容が無ければ空欄のまま、あれば <th>項目名</th><td>値</td> 形式の
# 表が挿入される（HPBの「表を貼り付けてください」という空枠に手動で貼る運用）。表1つ=1頭。
steps:
  - follow_all: "#sp-table-7 td a[href*='hogo']"
rows: "#content table"
image: "img@src"
fields:
  breed: {label: "種類"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  color: {label: "毛色"}
  size: {label: "大きさ"}
  shelter_date: {label: "収容日"}
  location: {label: "収容場所"}
species:
  from: heading
  selector: "h1.entry-title"
  map: {"犬": dog, "猫": cat}
