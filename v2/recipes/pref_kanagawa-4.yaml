# 神奈川県動物愛護センター「当所以外で保護されている動物の情報」。
# HTML本文に一覧は無く、犬/猫/その他 3本の PDF（1頭=表の1行、受付番号・受付日・保護/目撃日・場所・品種・毛色・体格・性別・首輪・特徴）を合算する。
# 写真は掲載されないため management_no（受付番号）と shelter_date（受付日）で動物判定を通す。犬猫の別は PDF ファイル名（dog/cat/others）でなく列の内容からは取れないため、まずは全部 other 扱いで試す。
steps:
  - pdf_links: "a[href$='.pdf']@href"
pdf:
  mode: table
  header_row: 0
fields:
  management_no: {header: "受付番号"}
  shelter_date: {header: "受付日"}
  age: {header: "保護/目撃日"}
  note: {header: "保護/目撃"}
  location: {header: "場所"}
  breed: {header: "品種"}
  color: {header: "毛色"}
  size: {header: "体格"}
  sex: {header: "性別"}
