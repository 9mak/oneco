# 金沢市動物愛護管理センター（収容された犬） — www4.city.kanazawa.lg.jp/soshikikarasagasu/dobutsuaigokanricenter/gyomuannai/1/3/3499.html
# 2026-10-05 T519 新規作成（環境省リンク集のリンク先 .../1/3/index.html の「収容された犬のお知らせ」）。
# 確認済み（2026-10-05・0 頭）: h2「収容中の犬の詳細」の下に「現在収容している犬はいません。」と、項目が空の雛形の表（div.wysiwyg > table: 特徴の p「種類：」「毛色：」… / 保護月日 / 保護場所 / 保護期間 / その他）が残る。
#   雛形は写真も保護月日も無いので動物とみなされず落ちる（empty_text で 0 頭）。
# 未確認: 犬が載った日の作り。同じ金沢市の譲渡ページ（city_kanazawa-5）と同じ「figure.img-item（写真）→ div.wysiwyg > table」の並びと仮定している（写真は表の直前の兄弟）。
#   外れた日は行が取れず、empty_text の文言も消えるので「読めなかった」で通知に出る（0 頭に見せない）。
# 写真（2026-10-07 T519 v-g3）: 表の前の figure.img-item の img（か、2025-01 の猫の譲渡ページのように直前の div.wysiwyg の p > img）から読む。本文冒頭の飾りのイラスト
#   （ファイル名 pet_inu.jpg・pet_doubutu_*.jpg、alt「…のイラスト」）は除く。以前の「前の兄弟の最初の 1 枚」は、前の行が無い 1 頭目で本文冒頭のイラストまで遡り、
#   1 頭目に別の写真（イラスト）を付けた（猫の収容 2024-08 の 1 頭目、犬の譲渡 2024-04 の 1 頭目（city_kanazawa-5））。0 頭の日の空の雛形の表にもこのイラストだけが写真になり、
#   中身が空の「動物 1 頭」が載った（犬の譲渡 2024-08・2024-11。偽の動物）。写真が無い子は写真なしで載る。
# 0 頭の日の文言（2026-10-07 T519 v-g3）: 今日は「現在収容している犬はいません。」、Wayback は「現在、収容している犬は、いません。」（2024-07・2025-01・2025-04）。読点の有無と「収容されて／して」の違いで 0 頭の日が failed になっていた。
#   どれも 0 頭の日だけの文言（動物がいる日は「現在収容中の猫は、こちらです。」）なので、言い換えを全部 empty_text に入れた。
# 2026-10-08 T519 v2-g3: 犬が載った日の作りを Wayback 2024-10 で確認できた（caption「収容中の犬の詳細」の表が本文の直下、写真は表の前の figure）。0 頭の日の文言に「収容中の犬は、いません」も足した。
rows: "div.wysiwyg:has(> table)"
row_filter:
  text_has_any: ["保護月日", "保護場所"]
image: {selector: "figure.img-item img:not([alt*='イラスト']), div.wysiwyg > p > img:not([alt*='イラスト'])@src", exclude: ["/pet_"], scope: prev_siblings, stop_at: row}
fields:
  management_no: {from: heading, selector: "h2, h3", regex: "([A-Z]\\d{7,10})"}
  breed: {selector: "td li:-soup-contains('種類'), td p:-soup-contains('種類')", regex: '種類[:：]\s*(\S.*)'}
  color: {selector: "td li:-soup-contains('毛色'), td p:-soup-contains('毛色')", regex: '毛色[:：]\s*(\S.*)'}
  sex: {selector: "td li:-soup-contains('性別'), td p:-soup-contains('性別')", regex: '性別[:：]\s*(\S.*)'}
  age: {selector: "td li:-soup-contains('年齢'), td p:-soup-contains('年齢')", regex: '年齢[:：]\s*(\S.*)'}
  size: {selector: "td li:-soup-contains('体格'), td p:-soup-contains('体格')", regex: '体格[:：]\s*(\S.*)'}
  shelter_date: {label: "保護月日"}
  location: {label: "保護場所"}
  note: {label: "その他"}
empty_text: ["収容している犬はいません", "収容している犬は、いません", "収容されている犬はいません", "収容中の犬は、いません", "収容中の犬はいません"]
