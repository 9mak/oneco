# いわき市保健所（譲渡動物情報 猫） — city.iwaki.lg.jp/www/contents/1777271747780/index.html
# 2026-10-05 T519 新規作成（環境省リンク集のリンク先「保護動物情報」の親ジャンル「保護動物・譲渡動物情報」から辿った譲渡ページ）。
# 構造は犬ページ（city_iwaki-2）と同じ: h2「新しい飼い主さんを募集しています（猫）」「現在、20頭です。」→ 表（収容日 / 種類 / 毛色 / 性別 / 体格 / 特徴 / 画像）が頭数分。
# 特徴の欄に「（愛称：ぬまっち）」「２～３ヶ月齢（9/18時点）」と、状態の印「●募集中」「●譲渡決定（手続き待ち）」「●譲渡済」が入る。
#   譲渡決定・譲渡済の子は掲載対象でないので捨てる（2026-10-05 時点 20 頭中に両方あった）。「●募集中」と印なしの子は載せる。
# 未確認: 0 頭の日の文言。empty_text は置かない（0 頭の日は「読めなかった」で通知に出る＝安全側）。
# 2026-10-08 T519 v2-g3: 年齢は「２～３ヶ月齢」「推定1~2歳」のほか、生年月日だけの子（せな「R7.6.7生」）も読む。●申込者に案内中・●面会結果待ちの子は譲渡が決まっていないので載せる。
rows: "div.edit-item table"
row_filter:
  text_has_any: ["収容日"]
  text_lacks: ["譲渡済", "譲渡決定"]
image: "img@src"
fields:
  shelter_date: {label: "収容日"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  name: {label: "特徴", regex: "愛称[:：]\\s*([^\\s）)]+)"}
  age: {label: "特徴", regex: "((?:推定)?\\d+(?:[～~〜]\\d+)?(?:ヶ月齢|か月齢|歳)|R\\d+\\.\\d+\\.\\d+生(?:まれ)?)"}   # 生年月日だけの子（せな「R7.6.7生」）も
  note: {label: "特徴"}
