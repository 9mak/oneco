# 東大阪市動物指導センター 新しい飼い主を探している犬たち（0000008118.html）。保護収容動物（city_higashiosaka）とは別のページ。
# ページには 3 つの節がある: 「新しい飼い主を募集中の犬(動物指導センター)」「新しい飼い主を募集中の犬(譲渡ボランティア)」（どちらもセンターが保護・収容した犬）と、
# 「犬の出会い広場(ゆずりたい犬の一覧)」（市民間の仲介。載せない）。仕様は 1 つ目の節だけだったが、2 つ目も同じセンターの犬なので読む。
# 個体は div.mol_imageblock。写真の alt が節ごとに違い、センター・ボランティアは「譲渡対象犬の画像です。」、出会い広場は「ゆずりたい犬の画像です。」。
# 1 頭が 2 ブロックに分かれることがある（1 つ目に写真・個体番号・種類・性別・毛色・体格・年齢、2 つ目に 2 枚目の写真・性格・備考）ので「個体番号」を含むブロックだけを 1 頭にする（2 つ目の性格は取れない）。
# 子がいる日の版は Wayback に見つからない（2023-06〜2026-05 の 5 版はセンター・ボランティアとも 0 頭）。今日のページに、個体のブロックが HTML コメントの中に残っているので、その作りに合わせた
# （コメントを外した版でテストしている）。0 頭の日は節ごとに「現在、譲渡対象犬の情報はありません」「現在、ボランティア犬の情報はありません」が出る。
# 2 つとも出た日だけ 0 頭（empty_text_all。片方でも欠ければ読めなかった扱い）。
rows: "div.mol_imageblock:has(img[alt*='譲渡対象犬'])"
row_filter:
  text_has_any: ["個体番号"]
image: "img@src"
fields:
  management_no: {regex: "個体番号[:：]\\s*(\\S+)"}
  breed: {regex: "種類[:：]\\s*(\\S+)"}
  sex: {regex: "性別[:：]\\s*(\\S+)"}
  color: {regex: "毛色[:：]\\s*(\\S+)"}
  size: {regex: "体格[:：]\\s*(\\S+)"}
  age: {regex: "年(?:齢|令)[:：]\\s*(\\S+)"}
  note: {regex: "性格[:：]\\s*(.+?)(?:\\s*備考[:：]|$)"}
empty_text_all:
  - "現在、譲渡対象犬の情報はありません"
  - "現在、ボランティア犬の情報はありません"
