# 熊本県動愛 保健所・センターからの保護犬情報（type_id:3 animal_id:1）。迷子でも譲渡対象でもないが、保健所やセンターで保護されている犬。
# 迷子犬（-7）・センター譲渡犬（-1）と同じテンプレート。一覧 ul.list-4col li = 1 頭で収容日・種類・性別・個体管理ナンバー・保健所・電話番号が全て揃う。
# 20 件ずつのページ送りがある（2026-11-17 は 28 件で 2 ページ）。
# 0 頭の日は「0件中 0～0件目を表示」（Wayback 2025-04）。子のいる日（Wayback 2026-02・2026-11-17）には出ない。
steps:
  - paginate: ".paging .next a@href"
rows: "ul.list-4col li"
image: "img@src"
fields:
  shelter_date: {label: "収容日", regex: "(\\d{4}年\\d{1,2}月\\d{1,2}日)"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  management_no: {label: "個体管理ナンバー"}
  location: {selector: "dt:-soup-contains('保健所') + dd"}
  phone: {label: "電話番号", regex: "(0\\d{1,4}-\\d{1,4}-\\d{3,4})"}   # 子ごとの収容先（保健所）の電話
  detail: {selector: "a", attr: "href"}
empty_text: ["0件中 0～0件目を表示"]
