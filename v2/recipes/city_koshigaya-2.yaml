# 越谷市（保護猫）: city_koshigaya-1（保護犬）と同一テンプレート。
# 2026-10-05 監査: 動物の表（種類・性別・年齢・毛色・体格・備考）が取れていなかったのを、h3.partsstyle_h3（管理番号「R8-52」）を行の始まりにして
# row_until で次の h3 か h2.partsstyle_h2 までを 1 頭分に束ね、場所の表と動物の表の両方を label で読むようにして解決した。
# 構造: h3.partsstyle_h3（管理番号）→ 写真代わりの例示 img（yourei。実写真ではないので image は取らない）→
# 「収容場所/収容日/収容期限」の場所テーブル → 「種類/性別/年齢/毛色/体格/備考」の動物テーブル（動物ごとに繰り返す）。
# CMS のマークアップが壊れていて、データ行が <tbody> ではなく <thead> の 2 行目に入っている（label は次の行の同じ列で読める）。
# 0 頭時は本文に「現在、情報はありません。」と出る。

rows: "div#tmp_honbun h3.partsstyle_h3"
row_until: "h2.partsstyle_h2"
image: {selector: "img@src", exclude: ["youreidoubutu"]}   # 実写真が無いと例示イラストが載る。取らない（取ると写真 URL が ID の元になり ID も変わる）
fields:
  management_no: {selector: "h3.partsstyle_h3"}   # 自分の見出し「R8-51」。同日同所の子が同じ ID に潰れていた（2026-10-02 監査）
  location: {label: "収容場所"}
  shelter_date: {label: "収容日"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  color: {label: "毛色"}
  size: {label: "体格"}
  note: {label: "備考"}
empty_text:
  - "現在、情報はありません。"
