# 宇都宮市（迷子犬・負傷猫）: single_page。div#voice 配下に「迷子犬（掲載期限 …）」
# 「負傷猫（掲載期限 …）」の h2 が並び、続く <p> 群にラベル+全角スペース+値で
# 収容日・収容場所・種類・毛色・性別・体格・装着物が入る（1頭=1見出し+後続p群）。
# 種別(犬/猫)は h2 のテキストから判定。0件時は「現在収容中の犬/猫はいません」。
rows: "div#voice h2"
row_filter:
  text_has_any: ["掲載期限"]

# 注意: 収容日等の値は h2 の「兄弟」の <p> にあり、h2 自身の子孫ではない
# （<h2>迷子犬（掲載期限…）</h2><p>収容日　令和8年5月13日</p> …）。
# このエンジンの fields.label は row 要素の子孫しか見ないため、実際に動物が
# 掲載された状態で値が正しく拾えるかは未検証（2026-09-29 現在は 0 件で確認不能）。
# 次に動物が出た時点で show の捨てた理由・取れた値を必ず確認して直すこと。
fields:
  shelter_date: {label: "収容日"}
  location: {label: "収容場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}

species:
  from: text
  map: {"犬": dog, "猫": cat}

empty_text:
  - "現在収容中の犬はいません"
  - "現在収容中の猫はいません"
