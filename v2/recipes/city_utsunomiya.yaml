# 宇都宮市（迷子犬・負傷猫）: single_page。div#voice 配下に「迷子犬（掲載期限 …）」
# 「負傷猫（掲載期限 …）」の h2 が並び、続く <p> 群にラベル+全角スペース+値で
# 収容日・収容場所・種類・毛色・性別・体格・装着物が入る（1頭=1見出し+後続p群）。
# 種別(犬/猫)は h2 のテキストから判定。0件時は「現在収容中の犬/猫はいません」。
rows: "div#voice h2"
# 2026-11-13: 初めて子が載った日（迷子犬 1・負傷猫 1）に作りを確かめた。h2 の後ろに写真の p.imageright と
# 「収容日　　令和8年…」のような 1 項目 1 段落の p が平らに並ぶ（h2 の子孫ではない）。次の h2 の手前までを 1 頭にまとめる。
row_until: "h2"
row_filter:
  text_has_any: ["掲載期限"]   # 子の見出しは「迷子犬（掲載期限…）」。下の「栃木県動物愛護指導センター」等の h2 はここで落ちる
image: "img@src"
fields:
  shelter_date: {selector: "p:-soup-contains('収容日')", regex: "収容日\\s*(.+)"}
  location: {selector: "p:-soup-contains('収容場所')", regex: "収容場所\\s*(.+)"}
  breed: {selector: "p:-soup-contains('種類')", regex: "種類\\s*(.+)"}
  color: {selector: "p:-soup-contains('毛色')", regex: "毛色\\s*(.+)"}
  sex: {selector: "p:-soup-contains('性別')", regex: "性別\\s*(.+)"}
  size: {selector: "p:-soup-contains('体格')", regex: "体格\\s*(.+)"}
  note: {selector: "p:-soup-contains('装着物')", regex: "装着物\\s*(?!なし\\s*$)(\\S.*)"}   # 首輪など（「なし」は載せない）

species:
  from: text
  map: {"犬": dog, "猫": cat}

empty_text:
  - "現在収容中の犬はいません"
  - "現在収容中の猫はいません"
