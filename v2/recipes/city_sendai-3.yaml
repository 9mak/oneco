# 仙台市アニパル 譲渡子猫情報（2026-08 リニューアル後の一覧表レイアウト）。
# table.datatable 1つ、ヘッダ行「管理番号/写真/性別/毛色/コメント」+ 1頭=1行。
# 写真は同じ行の td 内にあるため image はそのまま row 内から取れる。
rows: "table.datatable tr"
image: "img@src"
fields:
  management_no: {selector: "td:nth-of-type(1)"}
  sex: {selector: "td:nth-of-type(3)"}
  color: {selector: "td:nth-of-type(4)"}
  note: {selector: "td:nth-of-type(5)"}
empty_text:
  - "現在、譲渡可能な子猫はいません"
  - "現在譲渡可能な子猫はいません"
  - "現在、子猫はいません"
