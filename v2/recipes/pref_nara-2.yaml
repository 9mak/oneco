# 奈良県 中和保健所動物愛護センター 譲渡候補犬。h2（犬の名前）+ p（写真 1〜2 枚）+ p（【名前】【犬種】【性別】【毛色】【生年月日】【体重】【メッセージ】…）が 1 頭。
# 募集中・2 次募集中のバナー画像（dog1jibosyu.png・dog2jibosyu.png）は h6 や各頭の最後の p にあるので、写真は alt が「…のページ」「…1」の最初の 1 枚でなく、バナー名を除外して取る。
# 段の区切りは h2 の前の p に置かれたバナー画像（alt「1次募集中」「2次募集中」「マッチング中」「新しい飼い主が決まりました！」）。猫の -3 と同じく、
# マッチング中（相性確認が進んでいて新たな申し込みは受けない）以降の段は載せない。2026-10-07 は 2次募集中 3 頭（ジュノ・ドラ美・ズーマー）の次の
# 「マッチング中」バナーの下にラッタッタがいて、10/5 の版では 4 頭とも読んでいた（マッチング中の子を募集中として載せていた）。
# 2026-10-07 に奈良県のサイトは www.pref.nara.jp から www.pref.nara.lg.jp/n070/ に移っており、旧ドメインは証明書が失効したまま 301 で飛ばすだけ。台帳の URL を新ドメインにして recipe に戻した。
rows: "#tmp_contents h2:not(:is(p:has(img[alt='マッチング中']), p:has(img[alt*='決まりました'])) ~ h2)"
row_until: "h2"
row_filter:
  text_has_any: ["【名前】"]
image: {selector: "img@src", exclude: ["jibosyu", "matching"]}
fields:
  name: {regex: "【名前】\\s*(\\S+)"}
  breed: {regex: "【犬種】\\s*(\\S+)"}
  sex: {regex: "【性別】\\s*(\\S+)"}
  color: {regex: "【毛色】\\s*(\\S+)"}
  age: {regex: "【生年月日】\\s*([^【]+?)\\s*(?=【|$)"}
  size: {regex: "【体重】\\s*(\\S+)"}
  note: {regex: "【メッセージ】\\s*(.+?)\\s*(?=【|$)"}
