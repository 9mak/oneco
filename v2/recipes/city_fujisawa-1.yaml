# 藤沢市（収容犬）: 「ペットの迷子について」ページの h2「藤沢市の収容犬情報」の節。動物が載った日の作りは職員の手書きで毎回変わる（Wayback 2019〜2022 の 7 版で 6 通りを確認）:
#   2019-12 <p><strong>収容犬<img></strong></p> + <p>収容日：…<br>…</p>（写真は見出しの p）／ 2020-04 <p><strong>収容犬</strong></p> + <p>収容日：…<img><br>…</p>／
#   2020-09・11 <p><strong>収容犬1<img></strong>収容日：9月24日<br>引取期限：…<br>収容場所：…<br>種類：…<br>毛色：…<br>性別：…<br>体格：…<br>首輪：…</p>、2 頭目以降は hr で区切った裸の文字（6 頭）／
#   2020-12 表（1 行 2 列。収容日…は左、写真は右）／ 2021-01 <strong>収容犬<img></strong> + <p>収容日：…</p>／ 2022-08 <p><font><b>収容犬</b></font></p> + <p>収容日：…<img>…</p>。
# そこで見出しでなく、どの作りにもある「収容日：」を起点にする: 「収容日：」の p・表、hr の次の strong（2 頭目以降の裸の文字）。写真は行の中、無ければ直前の兄弟（次の行まで）から取る。公示の掲示板案内図（000148492.jpg）は写真にしない。
# 0 頭の日は「現在、収容犬はありません。」（2016〜2023）「【現在、収容犬はありません】」（2024〜2026。この strong は収容日が無いので行にならない）。
# 収容日は「9月24日」と年が無い（そのまま載せる）。名前は「収容犬1」（裸の文字の作りだけ。他は無名）。写真のファイル名は日が変わっても使い回される（hpdog.jpg）ので ID も同じになりうる。
# 2023 年以降に動物が載った日の保存ページは Wayback に無く、新しい作りでは未確認（読めない作りの日は「読めなかった」通知）。
rows: "#tmp_contents p:-soup-contains('収容日：'), #tmp_contents hr:has(+ strong), #tmp_contents table:-soup-contains('収容日：')"
row_until: "hr, h2, h3, p, ul"
row_filter:
  text_has_any: ["収容日：", "収容日:"]
image: {selector: "img@src", scope: self_or_prev_siblings, stop_at: row, exclude: ["000148492"]}
fields:
  name: {regex: "(収容犬\\s*\\d+)"}
  shelter_date: {regex: "収容日[:：]\\s*(\\S+)"}
  location: {regex: "収容場所[:：]\\s*(\\S+)"}
  breed: {regex: "種類[:：]\\s*(\\S+)"}
  color: {regex: "毛色[:：]\\s*(\\S+)"}
  sex: {regex: "性別[:：]\\s*(\\S+)"}
  size: {regex: "体格[:：]\\s*(\\S+)"}
  note: {regex: "(首輪[:：]\\s*\\S+)"}
empty_text:
  - "現在、収容犬はありません"
  - "現在収容犬はありません"
