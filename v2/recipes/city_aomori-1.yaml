# 青森市保健所 新しい飼い主さんを募集中の動物たち — city.aomori.aomori.jp（2026-10-05 T519 環境省リンク集から追加。2026-10-07 T519v で Wayback 3 版に当てて直した）
# 構造: h2「犬」「猫」「犬猫以外の動物」の下に h3（青森市保健所からの譲渡 / ワンニャン里親探しポスト）があり、
#   動物は div.img3lows > ul > li.imglows 1 つ = 1 頭（写真 img + p「R8-47「ベル」<br>MIX、キジトラ白、メス<br>令和8年8月生まれ」）。
#   span.imgtitle に管理番号と名前。「詳細情報」は PNG の個体シート(個体ページではないので detail にしない)。
# 版による違い（Wayback 2025-11・2026-02・2026-05 で確認）:
#   - ワンニャン里親探しポストの子は名前が無く span.imgtitle が「R7-207」だけ（「」が無い）。管理番号・品種・毛色は「」の有無に依らず読む
#   - 「R07-62「ツナ」 ※体調不良のため、譲渡お見合い中止 MIX、…」のように名前と品種の間に ※ の注記が入る子がいる（note に取る）
#   - 犬・猫の節が丸ごと空の日は h3 が付かず「犬 現在、募集中の動物はいません。」（2026-05 の犬）
# 種別は直近の h2（h3 は見ない）。「犬猫以外の動物」は犬・猫の語を両方含むので map の先頭に置く。
# 「🐾新しい飼い主さんが決まりました。」の子は掲載が終わっているので text_lacks で落とす（2026-10-05 は 5 頭中 4 頭がこれ）。
rows: "div.img3lows li.imglows"
row_filter:
  text_lacks: ["決まりました"]
image: "img@src"
fields:
  management_no: {selector: "span.imgtitle", regex: "^([^\\s「]+)"}
  name: {selector: "span.imgtitle", regex: "「(.+?)」"}
  breed: {regex: "([^、\\s]+)、[^、\\s]+、(?:オス|メス|不明)"}
  color: {regex: "[^、\\s]+、([^、\\s]+)、(?:オス|メス|不明)"}
  sex: {regex: "[^、\\s]+、[^、\\s]+、(オス|メス|不明)"}
  age: {regex: "(\\S*生まれ)"}
  note: {regex: "(※\\S+)"}
species:
  from: heading
  selector: "h2"
  map: {"犬猫以外": other, "猫": cat, "犬": dog}
# 0 頭の日の文言。猫の節が空のときの文言だけを使う（犬の節が空なだけの日に 0 頭と誤判定しない）。
# 節が丸ごと空だと h3 が付かない版（2026-05）があるので、h3 ありと無しの 2 通り。
empty_text:
  - "猫 青森市保健所からの譲渡 現在、募集中の動物はいません"
  - "猫 現在、募集中の動物はいません"
