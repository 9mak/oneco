# 西讃保健福祉事務所（収容動物・迷子収容）
# 2026-10-05 監査: 引取り場所の見出しが抜けた行の場所（収容日時の次の行）と、「2～3カ月」のように齢の付かない月齢を取る。
# 一覧 HTML には PDF リンクが 1 本（/documents/6282/<日付>.pdf。ファイル名は日次で変わる、6282 はページ ID）。
# PDF は 1 頭 = 写真＋表のカード。pdfplumber の表は崩れるので文字列で「管理番号 NNNNNNN」行ごとに切る。
# 犬猫は「動物の種類 猫」の値で決める（1 PDF に犬猫混在）。写真は PDF 内なので取れない（管理番号で通す）。
# 収容が無い日は PDF リンク自体が消え「現在、収容動物情報はありません。」になる（小豆で確認）。
steps:
  - pdf_links: "a[href*='/documents/6282/'][href$='.pdf']"
pdf:
  mode: text
rows_regex: "^(?:個体)?管理番号\\s*\\d+.*$"
fields:
  management_no: {regex: "(?:個体)?管理番号\\s*(\\d+)"}
  shelter_date: {regex: "収容日時\\s*(令和\\s*\\d+\\s*年\\s*\\d+\\s*月\\s*\\d+\\s*日)"}
  species: {regex: "動物の種類[ \\t]+(\\S+)"}
  breed: {regex: "動物の種類[ \\t]+\\S+[ \\t]+種類[ \\t]+(?!\\d)(\\S+)"}
  age: {regex: "種類[ \\t]+\\S+[ \\t]+(\\d\\S*(?:齢|歳|才|か月|カ月|ヶ月|月)\\S*)"}   # 「2～3カ月」のように齢の付かない月齢も取る
  color: {regex: "毛色[ \\t]+(?!性別)(\\S+)"}
  sex: {regex: "性別[ \\t]+(?!体格)(\\S+)"}
  size: {regex: "体格[ \\t]+(\\S+)"}
  location: {regex: "収容日時[^\\n]*\\n(?:引取り場所[ \\t]+)?([^\\n]+)"}   # 収容日時の次の行。「引取り場所」の見出しが抜けた行（2630257「まんのう町 新目」）も取る
  note: {regex: "備考[ \\t]*([^\\n]*)"}
species:
  from: field
empty_text: ["現在、収容動物情報はありません", "収容動物情報はありません"]
