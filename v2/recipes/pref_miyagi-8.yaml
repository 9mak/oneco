# 宮城県動物愛護センター 譲渡対象犬（doubutuaigo/jyoto-inu-syokai.html）。
# 譲渡猫（pref_miyagi-7）と同じ作り: h4「ID:12810【クッキー】」→ h5「オス（未去勢）／11歳」→ p（写真）→ ul（フィラリア・性格）が平らに並ぶ。
# 見出しは日によって違った（Wayback 2023-03 は 1 頭ごとの見出しが h3「ID:16341　ムック」で節の見出しは h2、2026 年は h4）。
# 1 頭の見出し（h3 で ID: を含むもの、または h4）を始まりにして、次の h2・h3・h4 の手前までをまとめる（row_until）。「■成犬」の見出し（h3 か p）は 1 頭の外。
# 2020 年以前は表の作り（ID と呼称・写真・犬種・性別・年齢等）で、この読み方では読めない。
# 2026-10-07 時点: 2 頭（クッキー・ごん）を実ページで確認。Wayback 2026-01〜2026-08 の 3 版（3・4・2 頭）と 2023-03 の h3 の作りを確認。
# 0 頭の日の文言は日で違い（2019「現在ご紹介可能な譲渡対象犬はおりません。」、2021 はページの題が「譲渡対象犬（現在おりません）」）、今の作りの 0 頭の日は保存に無く未確認
# （外れると「読めなかった」の通知になるだけで安全側）。
rows: "h4, h3:-soup-contains('ID:')"
row_until: "h2, h3, h4"
fields:
  management_no: {selector: "h3, h4", regex: "I?D[:：]\\s*(\\d+)"}
  name:
    join:
      - {selector: "h3, h4", regex: "【([^】]+)】"}
      - {selector: "h3", regex: "ID[:：]\\s*\\d+\\s+(\\S+)"}
  sex: {selector: "h5", regex: "^(オス|メス)"}
  age: {selector: "h5", regex: "／(.+)$"}
  note: {selector: "ul"}
image: {selector: "p img@src"}
empty_text:
  - "現在、譲渡対象の犬はいません"
  - "譲渡対象犬はいません"
  - "譲渡対象犬はおりません"
  - "譲渡対象犬（現在おりません）"
