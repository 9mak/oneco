# 秋田市 「犬・猫の譲渡制度」に登録されている動物のご案内（pet/1005363/1012582.html）。秋田市保健所の譲渡制度に登録された犬猫。台帳の city_akita-1〜3（公示・迷子・市民保護）とは別のページ。
# 掲載漏れの棚卸し（2026-11-18 W006 T640 3 回目）。2026-11-18 は犬 0・猫 5。「犬・ねこの飼い主紹介制度」（1012580。飼い主からの譲渡）は別のページで載せない。
# 作り: h2「新しい飼い主を募集している犬」「…猫」（節の見出し。下に「現在、秋田市保健所の譲渡制度に登録されている犬／猫は N匹です／はいません。」の p）→ 1 頭ごとに
#   h2「F027」（管理番号）→ p.imagecenter（写真）→ ul（種類・性別・月齢または年齢・体重・感染症対策・血液検査・収容の経緯・ひとこと）→（動画のリンクの ul.objectlink）。
#   h2 を 1 頭の始まりにし、次の h2 の手前までを 1 頭分にまとめる。種類の項目（「種類：」）が無い h2（節の見出し・メニュー・ご感想）は動物にしない。
#   犬猫は行より前にある直近の節の見出し（新しい飼い主を募集している犬／猫）で決める。
# 0 頭: 犬の節の「現在、…登録されている犬はいません。」は猫がいる日にも出る。両方の節の文（犬・猫）がそろった日だけ 0 頭（empty_text_all。猫の文が無い・猫の節の作りが変わった日は failed で通知）。
#   Wayback 2026-03 に犬猫とも「現在、秋田市保健所の譲渡制度に登録されている犬／猫はいません。」の 0 頭の日がある（猫のいる日 2025-11・2026-11 には猫の文が出ない）。2020-05 の 0 頭の日は書き方が古く（「…犬は0頭です」）当たらない。
# 作りは日で変わる: 2021-04・2023-03・2025-11 は動物の見出しが h3、欄が「雑種、オス、推定2カ月齢（令和7年10月）」のようにラベルの無い並び。今のレシピ（h2＋「種類：」のラベル）では 1 頭も読めず、猫が載っているので 0 頭とは言わず failed で通知される。
rows: "h2"
row_until: "h2"
row_filter:
  text_has_any: ["種類："]
image: "p.imagecenter img@src"
fields:
  management_no: {selector: "h2", regex: "^\\s*([A-Za-z]\\d+)\\s*$"}
  breed: {regex: "種類[:：]\\s*(\\S+)"}
  sex: {regex: "性別[:：]\\s*(\\S+)"}
  age: {regex: "(?:月齢|年齢)[:：]\\s*(\\S+)"}
  note:
    join:
      - {regex: "体重[:：]\\s*(\\S+)", prefix: "体重："}
      - {selector: "ul:not(.objectlink)", regex: "血液検査[^:：]*[:：]\\s*(?:猫エイズ・猫白血病[:：]\\s*)?(\\S+)", prefix: "血液検査（猫エイズ・猫白血病）："}
      - {selector: "ul:not(.objectlink)", regex: "血液検査[^:：]*[:：]\\s*(?:猫エイズ・猫白血病[:：]\\s*)?\\S+\\s+(.+)$"}
    sep: " "
species:
  from: heading
  selector: "h2:-soup-contains('新しい飼い主を募集している')"
  map: {"犬": dog, "猫": cat}
empty_text_all:
  - "現在、秋田市保健所の譲渡制度に登録されている犬はいません"
  - "現在、秋田市保健所の譲渡制度に登録されている猫はいません"
