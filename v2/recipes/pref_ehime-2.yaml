# 愛媛県動物愛護センター（譲渡予定）
# h2「猫」「犬」の下に class 無しの table が 1 つずつ。th 行がセクション見出し（愛護棟ホールにいる子猫・成猫 等）、
# td 行が 1 頭（写真 + 「愛　称：／性　別：／毛　色：／体　重：／推定年齢：／コメント：」を <br> 区切り、ラベル内に全角空白）。
# 犬猫は直前の h2 で決める。class="datatable" の表は案内文なので除く。
# 2026-10-04: 年齢欄に説明文が続くマロンの age が「推定3歳前後の男の子」になり note が空だったので、age を「の」で切り、
# 続きを note に入れた。室内の成犬は別ページ (page/145257) にだけ載っているので pref_ehime-3 を新設。
rows: "div.detail_free table:not(.datatable) tr"
row_filter:
  text_has_any: ["別：", "別:", "コメント"]     # セクション見出し行（th）を除く
image: "img@src"
fields:
  name: {regex: "愛[\\s\\u200b]*称[:：]\\s*(\\S+)"}
  sex: {regex: "性[\\s\\u200b]*別[:：]\\s*(\\S+)"}
  age: {regex: "年[\\s\\u200b]*齢[:：]\\s*([^\\s。の]+)"}   # 「推定年齢：推定3歳前後の男の子。ワイヤー…」のように説明文が続く行があるので「の」で切る
  color: {regex: "毛[\\s\\u200b]*色[:：]\\s*(\\S+)"}
  size: {regex: "体[\\s\\u200b]*重[:：]\\s*(\\S+)"}
  note: {regex: "(?:コメント[:：]|年[\\s\\u200b]*齢[:：]\\s*[^\\s。]*。)\\s*([^\\u200b]+)"}   # コメント欄が無く、年齢欄に「〜の男の子。」と説明が続く行（マロン）はその続きを note に
species:
  from: heading
  selector: "h2"
  map: {"猫": cat, "犬": dog}
empty_text: ["現在、おりません"]
