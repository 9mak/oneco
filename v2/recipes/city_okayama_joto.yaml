# 岡山市 譲渡犬情報一覧（0000016441）・譲渡猫情報一覧（0000016404）。city_okayama-2（犬）と city_okayama-3（猫）で共用する（犬猫は台帳の species で決まる）。
# 掲載漏れの棚卸し（2026-11-18 W006 T640 3 回目）。台帳の city_okayama は保護動物（迷子）の個別記事を辿るので別のページ。
# 作り: h3「1D2026067(ちゃこ君)」（個体番号と名前）→ 名前(仮)・種類・性別・月齢などの欄（div.mol_textblock。お声かかり中の子は写真のブロックの中）→ 写真のブロック（div.mol_imageblock）。
#   h2 は節の区切り（「以下、譲渡に条件がある犬達です。」「ZOOねるパークにいる犬たち」「…他の施設で訓練中です。」）で、どの節の子も譲渡の対象なので全部読む。
#   h3 を 1 頭の始まりにし、次の h2・h3・h4 の手前までを 1 頭分にまとめる（2025-12 の版は、決まった子の見出しを h4 で最後の子の後ろに並べていた。h4 で止めないと最後の子が「譲渡が決まりました」の行に混ざり落ちる）。見出しの前に写真の無い a.anchor（clearspacer.gif）が付くが、写真は div.mol_imageblock_img の中だけから取る。
# 譲渡が決まった子は見出し「…、譲渡が決まりました。ありがとうございました。」だけで中身が無い（名前の欄が無いので落ちる。text_lacks は念のため）。
# 「お声かかり中です」（申し込みが入っている子。見出しに付く）は、トライアル中と同じく載せて note に出す。
# 年齢の欄の名前は「月齢」（子犬・子猫）と「年齢」。体重・フィラリア検査（陽性（治療中）等）があれば note に出す。
# 0 頭: 猫は「現在、譲渡対象の猫はいません。」（Wayback 2025-04 の h3）・「現在、譲渡対象猫はいません。」（2025-08 の h2）・「現在譲渡者募集中の猫はいません。」（2024-02 の本文）が 0 頭の日にだけ出る
#   （子のいる日の版 2023-03・2026-11 には出ない）。犬の 0 頭の日の版は Wayback に無い（保存の 6 版 2021-02〜2025-12 はどれも子がいる日）ので文言は分からず、枠（h1 譲渡犬情報一覧・譲渡猫情報一覧）はあるが
#   動物の見出し（名前を括弧で書く h3）も「名前(仮)」の欄も写真も無い日だけ 0 頭にする（猫の文は犬のページには出ないので共用しても犬の判定には効かない）。
#   2023-03 の猫の作り（動物が h2 の見出しと写真だけ）は写真が残るので 0 頭とは言わず failed で通知される。
rows: "#mol_contents h3"
row_until: "h2, h3, h4"
row_filter:
  text_has_any: ["名前(仮)", "名前（仮）"]
  text_lacks: ["譲渡が決まりました"]
image: "div.mol_imageblock_img img@src"
fields:
  management_no: {selector: "h3", regex: "^\\s*([0-9A-Za-z]+)"}
  name: {regex: "名前[（(]仮[）)][:：]\\s*(\\S+)"}
  breed: {regex: "種類[:：]\\s*(\\S+)"}
  sex: {regex: "性別[:：]\\s*(\\S+)"}
  age: {regex: "(?:月齢|年齢)[:：]\\s*(\\S+)"}
  color: {regex: "毛色[:：]\\s*(\\S+)"}
  note:
    join:
      - {selector: "h3", regex: "(お声かかり中)"}
      - {regex: "(体重[:：]\\s*\\S+)"}
      - {regex: "(フィラリア\\S*[:：]\\s*\\S+)"}
    sep: "。"
empty_text:
  - "現在、譲渡対象の猫はいません"
  - "現在、譲渡対象猫はいません"
  - "現在譲渡者募集中の猫はいません"
empty_absent:
  page: "div.main_naka_h1 h1:-soup-contains('譲渡犬情報一覧'), div.main_naka_h1 h1:-soup-contains('譲渡猫情報一覧')"
  none: "#mol_contents h3:-soup-contains('('), #mol_contents h3:-soup-contains('（'), #mol_contents div.mol_imageblock_img img, #mol_contents :-soup-contains-own('名前(仮)'), #mol_contents :-soup-contains-own('名前（仮）')"
