# 千葉市（迷子犬）。div#contents_editable の直下に h4（管理番号 26093001）→ p 写真（無い子もいる）→
# p（収容日：…<br>告示（掲載）期限：…<br>収容場所：…<br>種類：…<br>毛色：…<br>性別：…<br>体格：…<br>特徴：…）が平らに並ぶ
# （迷子系＝項目が 1 つの p に <br> 区切りでまとまる。保護系の city_chiba-4/-5/-6 は項目ごとに別の p）。
# h4 を 1 頭の始まりにし、row_until で「このページのご利用について」の h2（次の h4 の手前でも自動で止まる）までをまとめる（T518）。
# 管理番号は始まりの h4 自身（selector: h4）。
# 項目は <br> 区切りなので文字にすると空白でつながる。空白を含みうる値（場所・種類・毛色）は label（最初の空白までの 1 語）でなく、
# 次の「項目名：」の手前まで regex で取る（値が空の「毛色：」で次の「性別：オス」を拾わないよう、値が項目名で始まるときは取らない）。
# 特徴は p の最後なので行末まで。
# 0 頭の日の書き方は 3 通り見ている: 「現在迷い犬の情報はございません」（2026-09-29）、h4「現在、対象の動物はいません。」＋空の雛形
# （Wayback 2025-07-30。雛形の h4 は行になるが、管理番号も収容日も無いので捨てる）、h3「現在、迷い犬の情報はありません。」（Wayback 2025-11-10）。
# 2026-10-05 時点 1 頭（26093001、写真あり）。
rows: "div#contents_editable > h4"
row_until: "h2"
# 写真は本文の p 直下の img だけ（a の中の img は子猫の育成ボランティア等のバナー。Wayback 27 ページで確認。
# 既定の img@src だと、写真の無い最後の子や 0 頭の日の雛形にバナーが付く。2026-10-05 公開前レビュー）
image: "p > img@src"
row_filter:
  text_has_any: ["収容日"]
fields:
  management_no: {selector: "h4"}
  shelter_date: {label: "収容日"}
  location: {selector: "p:-soup-contains('収容場所')", regex: "収容場所[:：]\\s*(?=\\S)(?![^\\s\\d:：]{1,8}[:：])(.+?)(?=\\s+(?![A-Za-zＡ-Ｚａ-ｚ])[^\\s\\d:：]{1,8}[:：]|$)"}
  breed: {selector: "p:-soup-contains('種類')", regex: "種類[:：]\\s*(?=\\S)(?![^\\s\\d:：]{1,8}[:：])(.+?)(?=\\s+(?![A-Za-zＡ-Ｚａ-ｚ])[^\\s\\d:：]{1,8}[:：]|$)"}
  color: {selector: "p:-soup-contains('毛色')", regex: "毛色[:：]\\s*(?=\\S)(?![^\\s\\d:：]{1,8}[:：])(.+?)(?=\\s+(?![A-Za-zＡ-Ｚａ-ｚ])[^\\s\\d:：]{1,8}[:：]|$)"}
  sex: {label: "性別"}
  size: {label: "体格"}
  note: {selector: "p:-soup-contains('特徴')", regex: "特徴[:：]\\s*(.+)"}
empty_text:
  - "現在迷い犬の情報はございません"
  - "現在、対象の動物はいません"
  - "現在、迷い犬の情報はありません"
  - "現在、対象となる動物はいません"
  - "現在、迷い犬の収容はありません"
