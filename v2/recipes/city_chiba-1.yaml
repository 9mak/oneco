# 千葉市（迷子犬）。#contents_editable に <h4>管理番号</h4><p>収容日：...<br>告示（掲載）期限：...<br>
# 収容場所：...<br>種類：...<br>毛色：...<br>性別：...<br>体格：...<br>特徴：...</p> が動物ごとに並ぶ（迷子系＝
# ラベル全部が1個の<p>に<br>区切りでまとまる）。管理番号(h4)は属性pの前方兄弟でこのエンジンからは届かないため
# row は属性p自体にし、収容日で動物と判定する（迷子系は写真が無いことも多い）。
# 2026-09-29時点0頭「現在迷い犬の情報はございません」。
rows: "p:-soup-contains('収容日：')"
fields:
  shelter_date: {label: "収容日"}
  location: {label: "収容場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  note: {label: "特徴"}
empty_text:
  - "現在迷い犬の情報はございません"
