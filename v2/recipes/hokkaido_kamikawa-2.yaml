# 北海道 上川総合振興局 新しい飼い主募集のページ（/hk/kks/inuneko.html）の「新しい飼い主探しの詳細」の表。
# 2026-11-07 は保健所ごとの件数の表だけで link_only にしていたが、2026-11-20 には「現在、新しい飼い主探しを実施している子達は、次のとおりです！」の
# 表（No・種別・年齢・性別・毛色・保管期限・写真・保管場所・備考。猫 3 頭）が載っていたので recipe にした（T656）。
# 表は 1 頭 1 行。写真のセルに写真と紹介文（複数の写真・p が入る）、保管場所のセルに「上川保健所 / 電話」。下に空欄の行が 5 行ほど残る雛形。
# 0 頭の日（Wayback 2025-11-07・2026-02-08）は表の見出し行と空欄の行だけが残る。子のいない行は写真も種別も保管期限も無い。
# 「現在、新しい飼い主さんを探している犬／猫は…います・いません」の文と「保健所での保護頭数」の表は、表の中身と食い違う日がある
# （2026-11-20 は文が「犬は 2 匹・猫はいません」で表は猫 3 頭。2026-07-22 も文が「猫はいません」で表は犬 2 頭）ので 0 頭の根拠にしない。
# 0 頭にするのは empty_absent: 「新しい飼い主探しの詳細」の表があり、その表に子のいる行（写真・種別の犬猫・保管期限の月のどれかがある行）が 1 つも無い日だけ。
# 保管期限が過ぎた行は、ページから消えない。職員が表を書き直すまで残る（2026-02-06 の版は期限 1 月 30 日のまま、2026-07-22 の版は期限 6 月 26 日のまま 2 頭が残る）。
# 期限は収容した日ではなく保管の期限で、期限後も表に残るので（その子が引き取られたかはページから分からない）、期限で行を外さず note に「保管期限 …」として載せる。
# 表の列の並びは版によって保管場所と備考が入れ替わる（2025-05 は備考が 8 列目）ので、保管場所は 8 列目に既知の名前があるときだけ読む。
# 種別が「猫」「犬」でない版（2026-02 は種別の列が「雑種」）は種別なしで載せる。写真の無い行は動物の条件（写真か番号か収容日）を満たさず落ちるが、
# 表に子のいる行（保管期限・種別）は残るので 0 頭にはならず、読めなかったとして通知される。写真は北海道のほかの振興局と同じく pending（出さない）。
# 同じページの「負傷動物一覧」の表（現在は雛形のみ）は読まない。
rows: "table:has(> caption:-soup-contains('新しい飼い主探しの詳細')) tr:nth-child(n+2)"
fields:
  age: {selector: ":scope > :nth-child(3)"}
  sex: {selector: ":scope > :nth-child(4)"}
  color: {selector: ":scope > :nth-child(5)"}
  species: {selector: ":scope > :nth-child(2)"}
  location: {selector: ":scope > :nth-child(8) p:nth-child(1)", regex: "^((?:上川|名寄|富良野)保健所|環境生活課)"}
  phone: {selector: ":scope > :nth-child(8)", regex: "(0\\d{1,4}-\\d{1,4}-\\d{3,4})"}
  note:
    join:
      - {selector: ":scope > :nth-child(7)"}
      - {selector: ":scope > :nth-child(6)", regex: "(\\d+月\\d+日)", prefix: "保管期限 "}
species:
  from: field
  map: {"猫": cat, "犬": dog}
image: "img@src"
empty_absent:
  page: "table > caption:-soup-contains('新しい飼い主探しの詳細')"
  none: "table:has(> caption:-soup-contains('新しい飼い主探しの詳細')) tr:nth-child(n+2):is(:has(img), :has(td:nth-child(6):-soup-contains('月')), :has(td:nth-child(2):-soup-contains('猫')), :has(td:nth-child(2):-soup-contains('犬')))"
