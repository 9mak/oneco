# 倉敷市（保護動物情報） https://www.city.kurashiki.okayama.jp/kurashi/pet/1013042/index.html
# 一覧 ul.listlink.clearfix > li の <a> が個別ページ（迷い犬猫の情報）に 1 頭ずつリンクしている（follow_all、各ページ rows: body）。
# 一覧のテキストだけでは収容日が同日の複数頭で id が衝突し取りこぼすため、
# 個別ページの span.idnumber「ページ番号NNNNNN」（サイト固有の一意なページ番号）を management_no として使う。
# 個別ページには h1 に一覧と同じ「令和08年09月28日　松島　猫（雑種）♀」、
# <ul><li>保護場所：.../保護日時：.../種類：.../性別：.../毛色：.../特徴：...</li></ul> がある。
# 写真は src に「_page_/001/」を含む img（個体ページ配下のアップロード画像。alt は「写真：保護犬」「ねこ」等でまちまちなので alt では絞らない。
# 共通ナビの 03_purpose アイコンと newwin 等のテンプレート画像は除外）。挿絵 runaway.gif と、負傷で画像掲載を見合わせる代替画像 keisaimiawase.jpg（水色地の「画像掲載を見合わせています」）は除外。
# 2026-10-04 alt='写真' 始まりだけだと alt='ねこ' の実写真（1027913）を取りこぼし、keisaimiawase.jpg（代替画像）を写真として載せていたので、src 基準＋除外に変更（実写真 5→8 頭、代替画像 1→0）。
steps:
  - follow_all: "ul.listlink.clearfix a@href"
rows: "body"
image: {selector: "img[src*='_page_/001/']@src", exclude: ["03_purpose", "runaway", "keisaimiawase"]}
fields:
  management_no: {selector: "span.idnumber", regex: "(\\d+)"}
  shelter_date: {selector: "h1", regex: "(令和\\s*\\d+\\s*年\\s*\\d+\\s*月\\s*\\d+\\s*日)"}
  species: {selector: "h1", regex: "(犬|猫)"}
  location: {label: "保護場所"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  color: {label: "毛色"}
  note: {label: "特徴"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、保護している犬猫はいません"
  - "現在収容している犬猫はいません"
  - "現在いません"
