# 相模原市 収容犬の公示（kosodate/kenko/1026628/pet/1007470.html）。迷い犬として収容した犬の公示（公示の翌日から原則 2 週間掲載。返還済みの犬も含む）。
# h2「公示に基づく収容犬情報」の下に、0 頭の日は p「現在、迷い犬の情報はありません。」の 1 文だけが出る（Wayback 2023-03〜2026-05・2026-09-19 と 2026-11-07 の実ページで一致）。
# 犬のいる日（Wayback 2026-09-03 の 1 版だけ保存にあった）は、その文が消えて p「令和8年8月31日の公示」→ p「整理番号　1」→ ul（収容日時・収容期限・収容場所・犬の種類・犬の毛色・犬の性別・犬の体格・備考）が並ぶ。
# 整理番号は公示ごとの連番（「1」が日をまたいで重なる）ので、収容日時と組み合わせて管理番号にする（ID が別の日の子と衝突しない）。
# 1 頭 = p「整理番号」の始まりから、次の整理番号・公示の p・問い合わせ欄の div の手前まで。
# 写真つきの日・複数頭の日・返還済みの印の書き方は保存に無く未確認。取れなければ「読めなかった」で通知（0 頭にはならない: 下の empty_absent は
# 「0 頭の文だけで、他の内容が h2 の後ろに無い」日に限る）。返還の語が行にあれば載せない（全部がそうなら 0 頭とは言わず読めなかった扱い）。
rows: "h2:-soup-contains('公示に基づく収容犬情報') ~ p:-soup-contains('整理番号')"
row_until: "p:-soup-contains('整理番号'), p:-soup-contains('の公示'), div#pagequest, div#reference"
row_filter:
  text_lacks: ["返還"]
fields:
  management_no:
    join:
      - {regex: "収容日時\\s*(令和\\d+年\\d+月\\d+日)"}
      - {regex: "整理番号\\s*(\\d+)"}
    sep: "-"
  shelter_date: {regex: "収容日時\\s*(令和\\d+年\\d+月\\d+日)"}
  location: {regex: "収容場所\\s*(.+?)\\s*犬の種類"}
  breed: {regex: "犬の種類\\s*(\\S+)"}
  color: {regex: "犬の毛色\\s*(\\S+)"}
  sex: {regex: "犬の性別\\s*(\\S+)"}
  size: {regex: "犬の体格\\s*(\\S+)"}
  note: {regex: "備考\\s*(.+?)(?:\\s*画像なし)?$"}
# 0 頭の日にだけ出る文（子のいる日は消える）が h2 の直後にあり、h2 の後ろに別の内容（リスト・表・画像・見出し・別の段落・div）が無い日だけ 0 頭
empty_absent:
  page: "h2:-soup-contains('公示に基づく収容犬情報') + p:-soup-contains('現在、迷い犬の情報はありません')"
  none: "h2:-soup-contains('公示に基づく収容犬情報') ~ :is(ul, ol, table, img, h3, h4, p:not(:-soup-contains('現在、迷い犬の情報はありません')), div:not(#pagequest):not(#reference))"
