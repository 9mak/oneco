# 奈良県 中和保健所動物愛護センター 譲渡候補猫。表（1 行 3 セル）の td に「写真（個別ページへのリンク）+ 名前♀♂ + 日付」が 1 頭。
# 表の直前の p に見出し画像（alt が「1次募集中」「2次募集中」「マッチング中」「新しい飼い主が決まりました！」）が 1 枚あり、段ごとに表が 1〜複数並ぶ。
# 募集中の猫だけ載せる: 見出し画像が 1次募集中・2次募集中の p の直後の表（続く表を 3 つまで）の td。
#   マッチング中（相性確認が進んでいて新たな申し込みは受けない）と、決まった猫（個別ページのリンクも無い）は載せない。
#   空欄のセル（alt「空欄」の画像）にはリンクが無く載らない。
# 日付（2026年6月18日 等）の意味はページに説明が無いので取り込まない。個別ページ（/n070/p0xxxxx.html）は収集器の UA で 403 になるため、詳細リンクは一覧ページにする。
# 注意: ページ上部の案内文に「現在1次募集中の猫はいません」とあるのに 1次募集中の見出しの下に 2 頭いる（2026-10-05。案内文が古いと見て、見出しと表を信じる）。
# 注意: 奈良県のサイトは 2026-09-13 に SSL 証明書が失効していて、収集器は取得できない（台帳は link_only）。2026-10-05 の保存 HTML で確かめた。
rows: >-
  #tmp_contents :is(p:has(img[alt="1次募集中"]), p:has(img[alt="2次募集中"])) + table td:has(a[href] img),
  #tmp_contents :is(p:has(img[alt="1次募集中"]), p:has(img[alt="2次募集中"])) + table + table td:has(a[href] img),
  #tmp_contents :is(p:has(img[alt="1次募集中"]), p:has(img[alt="2次募集中"])) + table + table + table td:has(a[href] img)
image: {selector: "a img@src"}
fields:
  name: {regex: "^\\s*(\\S+?)\\s*[♀♂]"}
  sex: {regex: "([♀♂])"}
