# 大阪府動物愛護管理センター 譲渡猫情報（jyoutoneko.html）。センターが新しい飼い主を募集している猫（迷い犬猫 pref_osaka とは別のページ）。
# 猫の個票は PDF（写真をクリックすると開く）で、ページ本文には写真と区分の見出ししかない。PDF は読まず、写真 1 枚 = 1 頭として、本文の見出しから性別と年齢の区分を読む。
#   h3「1歳齢以上の雄(オス)猫」「1歳齢以上の雌(メス)猫」「持続的なケアが必要な猫」「1歳齢未満の猫」（その下に h4「雄（オス）」「雌（メス）」）、
#   h3「センター以外の場所で新しい飼い主さんを募集している猫（おとな猫の譲渡促進事業）」（その下に h4「ホームセンターコーナン…にいる猫」）、h3「おとな猫の預託事業で預託中の猫」。
# 名前・管理番号・毛色・性格は PDF にしか無いので出さない（写真 → ID）。個体の「元ページ」は入口のページ。
# 「（令和8年11月24日から公開予定）」の節（コーナンの店舗の猫）は、まだ公開前なので載せない。公開されたら「ホームセンターコーナン…にいる猫」と note に出して載る。
# 「預託中の猫」は預託中のためマッチング・譲渡がセンターに返還後になるが、載せて note で預託中と分かるようにする（今日は「現在、対象の猫はいません。」）。
# 「現在、対象の猫はいません。」は節ごとに子のいる日にも出る（2026-11-17 も出ている）ので 0 頭の根拠にしない。0 頭は「写真のリンクが 1 つも無い」ことで決める。
rows: "#tmp_contents a[href$='.pdf']:has(> img)"
row_filter:
  field_lacks: {section: ["公開予定"]}
image: "img@src"
fields:
  section: {from: heading, selector: "h3, h4"}
  sex: {from: heading, selector: "h3, h4", regex: "(雄|雌)"}
  age: {from: heading, selector: "h3", regex: "(1歳齢以上|1歳齢未満)"}
  note: {from: heading, selector: "h3, h4", regex: "(ホームセンター[^（(]*にいる猫|預託中の猫)"}
empty_absent:
  page: "#tmp_contents h1:-soup-contains('譲渡猫情報')"
  none: "#tmp_contents a[href$='.pdf']:has(> img), #tmp_contents img[src*='/images/1442/']"
