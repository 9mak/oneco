# 新潟県動物愛護センター 子猫の新しい飼い主を募集しています！（1344055708060.html）。生後 6 か月未満の猫のページ（成猫は pref_niigata-2）。
# 2026-11-17 は「子猫はいません」の画像（alt）だけで 0 頭。ミルクボランティアに預けている子猫は戻る時期が未定で問い合わせにも答えられないとの案内。
# 子猫がいる日の作りは未確認だが、成猫のページ（pref_niigata-2）と同じく情報は写真の中でケージの番号だけの見出しになると考えられるので mode: link_only。
# このレシピは作りが変わったときのために残す（h3 を 1 頭の始まりにする。「知っておきたいこと」「動画」の見出しは動物ではない）。
rows: "div#main_body h3"
row_until: "h2, h3"
row_filter:
  field_lacks: {management_no: ["知っておきたいこと", "動画"]}
image: "img@src"
fields:
  management_no: {selector: "h3"}
empty_text:
  - "子猫はいません"
