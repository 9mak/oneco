# 岐阜県（迷い犬情報）— 入口はハブページで12保健所/センターへのリンク表のみ、動物情報は無い。
# 各リンク先が実データ（1頭=縦型table 1つ、管理番号・収容日等はth/td or td<strong>ラベルの隣）。
# 可茂保健所(5229)・揖斐センター(5767)は県サイト側で404（2026-09-29時点、soshiki/22706/からのリンクも同じ404）のため対象外。飛騨保健所(13689)も 404（2026-10-02 監査）。
# 岐阜市保健所は外部ドメイン(city.gifu.lg.jp)・別サイト構造(dl形式)のためこのレシピの対象外（現状0頭）。
# 2026-10-05: skip_errors: true（子 1 本の取得失敗はその 1 本だけ捨てて続ける。全部失敗した日は failed）に切り替え、
# 404 の固定除外を外した。今日の実ページで 可茂(5229)・飛騨(13689) は 404 のまま（skip で捨てる）、揖斐センター(5767) は 200 に戻っていて
# 除外したままだと読み落としていた。西濃保健所(123142) が今日 404 で、固定除外の方式では slug 全体が failed になっていた。
steps:
  - follow_all: "table a[href^='/page/']@href"
    skip_errors: true
# 2026-10-04: 西濃保健所(123142)は写真が表の直前の p にあり（他の保健所は表の中）、写真が付かなかったため
# image を self_or_prev_siblings に変更（行の中を先に探し、無ければ直前の兄弟要素）。
rows: "table"
image: {selector: "img@src", scope: self_or_prev_siblings}
fields:
  management_no: {label: "管理番号", regex: "(No\\.?\\s*\\d+|^\\d+$)"}
  shelter_date: {label: "収容日"}
  location: {label: "保護した場所"}
  breed: {label: "類"}
  color: {label: "毛"}
  sex: {label: "性"}
  age: {label: "年齢"}
  size: {label: "大きさ"}
  note: {label: "考"}
empty_text:
  - "現在の登録：0頭"
  - "現在の登録0頭"
  - "登録なし"
