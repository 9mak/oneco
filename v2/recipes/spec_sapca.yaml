# 滋賀県動物保護管理センター（迷い犬猫） https://www.sapca.jp/lost
# 一覧 ul.list の各 li a[href*='/lost/'] を個体ページ方式（follow_all）で1頭=1ページとして辿る。
# 詳細ページは 見出し/値 が交互に並ぶだけ（dt/dd 無し）なので label 抽出で拾う。
# 既に飼い主の元へ「戻りました」「決まりました」「亡くなりました」ページも一覧に残るため row_filter で除外する（2026-10-02 監査: 死亡を追加。
# rows: body なので text_lacks だと全頭除外の日に rows=0 で failed になる。status 項目で判定して「該当なし」扱いにする）。
steps:
  - follow_all: "ul.list li a[href*='/lost/']@href"
rows: "body"
# 2026-10-31: 一覧に残った子が全部「戻りました」「亡くなりました」の日（10/31 は 22137 の 1 頭だけで「飼い主さんのところへ戻りました」）は全行除外になり、
#   rows: body では見出しもコンテナも取れず ambiguous_empty だった。全行除外の 0 頭を確定する根拠に、済みの個体ページの項目表を置く。
#   済みのページは項目表 table.dogcat が div.sumidetail（戻りましたは sumidetail-lost も）の直下にあり、まだいる子のページは class の無い div の直下
#   （Wayback 2025-05〜2026-02 の個体ページ 20 枚と 10/30・10/31 の 5 枚: 済み 11 枚すべて・まだいる子 14 枚は 0 枚）。
#   辿った個体ページに済みの枠が 1 枚も無い日（枠の名前が変わった日や、文言だけが固定の欄に出た日）は従来どおり ambiguous_empty（通知に出る）。
empty_container: "div.sumidetail > table.dogcat"
row_filter:
  field_lacks: {status: ["戻りました", "決まりました", "亡くなりました"]}
image: "img[src*='/wp-content/uploads/']@src"
fields:
  shelter_date: {label: "収容日"}
  location: {label: "保護した場所"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  color: {label: "毛色"}
  size: {label: "体格"}
  note: {label: "備考", default: null}
  species: {label: "種類", default: "-"}
  status: {regex: "(戻りました|決まりました|亡くなりました)"}   # 除外判定用（animals には出ない）
species:
  from: field
  map: {"猫": cat, "ねこ": cat, "犬": dog, "いぬ": dog}
  infer: true   # 2026-11-07: 種類が「シーズー」だけの子（22141）は「犬」の語が無く種別なしだった。品種の語（シーズー等）で決める。決まらなければ従来どおり種別なし
# 2026-10-22: 迷い犬猫がいない日は一覧（ul.list）が無く「只今、迷い犬・猫はいません。」だけになる（follow_all が 0 件）。
empty_text: ["只今、迷い犬・猫はいません"]
