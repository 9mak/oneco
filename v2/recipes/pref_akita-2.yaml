# 秋田県（美の国あきたネット）「譲渡犬を探す」pages/archive/100841。秋田県動物愛護センター（ワンニャピアあきた）の譲渡犬。
# 1 頭 = 1 つの表（table.c-table--full）。表の caption が「個体No.１８」、th が名前、左のセルが写真、右に 年齢・性別・毛色・体重・備考 のセルが並ぶ。
# ワンニャピアあきた（wannyapia.akita.jp）が 2026-11-26 から公開停止中のため、その代わりに県のサイトの同じ内容のページを読む（spec_wannyapia_akita-1 は再開を検知するため残す）。
# 0 頭の日の書き方は未確認（2026-11-27 時点は 1 頭。保存も Wayback も無い）。0 頭の文言は書かず、表が 0 個の日は読めなかった扱いにして通知させる（POLICY.md 方針 52）。
rows: "table.c-table--full"
image: "img@src"
fields:
  name: {selector: "th"}
  management_no: {selector: "caption", regex: "No\\.?\\s*(\\S+)"}
  age: {label: "年齢"}
  sex: {label: "性別"}
  color: {label: "毛色"}
  size: {label: "体重"}
  note: {label: "備考"}
