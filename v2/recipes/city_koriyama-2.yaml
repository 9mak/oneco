# 郡山市保健所（飼い主募集の犬・猫） — city.koriyama.lg.jp/soshiki/74/7185.html
# 2026-10-05 T519 新規作成（環境省リンク集から追加）。
# 構造: div.detail_free 直下に h2「犬（N件）」→ p(img) → p「犬の情報」→ table(summary="飼い主募集": 種類/毛色/性別/体格/毛並/その他 が th/td) → 空の雛形 table。
#   h2「猫」は「下記にお問い合わせ下さい。 024-924-2157」だけ（2026-10-05 時点で猫の掲載なし）。管理番号・収容日は載らないので写真があることで動物とみなす。
# 種別は直近の h2（犬／猫）。h2「譲渡会について」等は動物の表より後ろ。
# 2026-10-07 T519 v-g3: 動物の表の summary は日によって違う（今日・2026-01 は「飼い主募集」、2023-12・2025-01 は「犬の情報の表」。空の雛形は「飼い主募集」のまま）。
#   「飼い主募集」だけを読む版は、2025-01 の犬（管理番号 11）を雛形しか拾えず 0 頭の failed にしていた。div.detail_free の表を全部読み、空の雛形（写真・管理番号が無い）はエンジンが捨てる。
#   管理番号は 2023-12・2025-01・2026-01 では表の見出し行（th の隣の th）にあり、label では隣が見出しに見えて取れないので行の文字から取る。
#   「その他」に「譲渡決定しました。」と書かれた子は載せない（2023-12）。
# 犬が 0 頭の日の文言は 2022-12 の版で確認（下の empty_text）。今日の作り（h2「犬（N件）」）の 0 頭の日は未確認。
# 未確認: 猫が載った日の読み方（猫の表が犬と同じ作りかどうか）。
# 2026-10-08 T519 v2-g3: 0 頭の日の書き方は 4 つ（「現在飼い主募集の犬はいません」2022-12、「…はおりません」2024-07・「現在飼い主を募集している犬はおりません」2025-06、「譲渡決定しました。」だけが残る 2023-12）。
#   今日の作り（h2「犬（N件）」）の 0 頭の日は未確認なので、見出しの「犬（0件」も置いた（郡山市保健所の別ページで「（0件）」が 0 頭の日だけに出ることは確認済み）。どれも動物のいる日には出ない。
rows: "div.detail_free table"
row_filter:
  text_has_any: ["種類", "毛色"]
  field_lacks: {note: ["譲渡決定", "譲渡済", "譲渡が決まり"]}
image: {selector: "img@src", scope: prev_siblings}
species:
  from: heading
  selector: "h2"
  map: {"犬": dog, "猫": cat}
fields:
  management_no: {regex: "管理番号\\s*(\\d+)"}   # 載っていない日（今日）は None
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  note: {label: "その他"}
# 0 頭の日（2022-12 の犬の節に「現在飼い主募集の犬はいません」。表は空の雛形のまま残る）と、譲渡が決まった子だけが残った日（2023-12 の「その他: 譲渡決定しました。」）。どちらも動物のいる日には出ない文言
empty_text: ["飼い主募集の犬はいません", "飼い主募集の犬はおりません", "飼い主を募集している犬はおりません", "犬（0件", "譲渡決定しました"]
