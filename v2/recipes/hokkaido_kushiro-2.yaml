# proposal: run の日付 2026-11-11・元の失敗理由 0 頭で empty_text も無い（行 0・捨てた 0）・取れた頭数 1・採用条件は次の行（人が差分を見て recipes/ へ反映する。今日の HTML は <slug>.today.html）
# 採用条件: 合格 a 必須項目・b 重複・c 行数・v1 見出し語・v2 日付・v3 現行の指定を保つ / 飛ばした d 回帰（保存 HTML なし）・v4 旧新比較（旧レシピが読めた保存ページが無い） / 回帰未確認 / 半自動の対象外（旧新の比較ができていない。draft のまま人が見る）
# agy note: 壊れていたダミーの rows を廃止し、個体情報のリストを含む div を rows に指定しました。直前の兄弟要素から画像を取得し、空の雛形行を row_filter で除外した上で、各項目および見出しからの種別判定を設定しました。
# 各個体の情報リストを含む div 要素（article.body > div:has(ul)）を 1 頭とみなす。
# 直前の兄弟要素から画像を取得し、空の雛形行（No.D、No.C）は row_filter で除外する。
rows: "article.body > div:has(ul)"
row_filter:
  text_lacks:
    - "No.D"
    - "No.C"
image:
  selector: "img@src"
  scope: prev_siblings
  stop_at: "row, h3"
fields:
  management_no: {regex: "No\\.?\\s*(\\S+)"}
  breed: {regex: "種類[:：]\\s*(\\S+)"}
  size: {regex: "大きさ[^：:]*[:：]\\s*([^・\\s]+)"}
  age: {regex: "(推定\\s*[^\\s]+)"}
  color: {regex: "毛色[^：:]*[:：]\\s*([^・\\s]+)"}
  sex: {regex: "(オス|メス|雄|雌)"}
  shelter_date: {regex: "抑留年月日[:：]\\s*(\\S+)"}
  note: {regex: "特徴[:：]\\s*(\\S+)"}
species:
  from: heading
  selector: "h3"
  map:
    "犬": dog
    "猫": cat
empty_text_all:
  - "犬0頭、猫0頭"
  - "犬（0頭）"
  - "猫(今はいません）"
