# 北海道 釧路総合振興局 釧路保健所 迷子の犬・猫情報（/hk/hgc/seikatuweb/kannkyouweb/175327.html）。
# 2026-11-07 W006（PR #104 の公開ゲート）: link_only をやめて 0 頭を読む。
# 見出しに頭数が入る作り: h3「犬0頭、猫0頭」、h3「犬（0頭）」、h3「猫(今はいません）」の 3 つが全部そろった日だけ 0 頭。
# 2026-11-13: 初めて子が載った日（h3「犬1頭、猫0頭」「犬（1頭）」、No.SD11-1）に作りを確かめた。本番の AI 修復の案（proposals/hokkaido_kushiro-2.yaml）を
#   元に、保護場所を足し、0 頭の条件を元の 3 つそろいに戻した。
# 1 頭 = 個体情報の ul（「No.SD11-1」「種類：雑種」「大きさ・推定年齢：中型・推定1~5歳」「毛色・性別：白・メス」…）を持つ div.ss-alignment-float。
#   写真はその前の兄弟の div.ss-alignment-float（p > img）にある。犬・猫の節の頭の h3（「犬（1頭）」「猫(今はいません）」）で種別を決める。
#   各節に「No.D」「No.C」（番号の無い英字 1 つ）と項目名だけの空の雛形が残るので、その雛形だけ捨てる。番号のある子は種類が空でも捨てない
#   （管理番号で載る。reviewer F-05）。
rows: "article.body div.ss-alignment-float:has(ul)"
row_filter:
  text_lacks:
    - "No.D 種類： 大きさ"
    - "No.C 種類： 大きさ"
    - "No.D 種類：大きさ"
    - "No.C 種類：大きさ"
image:
  selector: "img@src"
  scope: prev_siblings
  stop_at: "row, h3"
species:
  from: heading
  selector: "h3"
  map:
    犬: dog
    猫: cat
# 欄が空の子（「種類：」だけ）で次の項目（「大きさ・推定年齢：中型…」）を値として読まないよう、値の語に「：」を含むものは取らない（(?!\S*[:：])）
fields:
  management_no: {regex: 'No\.?\s*(?!\S*[:：])(\S+)'}
  breed: {regex: '種類[:：]\s*(?!\S*[:：])(\S+)'}
  size: {regex: '大きさ[^：:]*[:：]\s*(?!\S*[:：])([^・\s]+)'}
  age: {regex: '推定年齢[:：](?:[^・\s]+・)?(?!\S*[:：])(\S+)'}
  color: {regex: '毛色・性別[:：]\s*(?!\S*[:：])([^・\s]+)'}
  sex: {regex: '性別[:：](?:[^・\s]+・)?(オス|メス|雄|雌|不明)'}
  location: {regex: '保護場所[:：]\s*(?!\S*[:：])(\S+)'}
  shelter_date: {regex: '抑留年月日[:：]\s*(?!\S*[:：])(\S+)'}
  note: {regex: '特徴[:：](?!\s*抑留期限)\s*(.+?)(?=\s+抑留期限|$)'}
# 0 頭にするのは下の文が全部そろった日だけ。どれか 1 つでも消えれば（子が載った・作りが変わった）0 頭にならない（子が読めなければ failed）。
empty_text_all:
  - "犬0頭、猫0頭"
  - "犬（0頭）"
  - "猫(今はいません）"
