# 富山市保健所（猫の飼い主募集） — city.toyama.lg.jp/kurashi/seikatsu/1010313/1015825/1015834.html
# 2026-10-05 T519 新規作成（環境省リンク集のリンク先 1010313/index.html「ペット・生き物」→「飼い主募集情報」→「猫の飼い主募集」）。
# 構造: 本文は案内の p と動画リンクの後に、猫 1 頭ごと figure.imagecenter（img の alt = 名前、figcaption = 「オス　6歳（譲渡会時点）　不妊手術：済<br>大きな体の超ビビり君です」）。
#   2026-10-05 は 1 頭（ジャイアン）。管理番号・収容日は無く、写真で動物とみなす。動画リンク（ジャイアン・捕獲劇）の ul は figure の外なので影響しない。
# 未確認: 2 頭以上載った日の並び（figure が続くと仮定）、0 頭の日の文言（figure が消えるだけと仮定。empty_text は置かない＝0 頭の日は「読めなかった」で通知に出る）。
# 2026-10-08 T519 v2-g3: 年齢は「3－5歳（譲渡会時点）」のような範囲を丸ごと読む（以前は「5歳」だけ取っていた）。2025-12・2026-06 の 2 頭（イチロー・ジャイアン）で確認。
rows: "figure.imagecenter"
image: "img@src"
fields:
  name: {selector: "img", attr: alt}
  sex: {selector: "figcaption", regex: "^\\s*(オス|メス|雄|雌)"}
  age: {selector: "figcaption", regex: "(\\d+(?:\\s*[-－~～〜ー]\\s*\\d+)?\\s*(?:歳|ヶ月|か月|カ月)[^\\s]*)"}   # 「3－5歳」は範囲ごと（以前は「5歳」だけ取っていた）
  note: {selector: "figcaption", regex: "^\\s*(?:オス|メス|雄|雌)\\s*\\S+\\s*(.+)"}
