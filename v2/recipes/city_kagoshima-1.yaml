# 鹿児島市（保護犬）: #tmp_contents 直下に <h2>No.XXXXXX</h2> + 直後の <p> 群
# (写真・保護日・保護場所・種類・性別・体格・推定年齢等) が並ぶ flat な構造。
# 1頭分を束ねる親要素が無く、bs4 の Tag.select() は兄弟方向へ辿れないため、
# rows を h2 にすると兄弟 p (写真・保護日・性別等) は取得できない (city_oita と同じ制約)。
# h2 自身のテキストから安全に取れる管理番号のみ抽出する。
# h2 に「飼い主のもとに戻りました」を含むものは返還済みなので除外する。
rows: "h2"
row_filter:
  text_has_any: ["No"]
  text_lacks: ["戻りました"]
fields:
  management_no: {regex: "No\\.?\\s*(\\d+)"}
empty_text:
  - "現在、保護犬はいません"
  - "保護している犬はいません"
  - "現在いません"
