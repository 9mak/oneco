# 鹿児島市（保護犬）: #tmp_contents 直下に <h2>No.XXXXXX</h2> + 直後の <p> 群
# (写真・保護日・保護場所・種類・性別・体格・推定年齢・首輪) が並ぶ flat な構造。
# row_until で h2 から次の h2 の手前までを 1 頭にまとめ、項目と写真をその中から取る（2026-10-05 T517）。
# 管理番号は自分の h2 を selector で取る（from: heading だと前の子の h2 を指す）。
# h2 に「飼い主のもとに戻りました」を含むものは返還済みなので除外する。
# 2026-11-07 監査: 退院して掲載し直した子（No.260039）は上に新しい掲載（保護期限 11/11・退院の注記・写真）、下に古い掲載（保護期限 8/19・写真なし）の 2 つが載る。
# 上が最新なので、同じ管理番号は先に載った行だけ採る（下の行は写真が無く ID が別になるので「同じ ID」では捨てられなかった）。
unique_management_no: true
rows: "#tmp_contents > h2"
row_until: "h2"
row_filter:
  text_has_any: ["No"]
  text_lacks: ["戻りました"]
fields:
  management_no: {selector: "h2", regex: "No\\.?\\s*(\\d+)"}
  shelter_date: {label: "保護日", regex: "(令和\\s*\\d+\\s*年\\s*\\d+\\s*月\\s*\\d+\\s*日)"}
  location: {label: "保護場所"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  size: {label: "体格"}
  age: {label: "推定年齢"}
  note: {regex: "(首輪[^:：\\s]*[:：]\\s*\\S+)"}
empty_text:
  - "現在、保護犬はいません"
  - "保護している犬はいません"
  - "現在いません"
