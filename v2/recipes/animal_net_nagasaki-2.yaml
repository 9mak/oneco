# ながさき犬猫ネット 募集中一覧（その他・一般譲渡） /jyouto
# 2026-10-05 監査: 備考（保護時の状況・性格・譲渡条件）が note に入っていなかったので、備考〜次の見出しの手前を note に取る。
# WordPress。一覧 div.list-area 配下の /animal/no-xxx リンクを個体ページ方式（follow_all）で1頭=1ページとして辿る。
# 詳細ページは <li><p>ラベル</p><p>値</p></li> 構造で dt/dd を使わないため label 抽出が効かず、正規表現で本文から拾う。
# 収容日は無く「地区」（保護されていた市町）のみ。shelter_date は取れないためデータ取得日フォールバックに委ねる。
# 犬猫の別は明記が無い。「模様・柄」が三毛/サビ/キジ/トラ（猫固有の柄）なら猫、それ以外は犬とみなす（既定値）。
steps:
  - follow_all: "div.list-area a[href*='/animal/no-']@href"
rows: "body"
image: "ul.detail-img img@src"
fields:
  management_no: {regex: "No\\.(\\d+)"}
  breed: {regex: "品種\\s*(\\S+)"}
  sex: {regex: "性別\\s*(\\S+)"}
  age: {regex: "年齢\\s*(\\S+)"}
  color: {regex: "毛色\\s*(\\S+)"}
  size: {regex: "体格\\s*(\\S+)"}
  location: {regex: "地区\\s*(\\S+)"}
  note: {regex: "備考\\s*(?!譲渡申し込みをする|動物を譲りたい方)(.+?)(?=\\s*(?:譲渡申し込みをする|動物を譲りたい方))"}   # 備考の本文を次の見出しの手前まで（備考が空の子は「動物を譲りたい方」を拾わない）
  species: {regex: "模様・柄\\s*(?:犬（猫）種特有)?\\s*(.*?)\\s*譲渡申し込みをする", default: ""}   # 模様・柄〜備考（フッターの手前）を窓にする。値の「犬（猫）種特有」は読み飛ばす（2026-10-02 監査）
species:
  from: field
  map: {"猫": cat, "ネコ": cat, "ねこ": cat, "ハチワレ": cat, "エイズ": cat, "白血病": cat, "三毛": cat, "キジ": cat, "サビ": cat, "トラ ": cat, "犬": dog, "": dog}   # 猫語を犬より前に。「トラ 」はトライアル誤爆避け
empty_text: ["投稿がありません"]
