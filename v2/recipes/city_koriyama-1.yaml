# 郡山市保健所（保護している犬・猫） — city.koriyama.lg.jp/soshiki/74/32563.html
# 2026-10-05 T519 新規作成（環境省リンク集から追加）。
# 構造: div.detail_free 直下に h2「保健所で保護している犬について（N件）」→ p(img) → table(summary="犬の情報": 保護日時/保護場所/種類/毛色/性別/首輪/体格/毛並/特記事項 が th/td) → 空の雛形 table、
#   その後 h2「保健所で保護している猫について」→ 「現在保護情報はありません」。1 頭 = table 1 つ、写真は表の直前の p（prev_siblings、直前の表で止まる）。
# 空の雛形 table は項目が全部 nbsp で写真も無いので動物とみなされず落ちる。
# 種別は直近の h2（犬／猫）。h2「保護犬について」「保護猫について」は説明文の見出しで、動物の表より後ろにあるので影響しない。
# 未確認: 犬が 0 頭の日の文言（猫の 0 頭は「現在保護情報はありません」）。犬 0 頭の日も同じ文言のはずだが実物は未確認。
#   なお猫が 0 頭で犬が載っている日もこの文言が出るため、犬の表の構造が変わって取れなくなった日も「0 頭」に見える弱点がある。
# 未確認: 猫が載った日の読み方（猫の表が犬と同じ作りかどうか）。
# 2026-10-08 T519 v2-g3（前任の直しを Wayback 9 版で確かめ直した）: 0 頭の日の書き方は 3 つ。見出しの件数「（0件）」（2024-10・2026-06）、件数の無い見出し＋「現在保護されている犬はおりません。」（2025-05）。
#   どちらも犬の節の文言なので empty_text に入れた（猫の節の「現在保護情報はありません」は犬がいる日にも出るので使わない）。弱点: 猫の見出しが「（0件）」になる日に犬の表が読めなくなると 0 頭に見える。
#   特記事項に「飼い主へ返還」の子は載せない。2025-12 は犬 2 頭（管理番号 12・13）を読めた。
rows: "div.detail_free table"
row_filter:
  text_has_any: ["保護日時", "保護場所"]
  text_lacks: ["飼い主へ返還", "返還済", "返還されました", "返還しました"]   # 返還済みの子が特記事項に「飼い主へ返還」で残る日がある（2025-02。T519 v-g3）
image: {selector: "img@src", scope: prev_siblings}
species:
  from: heading
  selector: "h2"
  map: {"犬": dog, "猫": cat}
fields:
  management_no: {label: "管理番号"}   # 2025-12 のページには「管理番号」行があった（今は無い）。無いときは None
  shelter_date: {label: "保護日時", regex: "((?:令和|平成|R|H)?\\s*\\d+\\s*年\\s*\\d+\\s*月\\s*\\d+\\s*日)"}
  location: {label: "保護場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  note: {label: "特記事項"}
# 犬の見出しの件数が 0（「（0件）」2026-06、「(0件）」2024-10）の日だけ 0 頭。以前の「現在保護情報はありません」は猫の節の文言で、
# 犬がいる日にも出る（犬の表の作りが変わって取れなくなった日が 0 頭に見えてしまう）ので使わない。猫が載った日の作りは未確認。
empty_text: ["（0件", "(0件", "保護されている犬はおりません"]
