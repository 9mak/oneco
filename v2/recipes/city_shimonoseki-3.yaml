# 下関市動物愛護管理センター 迷い犬を保護しています。 https://www.city.shimonoseki.lg.jp/soshiki/52/1799.html（2026-10-05 T519 で追加。2026-10-07 T519v 検証で個体ページの読みを直した）
# このページは「ただいまセンターで犬を保護しています。…情報は『関連情報』のリンク先に掲載。関連情報に犬の情報が無い場合は保護している犬はいません」という案内で、
# 保護犬の個体情報は「関連情報」の見出しの下に足されるリンク先のページにある。2026-10-05・10-07 は関連情報の見出しの下が空（&nbsp; の p だけ）で 0 頭。
# 個体ページ（Wayback 2025-08-22「迷い犬を保護しています。（4月28日保護分）」の No.07-03）は、項目が「種類　　　秋田犬系」「性別　　　メス」「毛色　　　茶」「体格　　　大型」
# 「特徴　　　首輪無し」「保護（捕獲）場所　松屋東町2丁目」「保護（捕獲）日　令和7年（2025年）4月28日」のようにコロン無しで並ぶ（猫の個体ページ city_shimonoseki-2 はコロンあり）。
# 以前の regex はコロン必須で、種類・性別・毛色・体格・場所・日付が全部空になっていたので、コロンは省いてもよい形にした。
# 読めない日（リンクを辿ったのに取れない）は「読めなかった」として通知に載る（0 頭にはしない）。
# 0 頭の判定: 「関連情報」の見出しの直後の p が空（常に出ている案内文は使わない）。2026-04-15・06-28 の保存ページで empty を確認した。
steps:
  - follow_all: "div.detail_free a[href*='/soshiki/52/']@href"
    skip_errors: true
rows: "div.detail_free"
row_filter:
  text_has_any: ["保護", "収容"]
image: "img@src"
fields:
  management_no: {regex: "(?:No\\.?|番号[:：])\\s*([A-Za-z0-9R][A-Za-z0-9\\-]*)"}
  breed: {regex: "(?:種類|犬種)[:：]?\\s*(\\S+)"}
  color: {regex: "毛色[:：]?\\s*(\\S+)"}
  sex: {regex: "性別[:：]?\\s*(\\S+)"}
  age: {regex: "推定年齢[:：]?\\s*(\\S+)"}
  size: {regex: "体格[:：]?\\s*(\\S+)"}
  shelter_date: {regex: "(?:収容日|保護日|保護[（(]捕獲[）)]日)[:：]?\\s*(\\S+)"}
  location: {regex: "(?:収容場所|保護場所|保護した場所|保護[（(]捕獲[）)]場所)[:：]?\\s*(\\S+)"}
  note: {regex: "特徴[:：]?\\s*(\\S+)"}
empty_selector: "div.detail_free h2:-soup-contains('関連情報') + p"
