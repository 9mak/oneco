# 神奈川県動物愛護センター「当所で保護している犬の情報」。
# 一覧本文には表が無く、PDF（当所で収容している犬の情報）を1本落とす。表は No./収容日/掲載期限/種類/毛色/体格/性別/収容場所/時間/首輪等/写真の列。
# 現状0頭（PDF内に「現在、収容期間中の犬はいません」の案内のみ）。写真は掲載されないため management_no/shelter_date で動物判定を通す想定だが、日付が年無し(M月D日)のため通らない可能性がある。
steps:
  - pdf_links: "a[href$='.pdf']@href"
pdf:
  mode: table
  header_row: 0
fields:
  management_no: {header: "No"}
  shelter_date: {header: "収容日"}
  breed: {header: "種類"}
  color: {header: "毛色"}
  size: {header: "体格"}
  sex: {header: "性別"}
  location: {header: "収容場所"}
  note: {header: "時間"}
empty_text:
  - "現在、収容期間中の犬はいません"
