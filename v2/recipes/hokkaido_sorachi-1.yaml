# 北海道 空知総合振興局 飼い主募集の犬・猫（/hk/kks/kainusibosyuinuneko.html）。岩見沢保健所・由仁支所・滝川・深川・協力動物病院等で飼い主を募集している犬・猫。
# 自由書式の CMS（div.ss-alignment が平らに並ぶ）。1 頭ごとに p「【令和８年9月30日掲載】」→ p（写真）→ p（紹介文と 仮名・種類・性別・年齢・体格）が兄弟で並ぶ。
# 「掲載】」の p を 1 頭の始まりにして、次の「掲載】」の p か h2・h4 の手前までまとめる。
# 北海道動物愛護センター「あいにきた」の節は「【令和８年８月４日更新】」で「掲載】」ではないので読まない（別の掲載元 spec_aniwel が載せている）。
# 「方に引取となりました」の注記がある子（協力動物病院で治療中の猫は 10/28 に「治療等についてご協力頂ける方に引取となりました」と引き取り先が決まった）は載せない。
# 2026-11-20 T656: 滝川の「猫２頭引取となりました」（飼い主の事情での引取り。募集中）が、決定印「引取となりました」に当たって行ごと外れていたので、決定印を「方に引取となりました」に絞った。
# 同じ日の滝川は、写真 1 枚の下に「・まめ　メス　黒」「・みかん　オス　茶白」と 1 行 1 頭の箇条書き（仮名・種類のラベルが無い）。row_split で 1 頭ずつに分け、名前から ID を作る。
# 犬猫は種類のラベルか、導入文の「猫２頭」から決める。深川の「性別等：オス、茶白」・岩見沢の「種類等：猫、雑種、白茶」（ラベルに「等」が付く）も読む。
# 0 頭の文言は節ごとに「現在いません。」と出るが、他の節に子がいる日にも出る（Wayback 2025-11 は由仁・滝川・協力動物病院が「現在いません」で、岩見沢と深川に猫）ので、
# 文だけでは 0 頭にしない。5 つの節（岩見沢・由仁支所・滝川・深川・協力動物病院等）それぞれの見出しの直後に「現在いません」が全部出た日だけ 0 頭（empty_text_all）。
# 岩見沢・深川が 0 頭の日の実物は未確認（同じ書式と仮定）。違う文なら 0 頭にならず failed で通知される。
rows: "p:has(> strong:-soup-contains('掲載】'))"
row_until: "p:has(> strong:-soup-contains('掲載】')), h2, h4"
row_split: "(?:<br\\s*/?>\\s*)+(?=・)"
row_filter:
  text_lacks: ["方に引取となりました"]
fields:
  species:
    join:
      - {regex: "種\\s*類等?[:：]\\s*(犬|猫)"}
      - {regex: "([犬猫])[0-9０-９]+頭"}
  name:
    join:
      - {regex: "仮名[:：]\\s*(\\S+)"}
      - {regex: "・\\s*(\\S+)\\s+(?:オス|メス|不明)"}
  breed: {regex: "種\\s*類等?[:：]\\s*[犬猫][、，]\\s*([^\\s、，]+)"}
  sex:
    join:
      - {regex: "性\\s*別等?[:：]\\s*(\\S+)"}
      - {regex: "・\\s*\\S+\\s+((?:推定)?(?:オス|メス|不明))"}
  age: {regex: "年\\s*齢[:：]\\s*(\\S+)"}
  size: {regex: "体\\s*格[:：]\\s*(\\S+)"}
  color: {regex: "・\\s*\\S+\\s+(?:オス|メス|不明)\\s+(\\S+)"}
  note: {regex: "【(令和[^】]+?掲載)】"}    # 掲載日（収容日ではないので shelter_date にしない）
species:
  from: field
  map: {"犬": dog, "猫": cat}
image: "img@src"
empty_text_all:
  - "＜岩見沢保健所＞ 現在いません"
  - "＜岩見沢保健所由仁支所＞ 現在いません"
  - "＜滝川保健所＞ 現在いません"
  - "＜深川保健所＞ 現在いません"
  - "＜協力動物病院等＞ 現在いません"
