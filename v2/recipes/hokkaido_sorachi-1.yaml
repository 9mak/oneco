# 北海道 空知総合振興局 飼い主募集の犬・猫（/hk/kks/kainusibosyuinuneko.html）。岩見沢保健所・由仁支所・滝川・深川・協力動物病院等で飼い主を募集している犬・猫。
# 自由書式の CMS（div.ss-alignment が平らに並ぶ）。1 頭ごとに p「【令和８年9月30日掲載】」→ p（写真）→ p（紹介文と 仮名・種類・性別・年齢・体格）が兄弟で並ぶ。
# 「掲載】」の p を 1 頭の始まりにして、次の「掲載】」の p か h2・h4 の手前までまとめる。
# 北海道動物愛護センター「あいにきた」の節は「【令和８年８月４日更新】」で「掲載】」ではないので読まない（別の掲載元 spec_aniwel が載せている）。
# 「引取となりました」の注記がある子（協力動物病院で治療中の猫は 10/28 に引き取り先が決まった）は載せない。
# 0 頭の文言は節ごとに「現在いません。」と出るが、他の節に子がいる日にも出るので empty_text にしない（0 頭の日は「読めなかった」通知になる）。
rows: "p:has(> strong:-soup-contains('掲載】'))"
row_until: "p:has(> strong:-soup-contains('掲載】')), h2, h4"
row_filter:
  text_lacks: ["引取となりました"]
fields:
  species: {regex: "種\\s*類[:：]\\s*(犬|猫)"}
  name: {regex: "仮名[:：]\\s*(\\S+)"}
  breed: {regex: "種\\s*類[:：]\\s*[犬猫][、，]\\s*(\\S+)"}
  sex: {regex: "性\\s*別[:：]\\s*(\\S+)"}
  age: {regex: "年\\s*齢[:：]\\s*(\\S+)"}
  size: {regex: "体\\s*格[:：]\\s*(\\S+)"}
  note: {regex: "【(令和[^】]+?掲載)】"}    # 掲載日（収容日ではないので shelter_date にしない）
species:
  from: field
  map: {"犬": dog, "猫": cat}
image: "img@src"
