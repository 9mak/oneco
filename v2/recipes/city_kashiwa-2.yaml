# 柏市（譲渡対象動物） satoya.html — 自由テキスト形式。
# 1 頭 = div.col2_sp2_wrap（写真カード）の直後の <p><strong>名前</strong>（管理番号）。</p>。
# 性別・年齢・特徴は次の <p> 2 つに続くが、このカードと兄弟関係にあり recipe エンジンの
# フィールド抽出（row 配下の子要素検索のみ）では読めないため取得不可（名前・管理番号のみ）。
# 写真もこの名前 <p> の兄弟（1つ前）にあり同じ理由で取れない。
# species は直前の見出し <h3>猫</h3>/<h3>犬</h3> で決める。
rows: "div.col2_sp2_wrap + p"
fields:
  name: {regex: "^([^（(]+)"}
  management_no: {regex: "[（(]\\s*(\\d{4,6})\\s*[）)]"}
species:
  from: heading
  selector: "h3"
  map: {"猫": cat, "犬": dog}
empty_text:
  - "現在、譲渡可能な犬はおりません"
  - "現在、譲渡可能な猫はおりません"
  - "現在、譲渡可能な「犬と猫以外」の動物はおりません"
