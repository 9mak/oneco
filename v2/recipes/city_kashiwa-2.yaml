# 柏市（譲渡対象動物） satoya.html — 自由テキスト形式。
# 1 頭 = div.col2_sp2_wrap（写真カード）→ p 名前（管理番号）→ p 性別・生年 → p 性格（1〜3 つ）→ hr。
# row_until で写真カードから hr（または次の見出し h3）までをまとめて 1 行にする（T517）。
# 名前の p は row の中の「写真カードの直後の p」（div.col2_sp2_wrap + p）。トロワだけ名前と性別・生年が同じ p にあるので、
# 性別・年齢・note は行全体への regex で取る（note は「FeLV/FIV の検査結果」より後ろの文＝性格の説明）。
# species は直前の見出し <h3>猫</h3>/<h3>犬</h3> で決める（from: heading は始まりの要素＝写真カードの位置から探す）。
# 「※現在トライアル中です」（マヨ）のような状態の注記は項目にしていない（名前の p に混ざるだけで、除外もしていない）。
rows: "div.col2_sp2_wrap"
row_until: "hr, h3"
fields:
  name: {selector: "div.col2_sp2_wrap + p", regex: "^([^（(]+)"}
  management_no: {selector: "div.col2_sp2_wrap + p", regex: "[（(]\\s*(\\d{4,6})\\s*[）)]"}
  sex: {regex: "(オス|メス)"}
  age: {regex: "((?:\\d{4}年|\\d{4}\\.\\d{1,2}月)生\\s*[(（]推定[)）])"}
  note: {regex: "FIV\\s*[(（][+＋\\-−][)）]\\s*(.+)"}
species:
  from: heading
  selector: "h3"
  map: {"猫": cat, "犬": dog}
# 0 頭の根拠は置かない（W006 T631）。犬の文・犬と猫以外の文は猫がいる日に出る（2026-11 の実ページ、Wayback 2025-06〜2026-09 の 5 版）のに、
# 猫が 0 頭の日の文は見たことが無い（Wayback 2021〜2026 の 17 版すべてで猫は載っていた。「譲渡可能な猫はおりません」は一度も出ていない推測の文言）。
# 犬と猫以外の文だけで 0 頭にすると、猫の行が読めなくなった日を「本日は 0 頭」と通知なしで出してしまう。猫の 0 頭の文を確かめられたら
# empty_text_all [犬, 猫, 犬と猫以外] で復活させる。それまでは 0 頭の日は failed（通知に出る）。
