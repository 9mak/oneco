# いわき市保健所（保護している犬・猫） — city.iwaki.lg.jp/www/contents/1001000000358/index.html
# 2026-10-05 T519 新規作成（環境省リンク集から追加）。
# 構造: div.edit-item 直下に h2「保護犬情報について」→ 表（No. / 捕獲月日、場所、種類、毛色、性別、体格、特徴、画像）→ h3「収容犬の返還手続きについて」…
#   → h2「保護猫情報について」→ 表（No. / 保護月日 …同じ作り）。1 頭 = table 1 つ（項目名も値も td。写真は表の中の「画像」行）。
# 種別は直近の h2（犬／猫）。h3 の「収容犬の返還手続きについて」は h2 でないので影響しない。
# 日付は「８月12日」（年なし・全角）。収容日の項目名は犬が「捕獲月日」、猫が「保護月日」なので label は共通部分の「月日」。
# 未確認: 0 頭の日の文言（「現在、保護している犬はいません」等のはずだが実物は未確認）。empty_text は置かない（0 頭の日は「読めなかった」で通知に出る＝安全側）。
# 2026-10-08 T519 v2-g3: 2022 年の旧い作り（Wayback 2022-01〜2022-12 の 12 版）は表が div.edit-item でなく div.html.clearfix の中にあり、動物がいるのに 0 件で failed だった。
#   rows を「table」にして、row_filter（捕獲月日・保護月日）で動物の表だけ残す。2022〜2026 の 24 版で同じ頭数を確認（旧い作りは 12 版とも読める）。
rows: "table"
row_filter:
  text_has_any: ["捕獲月日", "保護月日"]
image: "img@src"
species:
  from: heading
  selector: "h2"
  map: {"犬": dog, "猫": cat}
fields:
  management_no: {label: "No."}
  shelter_date: {label: "月日"}
  location: {label: "場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  note: {label: "特徴"}
# 0 頭の日（2026-10-08 T519 v2-g3。Wayback 2024-06 で確認）: 犬の節が「現在、０頭です。」＋項目名だけの空の雛形の表（「No. ６- 捕獲月日 場所 …」）になる。
#   猫の節の「現在、０頭です。」は犬がいる日にも出る（猫 0 頭の日が多い）ので使えない。犬の雛形の表は項目名が「捕獲月日」（猫は「保護月日」）なので、
#   「０頭です。」の直後が犬の雛形（「No.」の後に年の番号の残り「６-」があってもなくても）のときだけ 0 頭にする。年の番号が違う雛形は読めなかった扱いになる（通知に出る＝安全側）。
empty_text:
  - "０頭です。 No. 捕獲月日"
  - "０頭です。 No. ６- 捕獲月日"
  - "０頭です。 No. ７- 捕獲月日"
  - "０頭です。 No. ８- 捕獲月日"
  - "０頭です。 No. ９- 捕獲月日"
