# 福山市動物愛護センター（迷い犬情報）
# 2026-10-04: 一覧表（番号/保護日/保護場所/種類/毛色/性別/掲載期間）には写真が無く、表の下の「迷い犬個別情報番号…」
# リンク先の個別ページ（/soshiki/dobutsuaigo/<id>.html）に写真・体格・推定年齢・備考がある。
# 以前は一覧表だけを読んで写真なしだったので、個別ページを follow_all で辿って 1 ページ = 1 頭（rows: body）にした。
# 個別ページは <h1>迷い犬個別情報ふ９－１</h1> + th/td の表（保護日・保護場所・種類・性別・毛色・体格・推定年齢・首輪・備考・掲載期限）。
# 0 頭のときは個別ページへのリンクが無く（follow_all が 0 件）、一覧表には全セル &nbsp; のプレースホルダ行だけが残る。
# empty_text は辿る前の入口ページ（visited）に対して照合される。
# 2026-10-05 監査: ページは「元の飼い主さんに犬をお返しするための情報提供」（迷い犬）なので、台帳の区分を保護中から迷子（stray）に直した（名前も「福山市（迷い犬）」）。レシピは変更なし。
steps:
  - follow_all: "a[href$='.html'][href*='/soshiki/dobutsuaigo/']@href"
rows: "body"
image: {selector: "img[src*='/uploaded/']@src"}
fields:
  management_no: {selector: "h1", regex: "個別情報(.+)$"}
  shelter_date: {label: "保護日", regex: "(\\d+年\\d+月\\d+日)"}
  location: {label: "保護場所"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  color: {label: "毛色"}
  size: {label: "体格"}
  age: {label: "推定年齢"}
  note: {label: "備考", default: null}
empty_text: ["現在、迷い犬の情報はありません", "現在、迷い犬情報はありません", "現在迷い犬の情報はありません"]
