# 2026-10-05 監査: 収容日（直前の h2「【収容日】…」から from: heading で）と毛色（品種・毛色・性別の行の 2 番目）を取るようにした
# 千葉県動愛センター本所（収容犬猫以外）。本所犬/猫と同一テンプレート想定
# (<h2>【収容日】...</h2> + <div class="col2"><div class="col2L"> に写真・管理番号・収容場所・品種等)。
# 現在は「収容されている動物はいません」の見出しのみで col2 ブロック自体が無い（0 頭）。
# 犬猫以外なので種別は判定できず allow_other で通す。
rows: "div.col2"
row_filter:
  text_lacks: ["2600000-01", "260000-00", "260000-0-0"]
image: "img@src"
fields:
  shelter_date:
    from: heading
    selector: "h2"
    regex: "(\\d+年\\d+月\\d+日)"
  color:
    regex: "収容場所】\\s*\\S+\\s+[^・\\s]+・([^・\\s]+)・"
  management_no:
    regex: "管理番号】\\s*([^\\s（(]+)"
  location:
    regex: "収容場所】\\s*([^\\s【]+)"
  breed:
    regex: "収容場所】\\s*\\S+\\s+([^・\\s]+)・"
  sex:
    regex: "(オス|メス)"
species:
  from: text
  allow_other: true
empty_text: ["収容されている動物はいません"]
