# さいたま市（保護犬） — 単一ページに動物カードが並ぶ single_page 形式。
# 1 頭 = p「管理番号 R08-8」→ p 写真 → ul 属性リスト（収容日… 備考）。1 頭目は div.wysiwyg_area 直下に平らに並び、
# 2 頭目以降は div に包まれていることがある（崩れ方がページごとに違う）。
# 「管理番号」の p を 1 頭の始まりにし、row_until で次の見出し h2（返還申請について）までをまとめる（T517）。
# 次の始まり（管理番号の p を含む div）の手前で自動的に止まるので、div に包まれた 2 頭目以降にも同じ作りで効く。
# 在庫 0 件でも全項目が空の「管理番号 R08-」だけの雛形カード（div でラップ）が常に 1 枚残る（写真 alt="作成用（要保存）" が目印）。
# 空欄は「収容日： 」の直後が即スペースになるので、row_filter.text_lacks で落とす。
# 管理番号は写真の alt（例: R8-8）から取る（ページ本文は R08-8 と 0 が入る表記。ID の安定のため今までの表記を維持）。
rows: "div.wysiwyg_area p:-soup-contains('管理番号')"
row_until: "h2"
row_filter:
  text_lacks: ["収容日： "]
image:
  selector: "img:not([alt*='作成用'])@src"
fields:
  management_no: {selector: "img:not([alt*='作成用'])", attr: "alt", regex: "[A-Za-z]?\\d+-\\d+"}
  shelter_date: {label: "収容日"}
  location: {label: "収容場所"}
  breed: {label: "種類"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  age: {label: "推定年齢"}
  note: {label: "備考"}
empty_text:
  - "管理番号 R08-"
  - "管理番号 R07-"
  - "管理番号 R09-"
