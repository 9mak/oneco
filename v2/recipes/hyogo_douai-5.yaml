# 兵庫県動物愛護センター 淡路支所の収容動物 https://hyogo-douai.sakura.ne.jp/hogo5.html
# 2026-10-05 T517: 一覧 shuuyou.html から follow_all で全 hogo*.html を辿っていたのを、支所ごとの slug に分けて url を各ページに固定した
#   （hyogo_douai = hogo1 センター / -2 = hogo2 三木 / -3 = hogo3 龍野 / -4 = hogo4 但馬 / -5 = hogo5 淡路。レシピは支所ごとに同じ形で 1 枚ずつ）。
#   どの支所に誰がいるか・どの支所の表が壊れたかが分かる。一覧の表（#sp-table-7）の <a> は収容が無い日も付いていて（2026-10-05: 龍野・淡路の犬にリンクがあるが両ページとも表は無い）、
#   リンクの有無では収容の有無を決められないので一覧は読まない。
# 各支所ページは #content 内に見出し「犬」「猫」(h1.entry-title) があり、その直後の div に収容が無ければ空欄のまま、あれば
#   <th>項目名</th><td>値</td> 形式の表が挿入される（HPBの「表を貼り付けてください」という空枠に手動で貼る運用）。表1つ=1頭。
#   （表が貼られた実物は未確認。2026-10-05 は全支所 0 頭）
# 0 頭の日にだけ出る文言・要素は無い（収容が無いページは表が無いだけで、「余白　これを削除してから表を貼り付けてください」の残骸も支所・日によって有ったり無かったり）。
#   empty_text は各ページの案内文（常に出る）に頼っている。表が出る日はそれより先に動物として読まれるので empty とは判定されない。
rows: "#content table"
image: "img@src"
fields:
  breed: {label: "種類"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  color: {label: "毛色"}
  size: {label: "大きさ"}
  shelter_date: {label: "収容日"}
  location: {label: "収容場所"}
species:
  from: heading
  selector: "h1.entry-title"
  map: {"犬": dog, "猫": cat}
# 「収容している犬・猫の情報を提供します」は各支所ページの案内文に必ず出る文言（0 頭の日だけの文言ではない）。
empty_text: ["収容している犬・猫の情報を提供します"]
