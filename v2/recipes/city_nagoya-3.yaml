# 名古屋市 飼主募集中の猫の情報コーナー
# 台帳の url (1015488.html) は制度説明ページで動物一覧を持たない。
# 実際の一覧は同ページ内リンク「飼主募集中の猫の情報コーナー」= 1017804.html。
# 構造: <h2>センター名：ネプ（06-0286）</h2> の直後に <p class="imagecenter"><img ...></p> が
# 1〜2 枚続くフラットな並び（h2/p を包む共通コンテナが無い）。
# 行 = h2 とし、名前・管理番号は見出しテキストの正規表現で取る。写真は行の後ろの兄弟（次の h2 の手前まで）の
# 1 枚目 = 紹介ポスター（image.scope: next_siblings、2026-10-05 T517）。2 枚目は健康状態の説明なので使わない。
url: https://www.city.nagoya.jp/kurashi/pet/1015473/1015483/1017804.html
rows: "article#content h2"
row_filter:
  text_has_any: ["センター名："]
image: {selector: "p.imagecenter img@src", scope: next_siblings}
fields:
  name: {regex: "センター名[:：]\\s*([^（(]+)"}
  management_no: {regex: "[（(](\\d{2}-\\d{4})[）)]"}
