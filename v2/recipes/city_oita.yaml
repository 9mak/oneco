# 大分市（保護犬）: index.html は説明文＋detail 記事1本へのリンクのみ。
# detail 記事内、"探しています" h2 配下に h3 見出し（例:「令和8年3月4日飼い主さんを探しています」）＋
# <ul>（保護した場所/種類/推定年齢/毛色/性別/体格/その他）＋<table>（写真）が兄弟要素として並ぶ。
# row_until で h3 から次の h3（または「お家がみつかりました」の h2）の手前までを 1 頭にまとめ、
# ul の項目と table の写真をその中から取る（2026-10-05 T517）。
# 「お家がみつかりました」節の見出しは「探しています」を含まないため row_filter で自然に除外される。
steps:
  - follow: "#tmp_contents a[href*='/kurashi/pet/']:not([href*='inunohogo'])@href"
rows: "#tmp_contents > h3"
row_until: "h2"
row_filter:
  text_has_any: ["探しています"]
fields:
  shelter_date: {selector: "h3", regex: "(令和\\s*\\d+\\s*年\\s*\\d+\\s*月\\s*\\d+\\s*日)"}
  location: {label: "保護した場所"}
  breed: {label: "種類"}
  age: {label: "推定年齢"}
  color: {label: "毛色"}
  sex: {label: "性別"}
  size: {label: "体格"}
  note: {label: "その他"}
empty_text:
  - "現在、保護収容している犬はいません"
  - "収容している犬はいません"
  - "現在いません"
