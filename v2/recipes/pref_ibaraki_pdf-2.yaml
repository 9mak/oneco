# 茨城県（迷い犬・猫情報） https://www.pref.ibaraki.jp/hokenfukushi/doshise/hogo/kouji.html
# 「動物指導センター公表情報」ページに直近 5 日分の公示 PDF (documents/kouhyou*.pdf) がある。
# PDF は 1 ページ 2 段組み（pdf.columns: 2 で左右を分けて読む）。空欄のテンプレート枡が並び、動物がいる枡だけ
# 「26-0684 市町村地区名 茨城町中石崎」で始まる。このサイトはラベルの意味が逆で、種類=品種、犬猫種=犬/猫。
# 2026-10-04: 負傷・衰弱は「備考」の 1 行上に単独で印字されるため note が全頭空だった。その行を note に拾うようにした
# （子犬・子猫の公表 PDF は別ページ → pref_ibaraki_pdf-3）。
steps:
  - pdf_links: "a[href*='documents/kouhyou'][href$='.pdf']"
pdf:
  mode: text
  columns: 2
rows_regex: "^\\d{2}-\\d{3,6}\\s+市町村地区名"
# 「おうちに帰れたワン！」バナー（飼い主の元へ戻った印）が重なった枡は収容中ではないので捨てる。
# バナー文字は行に混ざって「2026お/9う/17ちに」のように壊れるが、「帰れたワン！」の部分は 1 行で残る
row_filter:
  text_lacks: ["帰れたワン", "帰れたニャン", "帰れたにゃん"]
species:
  from: field
  map: {"犬": dog, "猫": cat}
fields:
  management_no: {regex: "^(\\d{2}-\\d{3,6})"}
  location: {regex: "市町村地区名\\s+(\\S+)"}
  shelter_date: {regex: "収容日\\s+(\\d{4}/\\d{1,2}/\\d{1,2})"}
  species: {regex: "犬猫種\\s+(犬|猫)"}
  breed: {regex: "種類\\s+(\\S+)\\s+犬猫種"}
  color: {regex: "毛色\\s+(\\S+)"}
  sex: {regex: "性別\\s+(\\S+)"}
  size: {regex: "体格\\s+(\\S+)"}
  note: {regex: "(?m)(?:(?<=備考 )\\S[^\\n]*|^(?:負傷|衰弱)$)"}   # 負傷・衰弱は「備考」の 1 行上に単独で出る。備考が同じ行に書かれているときはその文（空欄の枡の見出しを拾わない）
# 公示 PDF の見出し「… 公表分」は頭数 0 の日も出るので、PDF が取れて 1 頭も無ければ 0 頭とみなす
empty_text:
  - "公表分"
