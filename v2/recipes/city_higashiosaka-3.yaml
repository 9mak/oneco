# 東大阪市動物指導センター 新しい飼い主を探している猫たち（0000011324.html）。city_higashiosaka-2（犬）と同じ作り。
# 節は「新しい飼い主を募集中の猫(動物指導センター)」と「猫の出会い広場(ゆずりたい猫の一覧)」（市民間の仲介。載せない）の 2 つ。
# 個体は div.mol_imageblock。写真の alt がセンターは「譲渡対象猫の画像です。」、出会い広場は「譲りたい猫の画像です。」。
# 「個体番号」を含むブロックだけを 1 頭にする（猫の項目は「種類:… 性別:…」「毛色：… 体格:…」「年令：…」「備考：…」で、犬と違って「性格」は無く備考が説明）。
# 子がいる日の版は Wayback に見つからない（2025-03 と今日はセンター 0 頭）。今日のページに個体のブロックが HTML コメントの中に残っているので、その作りに合わせた。
# 0 頭の日は「現在、譲渡対象猫はいません。」が出る（子のいる日の版では確かめられないが、コメントで隠される作り）。
rows: "div.mol_imageblock:has(img[alt*='譲渡対象猫'])"
row_filter:
  text_has_any: ["個体番号"]
image: "img@src"
fields:
  management_no: {regex: "個体番号[:：]\\s*(\\S+)"}
  breed: {regex: "種類[:：]\\s*(\\S+)"}
  sex: {regex: "性別[:：]\\s*(\\S+)"}
  color: {regex: "毛色[:：]\\s*(\\S+)"}
  size: {regex: "体格[:：]\\s*(\\S+)"}
  age: {regex: "年(?:齢|令)[:：]\\s*(\\S+)"}
  note: {regex: "(?:性格|備考)[:：]\\s*(.+)"}
empty_text:
  - "現在、譲渡対象猫はいません"
