# 奈良市保健所（保護動物情報）
# 台帳 URL は「ペットの飼養・届出」一覧ページで、本文はお知らせ記事リンクの
# 一覧のみ（動物テーブルは直接載らない）。実際の収容動物情報は記事
# 「迷子犬・迷子猫をお探しの方へ」に載るので、そのリンクを辿る。
# 遷移先は 1 動物 = 縦並びラベル/値の table 1 つ（収容番号/収容年月日/
# 収容場所/種類/被毛/体格/性別/推定年齢/首輪等/写真）。複数収容中なら
# table が複数並ぶ想定。
steps:
  - follow_text: "迷子犬・迷子猫をお探しの方へ"
rows: "table"
image: "img@src"
fields:
  management_no: {label: "収容番号"}
  shelter_date: {label: "収容年月日"}
  location: {label: "収容場所"}
  species: {label: "種類"}
  breed: {label: "種類"}
  color: {label: "被毛"}
  size: {label: "体格"}
  sex: {label: "性別"}
  age: {label: "推定年齢"}
  # 「首輪等」の値自体が「首輪等装着なし…」のように見出し語を含み、
  # label 参照だと次の行（写真）を誤って拾うため regex で切り出す
  note: {regex: "首輪等\\s*(.+?)\\s*写真"}
species:
  from: field
  map: {"犬": dog, "猫": cat}
empty_text:
  - "現在、迷子犬・迷子猫はいません"
  - "現在、収容している犬・猫はいません"
  - "現在収容している犬はいません"
  - "現在収容している猫はいません"
