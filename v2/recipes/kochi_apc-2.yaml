# 高知県中央・中村小動物管理センター 迷子情報（/maigo/）。譲渡情報（kochi_apc。/jouto/）とは別のページで、「飼い主さんの迎えを待つ犬・猫」。
# 作りは kochi_apc と同じ: 一覧のカード（div.tab-animal-card）の「詳細はこちら」（/center-data/…）を個体ページ方式（follow_all）で 1 頭 = 1 ページとして辿る。
# 個体ページは <table><tr><th>ラベル</th><td>値</td></tr>。犬猫の別は個体ページ上部の区分リンク（maigojouto_cat=center_maigo_inu / center_maigo_neko）で決める
# （譲渡の個体ページは center_jouto_inu / _neko）。迷子は収容日の 6 日目後に順次「譲渡対象情報」へ移るので、同じ子が kochi_apc に移ることがある（移ると /maigo/ の一覧からは消える）。
# 2026-11-17 時点は 9 件（犬 6・猫 3。収容日は 2024-05〜2026-10）。0 頭の日の版は Wayback に見つからない（2025-07〜2026-05 の 5 版は 20 件前後が載る）ので文言は分からない。
# 枠（h2「迷子情報」）はあるがカードも詳細へのリンクも無い日だけ 0 頭にする。
url: https://kochi-apc.com/maigo/
steps:
  - follow_all: "a.animal-more[href*='/center-data/']@href"
rows: "body"
row_filter:
  text_lacks: ["譲渡決定 更新日"]
image: "ul.animal-slider img@src"
fields:
  management_no: {label: "管理番号"}
  name: {label: "仮名"}
  breed: {label: "品種"}
  sex: {label: "性別"}
  age: {label: "年齢"}
  color: {label: "毛色"}
  size: {label: "体格"}
  shelter_date: {label: "保護した日時"}
  location: {label: "保護した場所"}
  note: {label: "備考"}
  species: {selector: "a[href*='maigojouto_cat=']", attr: "href", default: ""}
species:
  from: field
  map: {"center_maigo_inu": dog, "center_maigo_neko": cat}
empty_absent:
  page: "h2:-soup-contains('迷子情報')"
  none: "div.tab-animal-card, a[href*='/center-data/']"
