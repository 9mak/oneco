# 松本市 新しい飼い主を探している犬の情報（1529）。h2「保健所の譲渡対象犬」の下に h4「保健所譲渡犬No.7-3」+ p(img 複数) + table（caption 掲載日・
# 犬種・性別・毛色・年齢・体格・不妊去勢手術・飼育場所・医療費等の負担・備考）。h2「個人の譲渡対象犬」は 2026-10-05 は
# 「現在、譲渡対象犬の情報はございません。」。個人の犬が載った日の形は未確認（猫ページ -5 の個人譲渡と同じく h 見出し + table + 掲載希望者の連絡先と推測）。
# 同じ h4 の「譲渡条件」「譲渡のながれ」は table が無く「犬の情報」の見出しも無いので row_filter で落ちる。掲載希望者（個人の連絡先）が載る場合も取らない。
# 動物の見出しは日によって h3（2022〜2023-02。「保健所譲渡犬No.4-3」「ボランティア譲渡対象犬No.4-3」）だったり h4（2024-03 以降）だったりするので両方を始まりにする。
# 動物かどうかは table の見出し「犬の情報」で決める（以前は caption の「掲載日」で決めていて、掲載日の無い保健所の犬 No.5-3 〔2024-03〕を取りこぼした）。
# 1 掲載に複数頭がまとまる「譲渡犬No.5-2（7頭）」（個体は PDF の一覧）は 1 件として載る（掲載のとおり）。
# 1 掲載に犬が 2 頭並ぶ表（2024-10 の 譲渡犬No.6-1。犬種の欄が列ごとに「譲渡されました」「募集中です」）は、このレシピが 1 頭目、city_matsumoto-9 が 2 頭目を読む。
# 「譲渡されました」の印が犬種の欄に書かれた子は載せない（以前は 1 頭目の譲渡済みの子を載せていた）。
# 2026-11-07 監査: 見出しが「保健所譲渡犬No.8-1　募集を停止しています」の子は募集していないので載せない（理由は掲載元に書いていない）。
# text_lacks だと行に数えられず、全頭が募集停止の日に 0 頭と確定できず failed になるので、見出しを項目 recruit_mark に読んで field_lacks で落とす（2026-11-08）。
# 案内見出し「個人やボランティアの方の譲渡対象犬の譲り受けを希望する方へ」は動物でないので rows に入れない（行に残すと全行除外にならない。除外に数えると、犬の見出しが読めなくなった日にこの行だけで 0 頭と確定してしまう）。
# 全行除外の 0 頭の根拠は、募集停止の印が全部の犬の見出しで読めたことと、ページの h1（empty_container）。
# 0 頭の日は、犬の情報の表（th「犬の情報」）が 1 つも無いこと（保健所・個人とも「現在、譲渡対象犬の情報はございません。」）で確かめる。
rows: "h3:not(:-soup-contains('譲り受けを希望する方へ')), h4:not(:-soup-contains('譲り受けを希望する方へ'))"
row_until: "h2, h3, h4"
row_filter:
  text_has_any: ["犬の情報"]
  text_lacks: ["募集を終了しました"]   # 2025-08 の見出し「募集を終了しました」の子（T519 ゲート F-03）
  field_lacks: {breed: ["譲渡されました", "譲渡済"], note: ["譲渡されました", "譲渡済", "新しい飼い主が見つかりました"], recruit_mark: ["募集を停止しています"]}
image: {selector: "img@src", exclude: ["5-28-2"]}
fields:
  management_no: {selector: "h3, h4", regex: "No[.．]?\\s*(\\S+)"}
  recruit_mark: {selector: "h3, h4"}
  breed: {label: "犬種"}
  sex: {label: "性別"}
  color: {label: "毛色"}
  age: {label: "年齢"}
  size: {label: "体格"}
  note: {label: ["備考", "性格・その他"]}
empty_absent:
  page: "h1:-soup-contains('新しい飼い主を探している犬の情報')"
  none: "table:has(th:-soup-contains('犬の情報'))"
empty_container: "h1:-soup-contains('新しい飼い主を探している犬の情報')"
