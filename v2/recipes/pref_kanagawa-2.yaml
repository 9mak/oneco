# 神奈川県動物愛護センター「疾病等により動物病院で保護されている猫の情報」（台帳名は保護猫だが実ページは病院収容の猫）。
# 一覧本文には表が無く、PDF を1本落とす。表は No/収容日(受付日)/掲載期限/種類/毛色/体格/性別/収容場所/時間/首輪等の列。
# 2026-10-05 監査: note を「時間」（収容時刻）から「首輪等」（青・星柄 等。「無」は空）に替えた。
steps:
  - pdf_links: "a[href$='.pdf']@href"
pdf:
  mode: table
  header_row: 0
fields:
  management_no: {header: "Ｎｏ"}
  shelter_date: {header: "収容日"}
  breed: {header: "種類"}
  color: {header: "毛色"}
  size: {header: "体格"}
  sex: {header: "性別"}
  location: {header: "収容場所"}
  note: {header: "首輪等", regex: "^(?!無$|なし$)(.+)$"}   # 首輪の色・柄（「無」は載せない）。旧: 時間（収容した時刻 14:40 等）を備考にしていた
empty_text:
  - "現在、収容期間中の猫はいません"
