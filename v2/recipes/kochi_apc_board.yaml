# 高知県中央・中村小動物管理センター アニマルステーション（市民の登録する掲示板）の区分ごとの一覧。kochi_apc-3〜-6（迷子の猫・犬を探している／迷子の猫・犬を保護している）で共用する。
# 掲載漏れの棚卸し（2026-11-18 W006 T640 3 回目）。おまえさん決定: 迷子（探している・保護している）は載せ、飼えなくなった飼い主からの譲渡（「猫を譲りたい人」）は載せない。
# 一覧のカード（ul.animal-card-item > li.unit）に、区分のリンク・管理番号・仮名・種類・性別・首輪・「詳細はこちら」・更新日が出る。猫か犬かは台帳の species で決まる（区分ごとに一覧が分かれる）。
# 個体ページ（/28487/ など）は辿らない: 「提供者住所」（投稿した市民の住所）が出るため。「詳細はこちら」のリンクは元ページのリンク（detail）にする。
# 1 つの投稿が複数の区分に入ることがある（08J05 は「猫を譲りたい人」と「迷子の猫を保護している」の両方）。カードの区分のリンク（div.card-bosyu a）は class が区分名になる（maigo-hogo-neko・yuzuru-neko 等）。
#   「迷子の…を保護している」（class が maigo-hogo-）の区分が付いたカードは、「譲りたい人」が一緒に付いていても載せる（市民が保護している子もほかの子と同じに載せる。POLICY.md 方針 6・7。2026-11-23。以前は譲渡の投稿として丸ごと外していた）。
#   「譲りたい人」だけの区分のカード（飼い主の手放し。方針 41 でリンクのみ）は読まない。探している区分の一覧に混ざった「譲りたい人」のカードも従来どおり読まない。
#   2026-11-23 の「迷子の猫を保護している」は 08J05 の 1 件で、載せるカードは 1。0 頭は、一覧の枠（div.animal-card）はあるが載せるカード（li）が 1 つも無い日。
#   0 頭の実物: 犬の 2 区分は今日カードの無い一覧（空の ul.animal-card-item）。猫も、探している猫 2026-06-10・保護している猫 2026-01-14 の Wayback が同じ空の一覧（子のいる日 2025-03・2025-09・今日は li.unit が並ぶ）。
#   保護している猫 2025-09 の 07M06 は譲渡の区分が付かない投稿（管理番号 M）。
#   カードの作りが変わった日（li は残るが表が読めない）は、載せる行が取れず 0 頭とは言わないので failed で通知される。
# 管理番号（08M04 等）は掲示板の通し番号で、同じ番号が 2 件の別の子に付く日がある（Wayback 2025-03 の 06M22 が「mn」と「ちゃー」）。管理番号の項目にすると、写真の無い子の ID が管理番号から作られて衝突し 1 件が消える
#   ので、note に「管理番号：08M04」と出し、ID は写真、写真が無ければ個体ページの URL（/28487/ の投稿 ID）から作る。
# 写真: 「写真がありません」の仮画像（themes/animal_ver2/img/no-image.png）は写真にしない。
# ページ送り: WP-PageNavi の「次へ」（a.nextpostslink）があれば辿る。今日はどの区分も 1 ページ（3 件以内）、Wayback 5 版（最大 7 件）にも無く、実物は未観測（未検証。無ければ何もしない）。
steps:
  - paginate: "div.wp-pagenavi a.nextpostslink@href"
rows: "ul.animal-card-item > li.unit:not(:-soup-contains('譲りたい人')), ul.animal-card-item > li.unit:has(a[class^='maigo-hogo-'])"
image: {selector: "div.card-img img@src", exclude: ["no-image"]}
fields:
  name: {label: "仮名"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  note: {label: "管理番号", prefix: "管理番号："}
  detail: {selector: "a.animal-more", attr: "href"}
empty_absent:
  page: "div.animal-card ul.animal-card-item"
  none: "div.animal-card ul.animal-card-item li:not(:-soup-contains('譲りたい人')), div.animal-card ul.animal-card-item li:has(a[class^='maigo-hogo-'])"
