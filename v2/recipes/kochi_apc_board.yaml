# 高知県中央・中村小動物管理センター アニマルステーション（市民の登録する掲示板）の区分ごとの一覧。kochi_apc-3〜-6（迷子の猫・犬を探している／迷子の猫・犬を保護している）で共用する。
# 掲載漏れの棚卸し（2026-11-18 W006 T640 3 回目）。おまえさん決定: 迷子（探している・保護している）は載せ、飼えなくなった飼い主からの譲渡（「猫を譲りたい人」）は載せない。
# 一覧のカード（ul.animal-card-item > li.unit）に、区分のリンク・管理番号・仮名・種類・性別・首輪・「詳細はこちら」・更新日が出る。猫か犬かは台帳の species で決まる（区分ごとに一覧が分かれる）。
# 個体ページ（/28487/ など）は辿らない: 「提供者住所」（投稿した市民の住所）が出るため。「詳細はこちら」のリンクは元ページのリンク（detail）にする。
# 1 つの投稿が複数の区分に入ることがある（08J05 は「猫を譲りたい人」と「迷子の猫を保護している」の両方。管理番号の J は譲渡の投稿）。「譲りたい人」の区分が付いたカードは譲渡の投稿なので載せない。
#   2026-11-18 の「迷子の猫を保護している」はこの 1 件だけで、載せるカードは 0。0 頭は、一覧の枠（div.animal-card）はあるが「譲りたい人」の付かないカード（li）が 1 つも無い日。
#   犬の 2 区分は今日カードの無い一覧（空の ul.animal-card-item）で、0 頭の実物（猫の区分に子がいる日には、猫の一覧に li.unit が並ぶ）。
#   カードの作りが変わった日（li は残るが表が読めない）は、載せる行が取れず 0 頭とは言わないので failed で通知される。
# 写真: 「写真がありません」の仮画像（themes/animal_ver2/img/no-image.png）は写真にしない。
# ページ送り: WP-PageNavi の「次へ」（a.nextpostslink）があれば辿る。今日はどの区分も 1 ページ（3 件以内）で実物は未観測。
steps:
  - paginate: "div.wp-pagenavi a.nextpostslink@href"
rows: "ul.animal-card-item > li.unit"
row_filter:
  text_lacks: ["譲りたい人"]
image: {selector: "div.card-img img@src", exclude: ["no-image"]}
fields:
  management_no: {label: "管理番号"}
  name: {label: "仮名"}
  breed: {label: "種類"}
  sex: {label: "性別"}
  detail: {selector: "a.animal-more", attr: "href"}
empty_absent:
  page: "div.animal-card ul.animal-card-item"
  none: "div.animal-card ul.animal-card-item li:not(:-soup-contains('譲りたい人'))"
