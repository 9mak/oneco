name: Deploy Collector Job

# 収集ジョブ (Cloud Run Jobs) のイメージを再ビルドして差し替える。
# 実行スケジュールは Cloud Scheduler (0:00 JST) が持つ。ここはデプロイのみ。
#
# 移設の経緯: GitHub Actions ランナーの IP 帯が複数自治体サイトから
# 累積アクセスペナルティを受けるため、収集の実行を GCP asia-northeast1 へ移した
# (T048/T049)。deploy-backend.yml と同じ WIF (キーレス) 認証を使う。

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile.collector'
      - 'cloudbuild-collector.yaml'
      - 'scripts/collector_entrypoint.sh'
      - 'pyproject.toml'
      - 'setup.py'
      - '.github/workflows/deploy-collector.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-collector
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # deploy-backend.yml と同じガード: GCP 未設定のフォークでは何もしない
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
      JOB_NAME: oneco-collector

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build collector image
        run: |
          gcloud builds submit \
            --project "$GCP_PROJECT_ID" \
            --config cloudbuild-collector.yaml \
            --substitutions "_TAG=${GITHUB_SHA}" \
            --gcs-log-dir "gs://${GCP_PROJECT_ID}_cloudbuild/build-logs" \
            --suppress-logs \
            .

      # ジョブ構成はここに完全宣言する (単一の真実源・review-20260814-pr272 F-01/F-02)。
      # GCP コンソール側での手変更はこのステップの次回実行で宣言値に戻る。
      # - task-timeout 18000s (5h): 旧 Actions 版の timeout-minutes: 300 と同値。
      #   Cloud Run Jobs の既定 (10分) のままだと毎晩サイレントに打ち切られる
      # - SITE_TIMEOUT_SEC/JS: 旧 Actions 版と同値 (コード既定の 300/360 より厳しい)
      # - SLACK_WEBHOOK_URL は GitHub secrets に存在しないため設定しない (Discord のみ)
      # - GIT_STATE_DEPLOY_KEY (T112, 2026-08-31): 旧 GIT_DEPLOY_KEY から改称。
      #   9mak/oneco 本体への読み書き両用鍵から、状態ファイル専用の private
      #   リポジトリ 9mak/oneco-state だけに書き込める鍵へ縮小した。
      #   Secret Manager 側の新規シークレット登録・値の反映は別途 CCC が実施する。
      - name: Update Cloud Run Job (image + declared config)
        run: |
          gcloud run jobs update "$JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "asia-northeast1-docker.pkg.dev/${GCP_PROJECT_ID}/oneco/oneco-collector:${GITHUB_SHA}" \
            --service-account "oneco-collector-job@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --set-env-vars "SITE_TIMEOUT_SEC=120,SITE_TIMEOUT_JS_SEC=180" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,GROQ_API_KEY=GROQ_API_KEY:latest,DISCORD_WEBHOOK_URL=DISCORD_WEBHOOK_URL:latest,GIT_STATE_DEPLOY_KEY=GIT_STATE_DEPLOY_KEY:latest" \
            --task-timeout 18000 \
            --cpu 2 \
            --memory 2Gi \
            --max-retries 0
