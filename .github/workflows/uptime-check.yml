name: Uptime Check

# Cloud Run /health と Vercel フロント top + 代表 /areas ページの死活を 30 分毎に外形監視。
# 失敗時のみ Discord に通知し、CI status も failure にして GitHub 上にも残す。
#
# /areas を含める理由 (PR #229 の教訓): 日本語スラッグの SSR サブルートが
# x-next-cache-tags ヘッダーで 500 を出していたのに、監視が top + /health + API
# だけで SSR サブルートを見ておらず約2週間気づけなかった。代表1県 (東京都) を
# 200 アサートして、SSR サブルート全般が死んだら気づける盲点埋めにする。
#
# 画像レイヤーを含める理由 (issue #237, 2026-07-07 の教訓): Vercel 画像最適化の
# クォータ超過 (402) で「ページは 200・サムネイルだけ全滅」が起き、HTML しか
# 見ない監視では検知できなかった。トップページが実際に参照している画像 URL を
# 動的に抽出して 200 + image/* をアサートする (固定 URL だと元画像が自治体側で
# 消えたときに誤検知するため動的抽出)。
#
# 設計判断:
# - スケジュール遅延: GitHub Actions cron は best-effort で 5〜15+分の遅延が普通。
#   検知 RTO は「およそ 30〜60 分以内」程度と理解すること（tight RTO は無理）。
# - チェックは浅く: HTTP 200 のみ確認。「/health が 200」≠「API が正しい」だが、
#   uptime の altitude では適切。深い機能チェックには昇格しない。
# - リトライ: 単発の transient エラー（GCP 一瞬の 5xx・ネットワーク）で flap して
#   誤通知すると alert 疲労を起こすので、3 回試行・各 5 秒間隔で「本当に落ちている」
#   を確証してから通知する。
# - 60 日ルール: GitHub は 60 日リポジトリ無活動で schedule を自動 disable する。
#   現状アクティブなので非問題だが、知識として残す。
# - force_failure 入力: 配線確認用。意図的に 404 を踏んで Discord 通知パスを
#   実地検証できる（PR #213 で _send_discord_alert を直接呼んだ精神と同じ）。

on:
  schedule:
    - cron: '*/30 * * * *'  # 30 分毎
  workflow_dispatch:
    inputs:
      force_failure:
        description: '配線テスト: true で意図的に失敗 URL を踏んで Discord 通知到達確認'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: https://oneco-api-tvlsrcvyuq-an.a.run.app/health
      FRONTEND_URL: https://frontend-psi-ten-73.vercel.app/
      # 代表的な日本語スラッグの SSR サブルート (東京都 = %E6%9D%B1%E4%BA%AC%E9%83%BD)。
      # URL エンコード済みで渡す (TARGETS はスペース区切りで分割するため非エンコード日本語は不可)。
      AREAS_URL: https://frontend-psi-ten-73.vercel.app/areas/%E6%9D%B1%E4%BA%AC%E9%83%BD
      RETRY_COUNT: '3'
      RETRY_WAIT_SEC: '5'
      CURL_TIMEOUT_SEC: '15'
      # 収集鮮度の許容上限 (時間)。/health の last_collected_at がこれ以上古ければ失敗。
      # 収集は日次 15:00 UTC 開始で 20 分前後。GitHub の schedule cron は best-effort で
      # 数十分遅れるため、24h ちょうどだと正常時にも鳴る。26h なら「1 回飛ばしたら鳴り、
      # 正常運用では鳴らない」線になる (2026-08-06 の障害なら 8/6 18:57 UTC に鳴っていた)。
      FRESHNESS_MAX_HOURS: '26'
    steps:
      - name: Probe targets
        id: probe
        env:
          FORCE_FAILURE: ${{ inputs.force_failure }}
        run: |
          set -u  # 未定義変数で fail（-e は失敗ターゲットがあっても集計を続けるためあえて入れない）

          # force_failure=true なら、意図的に存在しないパスをチェックリストに混ぜる
          # （実 endpoint も並行に確認するので片方でも落ちれば通知 = 配線検証になる）。
          if [ "$FORCE_FAILURE" = "true" ]; then
            FORCED_URL="https://oneco-api-tvlsrcvyuq-an.a.run.app/__uptime_force_failure__"
            echo "::warning::force_failure=true なので意図的に $FORCED_URL を含めます（Discord 通知の配線検証）"
            TARGETS="backend=$BACKEND_URL frontend=$FRONTEND_URL areas=$AREAS_URL forced_failure=$FORCED_URL"
          else
            TARGETS="backend=$BACKEND_URL frontend=$FRONTEND_URL areas=$AREAS_URL"
          fi

          FAILURES=""
          DETAILS=""

          for entry in $TARGETS; do
            name="${entry%%=*}"
            url="${entry#*=}"
            echo "[$name] $url"

            last_status=""
            last_err=""
            ok=0

            for attempt in $(seq 1 "$RETRY_COUNT"); do
              # -s: silent, -S: show errors, -o /dev/null: 本文捨てる, -w '%{http_code}'
              # --max-time: 全体タイムアウト, -L: redirect 追跡（フロントの 308 など）
              status="$(curl -sS -L -o /dev/null --max-time "$CURL_TIMEOUT_SEC" \
                          -w '%{http_code}' "$url" 2>/tmp/curl_err_$$ || echo '000')"
              last_status="$status"
              last_err="$(cat /tmp/curl_err_$$ 2>/dev/null || true)"
              echo "  attempt $attempt: HTTP $status"

              if [ "$status" = "200" ]; then
                ok=1
                break
              fi

              if [ "$attempt" -lt "$RETRY_COUNT" ]; then
                sleep "$RETRY_WAIT_SEC"
              fi
            done

            if [ "$ok" = "1" ]; then
              continue
            fi

            FAILURES="$FAILURES $name"
            DETAILS="$DETAILS\n- $name: HTTP $last_status ($url)"
            if [ -n "$last_err" ]; then
              # curl のエラーメッセージ（DNS 失敗・SSL 失敗・timeout 等）も拾う
              DETAILS="$DETAILS\n  curl_err: $last_err"
            fi
          done

          # --- 画像レイヤーのチェック (issue #237) ---
          # ページ 200 でも画像だけ全滅する障害 (2026-07-07 Vercel 402) を検知する。
          IMG_URL="$(curl -sS -L --max-time "$CURL_TIMEOUT_SEC" "$FRONTEND_URL" 2>/dev/null \
            | grep -oE 'https://wsrv\.nl/\?[^" ]+' | head -1 | sed 's/&amp;/\&/g')"
          if [ -z "$IMG_URL" ]; then
            # 画像なし動物のみ表示中など、正当に 0 件の可能性があるため fail にはしない
            echo "::warning::[image] トップページに wsrv.nl 画像が見つからずスキップ"
          else
            echo "[image] $IMG_URL"
            last_status=""
            last_ctype=""
            ok=0
            for attempt in $(seq 1 "$RETRY_COUNT"); do
              resp="$(curl -sS -L -o /dev/null --max-time "$CURL_TIMEOUT_SEC" \
                        -w '%{http_code} %{content_type}' "$IMG_URL" 2>/tmp/curl_err_$$ || echo '000 -')"
              last_status="${resp%% *}"
              last_ctype="${resp#* }"
              echo "  attempt $attempt: HTTP $last_status ($last_ctype)"
              case "$last_status $last_ctype" in
                "200 image/"*) ok=1; break ;;
              esac
              if [ "$attempt" -lt "$RETRY_COUNT" ]; then
                sleep "$RETRY_WAIT_SEC"
              fi
            done
            if [ "$ok" != "1" ]; then
              FAILURES="$FAILURES image"
              DETAILS="$DETAILS\n- image: HTTP $last_status content-type=$last_ctype ($IMG_URL)"
            fi
          fi

          # --- 収集鮮度のチェック ---
          # 「収集が丸ごと落ちた」を検知する。2026-08-06 の GitHub Actions 障害では
          # Data Collector の job が runner を確保できず steps が1つも実行されないまま
          # cancelled になり、job 内の通知ステップ (if: failure()) も走らず完全に無音で
          # 1日分の収集が飛んだ。ジョブの中から自分の失敗を通知する方式では原理的に
          # 拾えないため、公開データの鮮度という「症状」を外から見る。
          # 原因 (runner 未割当・adapter 全滅・DB 書き込み失敗・デプロイ事故) を問わず
          # 1本で拾えるのが、ワークフローの成否を見る方式に対する利点。
          LAST_COLLECTED="$(curl -sS -L --max-time "$CURL_TIMEOUT_SEC" "$BACKEND_URL" 2>/dev/null \
            | jq -r '.last_collected_at // empty' 2>/dev/null || true)"
          if [ -z "$LAST_COLLECTED" ]; then
            # backend 自体が落ちていれば上の backend チェックが既に拾っている。
            # ここで二重に fail させると原因が読みにくくなるので warning に留める。
            echo "::warning::[freshness] last_collected_at を取得できずスキップ"
          else
            LAST_EPOCH="$(date -u -d "$LAST_COLLECTED" +%s 2>/dev/null || echo '')"
            if [ -z "$LAST_EPOCH" ]; then
              echo "::warning::[freshness] last_collected_at をパースできずスキップ ($LAST_COLLECTED)"
            else
              AGE_HOURS=$(( ( $(date -u +%s) - LAST_EPOCH ) / 3600 ))
              echo "[freshness] last_collected_at=$LAST_COLLECTED (${AGE_HOURS}h前)"
              if [ "$AGE_HOURS" -ge "$FRESHNESS_MAX_HOURS" ]; then
                FAILURES="$FAILURES freshness"
                DETAILS="$DETAILS\n- freshness: 最終収集から ${AGE_HOURS} 時間経過 (閾値 ${FRESHNESS_MAX_HOURS}h, last_collected_at=$LAST_COLLECTED)"
              fi
            fi
          fi

          if [ -n "$FAILURES" ]; then
            FAILURES_TRIMMED="$(echo "$FAILURES" | xargs)"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "failed_targets=$FAILURES_TRIMMED" >> "$GITHUB_OUTPUT"
            # multiline output (heredoc)
            {
              echo 'details<<EOF'
              printf '%b' "$DETAILS"
              echo
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::uptime check 失敗: $FAILURES_TRIMMED"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::全ターゲット 200 OK"
          fi

      - name: Notify Discord on failure
        if: steps.probe.outputs.failed == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FAILED_TARGETS: ${{ steps.probe.outputs.failed_targets }}
          DETAILS: ${{ steps.probe.outputs.details }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL 未設定。Discord 通知はスキップ"
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CONTENT=":rotating_light: oneco uptime check 失敗
          失敗ターゲット: $FAILED_TARGETS
          詳細:
          $DETAILS
          run: $RUN_URL"
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$DISCORD_WEBHOOK_URL" \
            || echo "::warning::Discord webhook 送信に失敗"

      - name: Fail step on uptime failure
        if: steps.probe.outputs.failed == 'true'
        # GitHub Actions の status を failure にして UI 上でも目立たせる
        # （Discord 通知が万一届かなくても GitHub の email/notif で気づける二重ガード）。
        run: exit 1
