name: Sync Collector Secrets to Secret Manager

# GitHub Actions secrets を GCP Secret Manager へ複製する (手動起動のみ)。
# 収集ジョブの GCP 移設 (T049) で、シークレット値をローカル端末に経由させずに
# Secret Manager へ登録するための one-shot ワークフロー。
# 値を変更したときも、GitHub secret を更新 → これを再実行すれば新しい
# バージョンが追加される (Cloud Run Job は :latest を参照)。

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Sync secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          sync_secret() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::notice::$name は GitHub secret が空のためスキップ"
              return 0
            fi
            if ! gcloud secrets describe "$name" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$name" --project "$GCP_PROJECT_ID" \
                --replication-policy user-managed --locations asia-northeast1
            fi
            printf '%s' "$value" | gcloud secrets versions add "$name" \
              --project "$GCP_PROJECT_ID" --data-file=-
            echo "::notice::$name を同期した"
          }
          sync_secret DATABASE_URL        "$DATABASE_URL"
          sync_secret GROQ_API_KEY        "$GROQ_API_KEY"
          sync_secret DISCORD_WEBHOOK_URL "$DISCORD_WEBHOOK_URL"
