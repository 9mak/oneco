# Backend (FastAPI) を Cloud Run にデプロイするワークフロー（雛形）。
#
# 現状 backend は手動 `gcloud run deploy` でデプロイしているため、これを
# レビュー可能・再現可能な GitHub Actions に置き換える。Workload Identity
# Federation（WIF, キーレス。GCP 推奨）で認証する。
#
# ⚠️ 有効化の前提（未設定だと job は安全にスキップされる）:
#   1. GCP 側で WIF プールとプロバイダを作成し、デプロイ用サービスアカウント
#      （Cloud Run Admin / Artifact Registry Writer / Cloud Build Editor /
#       Service Account User 相当）にこのリポジトリからの借用を許可する。
#   2. リポジトリ Variables（Settings > Secrets and variables > Actions > Variables）:
#        GCP_PROJECT_ID   … GCP プロジェクト ID（これが空なら job はスキップ）
#        GCP_REGION       … 例 asia-northeast1（未設定時は下記 default）
#        GCP_AR_REPO      … Artifact Registry リポジトリ名（未設定時 oneco）
#        GCP_SERVICE      … Cloud Run サービス名（未設定時 oneco-api）
#        CORS_ORIGINS     … 本番フロントの URL（例 https://oneco.vercel.app）
#        SITE_URL         … フィード等で使う本番サイト URL（例 https://oneco.vercel.app）
#   3. リポジトリ Secrets:
#        GCP_WIF_PROVIDER     … projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#        GCP_SERVICE_ACCOUNT  … deploy-bot@<project>.iam.gserviceaccount.com
#        DATABASE_URL         … Supabase 接続 URL（既存。収集用と共用可）
#                               ※ Cloud Run へは Secret Manager 経由で渡す。
#                                 この Secret は runner 上の alembic 用
#        INTERNAL_API_TOKEN   … 内部 API 認証トークン（Vercel 側と同一値）
#                               ※ Cloud Run へは Secret Manager 経由で渡す。
#                                 この Secret は Vercel と値を揃えるための原本
#   4. Secret Manager（Cloud Run 実行時に参照。T425）:
#        DATABASE_URL、INTERNAL_API_TOKEN
#
# トリガーは workflow_dispatch（手動）と main への push の両方。push は
# 2026-06-15 に WIF 配線と end-to-end 検証を終えて有効化済みで、下の paths に
# このワークフロー自身も含まれるため、**このファイルを変更して main に入れると
# 自動デプロイが走る**。「段階導入のため workflow_dispatch のみ」という古い記述が
# 残っていたのを実態に合わせて直した (2026-09-19)。

name: Deploy Backend (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      run_migration:
        # push(自動CD)では常に migration を実行するため、このトグルは
        # workflow_dispatch で手動デプロイするときだけ効く。
        description: '手動デプロイ時に alembic upgrade head を実行する (push では常に実行)'
        type: boolean
        default: false
  # src/Dockerfile 等のバックエンド変更が main に入ると自動デプロイ。
  # (2026-06-15 WIF 配線完了・workflow_dispatch で end-to-end 検証済みのため有効化)
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'alembic/**'
      - '.github/workflows/deploy-backend.yml'

# WIF にはこの 2 つの権限が必須
permissions:
  contents: read
  id-token: write

# 同一ワークフローの多重実行を直列化する (deploy-collector.yml と同型)。
# 2026-08-07 に PR を数秒差で 3 件連続マージした際、本ワークフローが並行実行され
# 最古コミットのビルドが後勝ちでデプロイされ、さらに alembic upgrade head の並行
# 実行で DuplicatePreparedStatementError が発生した (T040)。
# cancel-in-progress は false にする: true にすると進行中のデプロイ (Cloud Run へ
# の反映や alembic migration) を中断してしまい、中途半端な状態が残るリスクがある。
# 代わりにキューイングして直列化し、後続の push は先行デプロイの完了を待つ。
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
  GCP_AR_REPO: ${{ vars.GCP_AR_REPO || 'oneco' }}
  GCP_SERVICE: ${{ vars.GCP_SERVICE || 'oneco-api' }}

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    # GCP 未設定のリポジトリでは安全にスキップ（赤くならない）
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Python (for migration)
        if: ${{ github.event_name == 'push' || inputs.run_migration }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # push(自動CD)では常に alembic upgrade head を実行し、マージした migration が
      # デプロイと同時に本番へ適用されるようにする (alembic upgrade head は pending が
      # 無ければ冪等な no-op)。これがないと「コードはデプロイされたが migration は
      # 未適用」で新コードが旧スキーマに当たる隙間が生じる (2026-06-17 に prefecture
      # backfill を手動 dispatch せざるを得なかった原因)。workflow_dispatch では
      # 従来どおり run_migration トグルで明示的に制御する。
      - name: Run database migration
        if: ${{ github.event_name == 'push' || inputs.run_migration }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          alembic upgrade head

      - name: Build & push image (Cloud Build)
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${GCP_AR_REPO}/${GCP_SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          # WIF の deploy SA は Cloud Build の「デフォルトログバケット」を
          # 読めず (Viewer/Owner 必須)、ビルド成功でも gcloud が exit 1 になる
          # 偽陰性が出る (2026-06-15 確認)。--gcs-log-dir で deploy SA が
          # storage.admin を持つ自前バケットにログを書かせ、--suppress-logs で
          # 追尾も止めてビルド結果のみで判定する。
          gcloud builds submit --tag "${IMAGE}" --project "${{ vars.GCP_PROJECT_ID }}" \
            --gcs-log-dir="gs://${{ vars.GCP_PROJECT_ID }}_cloudbuild/build-logs" \
            --suppress-logs .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${GCP_SERVICE}" \
            --image "${IMAGE}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "^;^CORS_ORIGINS=${{ vars.CORS_ORIGINS }};SITE_URL=${{ vars.SITE_URL }};LOG_LEVEL=INFO" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,INTERNAL_API_TOKEN=INTERNAL_API_TOKEN:latest"
          # 注: --set-env-vars / --set-secrets はそれぞれ既存の env / secret を
          #     全置換するため、本番で稼働中の全変数を列挙する必要がある。
          #     SITE_URL はフィード BASE_URL に使われており、欠落すると本番設定が
          #     消える (2026-06-15 監査で発覚)。
          # 注: 先頭 "^;^" は区切り文字を ; に変更する gcloud 構文。CORS_ORIGINS が
          #     カンマ区切りの複数 URL を持つため、既定のカンマ区切りだと dict
          #     パースが壊れる (2026-06-15 確認)。値に ; を含まないため安全。
          # 注: T425 (2026-09-19)。DATABASE_URL と INTERNAL_API_TOKEN は
          #     --set-env-vars で平文の環境変数として渡していた。Cloud Run の env は
          #     run.services.get 権限があれば誰でも読めるため、Secret Manager 参照
          #     (--set-secrets) に移した。収集 Job (oneco-collector) は以前から
          #     secretRef を使っており、API サービスだけ取り残されていた。
          #     前提 1: Secret Manager に DATABASE_URL と INTERNAL_API_TOKEN が
          #     存在すること。
          #     前提 2: 実行 SA (既定 Compute SA 462233676125-compute@) が両方の
          #     secret に roles/secretmanager.secretAccessor を持つこと。
          #     roles/editor は secretmanager 権限を 18 個持つが、値を読む
          #     secretmanager.versions.access は含まれない (2026-09-19 に
          #     `gcloud iam roles describe roles/editor` で実測)。この付与が
          #     無いと新リビジョンが secret を解決できず起動に失敗する。
          #     デプロイ SA (oneco-deployer) は roles/secretmanager.admin を持つ
          #     ため、デプロイ側の権限追加は不要。
          #     T430 で API を専用 SA へ移すときは、この付与を新しい SA へ
          #     付け替え、既定 Compute SA への付与は取り消すこと。
          # 注: デプロイが失敗した場合、Cloud Run は Ready にならない新リビジョンへ
          #     トラフィックを流さないため旧リビジョンが処理を続ける。失敗理由は
          #     `gcloud run services describe oneco-api --region asia-northeast1 \
          #       --project oneco-app --format='value(status.conditions)'` で見る。
          #     直すまで次の自動デプロイも同じ理由で失敗し続ける。
          # 注: GitHub Secrets の DATABASE_URL は上の migration ステップ
          #     (runner 上の alembic) で引き続き使う。INTERNAL_API_TOKEN の方は
          #     このワークフローからは参照しなくなるが、Vercel 側と同一値を保つ
          #     ための原本として残す。

      - name: Health check
        run: |
          URL="$(gcloud run services describe "${GCP_SERVICE}" --project "${{ vars.GCP_PROJECT_ID }}" --region "${GCP_REGION}" --format='value(status.url)')"
          echo "Deployed: ${URL}"
          for i in 1 2 3 4 5; do
            if curl -fsS "${URL}/health"; then echo "OK"; exit 0; fi
            echo "retry ${i}..."; sleep 5
          done
          echo "::error::health check failed"; exit 1
